name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp build id into service worker
        run: sed -i "s/__BUILD_ID__/${GITHUB_SHA}/g" teacher_app/sw.js

      # أدواتُ التطوير تبقى في المستودع وعلى جهاز المطوّر، ولا تُنشر.
      # أربعٌ منها تتّصل بالقاعدة الحقيقيّة وتُنشئ حسابَ زائرٍ لمن يفتحها،
      # وكلُّها تُحزَم مع التطبيق عند التغليف لولا هذا السطر.
      # وحُذفت هنا لا نُقلت إلى مجلّد: مساراتُها إلى js/ وcss/ نسبيّة،
      # فالنقلُ يكسرها كلَّها.
      - name: Strip dev tools from the published site
        # كتلةٌ (|) لا سطرٌ مطويّ: `run:` العاديّ يطوي الأسطر بمسافة، فتصير
        # الشرطةُ المائلة حرفاً يُهرِّب المسافة، فيُطلب ملفٌّ اسمُه يبدأ بفراغ
        # و`rm -f` يتجاهل المفقودَ بصمت. نجا بذلك smoke وreset حتى كشفهما
        # فحصُ الموقع الحيّ (٢٧ أغسطس ٢٠٢٦).
        run: |
          rm -f teacher_app/eval.html
          rm -f teacher_app/contrast.html
          rm -f teacher_app/smoke.html
          rm -f teacher_app/diag-print.html
          rm -f teacher_app/reset.html
          echo "— بقي من صفحات HTML:"; ls -1 teacher_app/*.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: teacher_app

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
