<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: بترولٌ شفّاف</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=13">
<link rel="stylesheet" href="css/views.css?v=D295">
<link rel="stylesheet" href="css/portfolio-theme.css?v=16">
<link rel="stylesheet" href="css/theme-white.css?v=22">

<style>
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 470px; margin: 0 auto; padding: 0 14px 60px; }
    .pv h1 { font-size: 19px; margin: 14px 0 4px; }
    .pv .lede { font-size: 12.5px; color: var(--text-muted); margin: 0 0 12px; line-height: 1.85; }

    .ctl { position: sticky; top: 0; z-index: 50;
           background: var(--surface); border: 1.5px solid var(--border);
           border-radius: 16px; padding: 12px; margin: 0 0 18px;
           box-shadow: 0 6px 18px rgba(16,24,40,.08); }
    .ctl-t { display: flex; align-items: baseline; justify-content: space-between;
             font-size: 12.5px; font-weight: var(--fw-bold); color: var(--ink-primary);
             margin-bottom: 9px; }
    .ctl-t .v { font-size: 17px; color: var(--primary); }
    .ctl-t .ver { font-size: 11px; font-weight: 500; color: var(--text-muted); }
    input[type=range] { width: 100%; accent-color: #0A3F4A; height: 30px; }
    .ends { display: flex; justify-content: space-between;
            font-size: 11px; color: var(--text-muted); margin-top: -4px; }
    .cmp { display: flex; gap: 7px; margin-top: 11px; padding-top: 10px;
           border-top: 1px solid var(--border); }
    .cmp button { flex: 1; min-height: 40px; border-radius: 11px; cursor: pointer;
        font-family: inherit; font-size: 13px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface); color: var(--ink-primary); }
    .cmp button.on { background: var(--primary); border-color: var(--primary); color: #fff; }

    .grp { margin: 0 0 24px; }
    .grp-h { font-size: 13.5px; font-weight: var(--fw-bold); color: var(--ink-primary);
             border-bottom: 1.5px solid var(--border); padding-bottom: 6px; margin-bottom: 11px; }
    .grp-h .n { color: var(--text-muted); font-weight: 500; font-size: 11.5px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 0;
           border-bottom: 1px solid var(--border); }
    .row:last-child { border-bottom: 0; }
    .row .demo { flex: none; }
    .row .meta { flex: 1; min-width: 0; }
    .row .nm { font-size: 12px; font-weight: var(--fw-bold); color: var(--ink-primary); }
    .row .wh { font-size: 11px; color: var(--text-muted); line-height: 1.65; margin-top: 1px; }
    .demo .sched-table { width: auto; }
    .mock { background: linear-gradient(160deg,#EEF1F0 0%,#E4EBEC 100%);
            border-radius: 20px; padding: 13px; }
    .mock-card { background: #fff; border: 1.5px solid var(--border);
                 border-radius: 16px; padding: 14px 13px; }
    .mock-h { font-size: 15px; font-weight: var(--fw-bold); color: var(--ink-primary);
              margin-bottom: 11px; }
    .under { border-radius: 24px; padding: 9px;
             background: linear-gradient(135deg, #EDEAE2 0%, #DDE7EA 55%, #CFDDE2 100%); }
    .bar { position: static; display: flex; inset-inline: auto; bottom: auto;
           z-index: auto; margin: 0; }
</style>
</head>
<body>
<div class="pv">
    <h1>بترولٌ شفّاف</h1>
    <p class="lede">
        التصميمُ كما هو — لا حوافَّ ولا تغييرَ شكل. البترولُ وحدَه يصير
        شفّافاً. حرّك المِقبض حتى ترضى.
    </p>

    <div class="ctl">
        <div class="ctl-t">
            <span>شفافيّة البترول <span class="v" id="pct">٨٪</span></span>
            <span class="ver">مِقبض · ١ سبتمبر</span>
        </div>
        <input type="range" id="rng" min="3" max="30" step="1" value="8">
        <div class="ends"><span>أشفُّ</span><span>أوضح</span></div>
        <div class="cmp">
            <button id="b-soft" class="on">شفّاف</button>
            <button id="b-cur">الحالي — للمقارنة</button>
        </div>
    </div>

    <div class="grp">
        <div class="grp-h">شاشةٌ كما يراها المعلّم <span class="n">— احكم هنا</span></div>
        <div class="mock">
            <div class="mock-card">
                <div class="mock-h">إضافة فصل</div>
                <div class="field" style="margin-bottom:12px">
                    <label class="label">الصف</label>
                    <input class="input" value="الصف الخامس الابتدائي" readonly>
                </div>
                <div style="display:flex;gap:7px;margin-bottom:14px">
                    <span class="chip active">ابتدائي</span>
                    <span class="chip">متوسط</span>
                    <span class="chip">ثانوي</span>
                </div>
                <div style="display:flex;gap:9px">
                    <button class="btn btn-primary">حفظ</button>
                    <button class="btn btn-ghost">إلغاء</button>
                </div>
            </div>
            <div class="classes-fab" style="position:static;padding:0;margin-top:13px">
                <button class="start-cta">+ إضافة فصل جديد</button>
            </div>
            <div class="under" style="margin-top:13px">
                <nav class="bottom-nav bar" id="nv2"></nav>
            </div>
        </div>
    </div>

    <div id="out"></div>
</div>

<script>
(function () {
    'use strict';
    const AR = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

    const STATE = ['.chip.active', '.tab.active', '.tf-chip.on', '.att-btn.active',
                   '.hint-go', '.br-jump-row .go', '.sch-chip.on', '.fchip.on',
                   '.subp-chip', '.subp-other-go', '.sheet-tab.on', '.stg-btn.main',
                   '.sched-edit-btn.on', '.mvs-tab.on', '.sched-table td.sched-per'];
    const ACTION = ['.btn-primary', '.start-cta', '.reg-add'];

    const NAV = [['🏠','الرئيسية'],['👥','الفصول'],['📅','الجدول'],['📁','إنجاز'],['⚙️','الإعدادات']];
    const navHtml = (act) => NAV.map((it, k) =>
        '<a href="javascript:void 0" class="bn-item' + (k === act ? ' is-active' : '')
        + '"><span class="bn-icon">' + it[0] + '</span><span class="bn-label">'
        + it[1] + '</span></a>').join('');

    const G = [
        ['أزرارُ الإضافة', [
            ['<div class="classes-fab" style="position:static;padding:0"><button class="start-cta">+ إضافة فصل جديد</button></div>', '.start-cta', 'شاشةُ الفصول'],
            ['<button class="btn reg-add">+ إضافة الطلاب</button>', '.reg-add', 'رأسُ سجلّ الطلاب'],
            ['<div class="classes-fab" style="position:static;padding:0"><a href="javascript:void 0" class="start-cta">+ ارفع جدولك الأسبوعي</a></div>', '.start-cta', 'الرئيسيّة']
        ]],
        ['الزرُّ الأساسيّ', [
            ['<button class="btn btn-primary">حفظ</button>', '.btn-primary', 'كلُّ نافذةٍ ونموذج']
        ]],
        ['الشريطُ السفليّ', [
            ['<div class="under"><nav class="bottom-nav bar" id="nv">' + navHtml(2) + '</nav></div>',
             '.bn-item.is-active', 'اضغط أيَّ خانة']
        ]],
        ['حبّاتٌ مختارة', [
            ['<span class="chip active">مختارة</span>', '.chip.active', 'مرشّحات'],
            ['<span class="tab active">تبويب</span>', '.tab.active', 'تبويباتُ الفصل'],
            ['<span class="tf-chip on">الفصل الأول</span>', '.tf-chip.on', 'الفصل الدراسيّ'],
            ['<button class="att-btn active">حاضر</button>', '.att-btn.active', 'أزرارُ الحضور'],
            ['<button class="hint-go">ابدأ</button>', '.hint-go', 'التلميحات'],
            ['<span class="br-jump-row"><button class="go">اذهب</button></span>', '.br-jump-row .go', 'قارئ الكتب']
        ]],
        ['حبّاتٌ متدرّجة', [
            ['<span class="sch-chip on">أ</span>', '.sch-chip.on', 'الشُّعَب'],
            ['<span class="fchip on">ابتدائي</span>', '.fchip.on', 'المرحلة'],
            ['<span class="subp-chip">الرياضيات</span>', '.subp-chip', 'منتقي المواد'],
            ['<button class="subp-other-go">تم</button>', '.subp-other-go', 'مادّةٌ أخرى'],
            ['<span class="sheet-tab on">ورقة ١</span>', '.sheet-tab.on', 'تبويباتُ إكسل'],
            ['<button class="stg-btn main">طبّقتها</button>', '.stg-btn.main', 'الاستراتيجيّة']
        ]],
        ['أشرطةٌ وتبويبات', [
            ['<button class="sched-edit-btn on">✎ تعديل</button>', '.sched-edit-btn.on', 'شريطُ الجدول'],
            ['<span class="mvs-tab on">الرؤية</span>', '.mvs-tab.on', 'الرسالة والرؤية'],
            ['<table class="sched-table"><tr><td class="sched-per">١<br><small>07:00</small></td></tr></table>', 'td.sched-per', 'عمودُ الحصص']
        ]]
    ];

    document.getElementById('out').innerHTML = G.map(([t, rows]) => `
        <div class="grp"><div class="grp-h">${t} <span class="n">— ${rows.length}</span></div>
        ${rows.map(([h, c, w]) => `<div class="row"><div class="demo">${h}</div>
          <div class="meta"><div class="nm">${c}</div><div class="wh">${w}</div></div></div>`).join('')}
        </div>`).join('');
    document.getElementById('nv2').innerHTML = navHtml(2);

    const style = document.createElement('style');
    document.head.appendChild(style);
    let soft = true;

    function paint() {
        const a = +document.getElementById('rng').value;
        document.getElementById('pct').textContent = AR(a) + '٪';
        if (!soft) { style.textContent = ''; return; }
        /* لا حافّةَ ولا ظلّ: التصميمُ كما هو، واللونُ وحدَه يشفّ. */
        const bg = 'rgba(10,63,74,.' + (a < 10 ? '0' + a : a) + ')';
        const put = (sel) => sel + '{background:' + bg + ' !important;color:#0A3F4A !important;'
            + 'border-color:transparent !important;box-shadow:none !important;}';
        style.textContent = put(STATE.concat(ACTION).join(','))
            + '.bottom-nav .bn-item.is-active{color:#0A3F4A !important;}'
            + '.bottom-nav .bn-item.is-active::before{background:' + bg
            + ' !important;box-shadow:none !important;}';
    }

    document.getElementById('rng').addEventListener('input', () => {
        if (!soft) { soft = true; flip(); }
        paint();
    });
    function flip() {
        document.getElementById('b-soft').classList.toggle('on', soft);
        document.getElementById('b-cur').classList.toggle('on', !soft);
    }
    document.getElementById('b-soft').addEventListener('click', () => { soft = true;  flip(); paint(); });
    document.getElementById('b-cur') .addEventListener('click', () => { soft = false; flip(); paint(); });

    document.getElementById('out').addEventListener('click', navTap);
    document.getElementById('nv2').addEventListener('click', navTap);
    function navTap(e) {
        const a = e.target.closest('.bn-item'); if (!a) return;
        a.parentElement.querySelectorAll('.bn-item').forEach((x) => x.classList.remove('is-active'));
        a.classList.add('is-active');
    }
    paint();
})();
</script>
</body>
</html>
