<title>تصاميم اسم الفصل — للتجربة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; font-family: Tajawal, system-ui, sans-serif; background: #F6F7F9; }
    .screen { display: none; min-height: 100vh; padding-bottom: 150px; }
    .screen.active { display: block; }

    /* ---------- switcher ---------- */
    .switcher {
        position: fixed; bottom: 0; right: 0; left: 0; z-index: 50;
        background: rgba(17,17,17,.94); backdrop-filter: blur(10px);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        display: flex; gap: 8px; overflow-x: auto;
    }
    .switcher button {
        flex-shrink: 0; background: rgba(255,255,255,.12); color: #fff;
        border: 1.5px solid transparent; border-radius: 99px;
        padding: 8px 16px; font-family: inherit; font-size: 13px; font-weight: 700;
        white-space: nowrap;
    }
    .switcher button.on { background: #fff; color: #111; }

    /* ---------- class-color bar ---------- */
    .colorbar {
        position: fixed; bottom: 56px; right: 0; left: 0; z-index: 50;
        background: rgba(17,17,17,.8); backdrop-filter: blur(10px);
        padding: 8px 14px calc(8px + env(safe-area-inset-bottom) * 0);
        display: flex; gap: 10px; align-items: center; justify-content: center;
    }
    .colorbar .lbl { color: rgba(255,255,255,.75); font-size: 11px; }
    .colorbar button {
        width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid transparent; padding: 0; cursor: pointer;
    }
    .colorbar button.on { border-color: #fff; }

    .hint {
        position: fixed; top: 10px; left: 10px; z-index: 50;
        background: rgba(17,17,17,.85); color: #fff; border-radius: 99px;
        padding: 5px 14px; font-size: 11px;
        transition: opacity .5s ease;
    }
    .hint.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div class="hint">نسخة تجريبية للمعاينة فقط</div>

CANDIDATES.forEach((c) => DESIGNS.push(c));

/* ---------- build screens, switcher, colorbar ---------- */
const root = document.getElementById('screens-root');
const sw = document.getElementById('switcher');
DESIGNS.forEach(([name, header], i) => {
    const sc = document.createElement('div');
    sc.className = 'screen' + (i === 0 ? ' active' : '');
    sc.style.setProperty('--c', '#1E40AF');
    sc.innerHTML = header + HUB_BODY;
    root.appendChild(sc);

    const btn = document.createElement('button');
    btn.textContent = name;
    if (i === 0) btn.className = 'on';
    btn.addEventListener('click', () => {
        document.querySelectorAll('.screen').forEach((s, j) => s.classList.toggle('active', j === i));
        sw.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
        window.scrollTo(0, 0);
    });
    sw.appendChild(btn);
});

/* Hide the demo hint after a moment so it never covers a design's buttons. */
setTimeout(() => document.querySelector('.hint').classList.add('gone'), 2500);

const COLORS = ['#1E40AF', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];
const cb = document.getElementById('colorbar');
COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    if (i === 0) b.className = 'on';
    b.addEventListener('click', () => {
        document.querySelectorAll('.screen').forEach((s) => s.style.setProperty('--c', c));
        cb.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    });
    cb.appendChild(b);
});
</script>
