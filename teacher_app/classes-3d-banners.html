<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مربعات أصغر + شريط مرحلة ثري دي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#667085;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 13px 80px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:13px;font-weight:800;color:var(--muted);margin:2px 3px 12px;}

    /* الفاصل الذهبي الرفيع بين المراحل */
    .sep-gold{border:0;border-top:1.5px solid color-mix(in srgb,var(--gold) 55%,#fff);margin:21px 6px;}

    /* بطاقات الفصول — أصغر، بنفس التدرّج الحالي */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
    .ccard{border-radius:14px;padding:11px 12px;min-height:88px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;
        background:linear-gradient(135deg,var(--cc) 0%,color-mix(in srgb,var(--cc) 60%,#fff) 130%);color:#fff;
        box-shadow:0 3px 9px color-mix(in srgb,var(--cc) 28%,transparent);}
    .cc-g{font-weight:900;font-size:13.5px;line-height:1.35;}
    .cc-s{font-size:10.5px;font-weight:700;margin-top:1px;color:rgba(255,255,255,.85);}
    .cc-meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:10.5px;}
    .cc-edit{border-radius:99px;padding:2px 10px;font-size:10px;font-weight:800;line-height:1.6;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);}

    /* الشريط الأساسي */
    .banner{display:flex;align-items:center;gap:10px;color:#fff;border-radius:15px;padding:9px 14px;margin:0 0 12px;}
    .bn-ic{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.18);font-size:14px;}
    .bn-lb{flex:1;font-size:16.5px;font-weight:900;}
    .bn-ct{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 11px;font-size:11px;font-weight:700;white-space:nowrap;}

    /* أ — حافة سفلية (زر مضغوط) */
    .b3d-edge{background:linear-gradient(180deg,#1B3E75 0%,var(--royal) 100%);
        box-shadow:0 4px 0 #081A38, 0 8px 16px rgba(15,44,92,.35);}
    /* ب — بارز بإضاءة علوية وظل عميق */
    .b3d-pop{background:linear-gradient(180deg,#24498A 0%,var(--royal) 55%,#0A2148 100%);
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -2px 4px rgba(0,0,0,.3),
                   0 7px 14px rgba(15,44,92,.4), 0 2px 4px rgba(15,44,92,.3);
        border:1px solid #1B3E75;}
    /* ج — بارز بإطار ذهبي سفلي */
    .b3d-gold{background:linear-gradient(180deg,#1B3E75 0%,var(--royal) 100%);
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3), 0 3.5px 0 var(--gold), 0 9px 18px rgba(15,44,92,.35);}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const STAGES=[
 ['🏫','ابتدائي','فصلان',[['الصف الرابع / أ','رياضيات','#12A150',24],['الصف السادس / ب','علوم','#1E40AF',27]]],
 ['📘','متوسط','فصل واحد',[['ثاني متوسط / أ','رياضيات','#BE185D',30]]],
 ['🎓','ثانوي','فصلان',[['أول ثانوي / ب','فيزياء','#8B5CF6',28],['ثالث ثانوي / أ','كيمياء','#0891B2',25]]],
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function stageHtml(cls,[ic,lb,ct,list]){
  return `<div class="banner ${cls}"><span class="bn-ic">${ic}</span><span class="bn-lb">${lb}</span><span class="bn-ct">${ct}</span></div>
    <div class="grid">${list.map(([g,sub,c,n])=>`
      <div class="ccard" style="--cc:${c}">
        <div><div class="cc-g">${g}</div><div class="cc-s">${sub}</div></div>
        <div class="cc-meta"><span class="num">${AR(n)} طالب</span><span class="cc-edit">تعديل</span></div>
      </div>`).join('')}
    </div>`;
}

const D=[
 ['أ — حافة سفلية','الشريط له حافة غامقة تحته كأنه زر بارز فوق الصفحة',
  STAGES.map(s=>stageHtml('b3d-edge',s)).join('<hr class="sep-gold">')],
 ['ب — بارز بإضاءة','إضاءة علوية وظل داخلي سفلي وظل عميق — بروز واقعي',
  STAGES.map(s=>stageHtml('b3d-pop',s)).join('<hr class="sep-gold">')],
 ['ج — حافة ذهبية','بروز بإضاءة علوية وحافته السفلية ذهبية — من هوية التطبيق',
  STAGES.map(s=>stageHtml('b3d-gold',s)).join('<hr class="sep-gold">')],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc} — البطاقات مصغّرة والفاصل ذهبي رفيع</div>`+html;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
