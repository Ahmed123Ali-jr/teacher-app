<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>بطاقات الفصول ذهبية بلا ألوان</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#667085;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 13px 80px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:13px;font-weight:800;color:var(--muted);margin:2px 3px 12px;}

    .sep-gold{border:0;border-top:1.5px solid color-mix(in srgb,var(--gold) 55%,#fff);margin:21px 6px;}

    /* الشريط المعتمد */
    .banner{display:flex;align-items:center;gap:10px;color:#fff;border-radius:15px;padding:9px 14px;margin:0 0 12px;
        background:linear-gradient(180deg,#24498A 0%,var(--royal) 55%,#0A2148 100%);
        border:1px solid #1B3E75;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -2px 4px rgba(0,0,0,.3),
                   0 7px 14px rgba(15,44,92,.4), 0 2px 4px rgba(15,44,92,.3);}
    .bn-ic{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.18);font-size:14px;}
    .bn-lb{flex:1;font-size:16.5px;font-weight:900;}
    .bn-ct{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 11px;font-size:11px;font-weight:700;white-space:nowrap;}

    /* البطاقة — نفس المقاسات المعتمدة، بلا ألوان الفصول */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .ccard{position:relative;overflow:hidden;border-radius:15px;padding:13px;min-height:112px;
        display:flex;flex-direction:column;justify-content:space-between;gap:7px;}
    .cc-g{font-weight:900;font-size:14.5px;line-height:1.35;position:relative;}
    .cc-s{font-size:11.5px;font-weight:700;margin-top:1px;position:relative;}
    .cc-meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;position:relative;}
    .cc-edit{border-radius:99px;padding:3px 11px;font-size:10.5px;font-weight:800;line-height:1.6;}

    /* ===== أ — ذهبي مصمت بارز ===== */
    .g-solid .ccard{background:linear-gradient(160deg,#E0C486 0%,var(--gold) 55%,#A98944 100%);color:#3B2E12;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(0,0,0,.16),
                   0 6px 12px rgba(201,169,97,.4), 0 2px 4px rgba(16,24,40,.18);}
    .g-solid .cc-s{color:rgba(59,46,18,.72);}
    .g-solid .cc-edit{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);color:#3B2E12;}

    /* ===== ب — كحلي بنص ذهبي ===== */
    .g-navy .ccard{background:linear-gradient(180deg,#24498A 0%,var(--royal) 55%,#0A2148 100%);color:var(--gold);
        box-shadow:inset 0 0 0 1px rgba(201,169,97,.55), inset 0 1.5px 0 rgba(255,255,255,.2),
                   0 6px 12px rgba(15,44,92,.35), 0 2px 4px rgba(16,24,40,.2);}
    .g-navy .cc-s{color:rgba(201,169,97,.78);}
    .g-navy .cc-meta{color:#fff;}
    .g-navy .cc-edit{background:rgba(201,169,97,.16);border:1px solid rgba(201,169,97,.6);color:var(--gold);}

    /* ===== ج — ذهبي شفاف فاتح ===== */
    .g-light .ccard{background:linear-gradient(150deg,rgba(201,169,97,.22) 0%,rgba(201,169,97,.10) 100%);
        color:#6B5320;border:1.5px solid rgba(201,169,97,.55);
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7), 0 4px 10px rgba(201,169,97,.22);}
    .g-light .cc-s{color:rgba(107,83,32,.72);}
    .g-light .cc-edit{background:#fff;border:1px solid rgba(201,169,97,.55);color:#6B5320;}

    /* ===== د — ذهبي فاخر بلمعة ===== */
    .g-lux .ccard{background:linear-gradient(150deg,#8C6D2F 0%,#C9A961 38%,#F2DFAE 52%,#C9A961 66%,#7E5F26 100%);
        color:#33270D;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55), inset 0 -2px 5px rgba(0,0,0,.2),
                   0 7px 14px rgba(140,109,47,.4), 0 2px 4px rgba(16,24,40,.2);}
    .g-lux .cc-s{color:rgba(51,39,13,.72);}
    .g-lux .cc-edit{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.72);color:#33270D;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const STAGES=[
 ['🏫','ابتدائي','فصلان',[['الصف الرابع / أ','رياضيات',24],['الصف السادس / ب','علوم',27]]],
 ['📘','متوسط','فصل واحد',[['ثاني متوسط / أ','رياضيات',30]]],
 ['🎓','ثانوي','فصلان',[['أول ثانوي / ب','فيزياء',28],['ثالث ثانوي / أ','كيمياء',25]]],
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function stageHtml([ic,lb,ct,list]){
  return `<div class="banner"><span class="bn-ic">${ic}</span><span class="bn-lb">${lb}</span><span class="bn-ct">${ct}</span></div>
    <div class="grid">${list.map(([g,sub,n])=>`
      <div class="ccard">
        <div><div class="cc-g">${g}</div><div class="cc-s">${sub}</div></div>
        <div class="cc-meta"><span class="num">${AR(n)} طالب</span><span class="cc-edit">تعديل</span></div>
      </div>`).join('')}
    </div>`;
}
const body=STAGES.map(stageHtml).join('<hr class="sep-gold">');

const D=[
 ['أ — ذهبي مصمت','ذهبي متدرّج بارز ونص غامق — أوضح قراءة','g-solid'],
 ['ب — كحلي بنص ذهبي','خلفية كحلية بإطار ونص ذهبيين — الأهدأ والأفخم','g-navy'],
 ['ج — ذهبي فاتح','صبغة ذهبية شفافة خفيفة بإطار ذهبي — الأخف بصرياً','g-light'],
 ['د — ذهبي فاخر','تدرّج ذهبي بلمعة معدنية عبر البطاقة','g-lux'],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,cls],i)=>{
  const sc=document.createElement('div');sc.className='screen '+cls+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+body;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
