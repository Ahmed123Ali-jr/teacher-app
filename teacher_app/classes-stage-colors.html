<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ألوان شرائط المراحل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#667085;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 13px 80px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:13px;font-weight:800;color:var(--muted);margin:2px 3px 12px;}

    .banner{display:flex;align-items:center;gap:11px;background:var(--bn,#0F2C5C);color:#fff;border-radius:16px;padding:10px 15px;margin:0 0 12px;
        box-shadow:0 4px 12px color-mix(in srgb,var(--bn,#0F2C5C) 28%,transparent);}
    .bn-ic{width:34px;height:34px;flex-shrink:0;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.18);font-size:17px;}
    .bn-lb{flex:1;font-size:17px;font-weight:900;}
    .bn-ct{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:11.5px;font-weight:700;white-space:nowrap;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:21px;}
    .ccard{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px;position:relative;overflow:hidden;}
    .ccard::before{content:"";position:absolute;top:0;right:0;left:0;height:4px;background:var(--cc);}
    .cc-g{font-weight:900;font-size:14.5px;margin-top:4px;}
    .cc-s{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;}
    .cc-b{display:inline-block;margin-top:8px;background:color-mix(in srgb,var(--cc) 10%,#fff);color:color-mix(in srgb,var(--cc) 75%,#000);border-radius:8px;padding:2px 9px;font-size:11px;font-weight:800;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
/* البدائل: [اسم، وصف، لون الابتدائي، المتوسط، الثانوي] */
const P = [
  ['أ — سُلّم النمو', 'أخضر يكبر إلى أزرق فبنفسجي — كل مرحلة أنضج من اللي قبلها',
    ['#059669','#1D4ED8','#6D28D9']],
  ['ب — درجات الأزرق', 'عائلة الأزرق الملكي نفسها من الفاتح للغامق — الأهدأ والأقرب لهوية التطبيق',
    ['#3B82F6','#1E40AF','#0F2C5C']],
  ['ج — ذهبي وتركوازي', 'ذهبي التطبيق للابتدائي، تركوازي للمتوسط، كحلي التطبيق للثانوي',
    ['#B8860B','#0891B2','#0F2C5C']],
  ['د — ألوان هادئة', 'تركوازي وبني دافئ ورمادي كحلي — محايدة ومريحة',
    ['#0D9488','#B45309','#475569']],
];
const STAGES=[['🏫','ابتدائي'],['📘','متوسط'],['🎓','ثانوي']];
const SAMPLE=[
  [['الصف الرابع','شعبة أ','رياضيات','#12A150'],['الصف السادس','شعبة ب','علوم','#1E40AF']],
  [['ثاني متوسط','شعبة أ','رياضيات','#BE185D'],['ثالث متوسط','شعبة ج','علوم','#F59E0B']],
  [['أول ثانوي','شعبة ب','فيزياء','#8B5CF6'],['ثالث ثانوي','شعبة أ','كيمياء','#0891B2']],
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

const root=document.getElementById('root'),sw=document.getElementById('switcher');
P.forEach(([name,desc,colors],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+
    STAGES.map(([ic,lb],s)=>`
      <div class="banner" style="--bn:${colors[s]}">
        <span class="bn-ic">${ic}</span><span class="bn-lb">${lb}</span>
        <span class="bn-ct"><span class="num">${AR(2)}</span> فصول</span>
      </div>
      <div class="grid">${SAMPLE[s].map(([g,sec,sub,c])=>`
        <div class="ccard" style="--cc:${c}">
          <div class="cc-g">${g}</div>
          <div class="cc-s">${sec}</div>
          <div class="cc-b">📘 ${sub}</div>
        </div>`).join('')}
      </div>`).join('');
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name.split(' · ')[0].split(' —')[0]+' — '+name.split('— ')[1];
  if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
