<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شريط المرحلة في المنتصف — بدائل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#667085;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 13px 80px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:13px;font-weight:800;color:var(--muted);margin:2px 3px 12px;}

    /* حاوية المرحلة (المعتمدة ج) */
    .stage-box{background:#fff;border:1px solid var(--border);border-radius:21px;padding:13px;margin-bottom:16px;box-shadow:0 1px 4px rgba(16,24,40,.05);position:relative;}

    /* بطاقات الفصول — سادة */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .ccard{border-radius:16px;padding:14px 13px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
        background:var(--cc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--cc) 30%,transparent);}
    .cc-g{font-weight:900;font-size:14.5px;}
    .cc-s{font-size:11.5px;font-weight:700;margin-top:2px;color:rgba(255,255,255,.85);}
    .cc-meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;}
    .cc-edit{border-radius:99px;padding:3px 12px;font-size:10.5px;font-weight:800;line-height:1.6;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);}

    /* ===== أ — حبة على اليمين، والعدد بإطار ذهبي (نمط ج) ===== */
    .hd-a{display:flex;justify-content:flex-start;margin-bottom:13px;}
    .hd-a .pill{display:inline-flex;align-items:center;gap:10px;background:var(--royal);color:#fff;border-radius:99px;padding:8px 9px 8px 8px;
        box-shadow:0 5px 14px rgba(15,44,92,.3);}
    .hd-a .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:14px;}
    .hd-a .lb{font-size:18px;font-weight:900;letter-spacing:0;}
    .hd-a .ct{background:rgba(255,255,255,.16);border:1px solid var(--gold);color:#fff;border-radius:99px;padding:3px 12px;font-size:11px;font-weight:800;white-space:nowrap;}

    /* ===== ب — شارة على حافة الحاوية ===== */
    .box-b{padding-top:34px;margin-top:23px;overflow:visible;}
    .hd-b{position:absolute;top:0;right:50%;transform:translate(50%,-50%);display:inline-flex;align-items:center;gap:10px;
        background:linear-gradient(135deg,#0A1F42 0%,var(--royal) 55%,#1B3E75 100%);color:#fff;border-radius:99px;padding:9px 9px 9px 19px;
        box-shadow:0 8px 20px rgba(15,44,92,.35);border:2.5px solid #fff;white-space:nowrap;}
    .hd-b .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:14px;}
    .hd-b .lb{font-size:18px;font-weight:900;}
    .hd-b .ct{background:var(--gold);color:#fff;border-radius:99px;padding:4px 13px;font-size:11.5px;font-weight:800;}

    /* ===== ج — جناحان ذهبيان ===== */
    .hd-c{display:flex;align-items:center;gap:12px;margin-bottom:13px;}
    .hd-c::before,.hd-c::after{content:"";flex:1;border-top:1.5px solid color-mix(in srgb,var(--gold) 55%,#fff);}
    .hd-c .pill{display:inline-flex;align-items:center;gap:10px;background:var(--royal);color:#fff;border-radius:14px;padding:8px 8px 8px 17px;
        box-shadow:0 4px 12px rgba(15,44,92,.28);}
    .hd-c .ic{font-size:15px;}
    .hd-c .lb{font-size:18px;font-weight:900;}
    .hd-c .ct{background:rgba(255,255,255,.16);border:1px solid var(--gold);color:#fff;border-radius:99px;padding:3px 12px;font-size:11px;font-weight:800;white-space:nowrap;}

    /* ===== د — قوس ملكي ===== */
    .hd-d{display:flex;flex-direction:column;align-items:center;gap:5px;margin-bottom:13px;}
    .hd-d .pill{display:inline-flex;align-items:center;gap:10px;background:var(--royal);color:#fff;border-radius:99px;padding:8px 8px 8px 18px;
        box-shadow:0 5px 14px rgba(15,44,92,.3);position:relative;}
    .hd-d .pill::before{content:"◆";position:absolute;top:-13px;right:50%;transform:translateX(50%);color:var(--gold);font-size:9px;}
    .hd-d .ic{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:14px;}
    .hd-d .lb{font-size:18px;font-weight:900;}
    .hd-d .ct{background:var(--gold);color:#fff;border-radius:99px;padding:4px 13px;font-size:11.5px;font-weight:800;}
    .hd-d .under{width:55px;border-top:2px solid var(--gold);border-radius:2px;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const STAGES=[
 ['🏫','ابتدائي','فصلان',[['الصف الرابع / أ','رياضيات','#12A150',24],['الصف السادس / ب','علوم','#1E40AF',27]]],
 ['📘','متوسط','فصل واحد',[['ثاني متوسط / أ','رياضيات','#BE185D',30]]],
 ['🎓','ثانوي','فصلان',[['أول ثانوي / ب','فيزياء','#8B5CF6',28],['ثالث ثانوي / أ','كيمياء','#0891B2',25]]],
];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function cards(list){
  return `<div class="grid">${list.map(([g,sub,c,n])=>`
    <div class="ccard" style="--cc:${c}">
      <div><div class="cc-g">${g}</div><div class="cc-s">${sub}</div></div>
      <div class="cc-meta"><span class="num">${AR(n)} طالب</span><span class="cc-edit">تعديل</span></div>
    </div>`).join('')}</div>`;
}

const D=[
 ['أ — حبة على اليمين','شريط كحلي مضغوط على يمين الحاوية، الاسم كبير والعدد بإطار ذهبي (نمط ج)',
  STAGES.map(([ic,lb,ct,list])=>`<div class="stage-box">
    <div class="hd-a"><span class="pill"><span class="ic">${ic}</span><span class="lb">${lb}</span><span class="ct">${ct}</span></span></div>
    ${cards(list)}</div>`).join('')],

 ['ب — شارة على الحافة','الشريط «شارة» راكبة على حافة الحاوية بإطار أبيض — كأنها ختم للمرحلة',
  STAGES.map(([ic,lb,ct,list])=>`<div class="stage-box box-b">
    <div class="hd-b"><span class="ic">${ic}</span><span class="lb">${lb}</span><span class="ct">${ct}</span></div>
    ${cards(list)}</div>`).join('')],

 ['ج — جناحان ذهبيان','شريط كحلي في المنتصف يمتد منه خطان ذهبيان للطرفين',
  STAGES.map(([ic,lb,ct,list])=>`<div class="stage-box">
    <div class="hd-c"><span class="pill"><span class="ic">${ic}</span><span class="lb">${lb}</span><span class="ct">${ct}</span></span></div>
    ${cards(list)}</div>`).join('')],

 ['د — لمسة ملكية','حبة كحلية وسط، فوقها ◆ ذهبية صغيرة وتحتها خط ذهبي قصير',
  STAGES.map(([ic,lb,ct,list])=>`<div class="stage-box">
    <div class="hd-d"><span class="pill"><span class="ic">${ic}</span><span class="lb">${lb}</span><span class="ct">${ct}</span></span><span class="under"></span></div>
    ${cards(list)}</div>`).join('')],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
