<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اللون الأبيض مع التدرّج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#667085;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--pl:#3B82F6;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 13px 80px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:13px;font-weight:800;color:var(--muted);margin:2px 3px 12px;line-height:1.6;}
    .sec{font-size:12px;font-weight:800;color:var(--muted);margin:16px 3px 8px;}

    .picker{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;display:flex;flex-wrap:wrap;gap:9px;}
    .chip{width:38px;height:38px;border-radius:11px;border:2px solid transparent;box-shadow:0 2px 5px rgba(16,24,40,.14);position:relative;}
    .chip.white{border-color:#E2DED2;background:linear-gradient(150deg,#fff 0%,#F3F0E8 100%);}
    .chip.on{border-color:var(--royal);box-shadow:0 0 0 3px color-mix(in srgb,var(--royal) 18%,transparent),0 2px 5px rgba(16,24,40,.14);}
    .chip span{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:900;opacity:0;}
    .chip.white span{color:var(--royal);}
    .chip.on span{opacity:1;}

    /* الشريط والمجموعة كما هو منشور */
    .banner{display:flex;align-items:center;gap:10px;color:#fff;border-radius:15px;padding:9px 14px;margin:0 0 13px;
        background:linear-gradient(180deg,color-mix(in srgb,var(--royal) 76%,#5B8DEF) 0%,var(--royal) 55%,color-mix(in srgb,var(--royal) 62%,#000) 100%);
        border:1px solid color-mix(in srgb,var(--royal) 80%,#fff);
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35), inset 0 -2px 4px rgba(0,0,0,.3),
                   0 7px 14px rgba(15,44,92,.4), 0 2px 4px rgba(15,44,92,.3);}
    .bn-ic{width:28px;height:28px;flex-shrink:0;display:grid;place-items:center;border-radius:9px;background:rgba(255,255,255,.18);font-size:14px;}
    .bn-lb{flex:1;font-size:16.5px;font-weight:900;}
    .bn-ct{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700;white-space:nowrap;}

    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .ccard{position:relative;min-height:104px;padding:12px;border-radius:15px;color:#fff;text-align:right;
        background:linear-gradient(135deg,var(--cc) 0%,var(--pl) 120%);border:0;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3), inset 0 -2px 4px rgba(0,0,0,.18),
                   0 6px 12px color-mix(in srgb,var(--cc) 32%,transparent), 0 2px 4px rgba(16,24,40,.18);
        display:flex;flex-direction:column;justify-content:space-between;gap:7px;}
    .cc-g{margin:0;font-weight:900;font-size:13px;line-height:1.35;}
    .cc-s{font-size:10.5px;font-weight:700;opacity:.9;}
    .cc-meta{display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;}
    .cc-edit{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);border-radius:99px;
        padding:2px 10px;font-size:9.5px;font-weight:700;line-height:1.6;}

    /* ===== معالجات البطاقة البيضاء ===== */
    .w .ccard.white{color:var(--royal);}
    .w .ccard.white .cc-s{color:color-mix(in srgb,var(--royal) 60%,#fff);opacity:1;}
    .w .ccard.white .cc-edit{background:rgba(15,44,92,.05);border:1px solid rgba(15,44,92,.22);color:var(--royal);}

    /* أ — أبيض ← رمادي فاتح */
    .w-grey .ccard.white{background:linear-gradient(150deg,#fff 0%,#FAFAF8 55%,#ECEAE3 100%);
        border:1.5px solid #E4E1D8;
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 11px rgba(16,24,40,.12);}
    /* ب — أبيض ← بيج (لون الخلفية) */
    .w-beige .ccard.white{background:linear-gradient(150deg,#fff 0%,#F7F4EC 50%,#E9E4D6 100%);
        border:1.5px solid #E2DCC9;
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 11px rgba(120,100,60,.14);}
    /* ج — أبيض ← ذهبي خفيف */
    .w-gold .ccard.white{background:linear-gradient(150deg,#fff 0%,#FBF6E9 45%,#EFE0BE 100%);
        border:1.5px solid rgba(201,169,97,.5);
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 12px rgba(201,169,97,.28);}
    /* د — أبيض ← كحلي فاتح */
    .w-navy .ccard.white{background:linear-gradient(150deg,#fff 0%,#F4F7FC 45%,#DCE5F3 100%);
        border:1.5px solid #CFDAEC;
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 12px rgba(15,44,92,.18);}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const COLORS=[['#1E40AF','أزرق'],['#10B981','أخضر'],['#F59E0B','عنبري'],['#EF4444','أحمر'],
              ['#0EA5E9','سماوي'],['#8B5CF6','بنفسجي'],['#EC4899','وردي'],['#14B8A6','فيروزي'],
              ['#FFFFFF','أبيض']];
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function pickerHtml(){
  return `<div class="picker">${COLORS.map(([c,n])=>`
    <button class="chip ${c==='#FFFFFF'?'white on':''}" style="${c==='#FFFFFF'?'':'background:'+c}" title="${n}"><span>✓</span></button>`).join('')}</div>`;
}
function body(){
  return `<div class="banner"><span class="bn-ic">🏫</span><span class="bn-lb">ابتدائي</span><span class="bn-ct">٤ فصول</span></div>
  <div class="grid">
    <div class="ccard white"><div><h4 class="cc-g">الرابع الابتدائي / أ</h4><div class="cc-s">رياضيات</div></div>
      <div class="cc-meta"><span class="num">٢٤ طالب</span><span class="cc-edit">تعديل</span></div></div>
    <div class="ccard" style="--cc:#1E40AF"><div><h4 class="cc-g">السادس الابتدائي / ب</h4><div class="cc-s">علوم</div></div>
      <div class="cc-meta"><span class="num">٢٧ طالب</span><span class="cc-edit">تعديل</span></div></div>
    <div class="ccard white"><div><h4 class="cc-g">الخامس الابتدائي / ج</h4><div class="cc-s">لغتي</div></div>
      <div class="cc-meta"><span class="num">٢٢ طالب</span><span class="cc-edit">تعديل</span></div></div>
    <div class="ccard white"><div><h4 class="cc-g">الثالث الابتدائي / د</h4><div class="cc-s">تربية إسلامية</div></div>
      <div class="cc-meta"><span class="num">٢٦ طالب</span><span class="cc-edit">تعديل</span></div></div>
  </div>`;
}

const D=[
 ['أ — رمادي فاتح','أبيض ينزل لرمادي فاتح جداً — محايد ونظيف','w-grey'],
 ['ب — بيج','أبيض ينزل لبيج بلون خلفية التطبيق — دافئ ومتناغم','w-beige'],
 ['ج — ذهبي خفيف','أبيض ينزل لذهبي فاتح بإطار ذهبي — الأفخم','w-gold'],
 ['د — كحلي فاتح','أبيض ينزل لأزرق فاتح جداً — يتناغم مع الشريط','w-navy'],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,cls],i)=>{
  const sc=document.createElement('div');sc.className='screen w '+cls+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>
    <div class="sec">في نافذة إضافة الفصل — الأبيض مضاف آخر الألوان</div>
    ${pickerHtml()}
    <div class="sec">شكل الفصول البيضاء (وبينها فصل أزرق للمقارنة)</div>
    ${body()}`;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
