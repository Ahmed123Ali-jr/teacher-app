<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>فحص الطباعة</title>
<link rel="stylesheet" href="css/fonts.css?v=1">
<style>
/* صفحة تشخيص: مستقلّة عن تنسيق التطبيق عمداً، حتى لا يخفي عطبٌ في
   التنسيق نتيجةَ الفحص نفسه. */
* { box-sizing: border-box; }
body {
    margin: 0; padding: 16px 14px 40px;
    font-family: 'Tajawal', system-ui, sans-serif;
    background: #F8F6F0; color: #0F2C5C;
}
h1 { font-size: 17px; margin: 0 0 4px; text-align: center; }
.sub { font-size: 12px; color: #6B6B68; text-align: center; margin: 0 0 16px; line-height: 1.8; }
button.go {
    display: block; width: 100%; min-height: 54px; margin-bottom: 16px;
    border-radius: 14px; cursor: pointer; font-family: inherit;
    font-size: 16px; font-weight: 900; color: #fff; border: 1.5px solid #0A2049;
    background: linear-gradient(150deg, #1B3E77 0%, #0F2C5C 55%, #0A2049 100%);
}
button.go:disabled { opacity: .6; }
ol { list-style: none; margin: 0 0 16px; padding: 0; }
li {
    display: flex; align-items: flex-start; gap: 9px;
    background: #fff; border: 1.5px solid #E8D9A8; border-radius: 12px;
    padding: 11px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.7;
}
li .ic { flex: none; width: 22px; font-size: 15px; text-align: center; }
li .tx { flex: 1; min-width: 0; }
li .nm { font-weight: 900; }
li .dt { display: block; font-size: 11.5px; color: #6B6B68; margin-top: 3px; word-break: break-word; }
li.ok   { border-color: #BFE3C4; }
li.bad  { border-color: #E7B4B4; background: #FFF7F7; }
li.wait { opacity: .55; }
.env {
    background: #fff; border: 1.5px solid #E8D9A8; border-radius: 12px;
    padding: 12px; font-size: 11.5px; line-height: 1.9; word-break: break-all;
}
.env b { color: #0F2C5C; }
.hint {
    margin-top: 14px; font-size: 12px; line-height: 1.9; color: #6B6B68;
    background: #fff; border: 1.5px dashed #C9A961; border-radius: 12px; padding: 12px;
}
</style>
</head>
<body>

<h1>فحص طباعة الاختبار</h1>
<p class="sub">يُجري السلسلة كاملة على جهازك ويُظهر أين تتوقّف.<br>لا يمسّ بياناتك ولا يحفظ شيئاً.</p>

<button class="go" id="go">▶︎ ابدأ الفحص</button>

<ol id="steps"></ol>
<div class="env" id="env">…</div>
<div class="hint">
    صوّر هذه الشاشة كاملةً وأرسلها — الخطوة الحمراء تكفي لمعرفة السبب.
</div>

<script src="js/question-editor.js?v=2"></script>
<script src="js/pdf-core.js?v=4"></script>
<script src="js/print-exam.js?v=D8"></script>

<script>
(function () {
    'use strict';

    const STEPS = [
        ['load',    'تحميل الوحدات الثلاث'],
        ['engine',  'تحميل مكتبتَي PDF (من vendor)'],
        ['stage',   'تجهيز المسرح وتنسيق الورقة'],
        ['pages',   'بناء الصفحات وترقيمها'],
        ['render',  'توليد ملف PDF'],
        ['deliver', 'فتح ورقة المشاركة / التنزيل']
    ];

    const listEl = document.getElementById('steps');
    listEl.innerHTML = STEPS.map(([k, n]) =>
        `<li class="wait" id="s-${k}"><span class="ic">⏳</span>
             <span class="tx"><span class="nm">${n}</span><span class="dt"></span></span></li>`).join('');

    const mark = (k, state, detail) => {
        const li = document.getElementById('s-' + k);
        li.className = state;
        li.querySelector('.ic').textContent = state === 'ok' ? '✅' : state === 'bad' ? '❌' : '⏳';
        if (detail !== undefined) li.querySelector('.dt').textContent = detail;
    };

    /* بيئة الجهاز: أهمّها هل يدعم مشاركة الملفّات، فهي مسار iOS. */
    function env() {
        const nav = navigator;
        const file = new File([new Blob(['x'])], 'x.pdf', { type: 'application/pdf' });
        let canShareFiles = false;
        try { canShareFiles = !!(nav.canShare && nav.canShare({ files: [file] })); } catch (e) {}
        const standalone = (nav.standalone === true)
            || matchMedia('(display-mode: standalone)').matches;
        return {
            'الجهاز': nav.userAgent,
            'مثبَّت كتطبيق': standalone ? 'نعم' : 'لا (داخل المتصفح)',
            'يدعم مشاركة الملفّات': canShareFiles ? 'نعم' : 'لا — سيُنزّل الملف',
            'navigator.share': typeof nav.share,
            'عامل الخدمة يتحكّم': nav.serviceWorker && nav.serviceWorker.controller ? 'نعم' : 'لا',
            'نسخ الوحدات': 'question-editor v2 · pdf-core v4 · print-exam D8'
        };
    }

    document.getElementById('env').innerHTML = Object.entries(env())
        .map(([k, v]) => `<b>${k}:</b> ${String(v)}`).join('<br>');

    const EXAM = {
        title: 'اختبار الفحص',
        settings: { include_school: true, include_teacher: true, include_date: true,
                    include_name: true, include_grade: true, include_instructions: true },
        questions: [
            { type:'mcq', text:'أيُّ الأجزاء الآتية مسؤولٌ عن نقل الماء في النبات؟',
              options:['الخشب','اللحاء','الوَرقة','الزهرة'], answer:'الخشب', points:2 },
            { type:'tf', text:'القمر جسمٌ مضيءٌ بذاته.', options:[], answer:'خطأ', points:1 },
            { type:'essay', text:'اذكر ثلاثاً من طرق المحافظة على البيئة المدرسية.',
              options:[], answer:'', points:4 }
        ]
    };

    document.getElementById('go').addEventListener('click', async function () {
        const btn = this;
        btn.disabled = true;
        btn.textContent = '⏳ جارٍ الفحص…';

        /* لا نستعمل PrintExam.savePdf مباشرةً: هي تبتلع الخطأ في catch
           واحد، والمطلوب هنا معرفة أيّ خطوةٍ سقطت بعينها. */
        /* savePdf تبتلع الخطأ في catch واحد ولا تُظهره إلا في console —
           فنلتقطه من هناك، وإلّا ضاع السبب الحقيقي. */
        let swallowed = '';
        const realWarn = console.warn;
        console.warn = function (...a) {
            const t = a.map((x) => (x && x.message) || String(x)).join(' ');
            if (t.indexOf('print-exam') >= 0) swallowed = t;
            realWarn.apply(console, a);
        };

        let stage = null;
        try {
            const missing = ['QuestionEditor', 'PdfCore', 'PrintExam'].filter((m) => !window[m]);
            if (missing.length) throw new Error('وحدات ناقصة: ' + missing.join('، '));
            mark('load', 'ok', 'الثلاث محمّلة');

            const t0 = Date.now();
            await window.PdfCore.preloadPdfEngine();
            if (!window.html2canvas) throw new Error('html2canvas لم تُحمَّل');
            if (!window.jspdf)       throw new Error('jsPDF لم تُحمَّل');
            mark('engine', 'ok', (Date.now() - t0) + ' مللي ثانية');

            stage = await window.PdfCore.createStage();
            mark('stage', 'ok', 'عرض الورقة ' + window.PdfCore.PAGE.W + 'px');

            /* نستدعي المسار الحقيقي عبر PrintExam، لكن باعتراض التسليم
               حتى نفصل «فشل التوليد» عن «فشل المشاركة». */
            let blob = null, delivered = null, delivErr = null;
            const realRender  = window.PdfCore.renderPdf;
            const realDeliver = window.PdfCore.deliverPdf;
            let pageCount = 0;

            window.PdfCore.renderPdf = async (pages, o) => {
                pageCount = pages.length;
                mark('pages', 'ok', pageCount + ' صفحة');
                return realRender.call(window.PdfCore, pages, o);
            };
            window.PdfCore.deliverPdf = async (b, name) => {
                blob = b;
                mark('render', 'ok', Math.round(b.size / 1024) + ' كيلوبايت · ' + pageCount + ' صفحة');
                try {
                    delivered = await realDeliver.call(window.PdfCore, b, name);
                } catch (e) {
                    delivErr = e;
                    throw e;
                }
                return delivered;
            };

            await window.PrintExam.savePdf(
                { exam: EXAM, cls: { grade: 'الأول المتوسط', section: '٣', subject: 'العلوم' },
                  teacher: { name: 'معلّم', school_name: 'مدرسة' } },
                { includeAnswers: true });

            window.PdfCore.renderPdf  = realRender;
            window.PdfCore.deliverPdf = realDeliver;

            if (!blob) {
                mark('pages', 'bad', 'لم تُبنَ الصفحات');
                mark('render', 'bad', 'لم يُولَّد ملف');
                throw new Error(swallowed || 'توقّف قبل التوليد — راجع الخطوات أعلاه');
            }
            if (delivErr) throw delivErr;

            mark('deliver', delivered ? 'ok' : 'bad',
                delivered === 'shared'     ? 'فُتحت ورقة المشاركة ✅'
              : delivered === 'downloaded' ? 'نُزّل الملف — ابحث عنه في «التنزيلات»'
              : delivered === 'cancelled'  ? 'أغلقتَ ورقة المشاركة (وهذا يعني أنها عملت ✅)'
              : 'لم يُرجَع شيء');

            btn.textContent = '✅ انتهى الفحص — أعِد المحاولة';
        } catch (err) {
            const msg = (err && (err.message || err.name)) || String(err);
            const pending = STEPS.map(([k]) => k)
                .find((k) => document.getElementById('s-' + k).className === 'wait');
            if (pending) mark(pending, 'bad', msg);
            btn.textContent = '❌ توقّف — أعِد المحاولة';
        } finally {
            console.warn = realWarn;
            if (stage) stage.destroy();
            btn.disabled = false;
        }
    });
})();
</script>
</body>
</html>
