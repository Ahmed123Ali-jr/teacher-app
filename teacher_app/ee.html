<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الحالات الفارغة — اختبارات وأوراق عمل</title>
<link rel="stylesheet" href="css/main.css?e=1">
<link rel="stylesheet" href="css/components.css?e=1">
<link rel="stylesheet" href="css/views.css?e=1">
<link rel="stylesheet" href="css/portfolio-theme.css?e=1">
<link rel="stylesheet" href="css/theme-white.css?e=1">
<link rel="stylesheet" href="css/fonts.css?e=1">
<!--
    ee.html — معاينةٌ لا تُشحن. تُحذف بعد الاعتماد.

    تسأل سؤالاً واحداً: هل تلبس الحالةُ الفارغةُ في الاختبارات وأوراق
    العمل ثوبَ الكتب؟ فالأنماطُ من ملفّات التطبيق نفسِها لا نسخةً منها،
    والترويسةُ والشريطُ السفلي بأبعادهما المعايَرة (٨٥ + ٥٨) حتى يقع
    الزرُّ حيث يقع فعلاً.
-->
<style>
body { margin:0; background: var(--bg); }
.frame { min-height:100dvh; display:flex; flex-direction:column; }
.hd { flex:0 0 auto; height:85px; display:flex; align-items:center; justify-content:space-between;
      padding:0 16px; background:var(--surface); border-bottom:1px solid var(--border); }
.hd .t { font-size:17px; font-weight:var(--fw-black); color:var(--ink-primary); }
.hd .b { font-size:20px; color:var(--primary); }
.body { flex:1 1 auto; }
.nav { position:fixed; inset-inline:11px; bottom:11px; height:58px; display:flex; padding:4px;
       border-radius:21px; background:var(--surface); border:1px solid var(--border);
       box-shadow:0 5px 16px rgba(16,24,40,.10); z-index:5; }
.nav i { font-style:normal; flex:1; text-align:center; padding:6px 0; font-size:10px;
         color:var(--text-muted); border-radius:15px; line-height:1.4; }
.nav i span { display:block; font-size:16px; }
.nav i.on { color:#fff; background:linear-gradient(150deg,var(--primary-lift),var(--primary)); font-weight:800; }
.pick { position:fixed; inset:auto 0 0 0; z-index:20; background:#12202A; padding:6px;
        padding-bottom:calc(6px + env(safe-area-inset-bottom)); display:flex; gap:6px; }
.pick button { flex:1; border:0; border-radius:10px; background:#1E323E; color:#C9D3DA;
        font-family:inherit; font-weight:800; font-size:11.5px; cursor:pointer; padding:8px 2px; line-height:1.35; }
.pick button.on { background:linear-gradient(150deg,#1A8299,var(--primary)); color:#fff; }
/* شريطُ الاختيار يأكل ‎56px‎ من أسفل الشاشة، فتُخصم من حساب الحالة
   الفارغة أيضاً — وإلّا وقع الزرُّ تحت شريط التنقّل هنا وحدَه، بخلاف
   ما سيقع في التطبيق. */
body { padding-bottom:56px; }
.nav { bottom:67px; }
#tab-panel.is-empty-tab { min-height: calc(100dvh - 175px - 56px); }
</style>
</head>
<body>

<div class="frame">
  <div class="hd"><span class="b">→</span><span class="t" id="ttl">الاختبارات</span></div>
  <div class="container body">
    <div class="tab-panel is-empty-tab" id="tab-panel"></div>
  </div>
</div>

<div class="nav">
  <i><span>🏠</span>الرئيسية</i><i class="on"><span>📚</span>الفصول</i>
  <i><span>📅</span>الجدول</i><i><span>🗂️</span>إنجاز</i><i><span>⚙️</span>الإعدادات</i>
</div>

<div class="pick">
  <button class="on" data-v="ex">الاختبارات<br>(المقترح)</button>
  <button data-v="ws">أوراق العمل<br>(المقترح)</button>
  <button data-v="bk">الكتب<br>(المنفَّذ اليوم)</button>
  <button data-v="old">الاختبارات<br>(الحالي)</button>
</div>

<script>
var V = {
    ex: { t:'الاختبارات', h:'لا اختبارات بعد',
          s:'اكتب أسئلتك، وتخرج الورقة بالتصميم الرسمي جاهزةً للطباعة',
          c:'+ اختبار جديد' },
    ws: { t:'أوراق العمل', h:'لا أوراق عمل بعد',
          s:'اكتب الورقة بنفسك، وتخرج بالتصميم الرسمي جاهزةً للطباعة',
          c:'+ ورقة عمل جديدة' },
    bk: { t:'الكتب', h:'لا كتب بعد',
          s:'ارفع كتاب الفصل أو دليل المعلّم لتقرأه هنا',
          c:'+ ارفع كتاباً' }
};

function draw(v) {
    var p = document.getElementById('tab-panel');
    if (v === 'old') {
        document.getElementById('ttl').textContent = 'الاختبارات';
        p.classList.remove('is-empty-tab');
        p.innerHTML = '<div class="empty-state">'
            + '<p>اكتب أسئلتك بنفسك، وتخرج الورقة بالتصميم الرسمي جاهزةً للطباعة.</p>'
            + '<button class="btn btn-primary">+ اختبار جديد</button></div>';
        return;
    }
    var d = V[v];
    document.getElementById('ttl').textContent = d.t;
    p.classList.add('is-empty-tab');
    p.innerHTML = '<div class="start-note"><b>' + d.h + '</b><span>' + d.s + '</span></div>'
        + '<div class="start-gap"></div>'
        + '<button type="button" class="start-cta">' + d.c + '</button>';
}

document.querySelector('.pick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    draw(b.dataset.v);
});
draw('ex');
</script>

</body>
</html>
