<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تصاميم الصفحة الرئيسية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:0 0 90px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    a{text-decoration:none;color:inherit;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 21px;line-height:1.6;}

    /* ===== مشترك ===== */
    .hd{display:flex;align-items:center;justify-content:space-between;padding:21px 21px 13px;}
    .hd-tt h1{margin:0;font-size:21px;font-weight:800;color:var(--royal);}
    .hd-tt .hij{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;}
    .hd-tt .hij::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);}
    .av{width:44px;height:44px;border-radius:50%;background:var(--royal);color:#fff;display:grid;place-items:center;
        font-weight:800;font-size:17px;border:1.5px solid var(--gold);flex-shrink:0;}

    .hero{margin:0 21px;background:var(--royal);border-radius:21px;padding:21px;color:#fff;position:relative;overflow:hidden;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12), 0 8px 21px rgba(15,44,92,.35);}
    .hero .badge{position:absolute;top:15px;left:15px;background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;
        border-radius:8px;padding:3px 9px;display:flex;align-items:center;gap:5px;}
    .hero .badge i{width:6px;height:6px;border-radius:50%;background:var(--royal);animation:pulse 2s infinite;font-style:normal;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .hero .h-t{font-size:26px;font-weight:900;margin-top:4px;}
    .hero .h-s{font-size:15px;color:rgba(201,169,97,.95);font-weight:700;margin-top:4px;}
    .hero .prog{display:flex;align-items:center;gap:9px;margin-top:14px;}
    .hero .prog .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;}
    .hero .prog .bar i{display:block;height:100%;width:60%;background:var(--gold);border-radius:99px;}
    .hero .prog span{font-size:12px;color:rgba(255,255,255,.7);}
    .hero .cta{display:flex;align-items:center;justify-content:center;margin-top:15px;min-height:55px;border-radius:13px;
        background:var(--gold);color:var(--royal);font-weight:800;font-size:17px;}

    .sec-h{display:flex;align-items:center;gap:8px;padding:0 21px;margin:21px 0 9px;}
    .sec-h b{font-size:15px;color:var(--royal);}
    .sec-h .cnt{color:var(--gold);font-weight:800;font-size:15px;}
    .sec-h a{margin-right:auto;font-size:13px;color:var(--royal);text-decoration:underline;padding:8px 0;}
    .chips-x{display:flex;gap:8px;overflow-x:auto;padding:2px 21px 6px;scrollbar-width:none;}
    .chips-x::-webkit-scrollbar{display:none;}
    .pchip{flex-shrink:0;width:68px;height:76px;border-radius:13px;background:#fff;border:1px solid rgba(15,44,92,.13);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
    .pchip .n{font-weight:800;font-size:15px;color:var(--royal);}
    .pchip .t{font-size:11px;color:var(--muted);}
    .pchip .c{font-size:11px;color:var(--royal);font-weight:700;}
    .pchip.past{background:var(--gray);border-color:transparent;}
    .pchip.past .n,.pchip.past .c{color:rgba(15,44,92,.55);}
    .pchip.past .n::after{content:" ✓";font-size:11px;}
    .pchip.live{background:var(--gold);border-color:transparent;transform:scale(1.05);box-shadow:0 3px 13px rgba(201,169,97,.5);}
    .pchip.live .n,.pchip.live .t,.pchip.live .c{color:var(--royal);font-weight:800;}
    .pchip.wait{background:#FCF3DC;border-color:#E7C87B;}
    .pchip.wait .c{color:#A8854C;}

    .rem-bar{margin:13px 21px 0;background:#fff;border-radius:15px;min-height:55px;display:flex;align-items:center;gap:11px;
        padding:8px 13px;box-shadow:0 2px 8px rgba(16,24,40,.07);}
    .rem-bar .ic{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:16px;}
    .rem-bar b{font-size:15px;color:var(--royal);}
    .rem-bar .bd{background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;}
    .rem-bar .ar{margin-right:auto;color:var(--muted);font-size:16px;}

    .prep-l{padding:0 21px;margin:21px 0 8px;font-size:13px;color:var(--muted);font-weight:700;}
    .prep{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 21px;}
    .prep a{min-height:55px;border-radius:13px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
        gap:5px;font-size:12.5px;font-weight:800;color:var(--royal);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.08);}

    /* ب */
    .mk3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 21px;}
    .mk3 a{min-height:89px;border-radius:15px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
        box-shadow:inset 0 1.5px 0 #fff,0 4px 10px rgba(16,24,40,.09);border:1px solid var(--border);}
    .mk3 .ci{width:34px;height:34px;border-radius:50%;background:rgba(201,169,97,.15);display:grid;place-items:center;font-size:16px;}
    .mk3 b{font-size:13px;color:var(--royal);}
    .att-bar{margin:13px 21px 0;background:#fff;border-radius:15px;min-height:55px;display:flex;align-items:center;gap:9px;padding:8px 13px;
        box-shadow:0 2px 8px rgba(16,24,40,.07);}
    .att-bar span{font-size:13px;color:var(--royal);font-weight:700;}
    .att-bar .pc{font-size:21px;font-weight:800;color:var(--gold);margin-right:auto;}
    .att-bar .ar{color:var(--muted);}

    /* ج */
    .c-hd{padding:34px 21px 0;display:flex;justify-content:space-between;align-items:flex-start;}
    .c-hd h1{margin:0;font-size:26px;font-weight:800;color:var(--royal);}
    .c-hd .hij{font-size:13px;color:rgba(15,44,92,.6);margin-top:5px;}
    .c-hero{margin:34px 21px 0;background:var(--royal);border-radius:21px;min-height:89px;display:flex;align-items:center;gap:13px;
        padding:17px;color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),0 13px 34px rgba(15,44,92,.28);}
    .c-hero::before{content:"";position:absolute;top:0;bottom:0;right:0;width:3px;background:var(--gold);}
    .c-hero .ic{width:44px;height:44px;border-radius:50%;background:rgba(201,169,97,.18);display:grid;place-items:center;font-size:19px;flex-shrink:0;}
    .c-hero .t{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px;}
    .c-hero .t i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite;font-style:normal;}
    .c-hero .s{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px;}
    .c-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:0 21px;margin-top:34px;}
    .c-tile{min-height:102px;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
        box-shadow:inset 0 1.5px 0 #fff,0 4px 10px rgba(16,24,40,.09);border:1px solid var(--border);position:relative;}
    .c-tile .em{font-size:26px;}
    .c-tile b{font-size:15px;font-weight:700;color:var(--royal);}
    .c-tile .lv{font-size:12px;color:#A8854C;font-weight:700;}
    .c-tile .bd{position:absolute;top:9px;left:9px;width:21px;height:21px;border-radius:50%;background:var(--gold);color:var(--royal);
        font-weight:800;font-size:12px;display:grid;place-items:center;}

    /* د */
    .d-hd{display:flex;align-items:center;gap:9px;padding:21px 21px 13px;}
    .d-hd h1{margin:0;font-size:17px;font-weight:800;color:var(--royal);}
    .d-hd .hij{font-size:12px;color:var(--muted);}
    .d-hd .av{width:34px;height:34px;font-size:14px;margin-right:auto;}
    .tl{position:relative;margin:8px 21px 0;padding-right:26px;}
    .tl::before{content:"";position:absolute;top:6px;bottom:6px;right:6px;width:2px;background:var(--gold);opacity:.75;}
    .tl-it{position:relative;margin-bottom:13px;}
    .tl-it .nd{position:absolute;right:-26px;top:50%;transform:translate(50%,-50%);width:13px;height:13px;border-radius:50%;
        background:var(--bg);border:2px solid var(--gold);z-index:1;right:-20px;}
    .tl-it.done .nd{background:#DFF3E8;border-color:#59B37F;}
    .tl-it.live .nd{background:var(--gold);animation:pulse 2s infinite;}
    .tl-row{min-height:55px;border-radius:13px;display:flex;align-items:center;gap:9px;padding:8px 13px;background:#fff;border:1px solid rgba(15,44,92,.13);}
    .tl-row .tt{font-size:13px;font-weight:700;color:var(--royal);}
    .tl-row .tm{font-size:11px;color:var(--muted);margin-right:auto;}
    .tl-it.done .tl-row{background:var(--gray);border-color:transparent;}
    .tl-it.done .tt{color:rgba(15,44,92,.6);}
    .tl-it.wait .tl-row{background:#FCF3DC;border-color:#E7C87B;}
    .tl-it.wait .tt{color:#A8854C;}
    .tl-next .tl-row{border:1px solid var(--gold);min-height:76px;box-shadow:0 4px 10px rgba(201,169,97,.18);}
    .tl-next .nb{background:var(--gold);color:var(--royal);font-weight:800;font-size:11px;border-radius:8px;padding:2px 8px;margin-right:auto;}
    .tl-live{background:var(--royal);border-radius:21px;padding:21px;color:#fff;position:relative;overflow:hidden;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.12),0 8px 21px rgba(15,44,92,.35);}
    .d-head{display:flex;align-items:center;padding:0 21px;margin:13px 0 11px;}
    .d-head b{font-size:15px;color:var(--royal);}
    .d-head span{color:var(--gold);}
    .d-head a{margin-right:auto;font-size:13px;color:var(--royal);text-decoration:underline;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
/* بيانات العرض: الثلاثاء، ٦ حصص، جارية = ح٣ رياضيات الرابع/أ */
const heroNow = `
  <div class="hero">
    <div class="badge"><i></i> الآن</div>
    <div style="font-size:13px;color:rgba(255,255,255,.65)">حصتك الحالية</div>
    <div class="h-t">الرابع الابتدائي / أ</div>
    <div class="h-s">رياضيات · حصة ٣</div>
    <div class="prog"><div class="bar"><i></i></div><span class="num">تنتهي ٠٩:٥٥</span></div>
    <div class="cta">📋 سجل المتابعة</div>
  </div>`;

const chipsRow = `
  <div class="sec-h"><b>حصص اليوم</b><span class="cnt num">٢/٦</span><a>الجدول كاملاً</a></div>
  <div class="chips-x">
    <div class="pchip past"><span class="n num">ح١</span><span class="t num">٠٧:٠٠</span><span class="c">الرابع/أ</span></div>
    <div class="pchip past"><span class="n num">ح٢</span><span class="t num">٠٧:٥٥</span><span class="c">السادس/ب</span></div>
    <div class="pchip live"><span class="n num">ح٣</span><span class="t num">٠٩:٠٠</span><span class="c">الرابع/أ</span></div>
    <div class="pchip wait"><span class="n num">ح٤</span><span class="t num">٠٩:٥٥</span><span class="c">انتظار</span></div>
    <div class="pchip"><span class="n num">ح٥</span><span class="t num">١٠:٥٠</span><span class="c">الخامس/ج</span></div>
    <div class="pchip"><span class="n num">ح٦</span><span class="t num">١١:٤٥</span><span class="c">السادس/ب</span></div>
  </div>`;

const remBar = `
  <div class="rem-bar"><div class="ic">🔔</div><b>تذكيرات اليوم</b><span class="bd num">٢</span><span class="ar">‹</span></div>`;

const header = `
  <div class="hd">
    <div class="hd-tt"><h1>صباح الخير، أحمد 👋</h1><div class="hij">الثلاثاء ١٢ صفر ١٤٤٨هـ</div></div>
    <div class="av">أ</div>
  </div>`;

const D=[];

/* ===== أ — يوم المعلم أولاً ===== */
D.push(['أ — يوم المعلم أولاً','هيرو «حصتك الآن» بزر سجل المتابعة + خط حصص اليوم بلا مودال + تجهيز فصل الحصة تحت الإبهام',`
  ${header}
  ${heroNow}
  ${chipsRow}
  ${remBar}
  <div class="prep-l">تجهيز الرابع الابتدائي / أ</div>
  <div class="prep"><a>📝 الاختبارات</a><a>📄 أوراق العمل</a><a>📚 الواجبات</a></div>
`]);

/* ===== ب — التوليفة ===== */
D.push(['ب — التوليفة','نفس هيرو أ وخط الحصص + «إنشاء سريع» لأي فصل + رقم حضور الأسبوع الحي',`
  ${header}
  ${heroNow}
  ${chipsRow}
  <div class="prep-l">إنشاء سريع</div>
  <div class="mk3">
    <a><span class="ci">📝</span><b>اختبار</b></a>
    <a><span class="ci">📄</span><b>ورقة عمل</b></a>
    <a><span class="ci">📚</span><b>واجب</b></a>
  </div>
  <div class="att-bar">📊<span>حضور هذا الأسبوع</span><span class="pc num">٩٢٪</span><span class="ar">‹</span></div>
  ${remBar}
`]);

/* ===== ج — الحد الأدنى الهادئ ===== */
D.push(['ج — الحد الأدنى','شاشة واحدة بلا تمرير: تحية + بطل واحد + شبكة ٢×٢ تحت الإبهام — والفراغ جزء من التصميم',`
  <div class="c-hd">
    <div><h1>صباح الخير، أحمد</h1><div class="hij">الثلاثاء ١٢ صفر ١٤٤٨هـ</div></div>
    <div class="av">أ</div>
  </div>
  <div class="c-hero">
    <div class="ic">📖</div>
    <div>
      <div class="t"><i></i> حصتك الآن: الرابع الابتدائي / أ</div>
      <div class="s num">رياضيات · حصة ٣ — تنتهي ٠٩:٥٥</div>
    </div>
  </div>
  <div class="c-grid">
    <div class="c-tile"><span class="em">📊</span><b>التقارير</b><span class="lv">حضور ودرجات</span></div>
    <div class="c-tile"><span class="em">📁</span><b>ملف الإنجاز</b><span class="lv">&nbsp;</span></div>
    <div class="c-tile"><span class="em">🕐</span><b>حصص اليوم</b><span class="lv num">٦ حصص · انتظار ١</span></div>
    <div class="c-tile"><span class="bd num">٢</span><span class="em">🔔</span><b>تذكيراتي</b><span class="lv">&nbsp;</span></div>
  </div>
`]);

/* ===== د — تدفّق اليوم ===== */
D.push(['د — تدفّق اليوم','جريء: يومك كله أجندة على خيط ذهبي — والحصة الجارية تتضخم في مكانها من الخيط',`
  <div class="d-hd"><h1>صباح الخير، أحمد 👋</h1><span class="hij">١٢ صفر</span><div class="av">أ</div></div>
  <div class="d-head"><b>يومك · <span class="num">٢/٦</span> حصص</b><a>الجدول كاملاً</a></div>
  <div class="tl">
    <div class="tl-it done"><span class="nd"></span>
      <div class="tl-row"><span class="tt num">ح١ · الرابع/أ</span><span class="tm num">٠٧:٠٠</span></div></div>
    <div class="tl-it done"><span class="nd"></span>
      <div class="tl-row"><span class="tt num">ح٢ · السادس/ب</span><span class="tm num">٠٧:٥٥</span></div></div>
    <div class="tl-it live"><span class="nd"></span>
      <div class="tl-live">
        <div class="badge" style="position:absolute;top:15px;left:15px;background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;border-radius:8px;padding:3px 9px;">● الآن</div>
        <div class="h-t" style="font-size:26px;font-weight:900;">الرابع الابتدائي / أ</div>
        <div class="h-s" style="font-size:15px;color:rgba(201,169,97,.95);font-weight:700;margin-top:4px;">رياضيات · حصة ٣</div>
        <div class="prog" style="display:flex;align-items:center;gap:9px;margin-top:14px;">
          <div class="bar" style="flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;"><i style="display:block;height:100%;width:60%;background:var(--gold);border-radius:99px;"></i></div>
          <span class="num" style="font-size:12px;color:rgba(255,255,255,.7);">تنتهي ٠٩:٥٥</span></div>
        <div class="cta" style="display:flex;align-items:center;justify-content:center;margin-top:15px;min-height:55px;border-radius:13px;background:var(--gold);color:var(--royal);font-weight:800;font-size:17px;">📋 سجل المتابعة</div>
      </div></div>
    <div class="tl-it wait"><span class="nd"></span>
      <div class="tl-row"><span class="tt">حصة انتظار</span><span class="tm num">٠٩:٥٥</span></div></div>
    <div class="tl-it tl-next"><span class="nd"></span>
      <div class="tl-row"><span class="tt num">ح٥ · الخامس/ج · علوم</span><span class="nb num">بعد ٢٥ د</span></div></div>
    <div class="tl-it"><span class="nd"></span>
      <div class="tl-row"><span class="tt num">ح٦ · السادس/ب</span><span class="tm num">١١:٤٥</span></div></div>
    <div class="tl-it"><span class="nd" style="background:#fff;"></span>
      <div class="tl-row"><span class="tt">🔔 تسليم أوراق الاختبار</span><span class="tm">تذكير</span></div></div>
  </div>
  <div class="prep-l">تجهيز الرابع الابتدائي / أ</div>
  <div class="prep"><a>📝 الاختبارات</a><a>📄 أوراق العمل</a><a>📚 الواجبات</a></div>
`]);

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
