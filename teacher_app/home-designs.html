<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تصميم أ — تعديلات قبل الاعتماد</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:0 0 90px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    a{text-decoration:none;color:inherit;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 21px;line-height:1.6;}

    .hd{display:flex;align-items:center;justify-content:space-between;padding:21px 21px 13px;}
    .hd-tt h1{margin:0;font-size:21px;font-weight:800;color:var(--royal);}
    .hd-tt .hij{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;}
    .hd-tt .hij::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);}
    .av{width:44px;height:44px;border-radius:50%;background:var(--royal);color:#fff;display:grid;place-items:center;
        font-weight:800;font-size:17px;border:1.5px solid var(--gold);flex-shrink:0;}

    /* مربع حصتك الحالية — كحلي سادة بلا تدرّج، بارز بالظل فقط */
    .hero{margin:0 21px;border-radius:21px;padding:21px;color:#fff;position:relative;overflow:hidden;
        background:var(--royal);
        border:1px solid #1B3E75;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),
                   0 8px 18px rgba(15,44,92,.42), 0 2px 5px rgba(15,44,92,.3);}
    .hero .badge{position:absolute;top:15px;left:15px;background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;
        border-radius:8px;padding:3px 9px;display:flex;align-items:center;gap:5px;}
    .hero .badge i{width:6px;height:6px;border-radius:50%;background:var(--royal);animation:pulse 2s infinite;font-style:normal;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    .hero .h-l{font-size:13px;color:rgba(255,255,255,.65);}
    .hero .h-t{font-size:26px;font-weight:900;margin-top:4px;}
    .hero .h-s{font-size:15px;color:rgba(201,169,97,.95);font-weight:700;margin-top:4px;}
    .hero .prog{display:flex;align-items:center;gap:9px;margin-top:14px;}
    .hero .prog .bar{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;}
    .hero .prog .bar i{display:block;height:100%;width:60%;background:var(--gold);border-radius:99px;}
    .hero .prog span{font-size:12px;color:rgba(255,255,255,.7);}
    .hero .cta{display:flex;align-items:center;justify-content:center;margin-top:15px;min-height:55px;border-radius:13px;
        background:var(--gold);color:var(--royal);font-weight:800;font-size:17px;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4), 0 4px 10px rgba(0,0,0,.2);}

    .sec-h{display:flex;align-items:center;gap:8px;padding:0 21px;margin:21px 0 9px;}
    .sec-h b{font-size:15px;color:var(--royal);}
    .sec-h .cnt{color:var(--gold);font-weight:800;font-size:15px;}
    .sec-h a{margin-right:auto;font-size:13px;color:var(--royal);text-decoration:underline;padding:8px 0;}
    .chips-x{display:flex;gap:8px;overflow-x:auto;padding:2px 21px 6px;scrollbar-width:none;}
    .chips-x::-webkit-scrollbar{display:none;}
    .pchip{flex-shrink:0;width:68px;height:76px;border-radius:13px;background:#fff;border:1px solid rgba(15,44,92,.13);
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
    .pchip .n{font-weight:800;font-size:15px;color:var(--royal);}
    .pchip .t{font-size:11px;color:var(--muted);}
    .pchip .c{font-size:11px;color:var(--royal);font-weight:700;}
    .pchip.past{background:var(--gray);border-color:transparent;}
    .pchip.past .n,.pchip.past .c{color:rgba(15,44,92,.55);}
    .pchip.past .n::after{content:" ✓";font-size:11px;}
    .pchip.live{background:var(--gold);border-color:transparent;transform:scale(1.05);box-shadow:0 3px 13px rgba(201,169,97,.5);}
    .pchip.live .n,.pchip.live .t,.pchip.live .c{color:var(--royal);font-weight:800;}
    .pchip.wait{background:#FCF3DC;border-color:#E7C87B;}
    .pchip.wait .c{color:#A8854C;}

    /* تذكيرات اليوم — واضحة بنصوصها */
    /* التذكيرات — نفس تدرّج بطاقات الفصول الرصاصي */
    .rem-card{margin:13px 21px 0;border-radius:15px;overflow:hidden;color:var(--royal);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 11px rgba(16,24,40,.12);}
    .rem-card .rem-head .ic{background:rgba(255,255,255,.75);}
    .rem-card .rem-head .tg-btn{background:rgba(255,255,255,.75);}
    .rem-it{border-top-color:color-mix(in srgb,var(--gray) 80%,#000) !important;}
    .rem-head{display:flex;align-items:center;gap:10px;padding:11px 13px;}
    .rem-head .ic{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:16px;}
    .rem-head b{font-size:15px;color:var(--royal);}
    .rem-head .bd{background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;}
    .rem-head .tg-btn{margin-right:auto;width:30px;height:30px;border-radius:50%;border:0;background:var(--bg);
        color:var(--royal);font-size:14px;display:grid;place-items:center;transition:transform .22s ease;}
    .rem-card.open .rem-head .tg-btn{transform:rotate(180deg);}
    .rem-body{display:none;}
    .rem-card.open .rem-body{display:block;}
    .rem-it{display:flex;align-items:center;gap:10px;padding:11px 13px;border-top:1px solid var(--border);}
    .rem-it .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .rem-it .tx{flex:1;min-width:0;}
    .rem-it .tt{font-size:13.5px;font-weight:700;color:var(--text);}
    .rem-it .ss{font-size:11.5px;color:var(--muted);margin-top:1px;}
    .rem-it .tg{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 8px;flex-shrink:0;}

    /* ===== صندوق حصص اليوم الفخم ===== */
    .box{margin:13px 21px 0;border-radius:19px;overflow:hidden;}
    .box-h{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;}
    .box-h b{font-size:15px;font-weight:800;}
    .box-h .cnt{font-weight:800;font-size:13px;border-radius:99px;padding:2px 10px;}
    .box-h a{margin-right:auto;font-size:12.5px;text-decoration:underline;}
    .box-b{padding:0 15px 15px;}
    .box .chips-x{padding:2px 0 4px;}

    /* أ — رصاصي بنفس تدرّج بطاقات الفصول */
    .box-a{color:var(--royal);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff, 0 5px 11px rgba(16,24,40,.12);}
    .box-a .box-h{border-bottom:1px solid color-mix(in srgb,var(--gray) 80%,#000);}
    .box-a .box-h b{color:var(--royal);}
    .box-a .box-h .cnt{background:rgba(201,169,97,.16);color:#8C6D2F;}
    .box-a .box-h a{color:var(--royal);}
    .box-a .box-b{padding-top:11px;}
    .box-a .pchip{border-color:transparent;box-shadow:0 2px 6px rgba(16,24,40,.08);}

    /* ب — كحلية فاخرة */
    .box-b2{background:linear-gradient(180deg,#1B3E75 0%,var(--royal) 55%,#0A2148 100%);
        border:1px solid #1B3E75;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.25),0 8px 18px rgba(15,44,92,.32);}
    .box-b2 .box-h b{color:#fff;}
    .box-b2 .box-h .cnt{background:var(--gold);color:var(--royal);}
    .box-b2 .box-h a{color:rgba(255,255,255,.8);}
    .box-b2 .pchip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);}
    .box-b2 .pchip .n{color:#fff;} .box-b2 .pchip .t{color:rgba(255,255,255,.6);} .box-b2 .pchip .c{color:rgba(255,255,255,.85);}
    .box-b2 .pchip.past{background:rgba(255,255,255,.05);border-color:transparent;}
    .box-b2 .pchip.past .n,.box-b2 .pchip.past .c{color:rgba(255,255,255,.45);}
    .box-b2 .pchip.live{background:var(--gold);border-color:transparent;}
    .box-b2 .pchip.live .n,.box-b2 .pchip.live .t,.box-b2 .pchip.live .c{color:var(--royal);}
    .box-b2 .pchip.wait{background:rgba(231,200,123,.15);border-color:rgba(231,200,123,.45);}
    .box-b2 .pchip.wait .c{color:#E7C87B;}

    /* ج — شبكة ٣×٢ بلا تمرير */
    .box-c{background:#fff;border:1px solid var(--border);box-shadow:0 5px 14px rgba(16,24,40,.08);}
    .box-c .box-h{border-bottom:1px solid var(--border);}
    .box-c .box-h b{color:var(--royal);}
    .box-c .box-h .cnt{background:rgba(201,169,97,.14);color:#8C6D2F;}
    .box-c .box-h a{color:var(--royal);}
    .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:13px;}
    .grid6 .pchip{width:auto;height:68px;}

    /* د — صفوف مرتبة */
    .box-d{background:#fff;border:1px solid var(--border);box-shadow:0 5px 14px rgba(16,24,40,.08);}
    .box-d .box-h{border-bottom:1px solid var(--border);}
    .box-d .box-h b{color:var(--royal);}
    .box-d .box-h .cnt{background:rgba(201,169,97,.14);color:#8C6D2F;}
    .box-d .box-h a{color:var(--royal);}
    .prow{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--border);}
    .prow:last-child{border-bottom:0;}
    .prow .pn{width:34px;height:34px;border-radius:10px;background:var(--bg);color:var(--royal);font-weight:800;font-size:13px;
        display:grid;place-items:center;flex-shrink:0;}
    .prow .pt{flex:1;min-width:0;}
    .prow .p1{font-size:13.5px;font-weight:700;color:var(--royal);}
    .prow .p2{font-size:11.5px;color:var(--muted);margin-top:1px;}
    .prow .pb{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 9px;flex-shrink:0;}
    .prow.past{background:#FAFAF7;}
    .prow.past .p1{color:rgba(15,44,92,.55);}
    .prow.past .pn{background:var(--gray);color:rgba(15,44,92,.5);}
    .prow.past .pb{background:rgba(15,44,92,.05);color:rgba(15,44,92,.45);}
    .prow.live{background:rgba(201,169,97,.09);}
    .prow.live .pn{background:var(--gold);color:var(--royal);}
    .prow.live .pb{background:var(--gold);color:var(--royal);}
    .prow.wait .pn{background:#FCF3DC;color:#A8854C;}
    .prow.wait .p1{color:#A8854C;}
    .prow.wait .pb{background:#FCF3DC;color:#A8854C;}
    .prow .pb.next{background:rgba(15,44,92,.06);color:var(--royal);}

    .prep-l{padding:0 21px;margin:21px 0 8px;font-size:13px;color:var(--muted);font-weight:700;}
    .prep{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 21px;}
    /* أزرار التجهيز — نفس تدرّج بطاقات الفصول الرصاصي */
    .prep a{min-height:55px;border-radius:13px;display:flex;align-items:center;justify-content:center;
        gap:5px;font-size:12.5px;font-weight:800;color:var(--royal);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff,0 5px 11px rgba(16,24,40,.12);}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const header = `
  <div class="hd">
    <div class="hd-tt"><h1>صباح الخير، أحمد 👋</h1><div class="hij">الثلاثاء ١٢ صفر ١٤٤٨هـ</div></div>
    <div class="av">أ</div>
  </div>`;

const hero = `
  <div class="hero">
    <div class="badge"><i></i> الآن</div>
    <div class="h-l">حصتك الحالية</div>
    <div class="h-t">الرابع الابتدائي / أ</div>
    <div class="h-s">رياضيات · حصة ٣</div>
    <div class="prog"><div class="bar"><i></i></div><span class="num">تنتهي ٠٩:٥٥</span></div>
    <div class="cta">📋 سجل المتابعة</div>
  </div>`;

const CHIPS = `
  <div class="pchip past"><span class="n num">ح١</span><span class="t num">٠٧:٠٠</span><span class="c">الرابع/أ</span></div>
  <div class="pchip past"><span class="n num">ح٢</span><span class="t num">٠٧:٥٥</span><span class="c">السادس/ب</span></div>
  <div class="pchip live"><span class="n num">ح٣</span><span class="t num">٠٩:٠٠</span><span class="c">الرابع/أ</span></div>
  <div class="pchip wait"><span class="n num">ح٤</span><span class="t num">٠٩:٥٥</span><span class="c">انتظار</span></div>
  <div class="pchip"><span class="n num">ح٥</span><span class="t num">١٠:٥٠</span><span class="c">الخامس/ج</span></div>
  <div class="pchip"><span class="n num">ح٦</span><span class="t num">١١:٤٥</span><span class="c">السادس/ب</span></div>`;

const boxHead = `
  <div class="box-h"><b>🕐 حصص اليوم</b><span class="cnt num">٢ / ٦</span><a>الجدول كاملاً</a></div>`;

/* أ — بطاقة بيضاء بإطار ذهبي، الشريط داخلها */
const boxA = `<div class="box box-a">${boxHead}<div class="box-b"><div class="chips-x">${CHIPS}</div></div></div>`;
/* ب — بطاقة كحلية فاخرة */
const boxB = `<div class="box box-b2">${boxHead}<div class="box-b"><div class="chips-x">${CHIPS}</div></div></div>`;
/* ج — شبكة ٣×٢ مرتبة بلا تمرير */
const boxC = `<div class="box box-c">${boxHead}<div class="box-b"><div class="grid6">${CHIPS}</div></div></div>`;
/* د — صفوف مرتبة */
const boxD = `
  <div class="box box-d">${boxHead}
    <div class="prow past"><span class="pn num">١</span><div class="pt"><div class="p1">الرابع الابتدائي / أ</div><div class="p2 num">رياضيات · ٠٧:٠٠</div></div><span class="pb">✓ تمت</span></div>
    <div class="prow past"><span class="pn num">٢</span><div class="pt"><div class="p1">السادس الابتدائي / ب</div><div class="p2 num">علوم · ٠٧:٥٥</div></div><span class="pb">✓ تمت</span></div>
    <div class="prow live"><span class="pn num">٣</span><div class="pt"><div class="p1">الرابع الابتدائي / أ</div><div class="p2 num">رياضيات · ٠٩:٠٠ — ٠٩:٥٥</div></div><span class="pb">● الآن</span></div>
    <div class="prow wait"><span class="pn">—</span><div class="pt"><div class="p1">حصة انتظار</div><div class="p2 num">٠٩:٥٥</div></div><span class="pb">انتظار</span></div>
    <div class="prow"><span class="pn num">٥</span><div class="pt"><div class="p1">الخامس الابتدائي / ج</div><div class="p2 num">علوم · ١٠:٥٠</div></div><span class="pb next num">بعد ٢٥ د</span></div>
    <div class="prow"><span class="pn num">٦</span><div class="pt"><div class="p1">السادس الابتدائي / ب</div><div class="p2 num">علوم · ١١:٤٥</div></div><span class="pb next">قادمة</span></div>
  </div>`;

/* التذكيرات واضحة: نص كل تذكير + نوعه + فصله/وقته */
/* التذكيرات مطويّة — السهم يفتحها */
const remCard = `
  <div class="rem-card" data-rem>
    <div class="rem-head"><div class="ic">🔔</div><b>تذكيرات اليوم</b><span class="bd num">٢</span>
      <button class="tg-btn" data-rem-toggle aria-label="عرض التذكيرات">▾</button></div>
    <div class="rem-body">
      <div class="rem-it">
        <span class="dot" style="background:#DC2626"></span>
        <div class="tx"><div class="tt">تسليم أوراق اختبار الفترة الأولى</div><div class="ss">الرابع الابتدائي / أ · اليوم</div></div>
        <span class="tg" style="background:rgba(220,38,38,.08);color:#DC2626">اختبار</span>
      </div>
      <div class="rem-it">
        <span class="dot" style="background:#2563EB"></span>
        <div class="tx"><div class="tt">اجتماع لجنة التوجيه الطلابي</div><div class="ss num">غرفة المعلمين · ٠١:٠٠ ظهراً</div></div>
        <span class="tg" style="background:rgba(37,99,235,.08);color:#2563EB">اجتماع</span>
      </div>
      <div class="rem-it" style="justify-content:center">
        <a style="font-size:12.5px;color:var(--royal);text-decoration:underline">كل التذكيرات ←</a>
      </div>
    </div>
  </div>`;

const prep = `
  <div class="prep-l">تجهيز الرابع الابتدائي / أ</div>
  <div class="prep"><a>📝 الاختبارات</a><a>📄 أوراق العمل</a><a>📚 الواجبات</a></div>`;

/* التذكيرات المطويّة أولاً في كل البدائل */
const page = (box) => header + remCard + box + prep + '<div style="height:13px"></div>' + hero;

const D=[
 ['أ — رصاصي كالفصول','التذكيرات مطويّة في الأعلى · صندوق الحصص بنفس تدرّج بطاقات الفصول الرصاصية، وحبّات الحصص بيضاء داخله', page(boxA)],
 ['ب — كحلية فاخرة','التذكيرات مطويّة في الأعلى · صندوق كحلي بارز، الحبّات داخله شفافة والجارية ذهبية — الأفخم', page(boxB)],
 ['ج — شبكة مرتبة','التذكيرات مطويّة في الأعلى · كل الحصص الست في شبكة ٣×٢ بلا تمرير — الأرتب', page(boxC)],
 ['د — صفوف مفصّلة','التذكيرات مطويّة في الأعلى · كل حصة سطر كامل بحالتها (تمت/الآن/انتظار/بعد ٢٥ د) — الأوضح', page(boxD)],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
/* فتح/طي التذكيرات */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-rem-toggle]');
  if (!t) return;
  t.closest('[data-rem]').classList.toggle('open');
});
</script>
</body>
</html>
