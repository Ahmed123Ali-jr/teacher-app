<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>صفحة البدء — النسخة المبسّطة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--green:#059669;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    #page{min-height:100vh;padding:0 21px 150px;}
    .num{font-variant-numeric:tabular-nums;}
    a{text-decoration:none;color:inherit;}
    .statebar{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);
        padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .statebar button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .statebar button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0;line-height:1.6;}

    .hd{display:flex;align-items:center;justify-content:space-between;padding:21px 0 13px;}
    .hd h1{margin:0;font-size:21px;font-weight:800;color:var(--royal);}
    .hd .hij{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;}
    .hd .hij::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);}
    .av{width:44px;height:44px;border-radius:50%;background:var(--royal);color:#fff;display:grid;place-items:center;
        font-weight:800;font-size:17px;border:1.5px solid var(--gold);flex-shrink:0;}

    /* المربع الكحلي الكبير — نفسه للفصل الأول ثم للجدول */
    .big{background:var(--royal);border-radius:26px;padding:34px 21px;color:#fff;text-align:center;position:relative;overflow:hidden;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 13px 26px rgba(15,44,92,.4);}
    .big .halo{position:absolute;width:210px;height:210px;border-radius:50%;background:rgba(201,169,97,.12);left:50%;top:-105px;transform:translateX(-50%);}
    .big .em{font-size:55px;line-height:1;position:relative;}
    .big .t{font-size:23px;font-weight:900;margin-top:13px;position:relative;}
    .big .s{font-size:13.5px;color:rgba(255,255,255,.75);margin-top:6px;line-height:1.7;position:relative;}
    .big .cta{display:flex;align-items:center;justify-content:center;margin:21px auto 0;min-height:55px;max-width:280px;border-radius:14px;
        background:var(--gold);color:var(--royal);font-weight:900;font-size:17px;position:relative;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 5px 13px rgba(0,0,0,.25);}

    /* شريط نجاح إضافة الفصل */
    .okbar{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--green) 8%,#fff);
        border:1.5px solid color-mix(in srgb,var(--green) 30%,#fff);border-radius:13px;padding:10px 13px;margin-bottom:13px;}
    .okbar .ck{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;flex-shrink:0;}
    .okbar b{font-size:13px;color:var(--royal);}

    /* بطاقة التذكيرات المطوية (كما اعتُمدت) */
    .rem{border-radius:15px;color:var(--royal);display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:13px;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff,0 5px 11px rgba(16,24,40,.12);}
    .rem .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:16px;}
    .rem b{font-size:15px;}
    .rem .bd{background:var(--gold);color:var(--royal);font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center;}
    .rem .tg{margin-right:auto;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;font-size:14px;}

    /* التجهيز */
    .prep-l{margin:21px 3px 8px;font-size:13px;color:var(--muted);font-weight:700;}
    .prep{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .prep a{min-height:55px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:5px;
        font-size:12.5px;font-weight:800;color:var(--royal);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff,0 5px 11px rgba(16,24,40,.12);}

    /* بطاقة «لا حصص اليوم» */
    .rest{margin-top:13px;background:#fff;border:1px solid var(--border);border-radius:21px;padding:26px 21px;text-align:center;
        box-shadow:0 3px 10px rgba(16,24,40,.07);}
    .rest .em{font-size:47px;line-height:1;}
    .rest .t{font-size:19px;font-weight:900;color:var(--royal);margin-top:11px;}
    .rest .s{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.7;}
    .rest .lk{display:inline-flex;align-items:center;gap:5px;margin-top:13px;font-size:13px;color:var(--royal);text-decoration:underline;font-weight:700;}
</style>
</head>
<body>
<div id="page"></div>
<div class="statebar" id="statebar">
  <button data-st="0" class="on">١ — أول فتح (لا فصول)</button>
  <button data-st="1">٢ — فصول بلا جدول</button>
  <button data-st="2">٣ — يوم بلا حصص</button>
  <button data-st="3">٤ — الجمعة/السبت</button>
</div>

<script>
const header = `
  <div class="hd">
    <div><h1>أهلاً بك 👋</h1><div class="hij">الثلاثاء ١٢ صفر ١٤٤٨هـ</div></div>
    <div class="av">أ</div>
  </div>`;

const prep = `
  <div class="prep-l">تجهيز الرابع الابتدائي / أ</div>
  <div class="prep"><a>📝 الاختبارات</a><a>📄 أوراق العمل</a><a>📚 الواجبات</a></div>`;

const rem = `<div class="rem"><div class="ic">🔔</div><b>تذكيرات اليوم</b><span class="bd num">٢</span><span class="tg">▾</span></div>`;

const STATES=[
 ['١ — أول فتح · لا فصول: مربع واحد فقط «أضف فصلك الأول» — بلا خطوات ولا تشتيت',`
  ${header}
  <div class="big">
    <div class="halo"></div>
    <div class="em">🎒</div>
    <div class="t">أضف فصلك الأول</div>
    <div class="s">اختر المرحلة والصف والشعبة والمادة<br>وابدأ متابعة طلابك خلال دقيقة</div>
    <div class="cta">+ إضافة فصل</div>
  </div>`],

 ['٢ — أضاف فصولاً ولم يُعدّ الجدول: نفس المربع تحت أزرار التجهيز يقول «أضف الفصول للجدول»',`
  ${header}
  <div class="okbar"><div class="ck">✓</div><b>تمت إضافة الرابع الابتدائي / أ — رياضيات</b></div>
  ${prep}
  <div style="height:13px"></div>
  <div class="big">
    <div class="halo"></div>
    <div class="em">📅</div>
    <div class="t">أضف الفصول للجدول</div>
    <div class="s">حدّد حصص فصولك في الجدول الأسبوعي<br>ليظهر يومك وحصتك القادمة هنا</div>
    <div class="cta">📅 إعداد الجدول</div>
  </div>`],

 ['٣ — الجدول مضبوط لكن اليوم ما فيه حصص (مثلاً يومك فاضي): الرئيسية تبقى مفيدة بالتذكيرات والتجهيز',`
  ${header}
  ${rem}
  ${prep}
  <div class="rest">
    <div class="em">🌤️</div>
    <div class="t">لا حصص لك اليوم</div>
    <div class="s">يومك خالٍ من الحصص — وقت مناسب<br>لتجهيز الاختبارات وأوراق العمل</div>
    <a class="lk">📅 الجدول كاملاً ←</a>
  </div>`],

 ['٤ — الجمعة والسبت: بطاقة إجازة هادئة',`
  ${header}
  ${rem}
  ${prep}
  <div class="rest">
    <div class="em">🌴</div>
    <div class="t">إجازة سعيدة</div>
    <div class="s">نلقاك الأحد بإذن الله</div>
  </div>`],
];

const page=document.getElementById('page');
function paint(i){page.innerHTML=`<div class="pal-name">${STATES[i][0]}</div>`+STATES[i][1];window.scrollTo(0,0);}
document.querySelectorAll('.statebar button').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.statebar button').forEach(x=>x.classList.toggle('on',x===b));paint(+b.dataset.st);};
});
paint(0);
</script>
</body>
</html>
