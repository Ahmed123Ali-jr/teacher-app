    <!-- ══════════════════════════════════════════════════════════════════
         تسخينُ القناة إلى الخادم قبل أن تُطلب.

         أوّلُ طلبٍ إلى Supabase (تسجيلُ الدخول) يدفع ثمناً قبل أن يبدأ:
         بحثٌ عن العنوان، ثم مصافحةُ TCP، ثم مصافحةُ TLS — ثلاثُ رحلاتٍ إلى
         فرانكفورت قبل إرسال حرفٍ واحد. وعلى شبكة الجوال قد تبلغ نصف ثانية.

         و`preconnect` يفعلها **أثناء تحميل الصفحة** — والمعلّم يقرأ شاشة
         الدخول — فحين يضغط لا يبقى إلا رحلةٌ واحدة.
         ══════════════════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://rbsfpsmolxldmwcclhlc.supabase.co" crossorigin>

    <!-- Instant splash: pure inline HTML/CSS so it paints before any file
         loads (kills the mobile white screen). Removed by the router after
         the first view renders; 15s failsafe fades it if boot ever hangs. -->
    <div id="splash" style="position:fixed; inset:0; z-index:9998; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#FFFFFF; font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; transition:opacity 250ms ease;">
        <!-- شعار التطبيق: قبعة تخرج بالأزرق الملكي والذهبي (SVG داخلي = يظهر فوراً) -->
        <svg width="104" height="104" viewBox="0 0 96 96" aria-label="شعار فصول">
            <defs>
                <linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#1A3A6E"/>
                    <stop offset="1" stop-color="#0F2C5C"/>
                </linearGradient>
            </defs>
            <circle cx="48" cy="48" r="45" fill="url(#splash-bg)"/>
            <circle cx="48" cy="48" r="45" fill="none" stroke="#C9A961" stroke-width="2.5"/>
            <path d="M48 29 L77 41.5 L48 54 L19 41.5 Z" fill="#FFFFFF"/>
            <path d="M33.5 48.5 V58.5 c0 4.2 6.8 7.2 14.5 7.2 s14.5-3 14.5-7.2 V48.5 L48 54.8 Z" fill="#E8ECF4"/>
            <path d="M75 43 v11.5" stroke="#C9A961" stroke-width="2.6" stroke-linecap="round"/>
            <circle cx="75" cy="58" r="3.2" fill="#C9A961"/>
        </svg>
        <div style="font-size:21px; font-weight:700; color:#0F2C5C;">فصول</div>
        <div style="width:26px; height:26px; border:3px solid #E2E8F0; border-top-color:#C9A961; border-radius:50%; animation:splash-spin .8s linear infinite;"></div>
        <style>@keyframes splash-spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script>
        setTimeout(function () {
            var s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
        }, 15000);
    </script>

    <!-- Service Worker: enables offline + auto-update banner on every deploy. -->
    <script>
    (function () {
        if (!('serviceWorker' in navigator)) return;

        function showUpdateBanner(registration) {
            if (document.getElementById('sw-update-banner')) return;
            const bar = document.createElement('div');
            bar.id = 'sw-update-banner';
            bar.style.cssText = [
                /* فوق الشريط السفلي العائم لا تحته: كان عند ‎16px‎ فيزاحمه
               الشريطُ ويصعب أن تُرى اللافتةُ أو يُضغط زرُّها. */
            'position:fixed','bottom:calc(84px + env(safe-area-inset-bottom))',
            'inset-inline-end:16px','z-index:9999',
                'background:#0A3F4A','color:#fff','padding:10px 14px',
                'border-radius:10px','font-family:IBM Plex Sans Arabic,system-ui,sans-serif',
                'box-shadow:0 6px 20px rgba(0,0,0,.18)','font-size:14px',
                'display:flex','gap:10px','align-items:center'
            ].join(';');
            bar.innerHTML = '<span>تحديث جديد متاح</span>'
                + '<button id="sw-update-btn" style="background:#fff;color:#0A3F4A;'
                + 'border:none;border-radius:6px;padding:6px 10px;font-weight:700;'
                + 'cursor:pointer">تحديث</button>';
            document.body.appendChild(bar);
            bar.querySelector('#sw-update-btn').addEventListener('click', () => {
                if (registration.waiting) registration.waiting.postMessage('SKIP_WAITING');
            });
        }

        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then((reg) => {
                if (reg.waiting) showUpdateBanner(reg);
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            showUpdateBanner(reg);
                        }
                    });
                });
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) reg.update().catch(() => {});
                });
            }).catch((e) => console.warn('[sw] registration failed:', e));
        });

        let _reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (_reloaded) return;
            _reloaded = true;
            location.reload();
        });
    })();
    </script>
