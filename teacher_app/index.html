    <!-- `viewport-fit=cover` لازمٌ للنسخة المغلَّفة: بدونه يرسم WKWebView
         ملءَ الشاشة **و`env(safe-area-inset-*)` تعود أصفاراً** — فيقع
         الشريطُ العلويّ تحت شريط الحالة والنتوء، ويلتصق السفليُّ بخطّ
         الإيماءة. قِيس على المحاكي (٥ سبتمبر ٢٠٢٦): `T=0px` والمحتوى فوقه.
         والتنسيقُ يقرأ هذه الرموزَ أصلاً (`main.css:154` و`views.css:4347`)،
         فلم يكن ينقصه إلّا أن تصير لها قيمة. ولا يضرّ المتصفّح: هناك
         الأصفارُ صحيحةٌ لأنّ الصفحةَ داخل نافذة. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script>
    /* ══ التكبيرُ التلقائيُّ عند الكتابة — في الغلاف وحدَه ══
       قِيس على المحاكي (٥ سبتمبر ٢٠٢٦): بمجرّد لمس حقلِ الاسم يصير
       `innerWidth` ‎352‎ و`outerWidth` ‎402‎ — أي **تكبيرٌ ‎١٤٪‎**، فيفيض
       المستندُ ‎50‎ بكسلاً وينزاح يمنةً، فيُقصّ أوّلُ كلِّ سطرٍ عربيّ:
       «أهلاً بك» تصير «بك».

       والسببُ قاعدةُ آبل: كلُّ حقلٍ خطُّه **دون ‎16px‎** يُكبَّر تلقائيّاً
       عند التركيز. وحقولُنا ‎13.5‎ و‎14‎ — وهي مقاسٌ مقصودٌ في التصميم.

       فيُمنع التكبيرُ **في النسخة المغلَّفة وحدَها** بإضافة
       `maximum-scale=1` — ولا يُكتب في الوسم أصلاً لأنّ ذلك يقتل
       **تكبيرَ الأصابع** في نسخة الويب، ومعلّمو أندرويد كلُّهم عليها
       (وهي طريقُنا هناك بقراره). فداخلَ الغلاف: لا تكبيرَ تلقائيّاً؛
       وعلى الويب: التكبيرُ بالأصابع باقٍ كما هو. */
    (function () {
        try {
            var cap = window.Capacitor;
            if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
            var m = document.querySelector('meta[name="viewport"]');
            if (m) m.setAttribute('content', m.getAttribute('content') +
                ', maximum-scale=1.0, user-scalable=no');
        } catch (e) {}
    })();
    </script>

         ── ولماذا `'unsafe-inline'` للسكربت ──
         في `index.html` سكربتاتٌ داخليّةٌ لازمةٌ **قبل أوّل رسم**: طلاءُ

         تبدّل. والبديلُ بصماتٌ (`sha256-…`) تُعاد كتابتُها مع كلّ تعديل
         حرفٍ فيها، فتُنسى مرّةً فيسقط الإقلاع صامتاً. فالمكسبُ الباقي —
         وهو الأهمّ — **منعُ تحميل أيّ سكربتٍ من نطاقٍ غريب**.

         ── ولا `'unsafe-eval'` ──
         pdf.js وحدَها تطلبه، وقد أُطفئ عندها صراحةً (`isEvalSupported`

         تُتجاهَل في الوسم ولا تعمل إلّا ترويسةً، فوضعُها ضجيجٌ في السجلّ.

<script>
/* لونُ التطبيق الذي اختاره المعلّم — يُطلى قبل أوّل رسمٍ لئلّا يومض
   البتروليُّ ثمّ يتبدّل. ولا حسابَ هنا: `js/theme-color.js` يكتب القيمَ
   المحسوبةَ في المرآة عند الاختيار، وهذا يطليها كما هي.
   والمرآةُ موسومةٌ بمعرّف المعلّم: جهازٌ واحدٌ قد يمرّ عليه حسابان، فلا
   يُلبَس لونُ غيرِه. وكلُّه في try/catch — لونٌ لا يوقف إقلاعاً. */
(function () {
    try {
        var raw = localStorage.getItem('teacher_app_color');
        if (!raw) return;
        var o = JSON.parse(raw);
        if (!o || !o.vars || !o.hex) return;

        var sraw = localStorage.getItem('teacher-app-auth');
        if (!sraw) return;
        var a = JSON.parse(sraw);
        var sess = a && (a.currentSession || a.session || a);
        var uid = sess && sess.user && sess.user.id;
        if (!uid || o.uid !== uid) return;

        var st = document.body.style;
        for (var k in o.vars) st.setProperty(k, o.vars[k]);

        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', o.hex);
    } catch (e) {}
})();
</script>

    <script>
        /* شاشةُ البدء مرسومةٌ بالحروف قبل أيّ ملفّ CSS، فلا يبلغها رمز —
           فتُلوَّن هنا لا في السكربت الأعلى: ذاك يسبق وجودَ هذه العناصر. */
        (function () {
            try {
                var o = JSON.parse(localStorage.getItem('teacher_app_color') || 'null');
                if (!o || !o.hex || !o.vars) return;
                /* التدرّجُ سقط مع القبعة — الشعارُ نقطيٌّ لا يُلوَّن.
                   وبقي النصُّ يتبع لونَ المعلّم. */
                var tx = document.getElementById('splash-tx');
                if (tx) tx.style.color = o.hex;
            } catch (e) {}
        })();
        setTimeout(function () {
            var s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(function () { s.remove(); }, 300); }
        }, 15000);
    </script>

    <!-- Service Worker: enables offline + auto-update banner on every deploy. -->
    <script>
    (function () {
        if (!('serviceWorker' in navigator)) return;

        function showUpdateBanner(registration) {
            if (document.getElementById('sw-update-banner')) return;
            const bar = document.createElement('div');
            bar.id = 'sw-update-banner';
            bar.style.cssText = [
                /* فوق الشريط السفلي العائم لا تحته: كان عند ‎16px‎ فيزاحمه
               الشريطُ ويصعب أن تُرى اللافتةُ أو يُضغط زرُّها. */
            'position:fixed','bottom:calc(84px + env(safe-area-inset-bottom))',
            'inset-inline-end:16px','z-index:9999',
                'background:var(--primary,#0A3F4A)','color:#fff','padding:10px 14px',
                'border-radius:10px','font-family:IBM Plex Sans Arabic,system-ui,sans-serif',
                'box-shadow:0 6px 20px rgba(0,0,0,.18)','font-size:14px',
                'display:flex','gap:10px','align-items:center'
            ].join(';');
            bar.innerHTML = '<span>تحديث جديد متاح</span>'
                + '<button id="sw-update-btn" style="background:#fff;color:var(--primary,#0A3F4A);'
                + 'border:none;border-radius:6px;padding:6px 10px;font-weight:700;'
                + 'cursor:pointer">تحديث</button>';
            document.body.appendChild(bar);
            bar.querySelector('#sw-update-btn').addEventListener('click', () => {
                if (registration.waiting) registration.waiting.postMessage('SKIP_WAITING');
            });
        }

        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then((reg) => {
                if (reg.waiting) showUpdateBanner(reg);
                reg.addEventListener('updatefound', () => {
                    const sw = reg.installing;
                    if (!sw) return;
                    sw.addEventListener('statechange', () => {
                        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                            showUpdateBanner(reg);
                        }
                    });
                });
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) reg.update().catch(() => {});
                });
            }).catch((e) => console.warn('[sw] registration failed:', e));
        });

        let _reloaded = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (_reloaded) return;
            _reloaded = true;
            location.reload();
        });
    })();
    </script>
