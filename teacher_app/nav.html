<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: لونُ الخانة النشطة في الشريط السفليّ</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=13">
<link rel="stylesheet" href="css/views.css?v=D295">
<link rel="stylesheet" href="css/portfolio-theme.css?v=16">
<link rel="stylesheet" href="css/theme-white.css?v=22">

<style>
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 460px; margin: 0 auto; padding: 16px 14px 40px; }
    .pv h1 { font-size: 19px; margin: 0 0 4px; }
    .pv .lede { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; line-height: 1.9; }

    .opt { margin-bottom: 22px; }
    .opt-h {
        display: flex; align-items: baseline; gap: 8px;
        font-size: 14px; font-weight: var(--fw-bold);
        color: var(--ink-primary); margin-bottom: 3px;
    }
    .opt-h .tag {
        font-size: 11px; font-weight: var(--fw-bold); color: #fff;
        background: var(--primary); border-radius: 7px; padding: 2px 8px;
    }
    .opt-s { font-size: 12px; color: var(--text-muted); margin: 0 0 9px; line-height: 1.8; }

    /* الشريطُ يُعرض في مكانه لا مثبَّتاً — لنراه خمس مرّات */
    .bar {
        position: static; display: flex; inset-inline: auto; bottom: auto;
        z-index: auto; margin: 0;
    }
    /* أرضيّةٌ تحته تُري الشفَّ حقيقةً — كما يمرّ محتوى التطبيق */
    .under {
        border-radius: 24px; padding: 10px;
        background: linear-gradient(135deg, #EDEAE2 0%, #DDE7EA 55%, #CFDDE2 100%);
    }
</style>
</head>
<body>

<div class="pv">
    <h1>الخانة النشطة في الشريط السفليّ</h1>
    <p class="lede">
        اضغط أيَّ خانةٍ في كلّ شريطٍ لتراها تتحرّك. والأرضيّةُ تحتها
        مموّهةٌ عمداً — الشريطُ زجاجيٌّ، فلا يُحكم على الشفافيّة على بياض.
    </p>
    <div id="out"></div>
</div>

<script>
(function () {
    'use strict';

    const ITEMS = [
        { icon: '🏠', label: 'الرئيسية' },
        { icon: '👥', label: 'الفصول'   },
        { icon: '📅', label: 'الجدول'   },
        { icon: '📁', label: 'إنجاز'    },
        { icon: '⚙️', label: 'الإعدادات' }
    ];

    /* البترول: ‎#0A3F4A‎ — يُبنى منه الماءُ بمزجه بالشفّاف، فيبقى من
       عائلة التطبيق ولا يصير أزرقَ غريباً. */
    const OPTS = [
        {
            tag: 'الحالي', name: 'بتروليٌّ مصمت',
            note: 'حبّةٌ داكنةٌ بحروفٍ بيضاء — وهو ما تريد تغييره.',
            css: `background: linear-gradient(150deg, #104E5B 0%, #0A3F4A 55%, #05262D 100%);
                  box-shadow: 0 4px 11px rgba(10,63,74,.32), inset 0 1.5px 0 rgba(255,255,255,.18);`,
            ink: '#fff'
        },
        {
            tag: 'أ', name: 'ماءٌ خفيفٌ صافٍ',
            note: 'أخفُّ ما يكون: ظِلُّ ماءٍ يُرى ولا يُثقل. بلا حافّةٍ ولا ظلّ.',
            css: 'background: rgba(10, 63, 74, .10);',
            ink: '#0A3F4A'
        },
        {
            tag: 'ب', name: 'ماءٌ بحافّةٍ رفيعة',
            note: 'الظلُّ نفسُه، وحولَه خيطٌ يحدّده — فيُعرف طرفُ الخانة.',
            css: `background: rgba(10, 63, 74, .08);
                  box-shadow: inset 0 0 0 1.5px rgba(10, 63, 74, .22);`,
            ink: '#0A3F4A'
        },
        {
            tag: 'ج', name: 'ماءٌ أوضح',
            note: 'درجتان أعمق — يُرى من بعيدٍ وما زال شفّافاً.',
            css: 'background: rgba(10, 63, 74, .18);',
            ink: '#0A3F4A'
        },
        {
            tag: 'د', name: 'ماءٌ سماويّ',
            note: 'ميلٌ إلى الزرقة لا إلى الرماد — أقربُ ما يكون إلى «لون الماء».',
            css: 'background: linear-gradient(150deg, rgba(56,152,170,.20) 0%, rgba(10,63,74,.13) 100%);',
            ink: '#0A3F4A'
        }
    ];

    const esc = (s) => String(s).replace(/[&<>"]/g, (m) => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));

    let html = '';
    OPTS.forEach((o, i) => {
        html += `
        <style>
            #bar${i} .bn-item.is-active { color: ${o.ink}; }
            #bar${i} .bn-item.is-active::before { ${o.css} }
        </style>
        <div class="opt">
            <div class="opt-h"><span class="tag">${esc(o.tag)}</span> ${esc(o.name)}</div>
            <p class="opt-s">${esc(o.note)}</p>
            <div class="under">
                <nav class="bottom-nav bar" id="bar${i}">
                    ${ITEMS.map((it, k) => `
                        <a href="javascript:void 0" class="bn-item${k === 2 ? ' is-active' : ''}">
                            <span class="bn-icon" aria-hidden="true">${it.icon}</span>
                            <span class="bn-label">${esc(it.label)}</span>
                        </a>`).join('')}
                </nav>
            </div>
        </div>`;
    });
    document.getElementById('out').innerHTML = html;

    /* الضغطُ ينقل النشِطَ داخل شريطه وحدَه. */
    document.getElementById('out').addEventListener('click', (e) => {
        const a = e.target.closest('.bn-item');
        if (!a) return;
        a.parentElement.querySelectorAll('.bn-item')
            .forEach((x) => x.classList.remove('is-active'));
        a.classList.add('is-active');
    });
})();
</script>
</body>
</html>
