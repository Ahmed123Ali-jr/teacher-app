<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أيقونات ملف الإنجاز</title>
<link rel="stylesheet" href="css/main.css?p=1">
<link rel="stylesheet" href="css/components.css?p=1">
<link rel="stylesheet" href="css/views.css?p=1">
<link rel="stylesheet" href="css/portfolio-theme.css?p=1">
<link rel="stylesheet" href="css/theme-white.css?p=1">
<link rel="stylesheet" href="css/theme-dark.css?p=1">
<link rel="stylesheet" href="css/fonts.css?p=1">
<!--
    pf.html — معاينةٌ لا تُشحن. تُحذف بعد الاختيار.
    أربعةُ أشكالٍ لأيقونات أقسام ملف الإنجاز، وأنماطُها من ملفّات التطبيق.
-->
<style>
body { margin:0; background: var(--bg); padding-bottom: 64px; }
.hd { height:85px; display:flex; align-items:center; padding:0 16px;
      background:var(--surface); border-bottom:1px solid var(--border); }
.hd b { font-size:17px; color:var(--ink-primary); }
.note { margin:10px 2px 8px; font-size:11.5px; color:var(--text-muted); font-weight:700; line-height:1.8; }

/* ب — مربّعٌ بترولي فاتح، كمربّع رقم الطالب */
.pf-sq {
    width:38px; height:38px; flex:none; border-radius:11px;
    display:grid; place-items:center;
    color: var(--primary);
    background: color-mix(in srgb, var(--primary) 10%, var(--mix-base));
    border: 1.5px solid color-mix(in srgb, var(--primary) 22%, var(--mix-base));
}
/* ج — دائرةٌ رمليّة، كأيقونة التذكير */
.pf-ci {
    width:38px; height:38px; flex:none; border-radius:50%;
    display:grid; place-items:center;
    color: #8A6F2E;
    background: color-mix(in srgb, var(--pf-gold) 22%, var(--mix-base));
}
/* د — مرسومةٌ عاريةً بلون الهُويّة */
.pf-bare { width:26px; height:26px; flex:none; display:grid; place-items:center; color: var(--primary); }
.pf-sq svg, .pf-ci svg, .pf-bare svg { display:block; }

.pick { position:fixed; inset:auto 0 0 0; z-index:990; background:#12202A; padding:6px;
        padding-bottom:calc(6px + env(safe-area-inset-bottom)); display:flex; gap:5px; }
.pick button { flex:1; border:0; border-radius:10px; background:#1E323E; color:#C9D3DA;
        font-family:inherit; font-weight:800; font-size:10.5px; cursor:pointer; padding:8px 2px; line-height:1.3; }
.pick button.on { background:linear-gradient(150deg,#1A8299,var(--primary)); color:#fff; }
.themer { position:fixed; inset-block-end:64px; inset-inline-start:10px; z-index:991;
          border:0; border-radius:9px; background:#12202A; color:#C9D3DA; font-family:inherit;
          font-weight:800; font-size:11px; padding:6px 12px; cursor:pointer; }
</style>
</head>
<body class="theme-white">

<div class="hd"><b>ملف الإنجاز</b></div>
<button class="themer" id="th">داكن</button>
<div class="container"><div id="p"></div></div>

<div class="pick">
  <button data-v="a">أ · الحالي<br>(إيموجي)</button>
  <button class="on" data-v="b">ب · مربّع بترولي<br>(المقترح)</button>
  <button data-v="c">ج · دائرة رمليّة</button>
  <button data-v="d">د · مرسومة عارية</button>
</div>

<script>
var S = function (d) {
    return '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"'
      + ' stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + d + '</svg>';
};
var SEC = [
  { t:'البيانات الشخصية',        e:'👤', d:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>' },
  { t:'الشهادات والرخصة المهنية', e:'🏆', d:'<circle cx="12" cy="9" r="5"/><path d="M8.6 13.4 7 22l5-3 5 3-1.6-8.6"/>' },
  { t:'الرسالة والرؤية',         e:'🎯', d:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.2"/>' },
  { t:'الجداول وتوزيع المنهج',    e:'📅', d:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>' },
  { t:'الاختبارات',              e:'📝', d:'<path d="M9 4h6v3H9z"/><path d="M15 5.5h3A1.5 1.5 0 0 1 19.5 7v12.5A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5V7A1.5 1.5 0 0 1 6 5.5h3"/><path d="m9 14 2 2 4-4"/>' },
  { t:'أوراق العمل',             e:'📄', d:'<path d="M14 3H7a1.5 1.5 0 0 0-1.5 1.5v15A1.5 1.5 0 0 0 7 21h10a1.5 1.5 0 0 0 1.5-1.5V7.5z"/><path d="M14 3v4.5h4.5M9 12.5h6M9 16h4"/>' },
  { t:'الواجبات',                e:'📚', d:'<path d="M12 6C10 4.5 7.5 4 5 4v14c2.5 0 5 .5 7 2 2-1.5 4.5-2 7-2V4c-2.5 0-5 .5-7 2z"/><path d="M12 6v14"/>' },
  { t:'استراتيجيات التدريس',      e:'🎯', d:'<path d="M9.5 18.5h5M10.5 21.5h3"/><path d="M12 2.5a6.2 6.2 0 0 0-3.6 11.2c.6.5 1 1.2 1.1 1.9h5c.1-.7.5-1.4 1.1-1.9A6.2 6.2 0 0 0 12 2.5z"/>' },
  { t:'المبادرات',               e:'🌟', d:'<path d="m12 3 2.6 5.4 6 .8-4.3 4.1 1 5.9-5.3-2.8-5.3 2.8 1-5.9L3.4 9.2l6-.8z"/>' },
  { t:'صور ومرفقات إضافية',      e:'📎', d:'<path d="M20 11.4 12.6 18.8a4.7 4.7 0 0 1-6.6-6.6l7.6-7.6a3.3 3.3 0 0 1 4.7 4.7l-7.6 7.6a1.9 1.9 0 0 1-2.7-2.7l6.7-6.7"/>' }
];
var NOTE = {
  a:'الحالي: إيموجي عارٍ — لونُه من خطّ النظام لا من التطبيق، ويختلف شكلُه بين جهازٍ وآخر.',
  b:'مربّعٌ بترولي فاتح كمربّع رقم الطالب في السجل — والأيقونةُ مرسومةٌ تتبع لونَ الهُويّة.',
  c:'دائرةٌ رمليّة كأيقونة التذكير في الرئيسية.',
  d:'مرسومةٌ عاريةً بلا خلفية — أخفُّ ما يكون، والفرقُ بين قسمٍ وآخر في الشكل وحدَه.'
};

function draw(v) {
    var h = '<div class="note">' + NOTE[v] + '</div>';
    h += SEC.map(function (s, i) {
        var ic = v === 'a' ? '<span class="portfolio-icon">' + s.e + '</span>'
               : v === 'b' ? '<span class="pf-sq">' + S(s.d) + '</span>'
               : v === 'c' ? '<span class="pf-ci">' + S(s.d) + '</span>'
               :             '<span class="pf-bare">' + S(s.d) + '</span>';
        var badges = (i === 7 || i === 8 ? '<span class="badge badge-warning">⭐ مميزة</span>' : '')
                   + (i >= 4 && i <= 6 ? '<span class="badge badge-info">تلقائي</span>' : '');
        return '<div class="portfolio-section" style="margin-bottom:9px">'
          + '<button class="portfolio-section-header">' + ic
          + '<span class="portfolio-title">' + s.t + '</span>' + badges
          + '<span class="portfolio-chev">◀</span></button></div>';
    }).join('');
    document.getElementById('p').innerHTML = h;
}

document.querySelector('.pick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    draw(b.dataset.v);
});
document.getElementById('th').addEventListener('click', function () {
    var dark = document.body.classList.toggle('theme-dark');
    document.body.classList.toggle('theme-white', !dark);
    this.textContent = dark ? 'فاتح' : 'داكن';
});
draw('b');
</script>

</body>
</html>
