<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: مكان زرّ طباعة ملف الإنجاز</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=10">
<link rel="stylesheet" href="css/views.css?v=D291">
<link rel="stylesheet" href="css/portfolio-theme.css?v=16">
<link rel="stylesheet" href="css/theme-white.css?v=22">
<link rel="stylesheet" href="css/theme-dark.css?v=34">

<style>
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 480px; margin: 0 auto; padding: 0 14px 20px; }
    .pv-bar {
        position: sticky; top: 0; z-index: 60;
        background: var(--surface); border-bottom: 1.5px solid var(--border);
        padding: 10px 14px 12px; margin: 0 -14px 0;
    }
    .pv-tabs { display: flex; gap: 7px; }
    .pv-tabs button {
        flex: 1 1 0; min-height: 44px; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface);
        color: var(--ink-primary);
    }
    .pv-tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pv-say { margin: 9px 2px 0; font-size: 12.5px; line-height: 1.8;
              font-weight: 500; color: var(--text-muted); }
    .pv-say b { color: var(--ink-primary); font-weight: var(--fw-bold); }

    /* المسرحُ يقلّد لوحَ التطبيق: الزرُّ العائمُ يطفو داخله لا على النافذة،
       ويُترك أسفلَه فراغُ الشريط السفليّ كما في الشاشة الحقيقيّة. */
    .stage {
        position: relative; overflow: hidden; margin-top: 12px;
        background: var(--bg); border: 1.5px solid var(--border);
        border-radius: 18px; height: 560px;
    }
    .scroll { position: absolute; inset: 0; overflow-y: auto; padding: 0 12px 12px; }
    /* فوق الشريط السفليّ كما في التطبيق — لا فوقه يحجبه. */
    .stage .classes-fab { position: absolute; bottom: 58px; }
    .navbar {
        position: absolute; inset-inline: 0; bottom: 0; height: 58px;
        background: var(--surface); border-top: 1.5px solid var(--border);
        display: flex; align-items: center; justify-content: space-around;
        font-size: 10.5px; font-weight: var(--fw-bold); color: var(--text-muted);
    }
</style>
</head>
<body>

<div class="pv">
    <div class="pv-bar">
        <div class="pv-tabs">
            <button type="button" data-m="now">الحالي</button>
            <button type="button" data-m="fab">أ — عائم</button>
            <button type="button" data-m="end">ب — أسفل</button>
        </div>
        <p class="pv-say" id="say"></p>
    </div>
    <div class="stage">
        <div class="scroll" id="scroll"></div>
        <div id="fab"></div>
        <div class="navbar"><span>الرئيسية</span><span>الفصول</span><span>الجدول</span>
            <span>إنجاز</span><span>الإعدادات</span></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const SECTIONS = [
        ['👤', 'البيانات الشخصية', ''],
        ['🏆', 'الشهادات والرخصة المهنية', '3'],
        ['🎯', 'الرسالة والرؤية', ''],
        ['📅', 'الجداول وتوزيع المنهج', '2'],
        ['📝', 'الاختبارات', '5'],
        ['📄', 'أوراق العمل', '7'],
        ['📚', 'الواجبات', '9'],
        ['🎯', 'استراتيجيات التدريس', '4'],
        ['🌟', 'المبادرات', '2'],
        ['📎', 'صور ومرفقات إضافية', '1']
    ];

    const list = () => `
        <div class="portfolio-sections">
            ${SECTIONS.map(([ic, t, n]) => `
                <div class="portfolio-section">
                    <button class="portfolio-section-header">
                        <span class="pf-chip">${ic}</span>
                        <span class="portfolio-title">${t}</span>
                        ${n ? `<span class="badge badge-muted">${n}</span>` : ''}
                        <span class="portfolio-chev">◀</span>
                    </button>
                </div>`).join('')}
        </div>
        <div style="margin-top: var(--space-4); display:flex; justify-content:flex-end;">
            <button class="btn btn-secondary">+ إضافة قسم جديد</button>
        </div>`;

    const topBtn = `
        <div class="section-header" style="margin-top: var(--space-6); justify-content: flex-end;">
            <button class="btn btn-primary" style="align-self: flex-end;">🖨️ طباعة ملف الإنجاز</button>
        </div>`;

    const endBtn = `
        <button type="button" class="start-cta" style="margin-top: var(--space-6)">
            طباعة ملف الإنجاز</button>`;

    const fabBtn = `
        <div class="classes-fab">
            <button type="button" class="start-cta">طباعة ملف الإنجاز</button>
        </div>`;

    const SAY = {
        now: '<b>الحالي</b> — أعلى الصفحة. مرِّرْ لأسفل: يختفي.',
        fab: '<b>أ — عائم.</b> مكانُ «إضافة فصل جديد» ومقاسُه. يبقى مهما مرّرت.',
        end: '<b>ب — أسفل الأقسام.</b> تملأ ثمّ تطبع — لكن بعد عشرة أقسام.'
    };

    const scroll = document.getElementById('scroll');
    const fab = document.getElementById('fab');
    const say = document.getElementById('say');
    let mode = 'now';

    function draw() {
        scroll.innerHTML = (mode === 'now' ? topBtn : '') + list()
                         + (mode === 'end' ? endBtn : '')
                         + '<div style="height:74px"></div>';
        fab.innerHTML = mode === 'fab' ? fabBtn : '';
        say.innerHTML = SAY[mode];
        scroll.scrollTop = 0;
        document.querySelectorAll('.pv-tabs button')
            .forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
    }
    document.querySelectorAll('.pv-tabs button').forEach((b) =>
        b.addEventListener('click', () => { mode = b.dataset.m; draw(); }));
    draw();
})();
</script>
</body>
</html>
