<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>موضع الصورة الشخصية — اختر التصميم</title>
<link rel="stylesheet" href="css/fonts.css?v=2">
<!--
    preview-avatar.html — معاينةٌ لا تُشحن. تُحذف بعد الاختيار.
    المطلوب: أين تجلس الصورةُ الشخصيّة من التحيّة.
    الشاشةُ كما ستكون في التطبيق، والاختيارُ من شريطٍ أسفلها.
-->
<style>
:root{
  --deep:#0A3F4A; --mid:#105260; --lift:#104E5B;
  --gold:#C9A961; --beige:#ECEAE3; --ink:#2C2C2A; --muted:#6B6B68;
  --line:#E4E6EA; --pick:54px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:#fff;color:var(--ink);line-height:1.7;overflow:hidden}

.screen{height:calc(100dvh - var(--pick));display:flex;flex-direction:column}
.hd{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--line)}
.hd b{font-size:15px;font-weight:800;color:var(--deep)}
.hd .bg{font-size:18px;opacity:.7}
.bd{flex:1 1 auto;display:flex;flex-direction:column;padding:9px 14px 12px;min-height:0}
.nav{flex:0 0 auto;margin:0 11px 11px;padding:4px;border-radius:21px;background:rgba(255,255,255,.85);
  border:1px solid var(--line);box-shadow:0 5px 16px rgba(16,24,40,.10);display:flex}
.nav i{font-style:normal;flex:1;text-align:center;padding:7px 0;font-size:10.5px;color:#575753;
  border-radius:15px;line-height:1.45}
.nav i span{display:block;font-size:17px}
.nav i.on{color:#fff;background:linear-gradient(150deg,var(--lift),var(--deep));font-weight:800}

/* ── الصورةُ والتحيّةُ والتاريخ ── */
.av{width:44px;height:44px;border-radius:50%;background:var(--deep);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:17px;
  border:1.5px solid var(--gold);flex-shrink:0}
.gt h2{margin:0;font-size:21px;font-weight:800;color:var(--deep)}
.hij{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.hij::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* ── اللافتةُ والزرّان (كما اعتُمدت) ── */
.note{margin-top:14px;padding:15px 16px;border-radius:16px;text-align:center;
  background:color-mix(in srgb,var(--gold) 15%,#fff);border:1px solid color-mix(in srgb,var(--gold) 45%,#fff)}
.note b{display:block;font-size:15px;font-weight:800;color:var(--deep)}
.note span{display:block;margin-top:2px;font-size:13px;color:var(--muted)}
.gap{flex:1 1 auto;min-height:12px}
.cta{display:flex;align-items:center;justify-content:center;min-height:55px;border-radius:14px;
  background:var(--deep);color:#fff;font-weight:800;font-size:17px;text-decoration:none;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 5px 13px color-mix(in srgb,var(--deep) 30%,transparent)}
.add{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:13px;
  border-radius:14px;background:#fff;border:1px solid #DFDCD2;color:var(--deep);
  font-weight:700;font-size:15px}

/* ── ثلاثةُ مواضع ── */
.head{display:none;padding-top:8px}
.head.on{display:flex}

/* أ — الصورةُ على يمين التحيّة، في سطرها */
.head.a{align-items:center;gap:12px}

/* ب — الصورةُ فوق التحيّة، على اليمين */
.head.b{flex-direction:column;align-items:flex-start;gap:9px}

/* ج — الوضعُ الحاليّ: الصورةُ في الطرف المقابل */
.head.c{align-items:center;justify-content:space-between;gap:12px}
</style>
</head>
<body>

<div class="screen">
  <div class="hd"><b>الرئيسية</b><span class="bg">☰</span></div>

  <div class="bd">
    <!-- أ -->
    <div class="head a on" data-h="a">
      <div class="av">م</div>
      <div class="gt"><h2>مساء الخير، معاينة</h2><div class="hij">الأربعاء، ٧ ربيع الأول ١٤٤٨ هـ</div></div>
    </div>
    <!-- ب -->
    <div class="head b" data-h="b">
      <div class="av">م</div>
      <div class="gt"><h2>مساء الخير، معاينة</h2><div class="hij">الأربعاء، ٧ ربيع الأول ١٤٤٨ هـ</div></div>
    </div>
    <!-- ج -->
    <div class="head c" data-h="c">
      <div class="gt"><h2>مساء الخير، معاينة</h2><div class="hij">الأربعاء، ٧ ربيع الأول ١٤٤٨ هـ</div></div>
      <div class="av">م</div>
    </div>

    <div class="note"><b>بقي الجدول</b><span>حدّد حصص فصولك ليظهر يومُك هنا</span></div>
    <div class="gap"></div>
    <a class="cta" href="#">+ أضف جدولك الأسبوعي</a>
    <div class="add">+ إضافة فصل</div>
  </div>

  <div class="nav">
    <i><span>⚙️</span>الإعدادات</i><i><span>🗂️</span>إنجاز</i><i><span>📅</span>الجدول</i>
    <i><span>📚</span>الفصول</i><i class="on"><span>🏠</span>الرئيسية</i>
  </div>
</div>

<div class="pick" style="position:fixed;inset:auto 0 0 0;height:var(--pick);display:flex;
  background:#12202A;padding:6px;gap:6px;z-index:9;padding-bottom:calc(6px + env(safe-area-inset-bottom))">
  <button class="on" data-go="a"><b>أ</b>يمين التحيّة</button>
  <button data-go="b"><b>ب</b>فوقها يميناً</button>
  <button data-go="c"><b>ج</b>الحالي</button>
</div>

<style>
.pick button{flex:1;border:0;border-radius:11px;background:#1E323E;color:#C9D3DA;
  font-family:inherit;font-weight:800;font-size:12px;line-height:1.35;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pick button b{font-size:15px;color:#fff}
.pick button.on{background:linear-gradient(150deg,#1A8299,var(--deep));color:#fff}
</style>

<script>
document.querySelector('.pick').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    var k = btn.dataset.go;
    this.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
    document.querySelectorAll('.head').forEach(function (h) {
        h.classList.toggle('on', h.dataset.h === k);
    });
});
</script>

</body>
</html>
