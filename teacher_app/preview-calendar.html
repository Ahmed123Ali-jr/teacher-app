<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — التقويم الدراسي</title>

<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/views.css?v=D141">
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
body { padding: 14px 12px 40px; }
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: var(--fw-black); text-align: center; color: var(--primary); }
.pv-note  { margin: 0 0 14px; font-size: 11.5px; line-height: 1.85; color: var(--text-muted); text-align: center; }
#stage { max-width: 520px; margin: 0 auto; }

/* شبح الجدول — ليرى مكان البطاقة لا شكلها وحده */
.ghost {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 14px; margin-bottom: 12px; opacity: .45;
}
.ghost h4 { margin: 0 0 10px; font-size: 13px; color: var(--primary); }
.ghost .g { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.ghost .g i { display: block; height: 26px; border-radius: 6px; background: color-mix(in srgb, #ECEAE3 60%, #fff); }

/* ==========================================================================
   البطاقة المطويّة
   ========================================================================== */
.cal {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(16,24,40,.05);
}
.cal.open { border-color: var(--primary); box-shadow: 0 4px 14px rgba(15,44,92,.14); }
.cal-top {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 13px 14px; background: none; border: 0; cursor: pointer;
    font-family: inherit; text-align: right;
}
.cal-ic {
    width: 34px; height: 34px; flex: none; border-radius: 10px;
    background: color-mix(in srgb, #ECEAE3 55%, #fff);
    border: 1.5px solid var(--border);
    display: grid; place-items: center; font-size: 15px;
}
.cal.open .cal-ic { background: #F7F1E1; border-color: #E2D3AC; }
.cal-tx { flex: 1; min-width: 0; }
.cal-nm { display: block; font-size: 13.5px; font-weight: var(--fw-black); color: var(--primary); }
.cal-sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.cal-sub b { color: #8A6E2E; font-weight: var(--fw-black); }
.cal-body { padding: 13px 14px 14px; border-top: 1px solid var(--border); }

/* ---------- شريط الفصول ---------- */
.trm { display: flex; gap: 6px; margin-bottom: 13px; }
.trm button {
    flex: 1; min-height: 40px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: var(--fw-black);
    color: var(--primary); line-height: 1.35;
    background: color-mix(in srgb, #ECEAE3 35%, #fff);
    border: 1.5px solid var(--border);
}
.trm button.on { color: #fff; background: var(--primary); border-color: var(--primary); }
.trm button small { display: block; font-size: 9.5px; font-weight: 500; opacity: .75; }

/* ---------- سطر «أين أنت» ---------- */
.now {
    display: flex; flex-direction: column; gap: 7px;
    background: color-mix(in srgb, #ECEAE3 32%, #fff);
    border: 1.5px solid var(--border); border-radius: 12px;
    padding: 11px 12px; margin-bottom: 13px;
}
.now .l1 { font-size: 13px; font-weight: var(--fw-black); color: var(--primary); }
.now .l2 {
    display: flex; align-items: baseline; gap: 6px;
    font-size: 11.5px; color: var(--text); line-height: 1.7;
    padding-top: 7px; border-top: 1px dashed var(--border);
}
.now .l2 .big { font-size: 17px; font-weight: var(--fw-black); color: #8A6E2E; }
.now .l2 .nm { color: #8A6E2E; font-weight: var(--fw-black); }

/* ---------- صفوف الأسابيع ---------- */
.wks { display: flex; flex-direction: column; gap: 7px; }
.wk {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 10px; border-radius: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
}
.wk-n {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    display: grid; place-items: center;
    font-size: 13px; font-weight: var(--fw-black); color: #fff;
}
.wk[data-t="1"] .wk-n { background: #0F2C5C; }
.wk[data-t="2"] .wk-n { background: #3E6096; }
.wk[data-t="3"] .wk-n { background: #7C93BC; }

.wk-b { flex: 1; min-width: 0; }
.wk-ttl { font-size: 12.5px; font-weight: var(--fw-black); color: var(--primary); }
/* سطرٌ لكل تقويم دائماً: الالتفاف كان يضعهما معاً حيناً ويفصلهما
   حيناً، فيختلف ارتفاع الصفوف بلا سبب يراه المعلّم. */
.wk-d {
    display: flex; flex-direction: column; gap: 1px; margin-top: 2px;
    font-size: 10.5px; color: var(--text-muted); line-height: 1.7;
}
.wk-d span { white-space: nowrap; }
.wk-d i {
    font-style: normal; font-weight: var(--fw-black);
    color: color-mix(in srgb, var(--primary) 55%, var(--text-muted));
    margin-inline-end: 3px;
}

/* أيام الإجازة داخل الأسبوع */
/* خمسة أعمدة لا التفاف: أيام الأسبوع صفٌّ واحد دائماً، وإلّا نزل
   «الخميس» وحده فبدا كأنه يومٌ من نوعٍ آخر. */
.wk-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 6px; }
.dy {
    font-size: 9.5px; font-weight: var(--fw-black); text-align: center;
    border-radius: 6px; padding: 3px 2px;
    background: color-mix(in srgb, #ECEAE3 45%, #fff);
    color: var(--text-muted); border: 1px solid var(--border);
}
.dy.off { background: #F5EEDC; color: #7A6224; border-color: #E2D3AC; }
.wk-hol {
    margin-top: 5px; font-size: 10.5px; font-weight: var(--fw-black); color: #8A6E2E;
}

/* الأسبوع الحالي — بلونٍ مميّز لا بإطارٍ وحده */
.wk.now-week {
    background: linear-gradient(145deg,
        color-mix(in srgb, #C9A961 20%, var(--surface)) 0%,
        color-mix(in srgb, #C9A961 8%, var(--surface)) 100%);
    border-color: #C9A961;
    box-shadow: 0 2px 8px rgba(201,169,97,.28);
}
.wk.now-week .wk-n { background: #B8963F; }
.wk.now-week .wk-ttl::after {
    content: 'أنت هنا';
    margin-inline-start: 7px; font-size: 9.5px; font-weight: var(--fw-black);
    color: #fff; background: #B8963F; border-radius: 20px; padding: 1px 8px;
    vertical-align: 1px;
}

/* أسبوع إجازته مطوّلة */
.wk.long-off { border-inline-start: 4px solid #C9A961; }
.wk.long-off .wk-n { background: repeating-linear-gradient(135deg,#C9A961 0 5px,#B8963F 5px 10px); }
</style>
</head>
<body>

<h1 class="pv-title">التقويم الدراسي — التصميم ج بتعديلاتك</h1>
<p class="pv-note">
    فصلٌ واحد في كل مرة · كل أسبوع بتاريخيه الهجري والميلادي<br>
    أيام الإجازة داخل الأسبوع محدّدة بأسمائها · وأسبوعك بلونٍ ذهبي<br>
    <b>البيانات تجريبية — ستُستبدل بتقويمك</b>
</p>

<div id="stage"></div>

<script>
(function () {
    'use strict';

    const ar  = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /* الهجري من المتصفّح نفسه بتقويم أم القرى — لا مكتبة ولا جدول تحويل. */
    const HIJRI = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long' });
    const GREG_M = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                    'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const hij  = (d) => HIJRI.format(d);
    const greg = (d) => ar(d.getDate()) + ' ' + GREG_M[d.getMonth()];

    const DAY_NAMES = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    const ORD = ['', 'الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن',
                 'التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر'];

    /* ------------------------------------------------------------------
       بياناتٌ تجريبية بالبنية التي سيأخذها التقويم الحقيقي.
       الإجازات بمداها اليومي لا بالأسبوع — لأن المطلوب تحديد الأيام
       نفسها داخل الأسبوع لا الإشارة إلى أن فيه إجازة.
       ------------------------------------------------------------------ */
    const D = (y, m, d) => new Date(y, m - 1, d);
    const START = D(2026, 8, 2);
    const TERMS = [
        { n: 1, name: 'الفصل الأول',  weeks: 13 },
        { n: 2, name: 'الفصل الثاني', weeks: 12 },
        { n: 3, name: 'الفصل الثالث', weeks: 11 }
    ];
    const HOLIDAYS = [
        { name: 'اليوم الوطني',            from: D(2026, 9, 23),  to: D(2026, 9, 23),  long: false },
        { name: 'إجازة مطوّلة',            from: D(2026, 10, 12), to: D(2026, 10, 13), long: true  },
        { name: 'إجازة نهاية الفصل الأول', from: D(2026, 10, 26), to: D(2026, 11, 5),  long: true  },
        { name: 'إجازة مطوّلة',            from: D(2026, 12, 14), to: D(2026, 12, 15), long: true  },
        { name: 'إجازة نهاية الفصل الثاني',from: D(2027, 1, 25),  to: D(2027, 2, 4),   long: true  },
        { name: 'إجازة عيد الفطر',         from: D(2027, 3, 8),   to: D(2027, 3, 19),  long: true  }
    ];

    const sameDay = (a, b) => a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    const holidayOn = (d) => HOLIDAYS.find((h) =>
        d >= new Date(h.from.getFullYear(), h.from.getMonth(), h.from.getDate())
     && d <= new Date(h.to.getFullYear(), h.to.getMonth(), h.to.getDate()));

    /* أسبوعٌ أسبوع، ولكلٍّ أيامه الخمسة موصوفةً بحالتها. */
    const WEEKS = [];
    (function build() {
        let n = 0;
        TERMS.forEach((t) => {
            for (let i = 0; i < t.weeks; i++) {
                n += 1;
                const from = new Date(START); from.setDate(START.getDate() + (n - 1) * 7);
                const days = DAY_NAMES.map((nm, k) => {
                    const d = new Date(from); d.setDate(from.getDate() + k);
                    return { name: nm, date: d, hol: holidayOn(d) || null };
                });
                const offs = days.filter((d) => d.hol);
                WEEKS.push({
                    n, term: t.n, from, to: days[4].date, days,
                    offs,
                    long: offs.some((d) => d.hol.long),
                    holName: offs.length ? offs[0].hol.name : null,
                    allOff: offs.length === 5
                });
            }
        });
    })();

    /* «اليوم» ثابت في المعاينة لتبقى اللقطة قابلة للمقارنة. */
    const TODAY = D(2026, 8, 13);
    const CURRENT = WEEKS.find((w) => TODAY >= w.from && TODAY <= new Date(w.to.getTime() + 2 * 864e5)) || WEEKS[0];

    /* أقرب يوم إجازة قادم — بالأيام لا بالأسابيع، فهو ما يسأل عنه المعلّم. */
    const nextOff = (function () {
        for (const w of WEEKS) {
            for (const d of w.days) {
                if (d.hol && d.date > TODAY) return { day: d, week: w };
            }
        }
        return null;
    })();
    const daysTo = nextOff ? Math.round((nextOff.day.date - TODAY) / 864e5) : 0;
    const dayWord = (n) => n === 1 ? 'يوم واحد' : n === 2 ? 'يومان'
        : n <= 10 ? ar(n) + ' أيام' : ar(n) + ' يوماً';

    let open = true, term = CURRENT.term;
    const idxInTerm = (w) => WEEKS.filter((x) => x.term === w.term).findIndex((x) => x.n === w.n) + 1;

    function head() {
        const sub = nextOff
            ? `الأسبوع ${ORD[idxInTerm(CURRENT)]} · <b>${esc(nextOff.day.hol.name)}</b> بعد ${dayWord(daysTo)}`
            : `الأسبوع ${ORD[idxInTerm(CURRENT)]}`;
        return `
            <button type="button" class="cal-top" data-toggle>
                <span class="cal-ic">🗓️</span>
                <span class="cal-tx">
                    <span class="cal-nm">التقويم الدراسي ١٤٤٨هـ</span>
                    <span class="cal-sub">${sub}</span>
                </span>
            </button>`;
    }

    function nowBox() {
        const t = TERMS[CURRENT.term - 1];
        return `
            <div class="now">
                <span class="l1">
                    أنت في الأسبوع ${ORD[idxInTerm(CURRENT)]} من ${t.name}
                </span>
                ${nextOff ? `
                <span class="l2">
                    <span class="big">${ar(daysTo)}</span>
                    <span>
                        ${daysTo === 1 ? 'يوم' : daysTo === 2 ? 'يومان' : 'يوماً'}
                        على <span class="nm">${esc(nextOff.day.hol.name)}</span>
                        — ${nextOff.day.name} ${greg(nextOff.day.date)} · ${hij(nextOff.day.date)}هـ
                    </span>
                </span>` : ''}
            </div>`;
    }

    function tabs() {
        return `<div class="trm">
            ${TERMS.map((t) => `
                <button type="button" data-term="${t.n}" class="${term === t.n ? 'on' : ''}">
                    ${t.name}
                    <small>${ar(t.weeks)} أسبوعاً</small>
                </button>`).join('')}
        </div>`;
    }

    function weekRow(w) {
        const k = idxInTerm(w);
        return `
            <div class="wk ${w.n === CURRENT.n ? 'now-week' : ''} ${w.long ? 'long-off' : ''}" data-t="${w.term}">
                <span class="wk-n">${ar(k)}</span>
                <div class="wk-b">
                    <div class="wk-ttl">الأسبوع ${ORD[k]}</div>
                    <div class="wk-d">
                        <span><i>هـ</i>${hij(w.from)} — ${hij(w.to)}</span>
                        <span><i>م</i>${greg(w.from)} — ${greg(w.to)}</span>
                    </div>
                    ${w.offs.length ? `
                        <div class="wk-days">
                            ${w.days.map((d) => `<span class="dy ${d.hol ? 'off' : ''}">${d.name}</span>`).join('')}
                        </div>
                        <div class="wk-hol">
                            ${w.allOff ? 'إجازة الأسبوع كاملاً' : 'إجازة'}:
                            ${esc(w.holName)} — ${dayWord(w.offs.length)}
                        </div>` : ''}
                </div>
            </div>`;
    }

    const stage = document.getElementById('stage');

    function draw() {
        const list = WEEKS.filter((w) => w.term === term);
        stage.innerHTML = `
            <div class="ghost">
                <h4>📅 الجدول الأسبوعي</h4>
                <div class="g">${'<i></i>'.repeat(15)}</div>
            </div>
            <div class="cal ${open ? 'open' : ''}">
                ${head()}
                ${open ? `<div class="cal-body">
                    ${nowBox()}
                    ${tabs()}
                    <div class="wks">${list.map(weekRow).join('')}</div>
                </div>` : ''}
            </div>`;
    }

    stage.addEventListener('click', (e) => {
        if (e.target.closest('[data-toggle]')) { open = !open; return draw(); }
        const t = e.target.closest('[data-term]');
        if (t) { term = Number(t.dataset.term); draw(); }
    });

    draw();
})();
</script>
</body>
</html>
