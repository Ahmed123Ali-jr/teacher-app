<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — التقويم الدراسي</title>

<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
/* ==========================================================================
   الفصل كلّه في شاشةٍ واحدة.

   ثلاث عشرة بطاقةً مفصّلة كانت تعني ألفاً ومئتَي بكسل من التمرير —
   والمعلّم يفتح التقويم ليعرف لا ليقرأ. فصارت الأسابيع شبكةً مضغوطة
   تُمسح بنظرة، والتفصيل يظهر لأسبوعٍ واحد: الذي يلمسه، أو أسبوعه هو.

   وكل خليّة تحمل معلومتها بلا كلمات: رقمها، وخمس نقاطٍ هي أيامها،
   الذهبيّ منها إجازة.
   ========================================================================== */
* { box-sizing: border-box; }
body {
    margin: 0; padding: 14px 12px 40px;
    font-family: 'Tajawal', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
}
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: 900; text-align: center; color: var(--primary); }
.pv-note  { margin: 0 0 14px; font-size: 11.5px; line-height: 1.85; color: var(--text-muted); text-align: center; }
#stage { max-width: 520px; margin: 0 auto; }
.pv-dept {
    max-width: 520px; margin: 0 auto 14px; padding: 10px 12px;
    background: var(--surface); border: 1.5px dashed var(--border-strong); border-radius: 13px;
}
.pv-dept label { display: block; font-size: 10.5px; color: var(--text-muted); margin-bottom: 5px; }
.pv-dept select {
    width: 100%; font-family: inherit; font-size: 13px; font-weight: 900;
    color: var(--primary); background: var(--surface);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 10px;
}
/* شارة التقويم المطبَّق — وهي زرٌّ لأن للمعلّم أن يبدّله */
.which {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 5px; font-family: inherit; font-size: 10px; font-weight: 900;
    color: #7A6224; background: #F7F1E1; border: 1px solid #E2D3AC;
    border-radius: 20px; padding: 3px 10px; cursor: pointer;
}
.which::after {
    content: '⇄'; font-size: 11px; opacity: .75;
}
.which.manual { border-style: dashed; }

/* لوحة تبديل التقويم */
.swap { padding: 0 13px 12px; display: flex; flex-direction: column; gap: 6px; }
.swap .hint { font-size: 10.5px; color: var(--text-muted); line-height: 1.7; }
.swap button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: right;
    padding: 9px 11px; border-radius: 11px; cursor: pointer; font-family: inherit;
    background: var(--surface); border: 1.5px solid var(--border);
}
.swap button.on { border-color: #C9A961; background: color-mix(in srgb, #C9A961 12%, var(--surface)); }
.swap .tick {
    width: 17px; height: 17px; flex: none; border-radius: 50%;
    border: 2px solid var(--border); display: grid; place-items: center;
    font-size: 9px; color: #fff;
}
.swap button.on .tick { background: #B8963F; border-color: #B8963F; }
.swap .lb { flex: 1; min-width: 0; }
.swap .lb b { display: block; font-size: 12px; font-weight: 900; color: var(--primary); }
.swap .lb span { display: block; font-size: 9.5px; color: var(--text-muted); margin-top: 1px; }
.pv-h { margin: 14px 0 6px; font-size: 11.5px; font-weight: 900; color: var(--text-muted); text-align: center; }

.ghost {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 16px; padding: 14px; margin-bottom: 12px; opacity: .4;
}
.ghost h4 { margin: 0 0 10px; font-size: 13px; color: var(--primary); }
.ghost .g { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.ghost .g i { display: block; height: 26px; border-radius: 6px; background: color-mix(in srgb, #ECEAE3 60%, #fff); }

/* ---------- البطاقة ---------- */
.cal {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 6px rgba(16,24,40,.05);
}
.cal.open { border-color: var(--primary); box-shadow: 0 6px 20px rgba(15,44,92,.16); }
.cal-top {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 13px 14px; background: none; border: 0; cursor: pointer;
    font-family: inherit; text-align: right;
}
.cal-ic {
    width: 34px; height: 34px; flex: none; border-radius: 10px;
    background: color-mix(in srgb, #ECEAE3 55%, #fff);
    border: 1.5px solid var(--border); display: grid; place-items: center; font-size: 15px;
}
.cal.open .cal-ic { background: #F7F1E1; border-color: #E2D3AC; }
.cal-tx { flex: 1; min-width: 0; }
.cal-nm { display: block; font-size: 13.5px; font-weight: 900; color: var(--primary); }
.cal-sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
.cal-sub b { color: #8A6E2E; font-weight: 900; }

/* ==========================================================================
   الشريط الكحليّ — سطرٌ واحد يحمل موضعك والعدّاد
   ========================================================================== */
.band {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 11px;
    padding: 11px 13px; color: #fff;
    background: linear-gradient(155deg, #1B3E77 0%, #0F2C5C 60%, #0A2049 100%);
}
.band::after {
    content: ''; position: absolute; inset-inline-end: -26px; top: -34px;
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,169,97,.30) 0%, transparent 68%);
}
.arc { width: 54px; height: 54px; flex: none; position: relative; z-index: 1; }
.arc svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.arc .mid { position: absolute; inset: 0; display: grid; place-items: center; }
.arc .mid b { font-size: 16px; font-weight: 900; line-height: 1; }

.band-tx { flex: 1; min-width: 0; position: relative; z-index: 1; }
.band-tx .ord { font-size: 14px; font-weight: 900; line-height: 1.35; }
.band-tx .sub { font-size: 10.5px; opacity: .78; }

.cd {
    flex: none; position: relative; z-index: 1; text-align: center;
    background: rgba(255,255,255,.10); border: 1px solid rgba(201,169,97,.45);
    border-radius: 11px; padding: 6px 10px; min-width: 66px;
}
.cd b { display: block; font-size: 17px; font-weight: 900; color: #E2C983; line-height: 1.1; }
.cd span { display: block; font-size: 8.5px; opacity: .85; line-height: 1.4; margin-top: 1px; }

/* ---------- شريط الفصول ---------- */
.trm-bar { display: flex; gap: 5px; padding: 11px 13px 0; }
.trm-bar button {
    flex: 1; padding: 6px 3px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 11px; font-weight: 900; line-height: 1.25;
    color: var(--primary); background: color-mix(in srgb, #ECEAE3 35%, #fff);
    border: 1.5px solid var(--border);
}
.trm-bar button.on { color: #fff; background: var(--primary); border-color: var(--primary); }
.trm-bar button small { display: block; font-size: 8.5px; font-weight: 500; opacity: .7; }

/* ==========================================================================
   شبكة الأسابيع — الفصل كلّه في ثلاثة صفوف
   ========================================================================== */
.grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 5px; padding: 11px 13px 0;
}
.cell {
    aspect-ratio: 1 / 1.12; border-radius: 10px; cursor: pointer; padding: 0;
    font-family: inherit; border: 1.5px solid var(--border);
    background: color-mix(in srgb, #ECEAE3 22%, var(--surface));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.cell .n { font-size: 12px; font-weight: 900; color: var(--primary); line-height: 1; }
/* خمس نقاطٍ هي أيام الأسبوع — الذهبيّ منها إجازة */
.cell .dd { display: flex; gap: 1.5px; align-items: center; }
.cell .dd i {
    width: 3.5px; height: 3.5px; border-radius: 50%;
    background: color-mix(in srgb, var(--primary) 26%, var(--border));
}
/* نقطة الإجازة أكبر وأغمق: الذهبيّ الفاتح على أرضيةٍ عاجية لا يُرى. */
.cell .dd i.off { width: 5px; height: 5px; background: #A8873F; }

.cell.past { opacity: .5; }
.cell.hol  { background: #F7F1E1; border-color: #E2D3AC; }
.cell.hol .n { color: #7A6224; }
.cell.sel  { border-color: var(--primary); box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 28%, transparent); }
.cell.now  {
    opacity: 1;
    background: linear-gradient(150deg, #D9BC78 0%, #C9A961 55%, #A8873F 100%);
    border-color: #A8873F; box-shadow: 0 3px 10px rgba(201,169,97,.4);
}
.cell.now .n { color: #fff; }
.cell.now .dd i { background: rgba(255,255,255,.55); }
.cell.now .dd i.off { background: #fff; }

/* ==========================================================================
   لوحة التفصيل — أسبوعٌ واحد، هو الملموس أو أسبوعك
   ========================================================================== */
.det {
    margin: 11px 13px 13px; padding: 11px 12px; border-radius: 13px;
    background: color-mix(in srgb, #ECEAE3 26%, var(--surface));
    border: 1.5px solid var(--border);
}
.det.is-now { background: color-mix(in srgb, #C9A961 13%, var(--surface)); border-color: #C9A961; }
.det.is-hol { background: color-mix(in srgb, #F5EEDC 55%, var(--surface)); border-color: #E2D3AC; }

.det-h { display: flex; align-items: baseline; gap: 7px; }
.det-h .t { flex: 1; font-size: 13px; font-weight: 900; color: var(--primary); }
.det-h .tag {
    font-size: 9px; font-weight: 900; color: #fff; background: #B8963F;
    border-radius: 20px; padding: 1px 8px;
}
.det-d { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.det-d span { font-size: 10.5px; color: var(--text-muted); line-height: 1.7; }
.det-d i {
    font-style: normal; font-weight: 900; margin-inline-end: 4px;
    color: color-mix(in srgb, var(--primary) 50%, var(--text-muted));
}

.det-days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
.dy {
    text-align: center; font-size: 9.5px; font-weight: 900;
    border-radius: 7px; padding: 4px 2px;
    background: color-mix(in srgb, #ECEAE3 45%, var(--surface));
    color: var(--text-muted); border: 1px solid var(--border);
}
.dy.off { background: #C9A961; color: #fff; border-color: #A8873F; }

.det-note {
    margin-top: 7px; padding-top: 7px; border-top: 1px dashed #E2D3AC;
    font-size: 10.5px; font-weight: 900; color: #8A6E2E; line-height: 1.65;
}
</style>
</head>
<body>

<h1 class="pv-title">التقويم الدراسي — مضغوط</h1>
<p class="pv-note">
    الفصل كلّه في شاشةٍ واحدة بلا تمرير.<br>
    المس أيّ أسبوع فتنزل تفاصيله · وتقويمك يُختار من إدارة تعليمك.<br>
    <b>البيانات تجريبية — ستُستبدل بتقويمك</b>
</p>

<div class="pv-dept">
    <label for="dept">إدارة تعليمك (للمعاينة — التطبيق يعرفها من إعداداتك)</label>
    <select id="dept"></select>
</div>

<div id="stage"></div>
<p class="pv-h" id="hgt"></p>

<script>
(function () {
    'use strict';

    const ar  = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const HIJRI = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', { day: 'numeric', month: 'long' });
    const GM = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    const hij  = (d) => HIJRI.format(d);
    const greg = (d) => ar(d.getDate()) + ' ' + GM[d.getMonth()];

    const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    const ORD = ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن',
                 'التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر'];

    const D = (y, m, d) => new Date(y, m - 1, d);

    /* ------------------------------------------------------------------
       تقويمان لا واحد.

       أربع إدارات لها تقويمها: مكة المكرمة وجدة والطائف والمدينة
       المنورة. وبقيّة الإدارات تقويمٌ آخر.

       والتطبيق لا يسأل المعلّم عنه: إدارة تعليمه محفوظةٌ عنده منذ
       التهيئة (education_dept، حقلٌ مطلوب). والقائمة صريحةٌ لا مشتقّة
       من المنطقة — لأن المدينة المنورة منطقةٌ مستقلّة، فاشتقاقُها من
       «منطقة مكة المكرمة» يُسقطها.
       ------------------------------------------------------------------ */
    const CALS = {
        makkah: {
            label: 'تقويم مكة وجدة والطائف والمدينة',
            start: D(2026, 8, 9),
            terms: [{ n: 1, name: 'الأول', weeks: 13 }, { n: 2, name: 'الثاني', weeks: 12 },
                    { n: 3, name: 'الثالث', weeks: 11 }],
            holidays: [
                { name: 'اليوم الوطني',             from: D(2026, 9, 23),  to: D(2026, 9, 23)  },
                { name: 'إجازة مطوّلة',             from: D(2026, 10, 19), to: D(2026, 10, 20) },
                { name: 'إجازة نهاية الفصل الأول',  from: D(2026, 11, 2),  to: D(2026, 11, 12) },
                { name: 'إجازة مطوّلة',             from: D(2026, 12, 21), to: D(2026, 12, 22) },
                { name: 'إجازة نهاية الفصل الثاني', from: D(2027, 2, 1),   to: D(2027, 2, 11)  },
                { name: 'إجازة عيد الفطر',          from: D(2027, 3, 8),   to: D(2027, 3, 19)  }
            ]
        },
        other: {
            label: 'تقويم بقيّة المناطق',
            start: D(2026, 8, 2),
            terms: [{ n: 1, name: 'الأول', weeks: 13 }, { n: 2, name: 'الثاني', weeks: 12 },
                    { n: 3, name: 'الثالث', weeks: 11 }],
            holidays: [
                { name: 'اليوم الوطني',             from: D(2026, 9, 23),  to: D(2026, 9, 23)  },
                { name: 'إجازة مطوّلة',             from: D(2026, 10, 12), to: D(2026, 10, 13) },
                { name: 'إجازة نهاية الفصل الأول',  from: D(2026, 10, 26), to: D(2026, 11, 5)  },
                { name: 'إجازة مطوّلة',             from: D(2026, 12, 14), to: D(2026, 12, 15) },
                { name: 'إجازة نهاية الفصل الثاني', from: D(2027, 1, 25),  to: D(2027, 2, 4)   },
                { name: 'إجازة عيد الفطر',          from: D(2027, 3, 8),   to: D(2027, 3, 19)  }
            ]
        }
    };

    const DEPTS = ['الرياض','مكة المكرمة','جدة','الطائف','المدينة المنورة','القصيم','الشرقية',
                   'الأحساء','عسير','تبوك','حائل','الحدود الشمالية','جازان','نجران','الباحة','الجوف'];
    /* الإدارات الأربع بأسمائها صريحةً — لا اشتقاقاً من المنطقة. */
    const EARLY_DEPTS = ['مكة المكرمة', 'جدة', 'الطائف', 'المدينة المنورة'];
    const calKeyFor = (dept) => EARLY_DEPTS.indexOf(dept) >= 0 ? 'makkah' : 'other';

    let dept = 'عسير';
    /* null = اتبع إدارتك. وغيره اختيارٌ صريح من المعلّم يعلو عليها —
       يُحفظ في الإعدادات فلا يُسأل عنه مرّتين. */
    let override = null;
    let swapOpen = false;
    let CAL, TERMS, WEEKS, CURRENT, nextOff, daysTo;
    const defaultKey = () => calKeyFor(dept);
    const activeKey  = () => override || defaultKey();

    const dayWord = (n) => n === 1 ? 'يوم واحد' : n === 2 ? 'يومان'
        : n <= 10 ? ar(n) + ' أيام' : ar(n) + ' يوماً';
    const TODAY = D(2026, 8, 13);

    function loadCalendar() {
        CAL = CALS[activeKey()];
        TERMS = CAL.terms;
        const holidayOn = (d) => CAL.holidays.find((h) => d >= h.from && d <= h.to);

        WEEKS = [];
        let n = 0;
        TERMS.forEach((t) => {
            for (let i = 0; i < t.weeks; i++) {
                n += 1;
                const from = new Date(CAL.start); from.setDate(CAL.start.getDate() + (n - 1) * 7);
                const days = DAYS.map((nm, k) => {
                    const d = new Date(from); d.setDate(from.getDate() + k);
                    return { name: nm, date: d, hol: holidayOn(d) || null };
                });
                const offs = days.filter((d) => d.hol);
                WEEKS.push({
                    n, term: t.n, k: i + 1, from, to: days[4].date, days, offs,
                    holName: offs.length ? offs[0].hol.name : null,
                    allOff: offs.length === 5
                });
            }
        });

        CURRENT = WEEKS.find((w) => TODAY >= w.from && TODAY <= new Date(w.to.getTime() + 2 * 864e5)) || WEEKS[0];
        nextOff = null;
        for (const w of WEEKS) { for (const d of w.days) if (d.hol && d.date > TODAY) { nextOff = d; break; } if (nextOff) break; }
        daysTo = nextOff ? Math.round((nextOff.date - TODAY) / 864e5) : 0;
    }
    loadCalendar();

    let open = true, term = CURRENT.term, sel = CURRENT.n;

    function band() {
        const t = TERMS[CURRENT.term - 1];
        const R = 22, C = 2 * Math.PI * R, pct = CURRENT.k / t.weeks;
        return `
            <div class="band">
                <div class="arc">
                    <svg viewBox="0 0 54 54" aria-hidden="true">
                        <circle cx="27" cy="27" r="${R}" fill="none" stroke="rgba(255,255,255,.20)" stroke-width="5"/>
                        <circle cx="27" cy="27" r="${R}" fill="none" stroke="#C9A961" stroke-width="5"
                                stroke-linecap="round" stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}"/>
                    </svg>
                    <span class="mid"><b>${ar(CURRENT.k)}</b></span>
                </div>
                <div class="band-tx">
                    <div class="ord">الأسبوع ${ORD[CURRENT.k]}</div>
                    <div class="sub">الفصل ${t.name} · ${ar(CURRENT.k)} من ${ar(t.weeks)} أسبوعاً</div>
                </div>
                ${nextOff ? `
                <div class="cd">
                    <b>${ar(daysTo)}</b>
                    <span>${daysTo === 2 ? 'يومان' : 'يوماً'} على<br>${esc(nextOff.hol.name)}</span>
                </div>` : ''}
            </div>`;
    }

    function tabs() {
        return `<div class="trm-bar">
            ${TERMS.map((t) => `
                <button type="button" data-term="${t.n}" class="${term === t.n ? 'on' : ''}">
                    الفصل ${t.name}<small>${ar(t.weeks)} أسبوعاً</small>
                </button>`).join('')}
        </div>`;
    }

    function grid() {
        const list = WEEKS.filter((w) => w.term === term);
        return `<div class="grid">
            ${list.map((w) => {
                const st = [w.n < CURRENT.n ? 'past' : '', w.offs.length ? 'hol' : '',
                            w.n === CURRENT.n ? 'now' : '', w.n === sel ? 'sel' : ''].filter(Boolean).join(' ');
                return `
                    <button type="button" class="cell ${st}" data-w="${w.n}">
                        <span class="n">${ar(w.k)}</span>
                        <span class="dd">${w.days.map((d) => `<i class="${d.hol ? 'off' : ''}"></i>`).join('')}</span>
                    </button>`;
            }).join('')}
        </div>`;
    }

    function detail() {
        const w = WEEKS.find((x) => x.n === sel) || CURRENT;
        const isNow = w.n === CURRENT.n;
        return `
            <div class="det ${isNow ? 'is-now' : ''} ${w.offs.length ? 'is-hol' : ''}">
                <div class="det-h">
                    <span class="t">الأسبوع ${ORD[w.k]}</span>
                    ${isNow ? '<span class="tag">أنت هنا</span>' : ''}
                </div>
                <div class="det-d">
                    <span><i>هـ</i>${hij(w.from)} — ${hij(w.to)}</span>
                    <span><i>م</i>${greg(w.from)} — ${greg(w.to)}</span>
                </div>
                <div class="det-days">
                    ${w.days.map((d) => `<span class="dy ${d.hol ? 'off' : ''}">${d.name}</span>`).join('')}
                </div>
                ${w.offs.length ? `
                    <div class="det-note">
                        ${esc(w.holName)} —
                        ${w.allOff ? 'الأسبوع كاملاً' : dayWord(w.offs.length) + ': ' + w.offs.map((d) => d.name).join(' و')}
                    </div>` : ''}
            </div>`;
    }

    function swap() {
        const rows = [
            ['makkah', CALS.makkah.label],
            ['other',  CALS.other.label]
        ];
        return `<div class="swap">
            <span class="hint">
                تقويمك يُختار من إدارة تعليمك (${esc(dept)}). بدّله إن كانت مدرستك تتبع الآخر.
            </span>
            ${rows.map(([k, label]) => `
                <button type="button" data-cal="${k}" class="${activeKey() === k ? 'on' : ''}">
                    <span class="tick">${activeKey() === k ? '✓' : ''}</span>
                    <span class="lb">
                        <b>${esc(label)}</b>
                        <span>${k === defaultKey() ? 'الافتراضي لإدارتك' : 'خلاف الافتراضي'}</span>
                    </span>
                </button>`).join('')}
        </div>`;
    }

    const stage = document.getElementById('stage');

    function draw() {
        stage.innerHTML = `
            <div class="ghost">
                <h4>📅 الجدول الأسبوعي</h4>
                <div class="g">${'<i></i>'.repeat(15)}</div>
            </div>
            <div class="cal ${open ? 'open' : ''}">
                <button type="button" class="cal-top" data-toggle>
                    <span class="cal-ic">🗓️</span>
                    <span class="cal-tx">
                        <span class="cal-nm">التقويم الدراسي ١٤٤٨هـ</span>
                        <span class="cal-sub">الأسبوع ${ORD[CURRENT.k]} · <b>${nextOff ? esc(nextOff.hol.name) : ''}</b> بعد ${dayWord(daysTo)}</span>
                    </span>
                </button>
                <div style="padding:0 13px 2px">
                    <button type="button" class="which ${override ? 'manual' : ''}" data-swap>${esc(CAL.label)}</button>
                </div>
                <span style="display:none">
                    </span>
                </button>
                ${open ? (swapOpen ? swap() : '') + band() + tabs() + grid() + detail() : ''}
            </div>`;
        const h = document.querySelector('.cal').getBoundingClientRect().height;
        document.getElementById('hgt').textContent = 'ارتفاع البطاقة مفتوحةً: ' + Math.round(h) + 'px';
    }

    const deptSel = document.getElementById('dept');
    deptSel.innerHTML = DEPTS.map((d) => `<option ${d === dept ? 'selected' : ''}>${d}</option>`).join('');
    deptSel.addEventListener('change', () => {
        dept = deptSel.value;
        override = null;
        loadCalendar();
        term = CURRENT.term; sel = CURRENT.n;
        draw();
    });

    stage.addEventListener('click', (e) => {
        if (e.target.closest('[data-swap]')) { swapOpen = !swapOpen; return draw(); }
        const pick = e.target.closest('[data-cal]');
        if (pick) {
            const k = pick.dataset.cal;
            /* اختيارٌ يوافق الافتراضي ليس تجاوزاً — نمسحه ليتبع إدارته
               لو نُقل إلى إدارةٍ أخرى لاحقاً. */
            override = (k === defaultKey()) ? null : k;
            loadCalendar();
            term = CURRENT.term; sel = CURRENT.n; swapOpen = false;
            return draw();
        }
        if (e.target.closest('[data-toggle]')) { open = !open; return draw(); }
        const t = e.target.closest('[data-term]');
        if (t) {
            term = Number(t.dataset.term);
            const first = WEEKS.find((w) => w.term === term);
            sel = (CURRENT.term === term) ? CURRENT.n : first.n;
            return draw();
        }
        const c = e.target.closest('[data-w]');
        if (c) { sel = Number(c.dataset.w); draw(); }
    });

    draw();
})();
</script>
</body>
</html>
