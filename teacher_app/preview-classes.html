<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — الفصول قبل أول فصل</title>

<link rel="stylesheet" href="css/fonts.css?v=2">

<style>
/* ==========================================================================
   معاينةُ شاشة «الفصول» قبل أن يُنشئ المعلّم فصلاً.

   حالُها اليوم فيها تكرارٌ ظاهر: زرّان يفعلان الشيء نفسه — واحدٌ فوق
   وواحدٌ في الوسط — وإطارٌ متقطّعٌ يحيط الفراغ.

   والسؤالُ في كل بديل: **كم عيناً تحتاج ليعرف ماذا يفعل؟**
   ========================================================================== */
:root {
    --ink: #0F2C5C; --muted: #6B6B68; --border: #E4E6EA;
    --gold: #C9A961; --surface: #FFFFFF; --alt: #F4F6F9;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: #EEEDE9; color: #16202E;
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    padding: 14px 12px calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
}
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: 700; text-align: center; color: var(--ink); }
.pv-note  { margin: 0 auto 12px; max-width: 470px; font-size: 11.5px; line-height: 1.9; color: #5C6470; text-align: center; }
.pv-cap {
    max-width: 470px; margin: 0 auto 12px; padding: 11px 13px;
    background: #fff; border: 1px solid #DDDCD6; border-radius: 12px; text-align: center;
}
.pv-cap .nm { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.pv-cap .ds { display: block; margin-top: 4px; font-size: 11.5px; color: #5C6470; line-height: 1.85; }

.phone {
    max-width: 470px; margin: 0 auto; background: #fff;
    border: 1px solid #DDDCD6; border-radius: 20px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(16,24,40,.10); min-height: 420px;
}
.ph-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 15px; border-bottom: 1px solid var(--border);
}
.ph-head .t { font-size: 16px; font-weight: 700; color: var(--ink); }
.ph-body { padding: 14px; }

/* ══ عناصرُ التطبيق ══ */
.row-top { display: flex; justify-content: flex-start; }
.btn-add-gray {
    padding: 11px 16px; border-radius: 12px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--border);
    font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
    box-shadow: 0 3px 8px rgba(16,24,40,.07);
}
.empty-dashed {
    margin-top: 13px; padding: 34px 18px; border-radius: 20px; text-align: center;
    border: 2px dashed #D8DCE3;
}
.empty-plain { margin-top: 24px; padding: 0 18px; text-align: center; }
.empty-t { font-size: 19px; font-weight: 700; color: var(--ink); }
.empty-s { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.8; }
.btn-primary {
    display: inline-block; margin-top: 15px; padding: 14px 22px; border-radius: 14px;
    background: linear-gradient(150deg, #1B3E77, #0F2C5C); color: #fff; cursor: pointer;
    border: 0; font-family: inherit; font-size: 15.5px; font-weight: 700;
}
.btn-wide { display: block; width: 100%; }

/* بطاقةٌ كبطاقات الرئيسية */
.start-card {
    display: flex; align-items: center; gap: 13px; width: 100%;
    padding: 17px 15px; border-radius: 18px; cursor: pointer; text-align: start;
    background: #fff; border: 1.5px solid var(--border);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 10px rgba(16,24,40,.07);
    font-family: inherit; text-decoration: none; margin-top: 13px;
}
.start-card .ic {
    width: 46px; height: 46px; flex: none; border-radius: 14px;
    display: grid; place-items: center; font-size: 21px;
    background: var(--alt); border: 1px solid var(--border);
}
.start-card .t { flex: 1; font-size: 15.5px; font-weight: 700; color: var(--ink); }
.start-card .chev { color: var(--muted); font-size: 13px; font-weight: 700; }

/* شريطٌ سفليٌّ ثابت */
.fab {
    position: sticky; bottom: 0; margin-top: 22px; padding: 12px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,0), #fff 40%);
}

.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid #DDDCD6; display: flex; gap: 6px;
}
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1.5px solid #D8D5CC;
}
.pv-bar button.on { color: #fff; background: var(--ink); border-color: #0A2049; }
</style>
</head>
<body>

<p class="pv-title">الفصول — قبل أول فصل</p>
<p class="pv-note">
    الحالُ اليوم: <b>زرّان يفعلان الشيء نفسه</b> (واحدٌ فوق وواحدٌ في الوسط)،
    وإطارٌ متقطّعٌ حول الفراغ.
</p>

<div class="pv-cap">
    <div class="nm" id="cap-nm"></div>
    <span class="ds" id="cap-ds"></span>
</div>

<div class="phone">
    <div class="ph-head"><div class="t">الفصول</div><div>☰</div></div>
    <div class="ph-body" id="slot"></div>
</div>

<div class="pv-bar">
    <button data-o="0" class="on">الحالي</button>
    <button data-o="a">أ</button>
    <button data-o="b">ب</button>
    <button data-o="c">ج</button>
    <button data-o="d">د</button>
</div>

<script>
const OPTS = {
    '0': {
        nm: 'الحالي',
        ds: 'زرٌّ أبيضُ فوق، وإطارٌ متقطّعٌ فيه عنوانٌ وزرٌّ كحليّ — وكلاهما يفتح النافذة نفسها.',
        html: `
            <div class="row-top"><button class="btn-add-gray">+ إضافة فصل</button></div>
            <div class="empty-dashed">
                <div class="empty-t">لا توجد لديك فصول بعد</div>
                <button class="btn-primary">+ إضافة فصل جديد</button>
            </div>`
    },

    a: {
        nm: 'أ — الأوسطُ وحده',
        ds: 'يُحذف زرُّ الأعلى ويبقى الأوسط — وهي القاعدةُ التي طبّقناها في تبويبات الفصل الستّة: زرُّ الإجراء في الوسط لا فوقُ ولا تحت. أقلُّ تغييرٍ وأكثرُه اتّساقاً مع بقيّة التطبيق.',
        html: `
            <div class="empty-dashed" style="margin-top:24px">
                <div class="empty-t">لا توجد لديك فصول بعد</div>
                <button class="btn-primary">+ إضافة فصل جديد</button>
            </div>`
    },

    b: {
        nm: 'ب — بلا إطارٍ متقطّع',
        ds: 'الإطارُ المتقطّع يرسم صندوقاً حول لا شيء. فيُحذف ويبقى نصٌّ هادئٌ وزرٌّ واحد. أنظفُ شاشةٍ وأخفُّها.',
        html: `
            <div class="empty-plain">
                <div class="empty-t">لا توجد لديك فصول بعد</div>
                <button class="btn-primary">+ إضافة فصل جديد</button>
            </div>`
    },

    c: {
        nm: 'ج — بطاقةٌ كبطاقات الرئيسية',
        ds: 'الشكلُ نفسه الذي اعتمدتَه في الرئيسية: صفٌّ فيه رمزٌ وعنوانٌ وسهم. فيصير «أضف فصلاً» شيئاً واحداً في الشاشتين — يتعلّمه المعلّم مرّةً ويعرفه أينما رآه.',
        html: `
            <div class="empty-plain" style="margin-top:18px">
                <div class="empty-t">لا توجد لديك فصول بعد</div>
            </div>
            <button class="start-card">
                <span class="ic">✍️</span>
                <span class="t">أضف فصلاً بنفسك</span>
                <span class="chev">❮</span>
            </button>
            <a class="start-card">
                <span class="ic">📷</span>
                <span class="t">ارفع جدولك <span style="font-size:12px;font-weight:500;color:var(--muted)">(تُنشأ فصولك تلقائياً)</span></span>
                <span class="chev">❮</span>
            </a>`
    },

    d: {
        nm: 'د — زرٌّ عريضٌ في الأسفل',
        ds: 'النصُّ في الوسط، والزرُّ عريضٌ ثابتٌ أسفل الشاشة حيث يبلغه الإبهام. أسهلُها وصولاً على الجوال — ويبقى في مكانه حين تمتلئ الشاشةُ بالفصول لاحقاً.',
        html: `
            <div class="empty-plain" style="margin-top:40px">
                <div class="empty-t">لا توجد لديك فصول بعد</div>
                <div class="empty-s">أضف فصلك الأول لتبدأ سجلّ طلابك.</div>
            </div>
            <div class="fab"><button class="btn-primary btn-wide">+ إضافة فصل جديد</button></div>`
    }
};

const slot = document.getElementById('slot');
function show(o) {
    const d = OPTS[o];
    document.getElementById('cap-nm').textContent = d.nm;
    document.getElementById('cap-ds').textContent = d.ds;
    slot.innerHTML = d.html;
}
document.querySelector('.pv-bar').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('.pv-bar button').forEach((x) => x.classList.toggle('on', x === b));
    show(b.dataset.o);
});
show('0');
</script>
</body>
</html>
