<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — صفحة الفصول</title>

<!-- تنسيق التطبيق الحقيقي: ما تراه هنا هو ما سيظهر في الصفحة بالضبط -->
<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/views.css?v=D118">
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
/* ===== شريط اختيار البديل — للمعاينة فقط، لا يُشحن ===== */
body { padding-bottom: 76px; }
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
}
.pv-bar button {
    flex: 1; min-height: 44px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: var(--fw-black);
    color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16, 24, 40, .09);
}
.pv-bar button.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
    border-color: color-mix(in srgb, var(--primary) 78%, #000);
}
.pv-note { margin: 0 0 var(--space-3); font-size: 11.5px; color: var(--text-muted); text-align: center; }

/* ==========================================================================
   مشترك بين البدائل: عنوان المرحلة الخفيف
   ========================================================================== */
.cl-stage {
    display: flex; align-items: baseline; gap: 7px;
    margin: var(--space-5) 3px var(--space-2);
    font-size: 12.5px; font-weight: var(--fw-black); color: var(--text-muted);
}
.cl-stage b { color: var(--primary); font-size: 13.5px; margin-inline-end: 2px; }
.cl-stage:first-of-type { margin-top: var(--space-3); }

/* ==========================================================================
   أ — صفوف داخل بطاقة واحدة، يفصلها خط شعري
   ========================================================================== */
.cla-box {
    background: #fff; border: 1px solid var(--border); border-radius: 15px;
    overflow: hidden; box-shadow: 0 2px 7px rgba(16, 24, 40, .05);
}
.cla-row {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 13px 14px; background: none; border: 0;
    font-family: inherit; text-align: right; cursor: pointer;
}
.cla-row + .cla-row { border-top: 1px solid var(--border); }
.cla-tx { flex: 1; min-width: 0; }
.cla-t { font-size: 15px; font-weight: var(--fw-black); color: var(--primary); }
.cla-s { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.cla-n {
    font-size: 12px; font-weight: var(--fw-black); color: var(--text-muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
}
.cla-go { color: #C9A961; font-size: 15px; }

/* ==========================================================================
   ب — كل فصل شريط رصاصي مستقل
   ========================================================================== */
.clb-row {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 14px 15px; border-radius: 14px; cursor: pointer;
    font-family: inherit; text-align: right;
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16, 24, 40, .09);
}
.clb-row + .clb-row { margin-top: 9px; }
.clb-t { font-size: 15.5px; font-weight: var(--fw-black); color: var(--primary); }
.clb-s { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

/* ==========================================================================
   ج — قائمة مسطّحة بلا مجموعات، والمرحلة وسم صغير في الصف
   ========================================================================== */
.clc-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 12px 4px; background: none; border: 0;
    font-family: inherit; text-align: right; cursor: pointer;
}
.clc-row + .clc-row { border-top: 1px solid var(--border); }
.clc-t { font-size: 15px; font-weight: var(--fw-black); color: var(--primary); }
.clc-s { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.clc-tag {
    font-size: 10.5px; font-weight: var(--fw-black); border-radius: 6px;
    padding: 2px 7px; background: #ECEAE3; color: #6B6B68; white-space: nowrap;
}
</style>
</head>
<body>

<div id="app" class="app-container">
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">🎓</span>
                <span class="brand-name">تطبيق إنجاز المعلم</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="container">
            <p class="pv-note">معاينة — اختر البديل من الأسفل</p>
            <div class="section-header" style="margin-top: var(--space-4);">
                <h2 class="section-title">📚 فصولي</h2>
                <button class="btn-add-gray" type="button">+ إضافة فصل</button>
            </div>
            <div id="stage"></div>
        </div>
    </main>
</div>

<nav class="pv-bar">
    <button type="button" data-o="cur">الحالي</button>
    <button type="button" data-o="a" class="on">أ</button>
    <button type="button" data-o="b">ب</button>
    <button type="button" data-o="c">ج</button>
</nav>

<script>
const AR = (s) => String(s).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d]);
const N  = (n) => n === 1 ? 'طالب واحد' : n === 2 ? 'طالبان'
               : n <= 10 ? AR(n) + ' طلاب' : AR(n) + ' طالباً';

const DATA = [
    { stage: 'ابتدائي', icon: '🏫', rows: [
        { t: 'الرابع الابتدائي / أ',  s: 'الرياضيات', n: 28 },
        { t: 'الرابع الابتدائي / ب',  s: 'الرياضيات', n: 26 },
        { t: 'الخامس الابتدائي / أ',  s: 'العلوم',    n: 25 } ] },
    { stage: 'متوسط', icon: '📘', rows: [
        { t: 'الأول المتوسط / ج',     s: 'الرياضيات', n: 30 } ] },
    { stage: 'ثانوي', icon: '🎓', rows: [
        { t: 'الثاني الثانوي / أ',    s: 'الرياضيات', n: 22 },
        { t: 'الثالث الثانوي / ب',    s: 'الرياضيات', n: 19 } ] }
];

const countWord = (n) => n === 1 ? 'فصل واحد' : n === 2 ? 'فصلان'
                      : n <= 10 ? AR(n) + ' فصول' : AR(n) + ' فصلاً';

/* بلا فاصلة «·»: تلتصق بالرقم العربي فيُقرأ «٣ فصول» كأنه «٣٠ فصول».
   اللافتة الحقيقية في التطبيق تفصل بالمسافة وحدها. */
const stageHead = (g) => `
    <div class="cl-stage">${g.icon} <b>${g.stage}</b>
        <span>${countWord(g.rows.length)}</span></div>`;

function optA() {
    return DATA.map((g) => stageHead(g) + `
        <div class="cla-box">${g.rows.map((r) => `
            <button type="button" class="cla-row">
                <div class="cla-tx">
                    <div class="cla-t">${r.t}</div>
                    <div class="cla-s">${r.s}</div>
                </div>
                <span class="cla-n">${N(r.n)}</span>
                <span class="cla-go">←</span>
            </button>`).join('')}
        </div>`).join('');
}

function optB() {
    return DATA.map((g) => stageHead(g) + g.rows.map((r) => `
        <button type="button" class="clb-row">
            <div class="cla-tx">
                <div class="clb-t">${r.t}</div>
                <div class="clb-s">${r.s}</div>
            </div>
            <span class="cla-n">${N(r.n)}</span>
        </button>`).join('')).join('');
}

function optC() {
    const all = DATA.flatMap((g) => g.rows.map((r) => ({ ...r, stage: g.stage })));
    return `<div style="margin-top:var(--space-3)">${all.map((r) => `
        <button type="button" class="clc-row">
            <div class="cla-tx">
                <div class="clc-t">${r.t}</div>
                <div class="clc-s">${r.s} — ${N(r.n)}</div>
            </div>
            <span class="clc-tag">${r.stage}</span>
            <span class="cla-go">←</span>
        </button>`).join('')}</div>`;
}

/* الحالي — شبكة بطاقات مجمّعة بلافتة المرحلة */
function optCur() {
    return DATA.map((g) => `
        <div class="classes-stage-group">
            <h3 class="stage-banner">
                <span class="stage-banner-icon">${g.icon}</span>
                <span class="stage-banner-label">${g.stage}</span>
                <span class="stage-banner-count">${countWord(g.rows.length)}</span>
            </h3>
            <div class="grid grid-3 classes-stage-grid">
                ${g.rows.map((r) => `
                    <button class="class-card card-light" style="--card-color:#ECEAE3;">
                        <div>
                            <h4 class="class-card-title">${r.t}</h4>
                            <div class="class-card-subject">${r.s}</div>
                        </div>
                        <div class="class-card-meta">
                            <span>${N(r.n)}</span>
                            <span class="class-card-edit">تعديل</span>
                        </div>
                    </button>`).join('')}
            </div>
        </div>`).join('');
}

const VIEWS = { cur: optCur, a: optA, b: optB, c: optC };
const stage = document.getElementById('stage');

function show(k) {
    stage.innerHTML = VIEWS[k]();
    document.querySelectorAll('.pv-bar button').forEach((b) => {
        b.classList.toggle('on', b.dataset.o === k);
    });
    try { localStorage.setItem('pv-classes', k); } catch (e) {}
}

document.querySelectorAll('.pv-bar button').forEach((b) => {
    b.addEventListener('click', () => show(b.dataset.o));
});

let start = 'a';
try { start = localStorage.getItem('pv-classes') || 'a'; } catch (e) {}
show(VIEWS[start] ? start : 'a');
</script>

</body>
</html>
