<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — شاشة تعبئة الاختبار</title>

<!-- تنسيق التطبيق الحقيقي: الألوان والرموز من نفس الملفّات -->
<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/views.css?v=D138">
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
body { padding: 14px 12px calc(88px + env(safe-area-inset-bottom)); }
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: var(--fw-black); text-align: center; color: var(--primary); }
.pv-note  { margin: 0 0 12px; font-size: 11.5px; line-height: 1.85; color: var(--text-muted); text-align: center; }
.pv-cap   { margin: 0 0 12px; font-size: 12.5px; font-weight: var(--fw-black); text-align: center; color: var(--primary); }
.pv-cap span { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); margin-top: 3px; line-height: 1.75; }

.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
}
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: var(--fw-black); color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16,24,40,.09);
}
.pv-bar button.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
    border-color: #0A2049;
}
#stage { max-width: 520px; margin: 0 auto; }

/* ==========================================================================
   المشترك: رأس الورقة — العنوان وحصيلتها
   ========================================================================== */
.eh {
    background: #fff; border: 1.5px solid var(--border); border-radius: 16px;
    padding: 13px 14px; margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(16,24,40,.05);
}
.eh-lbl { font-size: 11.5px; font-weight: var(--fw-black); color: var(--text-muted); margin-bottom: 5px; }
.eh-title {
    width: 100%; border: 0; padding: 0; font-family: inherit;
    font-size: 16px; font-weight: var(--fw-black); color: var(--primary);
    background: transparent; outline: none;
}
.eh-meta { display: flex; gap: 8px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--border); }
.eh-chip {
    font-size: 11.5px; font-weight: var(--fw-black); color: var(--primary);
    background: color-mix(in srgb, #ECEAE3 45%, #fff);
    border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px;
}
.eh-chip.gold { color: #7A6224; background: #F7F1E1; border-color: #E2D3AC; }

/* زرّ الإضافة المشترك */
.e-add {
    width: 100%; min-height: 46px; margin-top: 10px; border-radius: 13px; cursor: pointer;
    font-family: inherit; font-size: 13.5px; font-weight: var(--fw-black); color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16,24,40,.09);
}
.e-foot { display: flex; gap: 8px; margin-top: 14px; }
.e-foot button {
    flex: 1; min-height: 46px; border-radius: 13px; cursor: pointer; font-family: inherit;
    font-size: 13.5px; font-weight: var(--fw-black);
}
.e-foot .save {
    color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
}
.e-foot .print {
    color: #fff; border: 1.5px solid #0A2049;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
}

/* حقول موحّدة */
.e-ta, .e-in {
    width: 100%; font-family: inherit; font-size: 13.5px; line-height: 1.85; color: var(--text);
    background: #fff; border: 1.5px solid var(--border); border-radius: 11px;
    padding: 9px 11px; outline: none; resize: vertical;
}
.e-ta:focus, .e-in:focus { border-color: var(--primary); }

/* ==========================================================================
   أ — البطاقات المطويّة
   السؤال شريطٌ يُقرأ، ويُفتح عند اللمس. نفس نمط الاستراتيجيات والمبادرات.
   ========================================================================== */
.qa { display: flex; flex-direction: column; gap: 9px; }
.qa-card {
    background: #fff; border: 1.5px solid var(--border); border-radius: 14px;
    box-shadow: 0 2px 6px rgba(16,24,40,.05); overflow: hidden;
}
.qa-card.open { border-color: var(--primary); box-shadow: 0 4px 14px rgba(15,44,92,.16); }
.qa-top {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 11px 12px; background: none; border: 0; cursor: pointer;
    font-family: inherit; text-align: right;
    min-width: 0; overflow: hidden;
}
.qa-n {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    background: var(--primary); color: #fff;
    font-size: 12.5px; font-weight: var(--fw-black);
    display: grid; place-items: center;
}
.qa-card.open .qa-n { background: #C9A961; }
.qa-tx { flex: 1; min-width: 0; overflow: hidden; }
.qa-q {
    display: block; font-size: 13px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.qa-q.empty { color: var(--text-muted); font-weight: 500; font-style: italic; }
.qa-type {
    flex: none; font-size: 10.5px; font-weight: var(--fw-black);
    color: var(--primary); background: color-mix(in srgb, #ECEAE3 50%, #fff);
    border: 1px solid var(--border); border-radius: 20px; padding: 3px 9px;
}
.qa-body { padding: 0 12px 12px; border-top: 1px solid var(--border); padding-top: 11px; }
.qa-row { display: flex; gap: 8px; margin-bottom: 10px; }
.qa-row .e-in { flex: none; width: 74px; text-align: center; }

/* شرائط اختيار النوع — بدل القائمة المنسدلة */
.qt { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.qt button {
    flex: 1 1 calc(50% - 3px); min-height: 36px; padding: 0 8px; border-radius: 10px; cursor: pointer;
    font-family: inherit; font-size: 11.5px; font-weight: var(--fw-black); color: var(--primary);
    background: color-mix(in srgb, #ECEAE3 35%, #fff);
    border: 1.5px solid var(--border);
}
.qt button.on { color: #fff; background: var(--primary); border-color: var(--primary); }

/* الخيارات: حرفٌ في دائرة، والصحيح ذهبي */
.qo { display: flex; flex-direction: column; gap: 7px; }
.qo-row { display: flex; align-items: center; gap: 8px; }
.qo-pick {
    width: 28px; height: 28px; flex: none; border-radius: 50%; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: var(--fw-black);
    color: var(--text-muted); background: #fff;
    border: 1.5px solid var(--border); display: grid; place-items: center;
}
.qo-pick.on { color: #fff; background: #C9A961; border-color: #B8963F; }
.qo-hint { margin-top: 8px; font-size: 11px; color: var(--text-muted); }
.qa-del {
    margin-top: 10px; width: 100%; min-height: 38px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: var(--fw-black);
    color: #A33; background: #fff; border: 1.5px solid #F0D8D8;
}

/* ==========================================================================
   ب — مجموعاتٌ كالورقة المطبوعة
   الأسئلة تحت عناوين «السؤال الأول…» كما ستُطبع تماماً.
   ========================================================================== */
.gs { display: flex; flex-direction: column; gap: 14px; }
.gs-sec {
    background: #fff; border: 1.5px solid var(--border); border-radius: 16px;
    overflow: hidden; box-shadow: 0 2px 6px rgba(16,24,40,.05);
}
.gs-head {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 13px; background: var(--primary); color: #fff;
}
.gs-head .t { flex: 1; font-size: 12.5px; font-weight: var(--fw-black); }
.gs-head .g { font-size: 11px; color: #E8D9A8; font-weight: var(--fw-black); }
.gs-items { padding: 11px 12px; display: flex; flex-direction: column; gap: 9px; }
.gs-item { display: flex; gap: 9px; align-items: flex-start; }
.gs-n {
    width: 24px; height: 24px; border-radius: 50%; flex: none; margin-top: 5px;
    background: color-mix(in srgb, #ECEAE3 55%, #fff); color: var(--primary);
    border: 1.5px solid var(--border);
    font-size: 11.5px; font-weight: var(--fw-black); display: grid; place-items: center;
}
.gs-body { flex: 1; min-width: 0; }
/* شبكةٌ لا التفاف: الحرف وخيارُه زوجٌ لا ينفصل عند نهاية السطر. */
.gs-mini { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 6px; margin-top: 7px; align-items: center; }
.gs-mini.one { grid-template-columns: 1fr; }
.gs-mini .e-in { font-size: 12.5px; padding: 6px 9px; }
.gs-mini .lt {
    width: 26px; height: 26px; flex: none; border-radius: 50%; cursor: pointer;
    font-family: inherit; font-size: 11.5px; font-weight: var(--fw-black);
    color: var(--text-muted); background: #fff;
    border: 1.5px solid var(--border); display: grid; place-items: center;
}
.gs-mini .lt.on { color: #fff; background: #C9A961; border-color: #B8963F; }
.gs-add {
    width: 100%; min-height: 38px; margin: 2px 12px 12px; width: calc(100% - 24px);
    border-radius: 11px; cursor: pointer; font-family: inherit;
    font-size: 12px; font-weight: var(--fw-black); color: var(--primary);
    background: color-mix(in srgb, #ECEAE3 35%, #fff); border: 1.5px dashed var(--border-strong);
}
.gs-new {
    display: flex; flex-wrap: wrap; gap: 7px; padding: 12px;
    background: color-mix(in srgb, #ECEAE3 30%, #fff);
    border: 1.5px dashed var(--border-strong); border-radius: 16px;
}
.gs-new .lbl { flex: 1 0 100%; font-size: 11.5px; font-weight: var(--fw-black); color: var(--text-muted); }
.gs-new button {
    flex: 1 1 30%; min-height: 38px; border-radius: 11px; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: var(--fw-black); color: var(--primary);
    background: #fff; border: 1.5px solid var(--border);
}

/* ==========================================================================
   ج — البطاقة المفتوحة، بلغة التطبيق
   كل شيء ظاهر كما هو اليوم، لكن باللون والشكل الصحيحين.
   ========================================================================== */
.op { display: flex; flex-direction: column; gap: 11px; }
.op-card {
    background: #fff; border: 1.5px solid var(--border); border-radius: 16px;
    padding: 12px; box-shadow: 0 2px 6px rgba(16,24,40,.05);
    border-inline-start: 4px solid #C9A961;
}
.op-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.op-n {
    width: 27px; height: 27px; border-radius: 9px; flex: none;
    background: var(--primary); color: #fff;
    font-size: 12.5px; font-weight: var(--fw-black); display: grid; place-items: center;
}
.op-head .sp { flex: 1; }
.op-pts {
    width: 60px; text-align: center; font-size: 12.5px; font-weight: var(--fw-black);
    color: var(--primary); background: #fff; font-family: inherit;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 6px 4px; outline: none;
}
.op-x {
    width: 32px; height: 32px; flex: none; border-radius: 10px; cursor: pointer;
    background: #fff; border: 1.5px solid var(--border); color: #A33; font-size: 13px;
}
</style>
</head>
<body>

<h1 class="pv-title">شاشة تعبئة الاختبار</h1>
<p class="pv-note">
    ثلاثة تصاميم لنفس الاختبار — ستة أسئلة مختلطة.<br>
    البطاقات تشتغل: افتحها، بدّل الأنواع، اختر الإجابة.
</p>

<div class="pv-cap" id="cap"></div>
<div id="stage"></div>

<div class="pv-bar">
    <button data-v="a" class="on">أ</button>
    <button data-v="b">ب</button>
    <button data-v="c">ج</button>
</div>

<script>
(function () {
    'use strict';

    const ar  = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const TYPES = [
        { k: 'mcq',   n: 'اختيار من متعدد' },
        { k: 'tf',    n: 'صح/خطأ' },
        { k: 'fill',  n: 'أكمل الفراغ' },
        { k: 'essay', n: 'مقالي' }
    ];
    const typeName = (k) => (TYPES.find((t) => t.k === k) || {}).n || '';
    const LETTERS = ['أ', 'ب', 'ج', 'د'];

    const SEC_TITLE = {
        mcq: 'اختر الإجابة الصحيحة',
        tf: 'ضع علامة (✓) أو (✗)',
        fill: 'أكمل الفراغ',
        essay: 'أجب عمّا يأتي'
    };
    const ORD = ['الأول', 'الثاني', 'الثالث', 'الرابع'];

    function marks(n) {
        if (n === 1) return 'درجة واحدة';
        if (n === 2) return 'درجتان';
        if (n <= 10) return ar(n) + ' درجات';
        return ar(n) + ' درجة';
    }
    function qWord(n) {
        if (n === 1) return 'سؤال واحد';
        if (n === 2) return 'سؤالان';
        if (n <= 10) return ar(n) + ' أسئلة';
        return ar(n) + ' سؤالاً';
    }

    /* حالةٌ واحدة تتشاركها التصاميم الثلاثة — فما تعدّله في أ تراه في ب. */
    const exam = {
        title: 'اختبار الفترة الأولى — العلوم',
        questions: [
            { type: 'mcq', text: 'أيُّ الأجزاء الآتية مسؤولٌ عن نقل الماء والأملاح في النبات؟',
              options: ['الخشب', 'اللحاء', 'الوَرقة', 'الزهرة'], answer: 'الخشب', points: 2 },
            { type: 'mcq', text: 'تتحوّل الطاقة الكهربائية في المصباح إلى طاقة:',
              options: ['ضوئية وحرارية', 'صوتية', 'حركية', 'كيميائية'], answer: 'ضوئية وحرارية', points: 2 },
            { type: 'tf', text: 'القمر جسمٌ مضيءٌ بذاته.', options: [], answer: 'خطأ', points: 1 },
            { type: 'tf', text: 'الهواء الجوّي خليطٌ من عدّة غازات.', options: [], answer: 'صح', points: 1 },
            { type: 'fill', text: 'الوحدة الأساسية لبناء أجسام الكائنات الحية هي ...............',
              options: [], answer: 'الخلية', points: 2 },
            { type: 'essay', text: 'اذكر ثلاثاً من الطرق التي تُحافظ بها على البيئة المدرسية.',
              options: [], answer: '', points: 4 }
        ]
    };
    let openIdx = 0;

    const total = () => exam.questions.reduce((s, q) => s + (q.points || 0), 0);

    /* ------------------------------------------------------------------
       رأس الورقة — مشترك بين الثلاثة
       ------------------------------------------------------------------ */
    function headHtml() {
        return `
        <div class="eh">
            <div class="eh-lbl">عنوان الاختبار</div>
            <input class="eh-title" value="${esc(exam.title)}" data-title>
            <div class="eh-meta">
                <span class="eh-chip">${qWord(exam.questions.length)}</span>
                <span class="eh-chip gold">${marks(total())}</span>
            </div>
        </div>`;
    }
    const footHtml = () =>
        `<div class="e-foot"><button class="save">💾 حفظ</button><button class="print">🖨️ حفظ وطباعة</button></div>`;

    /* ------------------------------------------------------------------
       أ — البطاقات المطويّة
       ------------------------------------------------------------------ */
    function variantA() {
        const cards = exam.questions.map((q, i) => {
            const open = i === openIdx;
            const first = String(q.text || '').trim();
            return `
            <div class="qa-card ${open ? 'open' : ''}">
                <button class="qa-top" data-open="${i}">
                    <span class="qa-n">${ar(i + 1)}</span>
                    <span class="qa-tx">
                        <span class="qa-q ${first ? '' : 'empty'}">${first ? esc(first) : 'سؤال بلا نصّ…'}</span>
                    </span>
                    <span class="qa-type">${typeName(q.type)}</span>
                </button>
                ${open ? `
                <div class="qa-body">
                    <div class="qt">
                        ${TYPES.map((t) =>
                            `<button data-type="${i}" data-k="${t.k}" class="${q.type === t.k ? 'on' : ''}">${t.n}</button>`).join('')}
                    </div>
                    <textarea class="e-ta" rows="2" data-text="${i}"
                              placeholder="اكتب نصّ السؤال…">${esc(q.text)}</textarea>
                    <div class="qa-row" style="margin-top:10px; align-items:center;">
                        <span style="font-size:11.5px; font-weight:800; color:var(--text-muted);">الدرجة</span>
                        <input class="e-in" type="number" value="${q.points}" data-pts="${i}" title="الدرجة">
                    </div>
                    ${bodyFor(q, i)}
                    <button class="qa-del" data-del="${i}">حذف السؤال</button>
                </div>` : ''}
            </div>`;
        }).join('');

        return headHtml()
            + `<div class="qa">${cards}</div>`
            + `<button class="e-add" data-add>+ إضافة سؤال</button>`
            + footHtml();
    }

    function bodyFor(q, i) {
        if (q.type === 'mcq') {
            return `<div class="qo">
                ${(q.options.length ? q.options : ['', '', '', '']).map((o, k) => `
                    <div class="qo-row">
                        <button class="qo-pick ${q.answer === o && o !== '' ? 'on' : ''}" data-pick="${i}" data-k="${k}">${LETTERS[k]}</button>
                        <input class="e-in" value="${esc(o)}" data-opt="${i}" data-k="${k}" placeholder="الخيار ${LETTERS[k]}">
                    </div>`).join('')}
            </div>
            <div class="qo-hint">اضغط الحرف لتحديد الإجابة الصحيحة.</div>`;
        }
        if (q.type === 'tf') {
            return `<div class="qt" style="margin:0;">
                <button data-tf="${i}" data-val="صح" class="${q.answer === 'صح' ? 'on' : ''}">صح ✓</button>
                <button data-tf="${i}" data-val="خطأ" class="${q.answer === 'خطأ' ? 'on' : ''}">خطأ ✗</button>
            </div>`;
        }
        if (q.type === 'fill') {
            return `<div style="font-size:11.5px; font-weight:800; color:var(--text-muted); margin-bottom:5px;">الإجابة الصحيحة</div>
                    <input class="e-in" value="${esc(q.answer)}" data-ans="${i}">`;
        }
        return `<div style="font-size:11.5px; color:var(--text-muted); line-height:1.85;">
                    سؤال مقالي — تُطبع تحته أربعة سطور للإجابة.
                </div>`;
    }

    /* ------------------------------------------------------------------
       ب — مجموعاتٌ كالورقة المطبوعة
       ------------------------------------------------------------------ */
    function variantB() {
        const order = [];
        const map = new Map();
        exam.questions.forEach((q, i) => {
            if (!map.has(q.type)) { map.set(q.type, []); order.push(q.type); }
            map.get(q.type).push({ q, i });
        });

        const secs = order.map((t, gi) => {
            const items = map.get(t);
            const sum = items.reduce((s, x) => s + (x.q.points || 0), 0);
            return `
            <div class="gs-sec">
                <div class="gs-head">
                    <span class="t">السؤال ${ORD[gi] || ar(gi + 1)}: ${SEC_TITLE[t]}</span>
                    <span class="g">${marks(sum)}</span>
                </div>
                <div class="gs-items">
                    ${items.map((x, k) => `
                        <div class="gs-item">
                            <span class="gs-n">${ar(k + 1)}</span>
                            <div class="gs-body">
                                <textarea class="e-ta" rows="2" data-text="${x.i}"
                                          placeholder="اكتب نصّ السؤال…">${esc(x.q.text)}</textarea>
                                ${miniFor(x.q, x.i)}
                            </div>
                        </div>`).join('')}
                </div>
                <button class="gs-add" data-add-type="${t}">+ سؤال في هذا القسم</button>
            </div>`;
        }).join('');

        const missing = TYPES.filter((t) => !map.has(t.k));
        const adder = missing.length ? `
            <div class="gs-new">
                <span class="lbl">أضف قسماً جديداً</span>
                ${missing.map((t) => `<button data-add-type="${t.k}">${t.n}</button>`).join('')}
            </div>` : '';

        return headHtml() + `<div class="gs">${secs}${adder}</div>` + footHtml();
    }

    function miniFor(q, i) {
        if (q.type === 'mcq') {
            return `<div class="gs-mini">
                ${(q.options.length ? q.options : ['', '', '', '']).map((o, k) => `
                    <button class="lt ${q.answer === o && o !== '' ? 'on' : ''}" data-pick="${i}" data-k="${k}">${LETTERS[k]}</button>
                    <input class="e-in" value="${esc(o)}" data-opt="${i}" data-k="${k}" placeholder="الخيار ${LETTERS[k]}">
                `).join('')}
            </div>`;
        }
        if (q.type === 'tf') {
            return `<div class="qt" style="margin:6px 0 0;">
                <button data-tf="${i}" data-val="صح" class="${q.answer === 'صح' ? 'on' : ''}">صح ✓</button>
                <button data-tf="${i}" data-val="خطأ" class="${q.answer === 'خطأ' ? 'on' : ''}">خطأ ✗</button>
            </div>`;
        }
        if (q.type === 'fill') {
            return `<div class="gs-mini one"><input class="e-in" value="${esc(q.answer)}" data-ans="${i}"
                          placeholder="الإجابة الصحيحة"></div>`;
        }
        return '';
    }

    /* ------------------------------------------------------------------
       ج — البطاقة المفتوحة بلغة التطبيق
       ------------------------------------------------------------------ */
    function variantC() {
        const cards = exam.questions.map((q, i) => `
            <div class="op-card">
                <div class="op-head">
                    <span class="op-n">${ar(i + 1)}</span>
                    <span class="sp"></span>
                    <input class="op-pts" type="number" value="${q.points}" data-pts="${i}">
                    <button class="op-x" data-del="${i}">🗑️</button>
                </div>
                <div class="qt">
                    ${TYPES.map((t) =>
                        `<button data-type="${i}" data-k="${t.k}" class="${q.type === t.k ? 'on' : ''}">${t.n}</button>`).join('')}
                </div>
                <textarea class="e-ta" rows="2" data-text="${i}"
                          placeholder="اكتب نصّ السؤال…">${esc(q.text)}</textarea>
                <div style="margin-top:10px;">${bodyFor(q, i)}</div>
            </div>`).join('');

        return headHtml()
            + `<div class="op">${cards}</div>`
            + `<button class="e-add" data-add>+ إضافة سؤال</button>`
            + footHtml();
    }

    /* ------------------------------------------------------------------
       الربط
       ------------------------------------------------------------------ */
    const VARIANTS = {
        a: { fn: variantA, name: 'أ — البطاقات المطويّة',
             sub: 'السؤال شريطٌ يُقرأ ويُفتح عند اللمس · نفس نمط الاستراتيجيات والمبادرات · ثلاثون سؤالاً تُمسح بنظرة' },
        b: { fn: variantB, name: 'ب — مجموعاتٌ كالورقة المطبوعة',
             sub: 'الأسئلة تحت «السؤال الأول…» كما ستُطبع · النوع يُختار بالقسم لا بكل سؤال' },
        c: { fn: variantC, name: 'ج — البطاقة المفتوحة',
             sub: 'كل شيء ظاهرٌ كما هو اليوم، لكن بألوان التطبيق وشرائط النوع بدل القائمة المنسدلة' }
    };

    const stage = document.getElementById('stage');
    const cap   = document.getElementById('cap');
    let current = 'a';

    function draw() {
        const V = VARIANTS[current];
        cap.innerHTML = `${V.name}<span>${V.sub}</span>`;
        stage.innerHTML = V.fn();
    }

    stage.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.open !== undefined) {
            const i = Number(b.dataset.open);
            openIdx = (openIdx === i) ? -1 : i;
            return draw();
        }
        if (b.dataset.type !== undefined) {
            const q = exam.questions[Number(b.dataset.type)];
            q.type = b.dataset.k;
            if (q.type === 'mcq' && !q.options.length) q.options = ['', '', '', ''];
            if (q.type === 'tf' && q.answer !== 'صح' && q.answer !== 'خطأ') q.answer = '';
            return draw();
        }
        if (b.dataset.pick !== undefined) {
            const q = exam.questions[Number(b.dataset.pick)];
            q.answer = q.options[Number(b.dataset.k)];
            return draw();
        }
        if (b.dataset.tf !== undefined) {
            exam.questions[Number(b.dataset.tf)].answer = b.dataset.val;
            return draw();
        }
        if (b.dataset.del !== undefined) {
            exam.questions.splice(Number(b.dataset.del), 1);
            openIdx = -1;
            return draw();
        }
        if (b.dataset.add !== undefined) {
            exam.questions.push({ type: 'mcq', text: '', options: ['', '', '', ''], answer: '', points: 1 });
            openIdx = exam.questions.length - 1;
            return draw();
        }
        if (b.dataset.addType !== undefined) {
            const t = b.dataset.addType;
            exam.questions.push({ type: t, text: '', options: t === 'mcq' ? ['', '', '', ''] : [], answer: '', points: 1 });
            return draw();
        }
    });

    /* التعديل لا يُعيد الرسم: إعادة الرسم عند كل حرفٍ تفقد مؤشّر الكتابة. */
    stage.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset.title !== undefined) { exam.title = el.value; return; }
        if (el.dataset.text !== undefined) { exam.questions[Number(el.dataset.text)].text = el.value; return; }
        if (el.dataset.ans  !== undefined) { exam.questions[Number(el.dataset.ans)].answer = el.value; return; }
        if (el.dataset.pts  !== undefined) { exam.questions[Number(el.dataset.pts)].points = Number(el.value) || 0; return; }
        if (el.dataset.opt  !== undefined) {
            const q = exam.questions[Number(el.dataset.opt)];
            const k = Number(el.dataset.k);
            const was = q.answer !== '' && q.answer === q.options[k];
            q.options[k] = el.value;
            if (was) q.answer = el.value;
        }
    });

    document.querySelectorAll('.pv-bar button').forEach((b) => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.pv-bar button').forEach((x) => x.classList.remove('on'));
            b.classList.add('on');
            current = b.dataset.v;
            draw();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });

    draw();
})();
</script>
</body>
</html>
