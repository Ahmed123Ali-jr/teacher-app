<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — تصاميم ورقة الاختبار</title>

<!-- الخط المحلي نفسه المستعمل في التطبيق -->
<link rel="stylesheet" href="css/fonts.css?v=1">

<style>
/* ==========================================================================
   الصفحة نفسها ليست شاشة تطبيق — إنها ورقة A4. فالألوان هنا صريحة لا
   من متغيّرات السمة: الورق أبيض دائماً والحبر أسود، مهما كانت سمة الجهاز.
   ========================================================================== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    font-family: 'Tajawal', system-ui, sans-serif;
    background: #E9E7E0;
    color: #0F2C5C;
    padding: 14px 12px calc(86px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
}

.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: 900; text-align: center; }
.pv-note  { margin: 0 0 12px; font-size: 11.5px; line-height: 1.85; color: #6B7280; text-align: center; }
.pv-cap {
    margin: 0 0 8px; font-size: 12.5px; font-weight: 900; text-align: center; color: #0F2C5C;
}
.pv-cap span { display: block; font-size: 11px; font-weight: 500; color: #6B7280; margin-top: 2px; }

/* الورقة تُرسم بمقاسها الحقيقي (794×1123 عند 96dpi) ثم تُصغَّر بالتحويل،
   فما تراه على الجوال هو نِسَب الورق الفعلية لا تقريبٌ لها. */
.sheet-wrap { overflow: hidden; margin: 0 auto; }
.sheet {
    width: 794px;
    min-height: 1123px;
    padding: 68px 57px;
    background: #fff;
    color: #111;
    transform-origin: top right;
    box-shadow: 0 6px 22px rgba(16,24,40,.16);
}

/* ---------- شريط اختيار البديل ---------- */
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.94); backdrop-filter: blur(10px);
    border-top: 1px solid #D8D5CC;
}
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 900; color: #0F2C5C;
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16,24,40,.09);
}
.pv-bar button.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, #0F2C5C 55%, #0A2049 100%);
    border-color: #0A2049;
}

/* ==========================================================================
   المشترك بين التصاميم
   ========================================================================== */
.sheet h1, .sheet h2, .sheet h3, .sheet p, .sheet ol, .sheet ul { margin: 0; padding: 0; }
.sheet ol, .sheet ul { list-style: none; }
.q-txt { font-size: 15px; line-height: 1.9; }
.mark  { font-size: 13px; color: #444; white-space: nowrap; }
.blank { letter-spacing: 1px; }
.lines .ln { border-bottom: 1px dotted #9AA0A6; height: 30px; }

/* ==========================================================================
   أ — الرسمي السعودي
   ترويسة ثلاثية + جدول بيانات + تقسيم الأسئلة إلى «السؤال الأول/الثاني»
   كما هو معتاد في مدارس المملكة، وصح/خطأ في جدول بخانتين.
   ========================================================================== */
.a-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.a-head .side { font-size: 13.5px; line-height: 2.05; font-weight: 700; }
.a-head .side.l { text-align: left; }
.a-logo {
    width: 78px; height: 78px; border-radius: 50%;
    border: 1.5px dashed #B9BEC7; display: grid; place-items: center;
    font-size: 11px; color: #9AA0A6;
}
.a-rule { border: 0; border-top: 2px solid #111; margin: 10px 0 0; }
.a-rule2 { border: 0; border-top: 1px solid #111; margin: 2px 0 14px; }
.a-title { text-align: center; font-size: 18px; font-weight: 900; margin-bottom: 14px !important; }
.a-info { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.a-info td { border: 1px solid #111; padding: 9px 10px; font-size: 14px; font-weight: 700; }
.a-sec {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 15.5px; font-weight: 900; margin: 18px 0 10px;
    border-bottom: 1.5px solid #111; padding-bottom: 5px;
}
.a-sec .g { margin-inline-start: auto; font-size: 13px; font-weight: 700; }
/* بلا line-height مطابق يرتفع الرقم فوق سطر السؤال، لأن الفقرة عندها
   ارتفاع سطرٍ ١٫٩ والرقم يرث «normal». */
.a-q { display: flex; gap: 8px; margin-bottom: 6px; align-items: baseline; }
.a-q .n { font-weight: 900; font-size: 15px; line-height: 1.9; }
.a-opts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0 0 16px 0; padding-inline-start: 22px; }
.a-opts li { font-size: 14.5px; line-height: 1.9; }
.a-tbl { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.a-tbl th, .a-tbl td { border: 1px solid #111; padding: 9px 10px; font-size: 14.5px; }
.a-tbl th { background: #F0F0F0; font-weight: 900; font-size: 13.5px; }
.a-tbl .c { text-align: center; width: 62px; }
.a-tbl .m { text-align: center; width: 40px; }

/* ==========================================================================
   ب — البطاقات
   كل سؤال بطاقة مؤطّرة، رقمه في دائرة كحلية ودرجته في شارة ذهبية.
   ========================================================================== */
.b-head {
    display: flex; align-items: center; gap: 12px;
    background: #0F2C5C; color: #fff; border-radius: 14px; padding: 14px 16px;
}
.b-head .logo {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    border: 1.5px dashed rgba(255,255,255,.5); display: grid; place-items: center;
    font-size: 10px; color: rgba(255,255,255,.7);
}
.b-head .tx { flex: 1; }
.b-head .sc { font-size: 12.5px; opacity: .82; }
.b-head h1 { font-size: 19px; font-weight: 900; margin-top: 2px !important; }
.b-head .g { font-size: 12.5px; text-align: left; line-height: 1.9; }
.b-head .g b { color: #C9A961; }
.b-info { display: flex; gap: 14px; margin: 14px 0 18px; }
.b-info div { flex: 1; font-size: 14px; font-weight: 700; border-bottom: 1.5px solid #C9C6BD; padding-bottom: 7px; }
.b-card { border: 1.5px solid #D8D5CC; border-radius: 14px; padding: 14px 15px; margin-bottom: 11px; }
.b-top { display: flex; align-items: flex-start; gap: 10px; }
.b-n {
    width: 27px; height: 27px; border-radius: 50%; flex: none;
    background: #0F2C5C; color: #fff; font-size: 13.5px; font-weight: 900;
    display: grid; place-items: center;
}
.b-pill {
    flex: none; font-size: 11.5px; font-weight: 900; color: #7A6224;
    background: #F5EEDC; border: 1px solid #E2D3AC; border-radius: 20px; padding: 3px 10px;
}
.b-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 11px 0 0; padding-inline-start: 37px; }
.b-opts li { font-size: 14.5px; }
.b-tf { display: flex; gap: 24px; margin: 10px 0 0; padding-inline-start: 37px; font-size: 15px; }
.b-lines { margin: 11px 0 0; padding-inline-start: 37px; }

/* ==========================================================================
   ج — الخطّي المبسّط
   لا صناديق ولا جداول: مسافات واسعة وخيط ذهبي واحد. أنظف ما يُقرأ.
   ========================================================================== */
.c-head { text-align: center; }
.c-head .sc { font-size: 13px; color: #555; }
.c-head h1 { font-size: 22px; font-weight: 900; margin: 5px 0 6px !important; }
.c-head .mt { font-size: 12.5px; color: #555; }
.c-rule { border: 0; border-top: 2.5px solid #C9A961; width: 92px; margin: 13px auto 0; }
.c-info { display: flex; gap: 30px; margin: 22px 0 26px; font-size: 14px; font-weight: 700; }
.c-sec { font-size: 14px; font-weight: 900; color: #C9A961; letter-spacing: .3px; margin: 26px 0 12px; }
.c-q { margin-bottom: 20px; }
.c-top { display: flex; gap: 9px; align-items: baseline; }
.c-n { font-weight: 900; font-size: 15px; min-width: 22px; }
.c-opts { margin: 9px 0 0; padding-inline-start: 31px; display: flex; flex-direction: column; gap: 8px; }
.c-opts li { font-size: 14.5px; }
.c-tf { margin: 9px 0 0; padding-inline-start: 31px; display: flex; gap: 26px; font-size: 15px; }
.c-lines { margin: 10px 0 0; padding-inline-start: 31px; }

/* ==========================================================================
   د — الموفّر (عمودان)
   الأسئلة القصيرة في عمودين فيقلّ الورق إلى النصف تقريباً، والمقالي
   يمتدّ على العرض كاملاً لأنه يحتاج مساحة كتابة.
   ========================================================================== */
.d-head {
    display: flex; align-items: center; gap: 10px;
    border: 1.5px solid #111; border-radius: 8px; padding: 10px 13px; margin-bottom: 12px;
}
.d-head .tx { flex: 1; font-size: 13px; font-weight: 700; line-height: 1.75; }
.d-head h1 { font-size: 16px; font-weight: 900; }
.d-head .g { font-size: 12.5px; font-weight: 700; text-align: left; line-height: 1.75; }
.d-info { display: flex; gap: 16px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
.d-cols { column-count: 2; column-gap: 26px; column-rule: 1px solid #D8D5CC; }
.d-sec {
    font-size: 13.5px; font-weight: 900; margin: 0 0 9px;
    border-bottom: 1.5px solid #111; padding-bottom: 4px;
    break-after: avoid; -webkit-column-break-after: avoid;
}
.d-sec:not(:first-child) { margin-top: 14px; }
.d-q { margin-bottom: 11px; break-inside: avoid; -webkit-column-break-inside: avoid; }
.d-top { display: flex; gap: 6px; align-items: baseline; }
.d-top .n { font-weight: 900; font-size: 13.5px; }
.d-q .q-txt { font-size: 13.5px; line-height: 1.8; }
.d-opts { margin: 6px 0 0; padding-inline-start: 18px; display: flex; flex-direction: column; gap: 5px; }
.d-opts li { font-size: 13px; }
.d-tf { margin: 5px 0 0; padding-inline-start: 18px; display: flex; gap: 18px; font-size: 13px; }
.d-full { margin-top: 16px; }
.d-lines { margin: 8px 0 0; padding-inline-start: 20px; }
</style>
</head>
<body>

<h1 class="pv-title">تصاميم ورقة الاختبار</h1>
<p class="pv-note">
    الورقة معروضة بمقاس A4 الحقيقي مصغَّرةً لعرض جوالك.<br>
    المحتوى واحد في التصاميم الأربعة — الفرق في الإخراج وحده.
</p>

<div class="pv-cap" id="cap"></div>
<div class="sheet-wrap" id="wrap"></div>

<div class="pv-bar">
    <button data-v="a" class="on">أ</button>
    <button data-v="b">ب</button>
    <button data-v="c">ج</button>
    <button data-v="d">د</button>
</div>

<script>
(function () {
    'use strict';

    const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    /* اختبار حقيقي معبّأ — لا نص وهمي، حتى يُحكم على التصميم بحمولته. */
    const EXAM = {
        school: 'متوسطة الأمير سلطان',
        dept:   'إدارة التعليم بمنطقة عسير',
        title:  'اختبار الفترة الأولى',
        subject:'العلوم',
        grade:  'الأول المتوسط',
        term:   'الفصل الدراسي الأول',
        time:   'ساعة واحدة',
        teacher:'أحمد العسيري',
        total:  20
    };

    const MCQ = [
        { t: 'أيُّ الأجزاء الآتية مسؤولٌ عن نقل الماء والأملاح في النبات؟',
          o: ['الخشب', 'اللحاء', 'الوَرقة', 'الزهرة'], m: 2 },
        { t: 'تتحوّل الطاقة الكهربائية في المصباح المتوهّج إلى طاقة:',
          o: ['ضوئية وحرارية', 'صوتية', 'حركية', 'كيميائية'], m: 2 },
        { t: 'أيُّ الحالات الآتية تُعدّ تغيُّراً كيميائياً؟',
          o: ['صدأ الحديد', 'ذوبان الثلج', 'تبخُّر الماء', 'تكسُّر الزجاج'], m: 2 }
    ];

    const TF = [
        { t: 'القمر جسمٌ مضيءٌ بذاته.', m: 2 },
        { t: 'تنتقل الحرارة في الأجسام المعدنية بطريقة التوصيل.', m: 2 },
        { t: 'الهواء الجوّي خليطٌ من عدّة غازات.', m: 2 }
    ];

    const FILL = [
        { t: 'الوحدة الأساسية لبناء أجسام الكائنات الحية هي ...............', m: 2 },
        { t: 'تُقاس شدّة التيار الكهربائي بوحدة ...............', m: 2 }
    ];

    const ESSAY = [
        { t: 'اذكر ثلاثاً من الطرق التي تُحافظ بها على البيئة المدرسية.', m: 4, lines: 4 }
    ];

    const LETTERS = ['أ', 'ب', 'ج', 'د'];
    const mk = (n) => `(${ar(n)} ${n === 2 ? 'درجتان' : 'درجات'})`;
    const lines = (n, cls) => `<div class="lines ${cls}">${'<div class="ln"></div>'.repeat(n)}</div>`;

    /* ------------------------------------------------------------------
       أ — الرسمي السعودي
       ------------------------------------------------------------------ */
    function variantA() {
        let n = 0;
        const mcq = MCQ.map((q) => {
            n++;
            return `<div class="a-q"><span class="n">${ar(n)}-</span>
                        <span class="q-txt">${esc(q.t)}</span></div>
                    <ol class="a-opts">${q.o.map((o, k) =>
                        `<li>☐ ${LETTERS[k]}) ${esc(o)}</li>`).join('')}</ol>`;
        }).join('');

        let t = 0;
        const tf = TF.map((q) => {
            t++;
            return `<tr><td class="m">${ar(t)}</td><td>${esc(q.t)}</td>
                        <td class="c">☐</td><td class="c">☐</td></tr>`;
        }).join('');

        let f = 0;
        const fill = FILL.map((q) => {
            f++;
            return `<div class="a-q" style="margin-bottom:14px;">
                        <span class="n">${ar(f)}-</span>
                        <span class="q-txt">${esc(q.t)}</span></div>`;
        }).join('');

        const essay = ESSAY.map((q, i) =>
            `<div class="a-q"><span class="n">${ar(i + 1)}-</span>
                 <span class="q-txt">${esc(q.t)}</span></div>${lines(q.lines, '')}`).join('');

        return `
        <div class="a-head">
            <div class="side">
                المملكة العربية السعودية<br>
                وزارة التعليم<br>
                ${esc(EXAM.dept)}<br>
                ${esc(EXAM.school)}
            </div>
            <div class="a-logo">شعار<br>المدرسة</div>
            <div class="side l">
                المادة: ${esc(EXAM.subject)}<br>
                الصف: ${esc(EXAM.grade)}<br>
                الزمن: ${esc(EXAM.time)}<br>
                الدرجة: ${ar(EXAM.total)}
            </div>
        </div>
        <hr class="a-rule"><hr class="a-rule2">
        <h1 class="a-title">${esc(EXAM.title)} — ${esc(EXAM.term)}</h1>
        <table class="a-info"><tr>
            <td style="width:58%;">اسم الطالب: ....................................................</td>
            <td>رقم الجلوس: ..................</td>
            <td style="width:15%; text-align:center;">الدرجة<br>&nbsp;</td>
        </tr></table>

        <div class="a-sec">السؤال الأول: اختر الإجابة الصحيحة فيما يأتي:
            <span class="g">${mk(6)}</span></div>
        ${mcq}

        <div class="a-sec">السؤال الثاني: ضع علامة (✓) أمام العبارة الصحيحة و(✗) أمام الخاطئة:
            <span class="g">${mk(6)}</span></div>
        <table class="a-tbl">
            <tr><th class="m">م</th><th>العبارة</th><th class="c">صح</th><th class="c">خطأ</th></tr>
            ${tf}
        </table>

        <div class="a-sec">السؤال الثالث: أكمل الفراغ بما يناسبه:
            <span class="g">${mk(4)}</span></div>
        ${fill}

        <div class="a-sec">السؤال الرابع: أجب عمّا يأتي:
            <span class="g">${mk(4)}</span></div>
        ${essay}`;
    }

    /* ------------------------------------------------------------------
       ب — البطاقات
       ------------------------------------------------------------------ */
    function variantB() {
        let n = 0;
        const card = (q, body) => {
            n++;
            return `<div class="b-card">
                <div class="b-top">
                    <span class="b-n">${ar(n)}</span>
                    <span class="q-txt" style="flex:1;">${esc(q.t)}</span>
                    <span class="b-pill">${ar(q.m)}</span>
                </div>${body}</div>`;
        };

        return `
        <div class="b-head">
            <div class="logo">شعار</div>
            <div class="tx">
                <div class="sc">${esc(EXAM.school)}</div>
                <h1>${esc(EXAM.title)} — ${esc(EXAM.subject)}</h1>
            </div>
            <div class="g">${esc(EXAM.grade)}<br>الزمن: ${esc(EXAM.time)}<br><b>الدرجة: ${ar(EXAM.total)}</b></div>
        </div>
        <div class="b-info">
            <div style="flex:2;">اسم الطالب:</div>
            <div>الصف:</div>
            <div>الدرجة:</div>
        </div>

        ${MCQ.map((q) => card(q,
            `<ol class="b-opts">${q.o.map((o, k) =>
                `<li>☐ ${LETTERS[k]}) ${esc(o)}</li>`).join('')}</ol>`)).join('')}

        ${TF.map((q) => card(q,
            `<div class="b-tf"><span>☐ صح</span><span>☐ خطأ</span></div>`)).join('')}

        ${FILL.map((q) => card(q, '')).join('')}

        ${ESSAY.map((q) => card(q, lines(q.lines, 'b-lines'))).join('')}`;
    }

    /* ------------------------------------------------------------------
       ج — الخطّي المبسّط
       ------------------------------------------------------------------ */
    function variantC() {
        let n = 0;
        const q = (x, body) => {
            n++;
            return `<div class="c-q"><div class="c-top">
                        <span class="c-n">${ar(n)}.</span>
                        <span class="q-txt" style="flex:1;">${esc(x.t)}</span>
                        <span class="mark">${ar(x.m)}</span>
                    </div>${body}</div>`;
        };

        return `
        <div class="c-head">
            <div class="sc">${esc(EXAM.school)}</div>
            <h1>${esc(EXAM.title)}</h1>
            <div class="mt">${esc(EXAM.subject)} — ${esc(EXAM.grade)} — ${esc(EXAM.term)}</div>
            <hr class="c-rule">
        </div>
        <div class="c-info">
            <div style="flex:2;">الاسم: ..............................................</div>
            <div style="flex:1;">الزمن: ${esc(EXAM.time)}</div>
            <div style="flex:1;">الدرجة: &nbsp; / ${ar(EXAM.total)}</div>
        </div>

        <div class="c-sec">اختر الإجابة الصحيحة</div>
        ${MCQ.map((x) => q(x, `<ol class="c-opts">${x.o.map((o, k) =>
            `<li>☐ ${LETTERS[k]}) ${esc(o)}</li>`).join('')}</ol>`)).join('')}

        <div class="c-sec">صواب أم خطأ</div>
        ${TF.map((x) => q(x, `<div class="c-tf"><span>☐ صح</span><span>☐ خطأ</span></div>`)).join('')}

        <div class="c-sec">أكمل الفراغ</div>
        ${FILL.map((x) => q(x, '')).join('')}

        <div class="c-sec">أجب بأسلوبك</div>
        ${ESSAY.map((x) => q(x, lines(x.lines, 'c-lines'))).join('')}`;
    }

    /* ------------------------------------------------------------------
       د — الموفّر (عمودان)
       ------------------------------------------------------------------ */
    function variantD() {
        let n = 0;
        const q = (x, body) => {
            n++;
            return `<div class="d-q"><div class="d-top">
                        <span class="n">${ar(n)}.</span>
                        <span class="q-txt" style="flex:1;">${esc(x.t)}</span>
                        <span class="mark" style="font-size:11.5px;">${ar(x.m)}</span>
                    </div>${body}</div>`;
        };

        const short = `
            <div class="d-sec">أولاً: اختر الإجابة الصحيحة</div>
            ${MCQ.map((x) => q(x, `<ol class="d-opts">${x.o.map((o, k) =>
                `<li>☐ ${LETTERS[k]}) ${esc(o)}</li>`).join('')}</ol>`)).join('')}
            <div class="d-sec">ثانياً: صواب أم خطأ</div>
            ${TF.map((x) => q(x, `<div class="d-tf"><span>☐ صح</span><span>☐ خطأ</span></div>`)).join('')}
            <div class="d-sec">ثالثاً: أكمل الفراغ</div>
            ${FILL.map((x) => q(x, '')).join('')}`;

        return `
        <div class="d-head">
            <div class="tx">
                ${esc(EXAM.school)} — ${esc(EXAM.dept)}<br>
                <h1>${esc(EXAM.title)} — ${esc(EXAM.subject)}</h1>
            </div>
            <div class="g">${esc(EXAM.grade)}<br>الزمن: ${esc(EXAM.time)}<br>الدرجة: ${ar(EXAM.total)}</div>
        </div>
        <div class="d-info">
            <div style="flex:2;">اسم الطالب: ....................................</div>
            <div style="flex:1;">الدرجة: &nbsp; / ${ar(EXAM.total)}</div>
        </div>

        <div class="d-cols">${short}</div>

        <div class="d-full">
            <div class="d-sec">رابعاً: أجب عمّا يأتي</div>
            ${ESSAY.map((x) => q(x, lines(x.lines, 'd-lines'))).join('')}
        </div>`;
    }

    const VARIANTS = {
        a: { fn: variantA, name: 'أ — الرسمي السعودي',
             sub: 'ترويسة ثلاثية · جدول بيانات · «السؤال الأول/الثاني» · صح وخطأ في جدول' },
        b: { fn: variantB, name: 'ب — البطاقات',
             sub: 'ترويسة كحلية · كل سؤال بطاقة مؤطّرة ودرجته في شارة ذهبية' },
        c: { fn: variantC, name: 'ج — الخطّي المبسّط',
             sub: 'بلا صناديق · مسافات واسعة · خيط ذهبي واحد. أنظف ما يُقرأ' },
        d: { fn: variantD, name: 'د — الموفّر',
             sub: 'الأسئلة القصيرة في عمودين · ورقٌ أقلّ إلى النصف تقريباً' }
    };

    const wrap = document.getElementById('wrap');
    const cap  = document.getElementById('cap');
    let current = 'a';

    function render(v) {
        current = v;
        const V = VARIANTS[v];
        cap.innerHTML = `${V.name}<span>${V.sub}</span>`;
        wrap.innerHTML = `<div class="sheet">${V.fn()}</div>`;
        fit();
    }

    /* التصغير يُحسب من العرض المتاح، وارتفاع الحاوية من الارتفاع الفعلي
       للورقة بعد الرسم — فلا يبقى فراغٌ أسفلها ولا تُقصّ إن طالت. */
    function fit() {
        const sheet = wrap.querySelector('.sheet');
        if (!sheet) return;
        const s = wrap.clientWidth / 794;
        sheet.style.transform = `scale(${s})`;
        wrap.style.height = (sheet.offsetHeight * s) + 'px';
    }

    document.querySelectorAll('.pv-bar button').forEach((b) => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.pv-bar button').forEach((x) => x.classList.remove('on'));
            b.classList.add('on');
            render(b.dataset.v);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });

    window.addEventListener('resize', fit);
    document.fonts.ready.then(fit).catch(() => {});
    render('a');
})();
</script>
</body>
</html>
