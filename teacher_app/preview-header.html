<!DOCTYPE html>
<html lang="ar" dir="rtl" data-opt="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — تصاميم الشريط العلوي</title>

<link rel="stylesheet" href="css/fonts.css?v=2">

<style>
/* ==========================================================================
   معاينةُ الشريط العلوي — ستةُ تصاميم.

   الشريطُ يُحكم عليه في شاشتين لا واحدة: **الرئيسية** حيث لا رجوع، و**شاشةٍ
   داخلية** حيث يجب أن يُرجع المعلّم. وتصميمٌ يحلو في الأولى قد يترك الثانية
   بلا طريق.

   والألوانُ والخطُّ والحدودُ منقولةٌ من التطبيق كما هي — لا مقاربة.
   ========================================================================== */
:root {
    --ink: #0F2C5C;
    --ink-2: #24498A;
    --muted: #6B6B68;
    --border: #E4E6EA;
    --gold: #C9A961;
    --surface: #FFFFFF;
    --bg: #FFFFFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: #EEEDE9; color: #16202E;
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    padding: 14px 12px calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
}
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: 700; text-align: center; color: var(--ink); }
.pv-note  { margin: 0 auto 12px; max-width: 470px; font-size: 11.5px; line-height: 1.9; color: #5C6470; text-align: center; }
.pv-cap {
    max-width: 470px; margin: 0 auto 12px; padding: 11px 13px;
    background: #fff; border: 1px solid #DDDCD6; border-radius: 12px; text-align: center;
}
.pv-cap .nm { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.pv-cap .ds { display: block; margin-top: 4px; font-size: 11.5px; color: #5C6470; line-height: 1.85; }
.pv-cap .tg { display: inline-block; margin-top: 7px; padding: 3px 9px; border-radius: 99px;
              font-size: 10.5px; font-weight: 700; background: #F2F4F7; color: #475467; }
.pv-sec { max-width: 470px; margin: 15px auto 7px; font-size: 11px; font-weight: 700;
          color: #8A9099; text-align: center; letter-spacing: .3px; }

/* ── إطار الجوال ── */
.phone {
    max-width: 470px; margin: 0 auto; background: var(--bg);
    border: 1px solid #DDDCD6; border-radius: 20px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(16,24,40,.10);
}
.status {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 16px 3px; font-size: 11.5px; font-weight: 700; color: var(--ink);
    background: var(--surface);
}
.status .r { letter-spacing: 1px; font-size: 10px; }
.body { padding: 13px 14px 16px; min-height: 190px; background: var(--bg); }

/* ══════════════════════════════════════════════════════════════════════
   الشريط — الحالة الأصل (ما هو مطبَّقٌ اليوم)
   ══════════════════════════════════════════════════════════════════════ */
.hdr {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.hdr .side { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
             border-radius: 12px; color: var(--ink); font-size: 19px; }
.burger { display: inline-flex; flex-direction: column; gap: 5px; width: 21px; }
.burger i { display: block; height: 2.5px; border-radius: 2px; background: var(--ink); }
.wordmark { font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 7px; }

/* ── أ: العنوان السياقي ── */
.hdr.ctx .ttl { font-size: 17px; font-weight: 700; color: var(--ink); }

/* ── ب: العنوان الكبير ── */
.hdr.lg { height: 46px; border-bottom: 0; }
.bigttl {
    padding: 2px 16px 12px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 27px; font-weight: 700; color: var(--ink); line-height: 1.25;
}
.bigttl .sub { display: block; margin-top: 2px; font-size: 12px; font-weight: 400; color: var(--muted); }

/* ── ج: الترويسة المدمجة بالتحية ── */
.hdr.greet { height: 68px; }
.gr-wrap { display: flex; align-items: center; gap: 10px; }
.gr-av {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 1.5px solid var(--gold);
}
.gr-tx .t { font-size: 15.5px; font-weight: 700; color: var(--ink); line-height: 1.3; }
.gr-tx .s { font-size: 11px; color: var(--muted); }

/* ── د: الشريط الكحلي ── */
.hdr.navy {
    background: linear-gradient(135deg, #16386F 0%, #0F2C5C 60%, #0A2049 100%);
    border-bottom: 0; box-shadow: inset 0 -2px 0 var(--gold);
}
.hdr.navy .ttl, .hdr.navy .wordmark { color: #fff; }
.hdr.navy .side { color: #fff; }
.hdr.navy .burger i { background: #fff; }
.hdr.navy .wordmark .lg-dot { color: var(--gold); }
.status.navy { background: #16386F; color: #fff; }

/* ── هـ: الشريط العائم ── */
.float-wrap { padding: 9px 12px 0; background: var(--bg); }
.hdr.float {
    height: 50px; border: 1px solid var(--border); border-radius: 16px;
    background: rgba(255,255,255,.86); backdrop-filter: blur(12px);
    box-shadow: 0 4px 14px rgba(16,24,40,.10);
    padding: 0 8px 0 8px;
}
.hdr.float .side { width: 38px; height: 38px; font-size: 17px; }
.hdr.float .ttl { font-size: 15.5px; font-weight: 700; color: var(--ink); }
.float-peek {           /* محتوىً يمرّ تحت الشريط ليُرى أنه عائم */
    margin-top: -14px; padding: 22px 14px 0;
    background: linear-gradient(180deg, rgba(15,44,92,.05), transparent 70%);
}

/* ── و: الرمز وحده ── */
.hdr.mono { height: 52px; border-bottom: 0; }
.mono-mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(140deg, #1A3A6E, #0F2C5C);
    border: 1px solid var(--gold);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.mono-h1 { margin: 4px 0 0; font-size: 25px; font-weight: 700; color: var(--ink); line-height: 1.3; }

/* ── محتوى الشاشة تحت الشريط ── */
.greet-card { }
.greet-t { font-size: 20px; font-weight: 700; color: var(--ink); }
.greet-d { font-size: 12px; color: var(--muted); margin-top: 1px; }
.card {
    margin-top: 11px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 15px; box-shadow: 0 3px 10px rgba(16,24,40,.06);
}
.card .t { font-size: 15px; font-weight: 700; color: var(--ink); }
.card .s { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 1px solid #EFF0F2; font-size: 14px;
}
.row:last-child { border-bottom: 0; }
.row .g { font-weight: 700; color: var(--ink); }
.back-inline {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 9px;
    padding: 8px 12px; border-radius: 11px; background: var(--surface);
    border: 1px solid var(--border); font-size: 13px; font-weight: 700; color: var(--ink);
}

/* ── شريط البدائل ── */
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid #DDDCD6;
    display: flex; gap: 6px;
}
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1.5px solid #D8D5CC;
}
.pv-bar button.on { color: #fff; background: var(--ink); border-color: #0A2049; }
</style>
</head>
<body>

<p class="pv-title">الشريط العلوي — ستة تصاميم</p>
<p class="pv-note">
    كل تصميمٍ في شاشتين: <b>الرئيسية</b> حيث لا رجوع، و<b>شاشةٍ داخلية</b> حيث
    يجب أن يجد المعلّم طريقه للخلف.<br>
    والشريطُ اليوم يكتب اسم التطبيق في الشاشات الثماني عشرة كلِّها.
</p>

<div class="pv-cap">
    <div class="nm" id="cap-nm"></div>
    <span class="ds" id="cap-ds"></span>
    <span class="tg" id="cap-tg"></span>
</div>

<p class="pv-sec">▼ الرئيسية</p>
<div class="phone" id="ph-home"></div>

<p class="pv-sec">▼ شاشة داخلية — سجل الطلاب</p>
<div class="phone" id="ph-inner"></div>

<div class="pv-bar">
    <button data-o="0" class="on">الحالي</button>
    <button data-o="a">أ</button>
    <button data-o="b">ب</button>
    <button data-o="c">ج</button>
    <button data-o="d">د</button>
    <button data-o="e">هـ</button>
    <button data-o="f">و</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   البدائل. كلٌّ منها دالّتان: شريطُ الرئيسية وشريطُ الشاشة الداخلية —
   فالفرقُ بينها يظهر في الثانية أكثر من الأولى.
   ══════════════════════════════════════════════════════════════════════ */
const BURGER = '<span class="burger"><i></i><i></i><i></i></span>';
const STATUS = '<div class="status"><span>٩:٤١</span><span class="r">▮▮▮ ᯤ ▮</span></div>';

const GREET = `
    <div class="greet-t">مساء الخير، أحمد 👋</div>
    <div class="greet-d">السبت، ٣ ربيع الأول ١٤٤٨ هـ</div>`;

const HOME_BODY = `
    <div class="card">
        <div class="t">📅 حصتك القادمة</div>
        <div class="s">العلوم — الأول المتوسط أ — بعد ٢٥ دقيقة</div>
    </div>`;

const INNER_BODY = `
    <div class="card">
        <div class="row"><span>عبدالله محمد الأحمد</span><span class="g">٤٨</span></div>
        <div class="row"><span>فيصل عبدالعزيز الشهري</span><span class="g">٤٥</span></div>
        <div class="row"><span>إبراهيم سعد القحطاني</span><span class="g">٣٩</span></div>
    </div>`;

const OPTS = {
    /* ── الحالي ── */
    '0': {
        nm: 'الحالي — اسم التطبيق في كل شاشة',
        ds: 'الشريطُ نفسه في الشاشات الثماني عشرة: 🎓 واسمُ التطبيق. والمعلّم يعرف أيَّ تطبيقٍ فتح، فالسطرُ يُخبره بما يعرف ولا يقول أين هو. والرجوعُ في الشاشات الداخلية زرٌّ في المحتوى لا في الشريط.',
        tg: 'الحالة الأصل',
        home: STATUS + `<div class="hdr"><div class="wordmark">🎓 تطبيق إنجاز المعلم</div><div class="side">${BURGER}</div></div>`,
        inner: STATUS + `<div class="hdr"><div class="wordmark">🎓 تطبيق إنجاز المعلم</div><div class="side">${BURGER}</div></div>`,
        homeBody: GREET + HOME_BODY,
        innerBody: '<a class="back-inline">→ رجوع</a>' + INNER_BODY
    },

    /* ── أ ── */
    a: {
        nm: 'أ — العنوان السياقي',
        ds: 'الشريطُ يقول <b>أين أنت</b> لا ما اسم التطبيق: «الرئيسية»، «سجل الطلاب». وفي الشاشات الداخلية يصير الرجوعُ سهمَ الشريط نفسه — لا زرّاً في المحتوى. وهو ما تفعله التطبيقات كلُّها تقريباً، لأنه يحلّ مسألتين بمساحةٍ واحدة.',
        tg: 'المعيار في iOS وأندرويد',
        home: STATUS + `<div class="hdr ctx"><div class="ttl">الرئيسية</div><div class="side">${BURGER}</div></div>`,
        inner: STATUS + `<div class="hdr ctx"><div class="ttl">سجل الطلاب</div><div class="side">→</div></div>`,
        homeBody: GREET + HOME_BODY,
        innerBody: INNER_BODY
    },

    /* ── ب ── */
    b: {
        nm: 'ب — العنوان الكبير',
        ds: 'عنوانُ الشاشة كبيرٌ تحت شريطٍ نحيف، ويصغر ليعود إلى الشريط حين تمرّر. طابعٌ آبِليٌّ صريح، ويعطي كلَّ شاشةٍ رأساً واضحاً — بثمن ٤٠ بكسلاً إضافيةً قبل التمرير.',
        tg: 'نمط آبل — Large Title',
        home: STATUS + `<div class="hdr lg"><div class="ttl"></div><div class="side">${BURGER}</div></div>
               <div class="bigttl">الرئيسية<span class="sub">السبت، ٣ ربيع الأول ١٤٤٨ هـ</span></div>`,
        inner: STATUS + `<div class="hdr lg"><div class="ttl"></div><div class="side">→</div></div>
               <div class="bigttl">سجل الطلاب<span class="sub">الأول المتوسط أ · ٢٨ طالباً</span></div>`,
        homeBody: HOME_BODY,
        innerBody: INNER_BODY
    },

    /* ── ج ── */
    c: {
        nm: 'ج — الشريط يحمل التحية',
        ds: 'التحيةُ تصعد إلى الشريط: صورةٌ واسمٌ وتاريخ. فيختفي التكرارُ — اليومَ التحيةُ مكتوبةٌ مرتين، مرةً في الشريط باسم التطبيق ومرةً تحته. ويُكسب هذا نحو ستين بكسلاً في الرئيسية. وفي الشاشات الداخلية يصير عنواناً سياقياً كالبديل أ.',
        tg: 'الأكسب مساحةً',
        home: STATUS + `<div class="hdr greet">
                <div class="gr-wrap"><div class="gr-av">أح</div>
                <div class="gr-tx"><div class="t">مساء الخير، أحمد</div><div class="s">السبت، ٣ ربيع الأول ١٤٤٨ هـ</div></div></div>
                <div class="side">${BURGER}</div></div>`,
        inner: STATUS + `<div class="hdr ctx"><div class="ttl">سجل الطلاب</div><div class="side">→</div></div>`,
        homeBody: HOME_BODY,
        innerBody: INNER_BODY
    },

    /* ── د ── */
    d: {
        nm: 'د — الشريط الكحلي بخيطٍ ذهبي',
        ds: 'هُويّةُ التطبيق في أعلاه: كحليٌّ متدرّج وخيطٌ ذهبيٌّ تحته وكتابةٌ بيضاء. أرسمُ الستّة وأقربُها لطابع الوثائق الرسمية. وثمنُه أنه يثقل كلَّ شاشة، ويُلزمنا بلونِ شريط حالةٍ كحليٍّ على الآيفون.',
        tg: 'الأقوى هُويّةً',
        home: '<div class="status navy"><span>٩:٤١</span><span class="r">▮▮▮ ᯤ ▮</span></div>' +
              `<div class="hdr navy"><div class="wordmark"><span class="lg-dot">◆</span> إنجاز المعلم</div><div class="side">${BURGER}</div></div>`,
        inner: '<div class="status navy"><span>٩:٤١</span><span class="r">▮▮▮ ᯤ ▮</span></div>' +
               `<div class="hdr navy"><div class="ttl">سجل الطلاب</div><div class="side">→</div></div>`,
        homeBody: GREET + HOME_BODY,
        innerBody: INNER_BODY
    },

    /* ── هـ ── */
    e: {
        nm: 'هـ — شريطٌ عائم',
        ds: 'شريطٌ مستديرٌ يطفو فوق المحتوى بزجاجٍ ضبابيّ، والصفحةُ تمرّ تحته. طابعٌ حديثٌ تراه في تطبيقات ٢٠٢٥. وهو أجملُها حركةً، وأكثرُها حاجةً إلى ضبط: كلُّ شاشةٍ تحتاج فسحةً في أعلاها لئلّا يُغطّي أولَ سطر.',
        tg: 'الأحدث طابعاً',
        home: STATUS + `<div class="float-wrap"><div class="hdr float"><div class="ttl">الرئيسية</div><div class="side">${BURGER}</div></div></div>`,
        inner: STATUS + `<div class="float-wrap"><div class="hdr float"><div class="ttl">سجل الطلاب</div><div class="side">→</div></div></div>`,
        homeBody: '<div class="float-peek">' + GREET + HOME_BODY + '</div>',
        innerBody: '<div class="float-peek">' + INNER_BODY + '</div>'
    },

    /* ── و ── */
    f: {
        nm: 'و — الرمز وحده والعنوان في الصفحة',
        ds: 'لا شريطَ ولا حدّ: رمزٌ صغيرٌ وقائمة، والعنوانُ يبدأ الصفحةَ نفسها بحجمٍ كبير. أهدأُ الستّة وأكثرُها «تحريرية». يعطي إحساساً بالسعة، لكنّه يترك الشاشة بلا رأسٍ ثابتٍ عند التمرير.',
        tg: 'الأهدأ',
        home: STATUS + `<div class="hdr mono"><div class="mono-mark">🎓</div><div class="side">${BURGER}</div></div>`,
        inner: STATUS + `<div class="hdr mono"><div class="mono-mark">🎓</div><div class="side">→</div></div>`,
        homeBody: '<h1 class="mono-h1">الرئيسية</h1><div class="greet-d">السبت، ٣ ربيع الأول ١٤٤٨ هـ</div>' + HOME_BODY,
        innerBody: '<h1 class="mono-h1">سجل الطلاب</h1><div class="greet-d">الأول المتوسط أ · ٢٨ طالباً</div>' + INNER_BODY
    }
};

function render() {
    const o = document.documentElement.dataset.opt;
    const d = OPTS[o];
    document.getElementById('cap-nm').textContent = d.nm;
    document.getElementById('cap-ds').innerHTML = d.ds;
    document.getElementById('cap-tg').textContent = d.tg;
    document.getElementById('ph-home').innerHTML  = d.home  + '<div class="body">' + d.homeBody  + '</div>';
    document.getElementById('ph-inner').innerHTML = d.inner + '<div class="body">' + d.innerBody + '</div>';
}

document.querySelector('.pv-bar').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('.pv-bar button').forEach((x) => x.classList.toggle('on', x === b));
    document.documentElement.dataset.opt = b.dataset.o;
    render();
});

document.documentElement.dataset.opt = '0';
render();
</script>
</body>
</html>
