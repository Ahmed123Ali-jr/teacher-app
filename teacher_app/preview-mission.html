<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — الرسالة والرؤية</title>

<!-- تنسيق التطبيق الحقيقي: ما تراه هنا هو ما سيظهر في القسم بالضبط -->
<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/views.css?v=D137">
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
body { padding-bottom: 80px; }
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
}
.pv-bar button {
    flex: 1; min-height: 44px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: var(--fw-black);
    color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16,24,40,.09);
}
.pv-bar button.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
    border-color: color-mix(in srgb, var(--primary) 78%, #000);
}
.pv-note { margin: 0 0 var(--space-3); font-size: 11.5px; color: var(--text-muted); text-align: center; }

/* ==========================================================================
   البديل أ — بطاقات تُقرأ لا صناديق تُملأ
   ========================================================================== */
.mvc { display: flex; flex-direction: column; gap: 9px; }
.mvc-card {
    display: block; width: 100%; text-align: right; cursor: pointer;
    font-family: inherit; padding: 13px 14px; border-radius: 14px;
    background: #fff; border: 1.5px solid var(--border);
    box-shadow: 0 2px 6px rgba(16,24,40,.05);
}
.mvc-card:active { transform: scale(.995); }
.mvc-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.mvc-lbl { flex: 1; font-size: 12.5px; font-weight: var(--fw-black); color: var(--primary); }
.mvc-edit { font-size: 11.5px; font-weight: var(--fw-black); color: #B8963F; }
.mvc-tx { font-size: 13.5px; line-height: 1.95; color: var(--text); }
.mvc-empty { font-size: 12.5px; line-height: 1.9; color: var(--text-muted); }
.mvc-card.is-empty { border-style: dashed; background: color-mix(in srgb, #ECEAE3 22%, #fff); }
.mvc-goals { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.mvc-goals li {
    position: relative; padding-inline-start: 14px;
    font-size: 13px; line-height: 1.9; color: var(--text);
}
.mvc-goals li::before {
    content: ""; position: absolute; inset-inline-start: 0; top: .78em;
    width: 5px; height: 5px; border-radius: 50%; background: #C9A961;
}
.mvc-more { margin-top: 5px; font-size: 11.5px; color: var(--text-muted); }

/* لوحة الحقل الواحد: مكتبة + كتابة حرة */
.mvs-tabs { display: flex; gap: 6px; margin-bottom: var(--space-3); }
.mvs-tab {
    flex: 1; min-height: 38px; border-radius: 11px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: var(--fw-black); color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
}
.mvs-tab.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
    border-color: color-mix(in srgb, var(--primary) 78%, #000);
}
</style>
</head>
<body>

<div id="app" class="app-container">
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">🎓</span>
                <span class="brand-name">تطبيق إنجاز المعلم</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="container">
            <p class="pv-note">معاينة — بدّل بين الحالتين من الأسفل</p>
            <div class="portfolio-section is-open">
                <div class="portfolio-section-header" style="pointer-events:none">
                    <span style="flex:1">🎯 الرسالة والرؤية</span>
                    <span>▼</span>
                </div>
                <div style="padding: var(--space-4) var(--space-4) var(--space-5)">
                    <div id="stage"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<nav class="pv-bar">
    <button type="button" data-o="empty" class="on">فارغ</button>
    <button type="button" data-o="filled">معبّأ</button>
    <button type="button" data-o="sheet">اللوحة</button>
    <button type="button" data-o="old">الحالي</button>
</nav>

<script>
const DATA = {
    mission: 'أن أكون معلّماً قدوةً في خُلقه وانضباطه قبل علمه، ملتزماً بأخلاقيات المهنة، حريصاً على غرس القيم الإسلامية الوسطية وترسيخ الانتماء الوطني في نفوس طلابي.',
    vision:  'تعليمٌ متميّزٌ يبني جيلاً معتزّاً بهويته، منافساً عالمياً.',
    goals: [
        'رفع مستوى التحصيل الدراسي لطلابي في مادّتي وفق مؤشّرات قابلة للقياس.',
        'تنويع استراتيجيات التدريس بما يراعي الفروق الفردية بين الطلاب.',
        'تفعيل الشراكة مع أولياء الأمور في متابعة تعلّم أبنائهم.',
        'مواصلة التطوير المهني الذاتي والالتحاق بالبرامج التدريبية النوعية.'
    ]
};

const AR = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d]);
/* رقم لاتيني بين نصّ عربي يبدو خللاً — والتصريف يختلف بالعدد. */
const moreWord = (n) => n === 1 ? 'وهدفٌ آخر…'
                      : n === 2 ? 'وهدفان آخران…'
                      : n <= 10 ? `و${AR(n)} أهداف أخرى…`
                      : `و${AR(n)} هدفاً آخر…`;

const card = (lbl, body, empty) => `
    <button type="button" class="mvc-card ${empty ? 'is-empty' : ''}">
        <span class="mvc-head">
            <span class="mvc-lbl">${lbl}</span>
            <span class="mvc-edit">${empty ? 'اختر' : 'تعديل'}</span>
        </span>
        ${body}
    </button>`;

function viewEmpty() {
    const inv = (t) => `<span class="mvc-empty">${t}</span>`;
    return `<div class="mvc">
        ${card('الرسالة الشخصية', inv('اختر صياغة من المكتبة، أو اكتبها بنفسك.'), true)}
        ${card('الرؤية',          inv('سطر واحد يصف ما تسعى إليه.'), true)}
        ${card('الأهداف المهنية', inv('اختر ما يناسبك من الأهداف — تُضاف كقائمة.'), true)}
    </div>`;
}

function viewFilled() {
    const shown = DATA.goals.slice(0, 3);
    const rest  = DATA.goals.length - shown.length;
    return `<div class="mvc">
        ${card('الرسالة الشخصية', `<span class="mvc-tx">${DATA.mission}</span>`, false)}
        ${card('الرؤية',          `<span class="mvc-tx">${DATA.vision}</span>`, false)}
        ${card('الأهداف المهنية',
            `<ul class="mvc-goals">${shown.map((g) => `<li>${g}</li>`).join('')}</ul>` +
            (rest > 0 ? `<div class="mvc-more">${moreWord(rest)}</div>` : ''), false)}
    </div>`;
}

/* لوحة حقل واحد — تُفتح بالضغط على البطاقة */
function viewSheet() {
    const items = [
        ['القيم والمسؤوليات المهنية', 'أن أُسهم في إعداد متعلّمٍ معتزٍّ بدينه ووطنه، متمكّنٍ من مهارات عصره، قادرٍ على الإسهام في نهضة بلاده.'],
        ['القيم والمسؤوليات المهنية', 'أن أكون معلّماً قدوةً في خُلقه وانضباطه قبل علمه، ملتزماً بأخلاقيات المهنة.'],
        ['المعرفة المهنية', 'أن أُقدّم لطلابي تعليماً متقناً مبنياً على معرفةٍ عميقة بتخصّصي وبطرائق تدريسه.'],
        ['الممارسة المهنية', 'أن أُهيّئ لطلابي بيئة تعلّمٍ تفاعليةً داعمة، وأنوّع في استراتيجيات تدريسي.']
    ];
    return `
        <div class="sch-sheet" style="background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:14px">
            <div class="mvs-tabs">
                <button type="button" class="mvs-tab on">من المكتبة</button>
                <button type="button" class="mvs-tab">أكتبها بنفسي</button>
            </div>
            <div class="mv-list">
                ${items.map((x, i) => `
                    <button type="button" class="mv-item ${i === 1 ? 'on' : ''}">
                        <span class="ax">${x[0]}</span>
                        <span class="tx">${x[1]}</span>
                    </button>`).join('')}
            </div>
        </div>
        <p class="pv-note" style="margin-top:12px">هكذا تُفتح البطاقة — مكتبة الحقل وحده، ومعها الكتابة الحرة.</p>`;
}

/* الحالي للمقارنة */
function viewOld() {
    return `
        <button type="button" class="btn-add-gray" style="margin-bottom:8px">📖 اختر من المكتبة</button>
        <p class="mv-hint">صياغات رسمية مبنية على المعايير المهنية للمعلمين ورؤية وزارة التعليم — اخترها ثم عدّلها لتشبهك.</p>
        <div class="field">
            <label class="label">الرسالة الشخصية</label>
            <textarea class="textarea" rows="4" placeholder="رسالتي التربوية..."></textarea>
        </div>
        <div class="field">
            <label class="label">الرؤية</label>
            <textarea class="textarea" rows="4" placeholder="رؤيتي المستقبلية..."></textarea>
        </div>
        <div class="field">
            <label class="label">الأهداف المهنية</label>
            <textarea class="textarea" rows="4" placeholder="أهدافي للعام الدراسي..."></textarea>
        </div>
        <button class="btn btn-primary">💾 حفظ</button>`;
}

const VIEWS = { empty: viewEmpty, filled: viewFilled, sheet: viewSheet, old: viewOld };
const stage = document.getElementById('stage');

function show(k) {
    stage.innerHTML = VIEWS[k]();
    document.querySelectorAll('.pv-bar button').forEach((b) => {
        b.classList.toggle('on', b.dataset.o === k);
    });
    const h = Math.round(stage.getBoundingClientRect().height);
    const n = document.createElement('p');
    n.className = 'pv-note';
    n.style.marginTop = '10px';
    n.textContent = 'ارتفاع القسم: ' + h + 'px';
    stage.appendChild(n);
    try { localStorage.setItem('pv-mv', k); } catch (e) {}
}

document.querySelectorAll('.pv-bar button').forEach((b) => {
    b.addEventListener('click', () => show(b.dataset.o));
});

let start = 'empty';
try { start = localStorage.getItem('pv-mv') || 'empty'; } catch (e) {}
show(VIEWS[start] ? start : 'empty');
</script>

</body>
</html>
