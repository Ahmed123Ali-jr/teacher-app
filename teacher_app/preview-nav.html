<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الشريط السفلي — ثلاثة أشكال</title>
<link rel="stylesheet" href="css/fonts.css?v=2">
<!--
    preview-nav.html — معاينةٌ لا تُشحن.

    الشريطُ اليوم ملتصقٌ بحافّة الشاشة يملأ عرضها. وiOS 26 رفعه عنها وجعله
    زجاجاً يُرى ما تحته. والفرقُ لا يُوصف بالكلام — فهذه ثلاثةُ أشكالٍ تُلمس:
    مرّر المحتوى خلفها لترى الزجاج يعمل، وبدّل المظهر.

    تُحذف بعد اختيار الشكل.
-->
<style>
:root {
    --ink: #0F2C5C;
    --muted: #6B6B68;
    --page: #FFFFFF;
    --card: #FFFFFF;
    --line: #E4E6EA;
    --beige: #ECEAE3;
    --glass: rgba(255, 255, 255, .72);
    --glass-line: rgba(16, 24, 40, .10);
    --shadow: 0 8px 28px rgba(16, 24, 40, .16), 0 2px 6px rgba(16, 24, 40, .06);
}
body.dark {
    --ink: #8FB4F5;
    --muted: #A3AEC0;
    --page: #0D1117;
    --card: #161C27;
    --line: #2C3545;
    --beige: #1E2634;
    --glass: rgba(30, 38, 52, .74);
    --glass-line: rgba(255, 255, 255, .12);
    --shadow: 0 8px 28px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
    margin: 0; padding: 0 0 128px;
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    background: #F2F1EC; color: #2C2C2A;
}
body.dark { background: #05070B; color: #E8ECF3; }

.pv-title { text-align: center; font-size: 16px; font-weight: 800; margin: 12px 12px 4px; }
.pv-note  { text-align: center; font-size: 12.5px; color: #6B6B68; margin: 0 16px 14px; line-height: 1.75; }
body.dark .pv-note { color: #A3AEC0; }

.pv-cap {
    max-width: 430px; margin: 0 auto 12px; padding: 11px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
}
.pv-cap .nm { font-size: 14px; font-weight: 800; color: var(--ink); }
.pv-cap .ds { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.7; }

/* ── إطارُ الجوال ── */
.phone {
    position: relative; max-width: 430px; margin: 0 auto;
    height: 540px; overflow: hidden;
    background: var(--page); border: 1px solid var(--line);
    border-radius: 30px; box-shadow: 0 10px 34px rgba(16, 24, 40, .14);
}
.ph-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 16px; background: var(--page);
    border-bottom: 1px solid var(--line); font-weight: 800; font-size: 15px;
}
.ph-body { height: calc(100% - 51px); overflow-y: auto; padding: 14px 14px 140px; }

/* محتوىً ملوّنٌ يمرّ خلف الزجاج فيُرى أثرُه */
.blk {
    border-radius: 16px; padding: 15px; margin-bottom: 11px;
    border: 1px solid var(--line); background: var(--card);
}
.blk h4 { margin: 0 0 5px; font-size: 14px; color: var(--ink); }
.blk p  { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.8; }
.blk.navy { background: linear-gradient(135deg, #24498A, #0F2C5C); border: 0; }
.blk.navy h4, .blk.navy p { color: #fff; }
.blk.gold { background: linear-gradient(135deg, #C9A961, #A98C45); border: 0; }
.blk.gold h4, .blk.gold p { color: #fff; }

/* ══════════════════════════════════════════════════════════════════
   الشريط — القاعدة المشتركة
   ══════════════════════════════════════════════════════════════════ */
.nav {
    position: absolute; z-index: 9;
    display: flex; align-items: stretch;
    font-family: inherit;
}
.nav a {
    flex: 1; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; text-decoration: none; color: var(--muted);
    font-size: 10.5px; font-weight: 700; line-height: 1.2;
    padding: 7px 2px;
}
.nav .ic { font-size: 21px; line-height: 1; }
.nav a.on { color: #fff; font-weight: 800; }

/* ── الحالُ اليوم: ملتصقٌ يملأ العرض ── */
.nav.now {
    inset-inline: 0; bottom: 0;
    background: linear-gradient(180deg, #fff 0%, var(--beige) 140%);
    border-top: 1.5px solid #D8D5CC;
    box-shadow: 0 -4px 14px rgba(16, 24, 40, .07);
}
body.dark .nav.now { background: var(--card); border-top-color: var(--line); }
.nav.now a::before {
    content: ''; position: absolute; inset: 6px 8px; border-radius: 15px;
    background: transparent; transition: background .18s ease;
}
.nav.now a.on::before {
    background: #0F2C5C;
    box-shadow: 0 4px 11px rgba(15, 44, 92, .32), inset 0 1.5px 0 rgba(255,255,255,.18);
}
.nav.now a > * { position: relative; z-index: 1; }

/* ── أ: عائمٌ كامل العرض ── */
.nav.a {
    inset-inline: 12px; bottom: 12px;
    border-radius: 24px; padding: 4px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: var(--shadow);
}
.nav.a a { border-radius: 20px; }
.nav.a a.on { background: linear-gradient(150deg, #1B3E77, #0F2C5C); }

/* ── ب: كبسولةٌ مضغوطة، الاسمُ للنشط وحده ── */
.nav.b {
    inset-inline: auto; left: 50%; transform: translateX(-50%);
    bottom: 14px; width: auto; gap: 2px;
    border-radius: 999px; padding: 5px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: var(--shadow);
}
.nav.b a {
    flex: 0 0 auto; flex-direction: row; gap: 6px;
    width: 46px; height: 46px; border-radius: 999px; padding: 0;
    transition: width .26s cubic-bezier(.4,0,.2,1), background .2s ease;
    overflow: hidden;
}
.nav.b a .lb { display: none; white-space: nowrap; font-size: 12px; }
.nav.b a.on {
    width: auto; padding: 0 15px 0 12px;
    background: linear-gradient(150deg, #1B3E77, #0F2C5C);
}
.nav.b a.on .lb { display: inline; }
.nav.b a.on .ic { font-size: 18px; }

/* ── ج: عائمٌ كامل العرض والنشطُ حبّةٌ مرفوعة ── */
.nav.c {
    inset-inline: 12px; bottom: 12px;
    border-radius: 26px; padding: 6px 4px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid var(--glass-line);
    box-shadow: var(--shadow);
}
.nav.c a { border-radius: 18px; transition: transform .22s cubic-bezier(.34,1.4,.5,1); }
.nav.c a.on {
    background: linear-gradient(150deg, #1B3E77, #0F2C5C);
    transform: translateY(-9px);
    box-shadow: 0 8px 18px rgba(15, 44, 92, .38);
    padding: 9px 2px 8px;
}
.nav.c a.on .ic { font-size: 23px; }

/* ── شريطُ التبديل ── */
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid #DDDCD6; display: flex; gap: 6px;
}
body.dark .pv-bar { background: rgba(13,17,23,.96); border-top-color: #2C3545; }
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 800; color: #2C2C2A;
    background: #fff; border: 1.5px solid #D8D5CC;
}
body.dark .pv-bar button { color: #E8ECF3; background: #161C27; border-color: #2C3545; }
.pv-bar button.on { color: #fff; background: #0F2C5C; border-color: #0A2049; }
.pv-bar button.thm { flex: 0 0 54px; font-size: 19px; }
</style>
</head>
<body>

<p class="pv-title">الشريط السفلي — عائمٌ أم ملتصق؟</p>
<p class="pv-note">
    <b>مرّر داخل الجوال</b> لترى الزجاج يعمل، واضغط التبويبات. و<b>🌙</b> يقلب المظهر.
</p>

<div class="pv-cap">
    <div class="nm" id="cap-nm"></div>
    <span class="ds" id="cap-ds"></span>
</div>

<div class="phone">
    <div class="ph-head"><span>الرئيسية</span><span>☰</span></div>
    <div class="ph-body" id="body"></div>
    <nav class="nav" id="nav"></nav>
</div>

<div class="pv-bar">
    <button data-o="now">الحالي</button>
    <button data-o="a" class="on">أ</button>
    <button data-o="b">ب</button>
    <button data-o="c">ج</button>
    <button class="thm" id="thm">🌙</button>
</div>

<script>
const ITEMS = [
    { ic: '🏠', lb: 'الرئيسية' },
    { ic: '📚', lb: 'الفصول' },
    { ic: '📅', lb: 'الجدول' },
    { ic: '📁', lb: 'إنجاز' },
    { ic: '⚙️', lb: 'الإعدادات' }
];

const CAPS = {
    now: ['الحالي — ملتصقٌ يملأ العرض',
          'شريطٌ صلبٌ على حافّة الشاشة، بحدٍّ علويٍّ وخلفيةٍ معتمة. المحتوى ينتهي عنده ولا يمرّ تحته. هذا ما في يدك اليوم.'],
    a:   ['أ — عائمٌ كامل العرض',
          'يُرفع عن الحافّة اثني عشر بكسلاً وتُدوَّر أركانُه، وتصير خلفيتُه زجاجاً ضبابياً يُرى ما تحته. الأسماءُ الخمسةُ كلُّها باقية كما تعرفها — التغييرُ في الإطار لا في المحتوى. أقربُها لما اعتدتَه.'],
    b:   ['ب — كبسولةٌ مضغوطة (نظام آبل الجديد حرفياً)',
          'كبسولةٌ في وسط الأسفل لا تملأ العرض. الأيقوناتُ وحدها، والاسمُ يظهر للتبويب النشط فقط فيتمدّد له مكانُه بحركةٍ ناعمة. أخفُّ ما يكون على الشاشة، لكنّه يطلب من المعلّم أن يعرف أيقوناته.'],
    c:   ['ج — عائمٌ والنشطُ يرتفع',
          'كالأول في إطاره، لكنّ التبويب المختار يقفز خارج الشريط قليلاً في حبّةٍ كحليّة. الموضعُ يُعرف بلمحة بلا قراءة، والأسماءُ كلُّها باقية.']
};

let opt = 'a', active = 0;

function bodyHtml() {
    return `
        <div class="blk"><h4>مساء الخير، أحمد</h4><p>الأحد ٢٣ صفر ١٤٤٨هـ</p></div>
        <div class="blk navy"><h4>حصّتك القادمة</h4><p>الأول المتوسط / أ — رياضيات، بعد ١٢ دقيقة</p></div>
        <div class="blk"><h4>فصولك</h4><p>ثلاثةُ فصولٍ وثمانيةٌ وسبعون طالباً</p></div>
        <div class="blk gold"><h4>ملف الإنجاز</h4><p>أحدَ عشرَ شاهداً في ثمانية أقسام</p></div>
        <div class="blk"><h4>التذكيرات</h4><p>ثلاثةُ تذكيراتٍ قادمة</p></div>
        <div class="blk"><h4>الاستراتيجيات</h4><p>سبعُ استراتيجياتٍ طُبِّقت هذا الفصل</p></div>
        <div class="blk navy"><h4>المبادرات</h4><p>مبادرتان نُفِّذتا من ثلاثين</p></div>
        <div class="blk"><h4>الاختبارات</h4><p>اختباران قادمان هذا الأسبوع</p></div>`;
}

function navHtml() {
    return ITEMS.map((it, i) => `
        <a href="#" data-i="${i}" class="${i === active ? 'on' : ''}">
            <span class="ic">${it.ic}</span>
            <span class="lb">${it.lb}</span>
        </a>`).join('');
}

function paint() {
    document.getElementById('cap-nm').textContent = CAPS[opt][0];
    document.getElementById('cap-ds').textContent = CAPS[opt][1];
    const nav = document.getElementById('nav');
    nav.className = 'nav ' + opt;
    nav.innerHTML = navHtml();
}

document.getElementById('body').innerHTML = bodyHtml();
paint();

document.addEventListener('click', (e) => {
    if (e.target.closest('#thm')) {
        document.body.classList.toggle('dark');
        document.getElementById('thm').textContent =
            document.body.classList.contains('dark') ? '☀️' : '🌙';
        return;
    }
    const sw = e.target.closest('.pv-bar button[data-o]');
    if (sw) {
        document.querySelectorAll('.pv-bar button[data-o]')
            .forEach((x) => x.classList.toggle('on', x === sw));
        opt = sw.dataset.o; paint(); return;
    }
    const tab = e.target.closest('.nav a');
    if (tab) { e.preventDefault(); active = Number(tab.dataset.i); paint(); }
});
</script>
</body>
</html>
