<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>انكماشُ رأس السجلّ — اختر التصميم</title>
<link rel="stylesheet" href="css/fonts.css?v=2">
<!--
    preview-scroll.html — معاينةٌ لا تُشحن. تُحذف بعد الاختيار.
    الفكرة: عند فتح السجلّ ينزل الرأسُ حتى لا يبقى إلا الخاناتُ والأسماء،
    ومن أراد ما فوق رجع بإصبعه. ثلاثُ صياغاتٍ تُجرَّب باللمس لا بالنظر.
-->
<style>
:root{
  --deep:#0A3F4A; --mid:#105260; --lift:#104E5B;
  --gold:#C9A961; --beige:#ECEAE3; --ink:#2C2C2A; --muted:#6B6B68;
  --line:#E4E6EA; --pick:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;
  background:#fff;color:var(--ink);line-height:1.7;overflow:hidden}

.screen{height:calc(100dvh - var(--pick));display:flex;flex-direction:column;overflow:hidden}
.hd{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:11px 16px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.hd b{font-size:15px;font-weight:800;color:var(--deep)}

/* ── الوعاءُ الممرَّر ── */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 13px 12px;
  -webkit-overflow-scrolling:touch;scroll-behavior:auto}
.nav{flex:0 0 auto;margin:8px 11px 11px;padding:4px;border-radius:21px;background:rgba(255,255,255,.9);
  border:1px solid var(--line);box-shadow:0 5px 16px rgba(16,24,40,.10);display:flex}
.nav i{font-style:normal;flex:1;text-align:center;padding:6px 0;font-size:10px;color:#575753;
  border-radius:15px;line-height:1.4}
.nav i span{display:block;font-size:16px}
.nav i.on{color:#fff;background:linear-gradient(150deg,var(--lift),var(--deep));font-weight:800}

/* ── الرأسُ الكامل (يُمرَّر بعيداً) ── */
.head{padding-top:11px}
.slim{display:flex;align-items:center;gap:10px;background:var(--deep);color:#fff;
  border-radius:16px;padding:14px 15px;margin-bottom:10px}
.slim .d{flex:1;font-size:15.5px;font-weight:800}
.slim .n{font-size:12.5px;opacity:.85;margin-top:1px}
.slim .ib{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);
  display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.markbar{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:7px;margin-bottom:10px}
.markbar b{background:#15794A;color:#fff;border-radius:10px;padding:8px 16px;font-size:13.5px;font-weight:800}

/* ── الخاناتُ لاصقةٌ في الأعلى ── */
.chips{position:sticky;top:0;z-index:4;display:flex;gap:7px;overflow-x:auto;
  background:#fff;padding:9px 0 10px;margin-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips::before{content:"";position:absolute;inset:0 -13px;background:#fff;z-index:-1}
.chips c{display:block;flex:0 0 auto;border:1px solid var(--line);border-radius:11px;
  padding:8px 14px;font-size:13.5px;font-weight:700;background:#fff}
.chips c.on{background:color-mix(in srgb,var(--deep) 10%,#fff);border-color:var(--deep);
  color:var(--deep);font-weight:800}

/* شريطٌ مصغَّرٌ يظهر حين ينزل الرأس */
.mini{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:9px;
  background:var(--deep);color:#fff;border-radius:0 0 14px 14px;margin:0 -13px;
  padding:0 15px;height:0;overflow:hidden;opacity:0;
  transition:height .22s ease, opacity .22s ease}
.mini.on{height:46px;opacity:1}
.mini .d{flex:1;font-size:13.5px;font-weight:800}
.mini .n{font-size:11.5px;opacity:.85}
.mini .up{background:rgba(255,255,255,.18);border-radius:9px;padding:5px 11px;font-size:12px;font-weight:800}

.rows{display:flex;flex-direction:column;gap:9px;padding-top:8px}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:10px 12px}
.row .av{flex:0 0 30px;height:30px;border-radius:9px;background:var(--beige);color:var(--deep);
  display:grid;place-items:center;font-weight:800;font-size:13px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:14.5px;font-weight:800}
.row .nm span{display:block;font-size:11px;color:var(--muted)}
.row .acts{display:flex;gap:6px}
.row .acts i{font-style:normal;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  display:grid;place-items:center;font-size:13.5px;color:var(--muted)}

.pane{display:none}
.pane.on{display:block}

.pick{position:fixed;inset:auto 0 0 0;height:var(--pick);display:flex;background:#12202A;
  padding:6px;gap:6px;z-index:9;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.pick button{flex:1;border:0;border-radius:11px;background:#1E323E;color:#C9D3DA;
  font-family:inherit;font-weight:800;font-size:10.5px;line-height:1.3;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.pick button b{font-size:14px;color:#fff}
.pick button.on{background:linear-gradient(150deg,#1A8299,var(--deep));color:#fff}
.replay{position:fixed;bottom:calc(var(--pick) + 8px);inset-inline-start:10px;z-index:8;
  background:#12202A;color:#fff;border:0;border-radius:10px;padding:7px 13px;
  font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="screen">
  <div class="hd"><b>سجل الطلاب</b><span>←</span></div>

  <div class="scroll" id="scroll">
    <div class="mini" id="mini">
      <div class="d">الخميس ٢٠ أغسطس<div class="n">٦ طلاب · لم يُحضَّر أحد</div></div>
      <span class="up">↑ الأعلى</span>
    </div>

    <div class="head" id="head">
      <div class="slim">
        <div class="d">الخميس ٢٠ أغسطس<div class="n">٦ طلاب · لم يُحضَّر أحد</div></div>
        <span class="ib">🔍</span><span class="ib">⋯</span>
      </div>
      <div class="markbar"><b>✓ تحضير الكل</b></div>
    </div>

    <div class="chips">
      <c class="on">الحضور</c><c>المشاركة</c><c>التقييم</c><c>الملاحظات</c><c>+</c>
    </div>

    <div class="rows" id="rows"></div>
  </div>

  <div class="nav">
    <i><span>⚙️</span>الإعدادات</i><i><span>🗂️</span>إنجاز</i><i><span>📅</span>الجدول</i>
    <i class="on"><span>📚</span>الفصول</i><i><span>🏠</span>الرئيسية</i>
  </div>
</div>

<button class="replay" id="replay">↻ أعِد الفتح</button>
<div class="pick">
  <button class="on" data-go="a"><b>أ</b>ينزل وحدَه<br>عند الفتح</button>
  <button data-go="b"><b>ب</b>ينكمش مع<br>إصبعك فقط</button>
  <button data-go="c"><b>ج</b>الاثنان<br>معاً</button>
</div>

<script>
var NAMES = ['أحمد علي','بندر سعد','خالد محمد','راكان فهد','سامي عبدالله','طلال ناصر',
             'عمر يوسف','فيصل تركي','ماجد سلطان','نايف بدر','هشام وليد','ياسر صالح'];
document.getElementById('rows').innerHTML = NAMES.map(function (n) {
    return '<div class="row"><div class="av">' + n[0] + '</div>'
      + '<div class="nm"><b>' + n + '</b><span>بلا تحضير</span></div>'
      + '<div class="acts"><i>✓</i><i>✗</i><i>⏰</i><i>📝</i></div></div>';
}).join('');

var sc = document.getElementById('scroll');
var head = document.getElementById('head');
var mini = document.getElementById('mini');
var mode = 'a';

/* الشريطُ المصغَّر يظهر حين يغيب الرأسُ — في «ب» و«ج» فقط له معنى،
   وفي «أ» يظهر كذلك لأن الرأسَ نزل. */
sc.addEventListener('scroll', function () {
    mini.classList.toggle('on', sc.scrollTop > head.offsetHeight - 10);
});

/* التمريرُ التلقائيُّ: بطيءٌ ومتأخّرٌ قليلاً ليدرك المعلّمُ أن الشاشة
   امتلأت أولاً ثمّ انزلقت — لا أن يجدها منزلقةً فيظنّ شيئاً ضاع.
   ويُلغى بأوّل لمسةٍ منه: من بدأ يمرّر بيده لا يُنازَع. */
var animId = null;
function autoScroll() {
    cancelAnimationFrame(animId);
    var target = head.offsetHeight;
    var from = sc.scrollTop, dist = target - from;
    if (dist <= 0) return;
    var t0 = null, dur = 900;
    function step(ts) {
        if (t0 === null) t0 = ts;
        var k = Math.min(1, (ts - t0) / dur);
        var e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;   /* ease-in-out */
        sc.scrollTop = from + dist * e;
        if (k < 1) animId = requestAnimationFrame(step);
    }
    animId = requestAnimationFrame(step);
}
['touchstart','wheel','pointerdown'].forEach(function (ev) {
    sc.addEventListener(ev, function () { cancelAnimationFrame(animId); }, { passive: true });
});

function open(m) {
    mode = m;
    cancelAnimationFrame(animId);
    sc.scrollTop = 0;
    mini.classList.remove('on');
    if (m === 'a' || m === 'c') setTimeout(autoScroll, 450);
}

document.querySelector('.pick').addEventListener('click', function (e) {
    var btn = e.target.closest('button'); if (!btn) return;
    this.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
    open(btn.dataset.go);
});
document.getElementById('replay').addEventListener('click', function () { open(mode); });
document.querySelector('.chips').addEventListener('click', function (e) {
    var c = e.target.closest('c'); if (!c) return;
    this.querySelectorAll('c').forEach(function (x) { x.classList.toggle('on', x === c); });
});
mini.addEventListener('click', function () { sc.scrollTop = 0; });

open('a');
</script>

</body>
</html>
