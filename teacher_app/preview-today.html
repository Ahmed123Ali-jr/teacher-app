<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — حصص اليوم</title>

<!-- تنسيق التطبيق الحقيقي: ما تراه هنا هو ما سيظهر في الرئيسية بالضبط -->
<link rel="stylesheet" href="css/fonts.css?v=1">
<link rel="stylesheet" href="css/main.css?v=D16">
<link rel="stylesheet" href="css/components.css?v=5">
<link rel="stylesheet" href="css/views.css?v=D102">
<!-- اللوحة الملكية: هذه هي التي تعيد تعريف --primary و--bg، وبدونها
     تُستعمل ألوان main.css القديمة (أزرق فاتح) لا ألوان التطبيق. -->
<link rel="stylesheet" href="css/portfolio-theme.css?v=4">

<style>
/* ===== شريط اختيار البديل — للمعاينة فقط، لا يُشحن ===== */
body { padding-bottom: 76px; }
.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
}
.pv-bar button {
    flex: 1; min-height: 44px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 13px; font-weight: var(--fw-black);
    color: var(--primary);
    background: linear-gradient(150deg, #fff 0%, color-mix(in srgb, #ECEAE3 42%, #fff) 50%, #ECEAE3 100%);
    border: 1.5px solid color-mix(in srgb, #ECEAE3 85%, #000);
    box-shadow: inset 0 1.5px 0 #fff, 0 3px 8px rgba(16, 24, 40, .09);
}
.pv-bar button.on {
    color: #fff;
    background: linear-gradient(150deg, #1B3E77 0%, var(--primary) 55%, #0A2049 100%);
    border-color: color-mix(in srgb, var(--primary) 78%, #000);
}
.pv-note {
    margin: 0 0 var(--space-3); font-size: 11.5px; color: var(--text-muted);
    text-align: center;
}

/* ==========================================================================
   أ — خط زمني رأسي
   ========================================================================== */
.tdy-h {
    display: flex; align-items: baseline; gap: 8px;
    margin: var(--space-4) 0 var(--space-3);
}
.tdy-h h3 {
    margin: 0; flex: 1; font-size: 19px; font-weight: var(--fw-black);
    color: var(--primary);
}
.tdy-h a { font-size: 12px; color: #B8963F; text-decoration: none; font-weight: var(--fw-black); }

.tl { position: relative; padding-inline-start: 26px; display: flex; flex-direction: column; gap: 10px; }
.tl-spine {
    position: absolute; inset-inline-start: 6px; top: 10px; bottom: 10px;
    width: 2px; background: var(--border);
}
.tl-row { position: relative; display: flex; align-items: center; gap: 10px; }
.tl-dot {
    position: absolute; inset-inline-start: -23px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #ECEAE3; border: 2px solid var(--bg);
}
.tl-row.is-next .tl-dot { background: #fff; border-color: var(--border); }
.tl-row.is-past { opacity: .42; }
.tl-name { flex: 1; font-size: 14px; font-weight: var(--fw-black); color: var(--text); }
.tl-when { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.tl-live { flex: 1; position: relative; border-radius: 14px; padding: 11px 13px;
    background: var(--primary); color: #fff;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.2), 0 6px 14px rgba(15,44,92,.28); }
.tl-dot.live {
    inset-inline-start: -25px; top: 17px; width: 15px; height: 15px;
    background: #C9A961; border: 3px solid var(--bg);
    box-shadow: 0 0 0 3px rgba(201,169,97,.28);
}
@media (prefers-reduced-motion: no-preference) {
    .tl-dot.live { animation: tl-pulse 2.4s ease-in-out infinite; }
}
@keyframes tl-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(201,169,97,.28); }
    50%      { box-shadow: 0 0 0 7px rgba(201,169,97,.08); }
}
.tl-live-top { display: flex; align-items: baseline; gap: 8px; }
.tl-live-top b { flex: 1; font-size: 15.5px; font-weight: var(--fw-black); }
.tl-live-top span { font-size: 12px; opacity: .72; font-variant-numeric: tabular-nums; }
.tl-bar { height: 5px; border-radius: 99px; background: rgba(255,255,255,.18);
    margin: 9px 0 6px; overflow: hidden; }
.tl-bar i { display: block; height: 100%; background: #C9A961; border-radius: 99px; }
.tl-left { font-size: 12.5px; color: #C9A961; font-weight: var(--fw-black);
    font-variant-numeric: tabular-nums; }

/* ==========================================================================
   ب — شريط اليوم
   ========================================================================== */
.dstrip { display: flex; gap: 4px; height: 38px; }
.dseg { flex: 1; border-radius: 9px; display: grid; place-items: center;
    background: #ECEAE3; font-size: 12px; color: var(--text-muted);
    font-variant-numeric: tabular-nums; }
.dseg.now { flex: 1.2; background: var(--primary); color: #fff; font-size: 13.5px;
    font-weight: var(--fw-black); box-shadow: 0 0 0 2px #C9A961; }
.dseg.next { background: #fff; border: 1px solid var(--border); }
.dmark { position: relative; height: 16px; }
.dmark span { position: absolute; inset-inline-start: 44%; transform: translateX(50%);
    font-size: 11px; color: #B8963F; font-weight: var(--fw-black); }
.done { background: #fff; border: 1px solid var(--border); border-radius: 14px;
    padding: 11px 13px; box-shadow: 0 2px 6px rgba(16,24,40,.05); }
.done b { display: block; font-size: 15.5px; font-weight: var(--fw-black); color: var(--primary); }
.done i { font-style: normal; font-size: 13px; color: #B8963F; font-weight: var(--fw-black);
    font-variant-numeric: tabular-nums; }

/* ==========================================================================
   ج — الحالية كبيرة + خط مصغّر
   ========================================================================== */
.jbig { display: flex; align-items: center; gap: 14px; border-radius: 18px; padding: 15px;
    background: var(--primary); color: #fff;
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,.2), 0 8px 18px rgba(15,44,92,.32); }
.jring { position: relative; flex: none; width: 68px; height: 68px; border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(#C9A961 0 52%, rgba(255,255,255,.16) 52% 100%); }
.jring i { font-style: normal; width: 53px; height: 53px; border-radius: 50%;
    background: var(--primary); display: grid; place-items: center; text-align: center;
    line-height: 1.05; }
.jring b { display: block; font-size: 19px; font-weight: var(--fw-black);
    font-variant-numeric: tabular-nums; }
.jring s { display: block; font-size: 10px; opacity: .7; text-decoration: none; }
.jlbl { font-size: 12px; color: #C9A961; font-weight: var(--fw-black); }
.jname { font-size: 19px; font-weight: var(--fw-black); margin: 1px 0 2px; }
.jsub { font-size: 13px; opacity: .78; font-variant-numeric: tabular-nums; }
.jmini { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
.jmini .d { flex: none; width: 9px; height: 9px; border-radius: 50%; background: #ECEAE3; }
.jmini .d.now { width: 13px; height: 13px; background: #C9A961; }
.jmini .d.next { background: #fff; border: 1.5px solid var(--border); }
.jmini .l { flex: 1; height: 2px; background: var(--border); }
.jfoot { display: flex; justify-content: space-between; margin-top: 7px;
    font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="app" class="app-container">
    <header class="app-header">
        <div class="container header-inner">
            <div class="brand">
                <span class="brand-mark">🎓</span>
                <span class="brand-name">تطبيق إنجاز المعلم</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div class="container">
            <p class="pv-note">معاينة — اختر البديل من الأسفل</p>
            <div id="stage"></div>
        </div>
    </main>
</div>

<nav class="pv-bar">
    <button type="button" data-o="cur">الحالي</button>
    <button type="button" data-o="a" class="on">أ</button>
    <button type="button" data-o="b">ب</button>
    <button type="button" data-o="j">ج</button>
</nav>

<script>
/* بيانات المشهد: الآن ٠٨:٥٢ — أنت داخل الحصة الثالثة، بقي ٢٣ دقيقة. */
const AR = (s) => String(s).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[+d]);

const P = [
    { n: 1, t: '07:00', name: 'الرابع/أ · رياضيات', st: 'past' },
    { n: 2, t: '07:45', name: 'انتظار',            st: 'past' },
    { n: 3, t: '08:30', name: 'الخامس/ب · علوم',   st: 'live', end: '09:15', pct: 52, left: 23 },
    { n: 4, t: '09:45', name: 'السادس/أ · رياضيات', st: 'next', inMin: 38 },
    { n: 5, t: '10:30', name: 'الرابع/ب · رياضيات', st: 'next' }
];

const head = (extra) => `
    <div class="tdy-h"><h3>حصص اليوم</h3>${extra || ''}<a href="#">الجدول ←</a></div>`;

function optA() {
    const rows = P.map((p) => {
        if (p.st === 'live') {
            return `
                <div class="tl-row">
                    <span class="tl-dot live"></span>
                    <div class="tl-live">
                        <div class="tl-live-top"><b>${p.name}</b><span>${AR(p.t)}</span></div>
                        <div class="tl-bar"><i style="width:${p.pct}%"></i></div>
                        <div class="tl-left">تنتهي بعد ${AR(p.left)} دقيقة</div>
                    </div>
                </div>`;
        }
        const when = p.inMin ? `بعد ${AR(p.inMin)} د` : AR(p.t);
        return `
            <div class="tl-row is-${p.st}">
                <span class="tl-dot"></span>
                <span class="tl-name">${p.name}</span>
                <span class="tl-when">${when}</span>
            </div>`;
    }).join('');
    return head() + `<div class="tl"><div class="tl-spine"></div>${rows}</div>`;
}

function optB() {
    const segs = P.map((p) => {
        const c = p.st === 'live' ? 'dseg now' : (p.st === 'next' ? 'dseg next' : 'dseg');
        return `<div class="${c}">${AR(p.n)}</div>`;
    }).join('');
    const live = P.find((p) => p.st === 'live');
    return head() + `
        <div class="dstrip">${segs}</div>
        <div class="dmark"><span>▲ الآن</span></div>
        <div class="done">
            <b>${live.name}</b>
            <i>تنتهي بعد ${AR(live.left)} دقيقة</i>
        </div>`;
}

function optJ() {
    const live = P.find((p) => p.st === 'live');
    const next = P.find((p) => p.st === 'next');
    const dots = P.map((p, i) => {
        const c = p.st === 'live' ? 'd now' : (p.st === 'next' ? 'd next' : 'd');
        return `<span class="${c}"></span>` + (i < P.length - 1 ? '<span class="l"></span>' : '');
    }).join('');
    return head() + `
        <div class="jbig">
            <div class="jring"><i><b>${AR(live.left)}</b><s>دقيقة</s></i></div>
            <div style="flex:1; min-width:0">
                <div class="jlbl">الآن</div>
                <div class="jname">${live.name.split(' · ')[0]}</div>
                <div class="jsub">${live.name.split(' · ')[1]} · تنتهي ${AR(live.end)}</div>
            </div>
        </div>
        <div class="jmini">${dots}</div>
        <div class="jfoot">
            <span>${AR(P[0].t)}</span>
            <span>التالية: ${next.name.split(' · ')[0]} بعد ${AR(next.inMin)} د</span>
        </div>`;
}

/* الوضع الحالي — مبنيّ بأصناف التطبيق نفسها (pday-box / home-hero) */
function optCur() {
    const chips = P.map((p) => {
        const c = p.st === 'live' ? 'pchip live' : (p.st === 'past' ? 'pchip past' : 'pchip');
        return `<a class="${c}">
            <span class="pc-n num">ح${AR(p.n)}</span>
            <span class="pc-t num">${AR(p.t)}</span>
            <span class="pc-c">${p.name.split(' · ')[0]}</span></a>`;
    }).join('');
    return `
        <div class="pday-box">
            <div class="pday-head">
                <b>🕐 حصص اليوم</b>
                <span class="pday-cnt num">${AR(2)} / ${AR(5)}</span>
                <a href="#">الجدول كاملاً</a>
            </div>
            <div class="pday-chips">${chips}</div>
        </div>
        <div class="home-hero">
            <span class="hh-badge"><i></i> الآن</span>
            <a class="hh-body">
                <div class="hh-l">حصتك الحالية</div>
                <div class="hh-t">الخامس/ب</div>
                <div class="hh-s">علوم · حصة <span class="num">${AR(3)}</span></div>
                <div class="hh-prog">
                    <div class="hh-bar"><i style="width:52%"></i></div>
                    <span class="num">تنتهي ${AR('09:15')}</span>
                </div>
            </a>
            <a class="hh-cta">📋 سجل المتابعة</a>
        </div>`;
}

const VIEWS = { cur: optCur, a: optA, b: optB, j: optJ };
const stage = document.getElementById('stage');

function show(k) {
    stage.innerHTML = VIEWS[k]();
    document.querySelectorAll('.pv-bar button').forEach((b) => {
        b.classList.toggle('on', b.dataset.o === k);
    });
    try { localStorage.setItem('pv-today', k); } catch (e) {}
}

document.querySelectorAll('.pv-bar button').forEach((b) => {
    b.addEventListener('click', () => show(b.dataset.o));
});

let start = 'a';
try { start = localStorage.getItem('pv-today') || 'a'; } catch (e) {}
show(VIEWS[start] ? start : 'a');
</script>

</body>
</html>
