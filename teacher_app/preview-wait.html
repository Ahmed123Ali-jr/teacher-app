<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>معاينة — زرّ حصة الانتظار</title>

<link rel="stylesheet" href="css/fonts.css?v=2">

<style>
/* ==========================================================================
   معاينةُ «أضف حصة انتظار اليوم».

   الفعلُ واحد: يُسنَد للمعلّم انتظارٌ في حصّةٍ من حصص اليوم، فيسجّله في
   جدوله بضغطة. والسؤالُ في كل بديل: **كم لمسةً حتى تدخل الحصةُ الجدول؟**

   الجدولُ والألوانُ والأبعاد منقولةٌ من التطبيق كما هي.
   ========================================================================== */
:root {
    --ink: #0F2C5C; --muted: #6B6B68; --border: #E4E6EA;
    --gold: #C9A961; --amber: #B45309; --amber-bg: #FFF7E8;
    --surface: #FFFFFF;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
    background: #EEEDE9; color: #16202E;
    font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
    padding: 14px 12px calc(150px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
}
.pv-title { margin: 0 0 4px; font-size: 15px; font-weight: 700; text-align: center; color: var(--ink); }
.pv-note  { margin: 0 auto 12px; max-width: 470px; font-size: 11.5px; line-height: 1.9; color: #5C6470; text-align: center; }
.pv-cap {
    max-width: 470px; margin: 0 auto 12px; padding: 11px 13px;
    background: #fff; border: 1px solid #DDDCD6; border-radius: 12px; text-align: center;
}
.pv-cap .nm { font-size: 14.5px; font-weight: 700; color: var(--ink); }
.pv-cap .ds { display: block; margin-top: 4px; font-size: 11.5px; color: #5C6470; line-height: 1.85; }
.pv-cap .tg { display: inline-block; margin-top: 7px; padding: 3px 9px; border-radius: 99px;
              font-size: 10.5px; font-weight: 700; background: #F2F4F7; color: #475467; }

.phone {
    max-width: 470px; margin: 0 auto; background: #fff; position: relative;
    border: 1px solid #DDDCD6; border-radius: 20px; overflow: hidden;
    box-shadow: 0 6px 20px rgba(16,24,40,.10);
}
.ph-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 15px; border-bottom: 1px solid var(--border);
}
.ph-head .t { font-size: 16px; font-weight: 700; color: var(--ink); }
.ph-body { padding: 13px; }

/* صفُّ الأزرار */
.sched-head { display: flex; align-items: center; gap: 6px; margin-bottom: 11px; }
.sched-head .spacer { flex: 1; }
.tbtn {
    display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px;
    border-radius: 11px; cursor: pointer; white-space: nowrap;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1.5px solid var(--border);
    box-shadow: 0 3px 8px rgba(16,24,40,.09);
}
.tbtn.wait {
    color: var(--amber); background: var(--amber-bg);
    border-color: rgba(180, 83, 9, .3);
}

/* الشبكة */
.grid { display: grid; grid-template-columns: 62px repeat(5, 1fr); font-size: 11px; }
.gh {
    padding: 8px 2px; text-align: center; font-weight: 700; color: var(--ink);
    border-bottom: 1px solid var(--border);
}
.gp {
    padding: 10px 2px; text-align: center; color: #fff; font-weight: 700;
    background: #0F2C5C; border-bottom: 1px solid rgba(255,255,255,.12);
}
.gp small { display: block; font-size: 9.5px; font-weight: 500; opacity: .8; }
.gc { border-bottom: 1px solid #EFF0F2; border-inline-start: 1px solid #EFF0F2; min-height: 44px; padding: 4px 2px; }
.gc.today { background: #FBF9F4; }
.gc .cls { display: block; font-size: 10px; font-weight: 700; color: var(--ink); text-align: center; padding-top: 8px; }
.gc.pick {
    outline: 2px dashed var(--amber); outline-offset: -3px; cursor: pointer;
    background: var(--amber-bg);
}
.gc.pick::after { content: "+"; display: block; text-align: center; color: var(--amber); font-weight: 900; font-size: 15px; padding-top: 8px; }
.gc.added { background: var(--amber-bg); }
.gc.added .w { display: block; text-align: center; color: var(--amber); font-weight: 900; font-size: 10px; padding-top: 8px; }

/* ورقةٌ سفلية */
.sheet-back {
    position: absolute; inset: 0; background: rgba(16,24,40,.35); display: none;
}
.sheet-back.on { display: block; }
.sheet {
    position: absolute; inset-inline: 0; bottom: 0; background: #fff;
    border-radius: 20px 20px 0 0; padding: 15px 14px 20px;
    box-shadow: 0 -8px 24px rgba(16,24,40,.18); display: none;
}
.sheet.on { display: block; }
.sheet-t { font-size: 15px; font-weight: 700; color: var(--ink); text-align: center; }
.sheet-s { font-size: 11.5px; color: var(--muted); text-align: center; margin-top: 3px; }
.plist { margin-top: 13px; display: flex; flex-direction: column; gap: 7px; }
.prow {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 12px 13px; border-radius: 13px; cursor: pointer; text-align: start;
    background: #fff; border: 1.5px solid var(--border); font-family: inherit;
}
.prow[disabled] { opacity: .5; }
.prow .n {
    width: 34px; height: 34px; flex: none; border-radius: 10px; display: grid; place-items: center;
    background: #0F2C5C; color: #fff; font-size: 14px; font-weight: 700;
}
.prow .tx { flex: 1; }
.prow .t { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.prow .s { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }

/* منسدلة */
.wsel {
    width: 100%; min-height: 46px; margin-top: 11px; padding: 0 34px 0 14px;
    border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700;
    color: var(--ink); background: #fff; border: 1.5px solid var(--border);
    appearance: none;
}

.pv-bar {
    position: fixed; inset-inline: 0; bottom: 0; z-index: 60;
    padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
    border-top: 1px solid #DDDCD6; display: flex; gap: 6px;
}
.pv-bar button {
    flex: 1; min-height: 46px; border-radius: 12px; cursor: pointer;
    font-family: inherit; font-size: 15px; font-weight: 700; color: var(--ink);
    background: #fff; border: 1.5px solid #D8D5CC;
}
.pv-bar button.on { color: #fff; background: var(--ink); border-color: #0A2049; }
</style>
</head>
<body>

<p class="pv-title">حصة الانتظار — زرٌّ واحدٌ في الأعلى</p>
<p class="pv-note">
    اضغط الزرَّ الكهرمانيَّ في كل بديلٍ لترى ما يحدث بعده.<br>
    اليومُ في المعاينة هو <b>الأحد</b>، وفيه حصةٌ واحدةٌ مشغولة.
</p>

<div class="pv-cap">
    <div class="nm" id="cap-nm"></div>
    <span class="ds" id="cap-ds"></span>
    <span class="tg" id="cap-tg"></span>
</div>

<div class="phone">
    <div class="ph-head"><div class="t">الجدول الأسبوعي</div><div>☰</div></div>
    <div class="ph-body">
        <div class="sched-head" id="head"></div>
        <div class="grid" id="grid"></div>
    </div>
    <div class="sheet-back" id="back"></div>
    <div class="sheet" id="sheet"></div>
</div>

<div class="pv-bar">
    <button data-o="a" class="on">أ</button>
    <button data-o="b">ب</button>
    <button data-o="c">ج</button>
</div>

<script>
const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
const TIMES = ['07:00', '07:45', '08:30', '09:45', '10:30', '11:15', '12:00'];
/* اليومُ الأحد (العمود ٠)، وفيه حصةٌ في الأولى. */
const BUSY = { '0:1': 'الأول/أ' };
let added = null;      // رقمُ الحصة التي أُضيف فيها الانتظار
let picking = false;   // وضعُ اختيار الخلية (البديل ج)

const CAPS = {
    a: ['أ — ورقةٌ سفلية بحصص اليوم',
        'الزرُّ يفتح ورقةً فيها حصصُ اليوم السبع، كلٌّ بوقتها وحالتها: فارغةٌ أو فيها فصلك. تضغط الرقم فتُضاف. لمستان، وترى كلَّ يومك قبل أن تختار.',
        'لمستان'],
    b: ['ب — منسدلةٌ في الورقة',
        'الورقةُ نفسها لكن بقائمةٍ منسدلةٍ بدل الصفوف. أقصرُ ارتفاعاً، لكنك لا ترى حالةَ الحصص إلا بفتحها.',
        'لمستان + فتحُ قائمة'],
    c: ['ج — تختار من الجدول نفسه',
        'الزرُّ يُدخلك «وضعَ الاختيار»: تُضاء خاناتُ اليوم في الجدول وتضغط الخانة التي تريدها مباشرةً. لمستان بلا نافذة، وترى موضعَ الحصة في مكانه الحقيقيّ من الأسبوع.',
        'لمستان بلا نافذة']
};

function headHtml(opt) {
    return `
        <button class="tbtn wait" id="waitbtn">+ حصة انتظار اليوم</button>
        <span class="spacer"></span>
        <button class="tbtn">✎ تعديل</button>
        <button class="tbtn">توقيت الحصص</button>`;
}

function gridHtml() {
    let h = '<div class="gh">الحصة</div>' + DAYS.map((d) => `<div class="gh">${d}</div>`).join('');
    for (let p = 1; p <= 7; p++) {
        h += `<div class="gp">${p}<small>${TIMES[p-1]}</small></div>`;
        for (let d = 0; d < 5; d++) {
            const busy = BUSY[d + ':' + p];
            const isToday = d === 0;
            let cls = 'gc' + (isToday ? ' today' : '');
            let inner = busy ? `<span class="cls">${busy}</span>` : '';
            if (isToday && added === p) { cls += ' added'; inner = '<span class="w">انتظار</span>'; }
            else if (picking && isToday && !busy) cls += ' pick';
            h += `<div class="${cls}" data-day="${d}" data-p="${p}"></div>`.replace('></div>', `>${inner}</div>`);
        }
    }
    return h;
}

function sheetHtml(opt) {
    if (opt === 'b') {
        return `
            <div class="sheet-t">حصة انتظار — اليوم الأحد</div>
            <div class="sheet-s">اختر الحصة التي أُسند إليك فيها انتظار</div>
            <select class="wsel" id="wsel">
                <option value=""></option>
                ${[1,2,3,4,5,6,7].map((p) => `<option value="${p}" ${BUSY['0:'+p] ? 'disabled' : ''}>الحصة ${p} — ${TIMES[p-1]}${BUSY['0:'+p] ? ' (مشغولة)' : ''}</option>`).join('')}
            </select>`;
    }
    return `
        <div class="sheet-t">حصة انتظار — اليوم الأحد</div>
        <div class="sheet-s">اختر الحصة التي أُسند إليك فيها انتظار</div>
        <div class="plist">
            ${[1,2,3,4,5,6,7].map((p) => {
                const busy = BUSY['0:' + p];
                return `<button class="prow" data-p="${p}" ${busy ? 'disabled' : ''}>
                            <span class="n">${p}</span>
                            <span class="tx">
                                <span class="t">${TIMES[p-1]}</span>
                                <span class="s">${busy ? 'عندك ' + busy : 'فارغة'}</span>
                            </span>
                        </button>`;
            }).join('')}
        </div>`;
}

let opt = 'a';
const head = document.getElementById('head');
const grid = document.getElementById('grid');
const sheet = document.getElementById('sheet');
const back = document.getElementById('back');

function paint() {
    document.getElementById('cap-nm').textContent = CAPS[opt][0];
    document.getElementById('cap-ds').textContent = CAPS[opt][1];
    document.getElementById('cap-tg').textContent = CAPS[opt][2];
    head.innerHTML = headHtml(opt);
    grid.innerHTML = gridHtml();
}

function closeSheet() { sheet.classList.remove('on'); back.classList.remove('on'); }

document.addEventListener('click', (e) => {
    const sw = e.target.closest('.pv-bar button');
    if (sw) {
        document.querySelectorAll('.pv-bar button').forEach((x) => x.classList.toggle('on', x === sw));
        opt = sw.dataset.o; added = null; picking = false; closeSheet(); paint(); return;
    }
    if (e.target.closest('#waitbtn')) {
        added = null;
        if (opt === 'c') { picking = true; paint(); return; }
        sheet.innerHTML = sheetHtml(opt);
        sheet.classList.add('on'); back.classList.add('on');
        return;
    }
    if (e.target.closest('#back')) return closeSheet();
    const row = e.target.closest('.prow');
    if (row && !row.disabled) { added = Number(row.dataset.p); closeSheet(); paint(); return; }
    const cell = e.target.closest('.gc.pick');
    if (cell) { added = Number(cell.dataset.p); picking = false; paint(); return; }
});
document.addEventListener('change', (e) => {
    if (e.target.id === 'wsel' && e.target.value) { added = Number(e.target.value); closeSheet(); paint(); }
});

paint();
</script>
</body>
</html>
