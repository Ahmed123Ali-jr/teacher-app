<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نافذة خيارات الطباعة — الجديدة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{ --royal:#0F2C5C; --gold:#C9A961; --ink:#101828; --muted:#667085; --line:#E7EAF0; --soft:#F5F6F9; }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:#E9EBEF;color:var(--ink);}
    body{padding:18px 14px 40px;}
    .sheet{background:#fff;border-radius:20px;max-width:460px;margin:0 auto;box-shadow:0 12px 40px rgba(16,24,40,.16);overflow:hidden;}
    .sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);}
    .sheet-hd h2{margin:0;font-size:18px;font-weight:900;color:var(--royal);}
    .sheet-hd .x{width:32px;height:32px;border-radius:9px;border:0;background:var(--soft);font-size:18px;color:var(--muted);}
    .sheet-bd{padding:16px 18px;}
    .lbl{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 2px 8px;}
    .num{font-variant-numeric:tabular-nums;}
    /* type card */
    .opt{border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.15s;}
    .opt-hd{display:flex;align-items:flex-start;gap:12px;}
    .opt .ic{font-size:22px;flex-shrink:0;line-height:1.3;}
    .opt .tt{font-weight:800;font-size:15px;}
    .opt .dd{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5;}
    .opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;margin-inline-start:auto;display:grid;place-items:center;margin-top:2px;}
    .opt.on{border-color:var(--royal);background:color-mix(in srgb,var(--royal) 5%,#fff);}
    .opt.on .rd{border-color:var(--royal);} .opt.on .rd::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--royal);}
    /* sub options */
    .sub{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:none;}
    .opt.on .sub{display:block;}
    .segs{display:flex;gap:8px;}
    .seg{flex:1;min-height:42px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-family:inherit;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;}
    .seg.on{border-color:var(--royal);background:color-mix(in srgb,var(--royal) 7%,#fff);color:var(--royal);}
    .dates{display:none;gap:8px;margin-top:10px;}
    .dates.show{display:flex;}
    .dates .fld{flex:1;}
    .dates label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px;}
    .dates input{width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;font-family:inherit;font-size:13.5px;color:var(--ink);}
    .note{font-size:11.5px;color:var(--gold);font-weight:700;margin-top:8px;}
    .sheet-ft{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#FCFCFD;}
    .btn{flex:1;min-height:48px;border:0;border-radius:13px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;}
    .btn-primary{background:var(--royal);color:#fff;}
    .btn-ghost{background:transparent;color:var(--muted);flex:0 0 auto;padding:0 18px;}
    .hint{max-width:460px;margin:0 auto 12px;background:#0F2C5C;color:#fff;border-radius:12px;padding:10px 14px;font-size:12.5px;text-align:center;}
</style>
</head>
<body>
<div class="hint">جرّب: اضغط أي نوع لتظهر خياراته الفرعية · «فترة محددة» تُظهر خانات التاريخ</div>
<div class="sheet">
  <div class="sheet-hd"><h2>🖨️ طباعة السجل</h2><button class="x">×</button></div>
  <div class="sheet-bd" id="bd"></div>
  <div class="sheet-ft"><button class="btn btn-primary">معاينة وطباعة</button><button class="btn btn-ghost">إلغاء</button></div>
</div>

<script>
const TYPES = [
  { k:'attendance', ic:'✅', t:'سجل الحضور والغياب', d:'الحضور فقط — بدون خانات التقييم',
    sub:{ kind:'period' } },
  { k:'full', ic:'📋', t:'سجل بكامل الخانات (معبّأ)', d:'حضور + كل خانات التقييم بقيمها الفعلية',
    sub:{ kind:'period', rangeNote:'الفترة: جدول مستقل لكل يوم' } },
  { k:'blank', ic:'🗒️', t:'سجل مُفرّغ', d:'فاضٍ للتعبئة باليد',
    sub:{ kind:'blankScope' } },
  { k:'averages', ic:'📊', t:'متوسطات التقييم', d:'ملخّص متوسط كل تقييم لكل طالب — لفترة',
    sub:{ kind:'rangeOnly' } },
];

function isoDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
const today = new Date().toISOString().slice(0,10);

function subHtml(t){
  if (t.sub.kind==='period' || t.sub.kind==='rangeOnly') {
    const seg = t.sub.kind==='rangeOnly'
      ? '' // range only, no day/period toggle
      : `<div class="lbl">النطاق</div>
         <div class="segs"><button class="seg on" data-scope="today">اليوم</button><button class="seg" data-scope="range">فترة محددة</button></div>`;
    const datesShown = t.sub.kind==='rangeOnly' ? 'show' : '';
    return `${seg}
      <div class="dates ${datesShown}">
        <div class="fld"><label>من تاريخ</label><input type="date" value="${isoDaysAgo(13)}"></div>
        <div class="fld"><label>إلى تاريخ</label><input type="date" value="${today}"></div>
      </div>
      ${t.sub.rangeNote?`<div class="note" data-rangenote hidden>▸ ${t.sub.rangeNote}</div>`:''}`;
  }
  if (t.sub.kind==='blankScope') {
    return `<div class="lbl">نوع الأعمدة</div>
      <div class="segs"><button class="seg on" data-scope="att">حضور وغياب فقط</button><button class="seg" data-scope="all">كل الخانات</button></div>`;
  }
  return '';
}

const bd = document.getElementById('bd');
bd.innerHTML = `<div class="lbl">اختر نوع السجل</div>` + TYPES.map((t,i)=>`
  <div class="opt ${i===0?'on':''}" data-k="${t.k}">
    <div class="opt-hd">
      <div class="ic">${t.ic}</div>
      <div><div class="tt">${t.t}</div><div class="dd">${t.d}</div></div>
      <div class="rd"></div>
    </div>
    <div class="sub">${subHtml(t)}</div>
  </div>`).join('');

// select a type
bd.querySelectorAll('.opt').forEach(opt=>{
  opt.querySelector('.opt-hd').addEventListener('click',()=>{
    bd.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
    opt.classList.add('on');
  });
});
// day/period + scope toggles + reveal dates
bd.querySelectorAll('.segs').forEach(segs=>{
  segs.querySelectorAll('.seg').forEach(seg=>{
    seg.addEventListener('click',()=>{
      segs.querySelectorAll('.seg').forEach(s=>s.classList.remove('on'));
      seg.classList.add('on');
      const opt = seg.closest('.opt');
      const dates = opt.querySelector('.dates');
      const note = opt.querySelector('[data-rangenote]');
      const isRange = seg.dataset.scope==='range';
      if (dates && seg.dataset.scope!=='att' && seg.dataset.scope!=='all') {
        dates.classList.toggle('show', isRange);
        if (note) note.hidden = !isRange;
      }
    });
  });
});
</script>
</body>
</html>
