<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: مكان أنواع الأسئلة</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=9">
<link rel="stylesheet" href="css/views.css?v=D283">
<link rel="stylesheet" href="css/portfolio-theme.css?v=15">
<link rel="stylesheet" href="css/theme-white.css?v=20">
<link rel="stylesheet" href="css/theme-dark.css?v=32">

<style>
    /* ══ إطارُ المعاينة وحدَه — لا شيء منه يدخل التطبيق ══ */
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv-wrap { max-width: 480px; margin: 0 auto; padding: 0 14px 40px; }

    .pv-bar {
        position: sticky; top: 0; z-index: 30;
        background: var(--surface); border-bottom: 1.5px solid var(--border);
        padding: 10px 14px 12px; margin: 0 -14px 14px;
    }
    .pv-tabs { display: flex; gap: 8px; }
    .pv-tabs button {
        flex: 1 1 0; min-height: 46px; border-radius: 13px; cursor: pointer;
        font-family: inherit; font-size: 15px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface);
        color: var(--ink-primary);
    }
    .pv-tabs button.on {
        background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .pv-say {
        margin: 10px 2px 0; font-size: 12.5px; line-height: 1.85;
        font-weight: 500; color: var(--text-muted);
    }
    .pv-say b { color: var(--ink-primary); font-weight: var(--fw-bold); }
    .pv-reset {
        margin-top: 9px; min-height: 38px; width: 100%; border-radius: 11px;
        cursor: pointer; font-family: inherit; font-size: 12.5px;
        font-weight: var(--fw-bold); color: var(--ink-primary);
        background: transparent; border: 1.5px dashed var(--border-strong);
    }

    /* المسرحُ يقلّد لوح التطبيق: الرصيفُ لاصقٌ في قاعه لا في قاع النافذة. */
    .pv-stage {
        position: relative; background: var(--surface);
        border: 1.5px solid var(--border); border-radius: 18px;
        padding: 14px 12px 10px; min-height: 460px;
    }
    .pv-stage .qe-dock { position: static; margin-top: var(--space-4); }

    /* ── «أ» و«ج»: الأنواعُ لوحةً في مكان الفراغ ──
       شكلُ الأزرار هو شكلُ ورقة الأنواع نفسِها، فما يراه هنا هو ما
       اعتاده هناك — لا شكلٌ سادسٌ يتعلّمه. */
    .tp-panel { padding: 4px 0 2px; }
    .tp-panel .h {
        font-size: 12px; font-weight: var(--fw-bold);
        color: var(--text-muted); margin: 2px 4px 10px;
    }
    .tp-panel button {
        display: block; width: 100%; text-align: start; cursor: pointer;
        font-family: inherit; padding: 12px 14px; margin-bottom: 8px;
        border-radius: 13px; border: 1.5px solid var(--border);
        background: var(--surface);
    }
    .tp-panel button b {
        display: block; font-size: 14.5px; font-weight: var(--fw-bold);
        color: var(--ink-primary);
    }
    .tp-panel button small {
        display: block; font-size: 11.5px; font-weight: 500;
        line-height: 1.75; color: var(--text-muted); margin-top: 2px;
    }
    .tp-panel button.used { border-style: dashed; }

    /* ── «ب»: شريطُ رقاقاتٍ تحت آخر قسم ── */
    .tp-strip { margin-top: 14px; }
    .tp-strip .h {
        font-size: 11.5px; font-weight: var(--fw-bold);
        color: var(--text-muted); margin: 0 4px 8px;
    }
    .tp-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .tp-chips button {
        flex: 1 1 auto; min-height: 42px; padding: 0 14px;
        border-radius: 12px; cursor: pointer; font-family: inherit;
        font-size: 13px; font-weight: var(--fw-bold);
        color: var(--ink-primary); background: var(--surface);
        border: 1.5px solid var(--border-strong);
    }
    .tp-chips button.used {
        border-style: dashed;
        background: color-mix(in srgb, var(--beige) 30%, var(--surface));
    }

    /* ── «ج»: زرُّ «تم» ينهي القسم ── */
    .tp-done {
        display: block; width: 100%; min-height: 52px; border: 0;
        border-radius: 15px; cursor: pointer; font-family: inherit;
        font-size: 15px; font-weight: var(--fw-bold); color: #fff;
        background: var(--primary); margin-top: var(--space-4);
        box-shadow: 0 5px 15px color-mix(in srgb, var(--primary) 30%, transparent);
    }
    /* ── «د»: القسمُ المنتهي يُطوى إلى رأسه البتروليّ ──
       ولا لونَ جديد: رأسُ القسم في التطبيق بترولـيٌّ أصلاً. الطيُّ إخفاءُ
       جسدِه لا صبغُ رأسه. */
    .tp-fold .qe-items, .tp-fold .qe-add-in { display: none; }
    .tp-fold { cursor: pointer; }
    .tp-fold .qe-sec-head::before {
        content: "▾"; align-self: center; font-size: 12px; opacity: .8;
        margin-inline-end: 2px;
    }
    .pv-hide { display: none !important; }
</style>
</head>
<body>

<div class="pv-wrap">
    <div class="pv-bar">
        <div class="pv-tabs">
            <button type="button" data-m="a">أ</button>
            <button type="button" data-m="b">ب</button>
            <button type="button" data-m="c">ج</button>
            <button type="button" data-m="d">د</button>
        </div>
        <p class="pv-say" id="say"></p>
        <button type="button" class="pv-reset" id="reset">ابدأ من جديد</button>
    </div>

    <div class="pv-stage" id="stage"></div>
</div>

<script src="js/question-editor.js?v=8"></script>
<script>
(function () {
    'use strict';

    /* المحرّرُ حقيقيٌّ لا مقلَّد: نفسُ `editorHtml` ونفسُ `bind` اللذين
       يعملان في التطبيق. والفرقُ بين الأشكال الثلاثة موضعُ أزرار الأنواع
       لا غير — وكلُّها تحمل `data-qe-add` فيلتقطها الرابطُ نفسُه.
       فما يجرّبه هنا هو ما سيعمل هناك، لا وعدٌ به. */
    const QE = window.QuestionEditor;
    const stage = document.getElementById('stage');
    const say   = document.getElementById('say');

    const SAY = {
        a: '<b>أ — الأنواعُ حالةً فارغة.</b> تدخل فتجدها أمامك. وبعد أوّل ' +
           'سؤالٍ يعود زرُّ «أضف سؤالاً» كما هو اليوم.',
        b: '<b>ب — شريطٌ دائمٌ تحت آخر قسم.</b> تكتب، تنزل، تضغط النوعَ ' +
           'التالي. بلا زرٍّ وبلا ورقةٍ منبثقة، والاختبارُ كلُّه أمامك.',
        c: '<b>ج — نوعٌ واحدٌ في الشاشة.</b> تختار، تكتب، تضغط «تم»، ثمّ ' +
           'تختار الذي بعده. وبقيّةُ الورقة محجوبةٌ أثناء الكتابة.',
        d: '<b>د — لا شيء أوّلَ ما تدخل.</b> تضغط «أضف سؤالاً» فتظهر ' +
           'القائمة، تكتب، تضغط «تم» — فيُطوى ما أنهيتَه إلى شريطٍ ' +
           'بتروليٍّ باسمه فوق ما بعده. <b>واضغط الشريطَ ليُفتح ثانية.</b> ' +
           'ولا سلّةَ حذفٍ في المطويّ — تعود حين تفتحه.'
    };

    const S = {
        a: { title: 'اختبار الفصل الأول', qs: [] },
        b: { title: 'اختبار الفصل الأول', qs: [] },
        c: { title: 'اختبار الفصل الأول', qs: [], open: null },
        d: { title: 'اختبار الفصل الأول', qs: [], open: null, picking: false }
    };
    let mode = 'a';

    const kindOf = (q) => (q && q.type) || 'essay';
    const leadOf = (k) => String(QE.SECTION_TITLE[k] || QE.SECTION_TITLE.essay)
        .replace(/\s*:\s*$/, '');

    /** لوحةُ الأنواع الكاملة — بشكل ورقة الأنواع نفسِه. */
    function panelHtml(qs, head) {
        const used = new Set(qs.map(kindOf));
        return '<div class="tp-panel"><div class="h">' + head + '</div>'
            + QE.TYPES.map((t) =>
                '<button type="button" class="' + (used.has(t.k) ? 'used' : '') + '"'
                + ' data-qe-add="' + t.k + '"><b>' + t.n + '</b><small>'
                + (used.has(t.k) ? 'مفتوحٌ أصلاً — تُضاف فقرةٌ إليه' : leadOf(t.k))
                + '</small></button>').join('')
            + '</div>';
    }

    /** شريطُ الرقاقات — الأنواعُ الخمسةُ في سطرين. */
    function stripHtml(qs) {
        const used = new Set(qs.map(kindOf));
        return '<div class="tp-strip"><div class="h">أضِف سؤالاً:</div>'
            + '<div class="tp-chips">'
            + QE.TYPES.map((t) =>
                '<button type="button" class="' + (used.has(t.k) ? 'used' : '') + '"'
                + ' data-qe-add="' + t.k + '">' + (used.has(t.k) ? '+ ' : '')
                + t.n + '</button>').join('')
            + '</div></div>';
    }

    function render() {
        const s = S[mode];
        stage.innerHTML =
            QE.editorHtml(s.title, s.qs, { points: true })
            + '<div class="qe-dock">' + QE.addBtnHtml()
            + '<div class="wizard-footer">'
            + '<button class="btn btn-secondary" type="button">حفظ</button>'
            + '<button class="btn btn-primary" type="button">الطباعة ←</button>'
            + '</div></div>';

        const secs = stage.querySelector('.qe-secs');
        const dock = stage.querySelector('.qe-addsec');

        if (mode === 'a') {
            /* الفراغُ وحدَه يُستبدل. وما إن يوجد قسمٌ حتى تعود الشاشةُ
               إلى حالها اليوم — وهذا كلُّ الفرق. */
            const empty = stage.querySelector('.qe-empty');
            if (empty) empty.outerHTML = panelHtml(s.qs, 'ابدأ بنوع السؤال:');
        }

        if (mode === 'b') {
            const empty = stage.querySelector('.qe-empty');
            if (empty) empty.remove();
            secs.insertAdjacentHTML('afterend', stripHtml(s.qs));
            dock.classList.add('pv-hide');          /* الشريطُ أغنى عنه */
        }

        if (mode === 'c') {
            dock.classList.add('pv-hide');
            const empty = stage.querySelector('.qe-empty');
            if (empty) empty.remove();
            if (s.open) {
                /* قسمٌ واحدٌ ظاهر، وما عداه محجوب. */
                stage.querySelectorAll('.qe-sec').forEach((el) => {
                    const del = el.querySelector('[data-qe-sec-del]');
                    const t = del && del.dataset.qeSecDel;
                    if (t !== s.open) el.classList.add('pv-hide');
                });
                secs.insertAdjacentHTML('afterend',
                    '<button type="button" class="tp-done" data-done>تم</button>');
            } else {
                stage.querySelectorAll('.qe-sec').forEach((el) => el.classList.add('pv-hide'));
                secs.insertAdjacentHTML('afterend',
                    panelHtml(s.qs, s.qs.length ? 'اختر النوع الذي بعده:' : 'ابدأ بنوع السؤال:'));
            }
        }

        if (mode === 'd') {
            const empty = stage.querySelector('.qe-empty');
            if (empty) empty.remove();

            /* كلُّ قسمٍ مطويٌّ إلّا المفتوح — ورأسُه يبقى ظاهراً دائماً،
               فالمعلّمُ يرى ما أنجزه ويعود إليه بضغطة. */
            stage.querySelectorAll('.qe-sec').forEach((el) => {
                const del = el.querySelector('[data-qe-sec-del]');
                const t = del && del.dataset.qeSecDel;
                el.dataset.tpType = t;
                if (t === s.open) return;
                el.classList.add('tp-fold');
                /* الشريطُ المطويُّ يقول نوعَه لا ترويسةَ طباعته: «السؤال
                   الأول: اختيار من متعدد». الترويسةُ الطويلةُ تنفع مفتوحاً
                   حيث يراجعها بعينه، ولا تنفع سطراً مطويّاً يُلمح لمحاً. */
                /* ولا حذفَ من شريطٍ مطويّ (شرطُه): حذفُ قسمٍ بفقراته ضغطةٌ
                   لا تُستدرك، فلا تُتاح إلّا وهو مفتوحٌ يرى ما يحذف. */
                const delEl = el.querySelector('[data-qe-sec-del]');
                if (delEl) delEl.classList.add('pv-hide');

                const bEl = el.querySelector('.qe-sec-head .tx b');
                const sEl = el.querySelector('.qe-sec-head .tx span');
                if (bEl) bEl.textContent =
                    bEl.textContent.split(':')[0].trim() + ': ' + QE.TYPE_LABELS[t];
                if (sEl) sEl.textContent = sEl.textContent.split('—').pop().trim();
            });

            if (s.open) {
                secs.insertAdjacentHTML('afterend',
                    '<button type="button" class="tp-done" data-done>تم</button>');
                dock.classList.add('pv-hide');
            } else if (s.picking) {
                secs.insertAdjacentHTML('afterend',
                    panelHtml(s.qs, s.qs.length ? 'اختر النوع الذي بعده:' : 'نوعُ السؤال:'));
                dock.classList.add('pv-hide');
            }
            /* وإلّا فلا شيء إلّا زرُّ «أضف سؤالاً» — وهذا حالُ الدخول. */
        }

        QE.bind(stage, s.qs, {
            points: true,
            rerender: render,
            onTitle: (v) => { s.title = v; }
        });
    }

    /* في «ج» يُلتقط النوعُ قبل أن يعمل الرابط، ليُفتح قسمُه وحدَه. */
    stage.addEventListener('click', (e) => {
        /* الشريطُ المطويُّ يُفتح بالضغط أيّاً كان موضعُ الإصبع منه —
           والسلّةُ فيه لا تعمل ولو وُصل إليها. وإخفاؤها وحدَه لا يكفي:
           `display:none` يمنع الإصبعَ ولا يمنع المعالج، فيبقى الحذفُ
           ممكناً من حيث لا يُرى. فالمنعُ هنا بالسلوك لا بالمظهر. */
        if (mode === 'd') {
            const fold = e.target.closest('.tp-fold');
            if (fold) {
                e.stopPropagation(); e.preventDefault();
                S.d.open = fold.dataset.tpType; S.d.picking = false;
                return render();
            }
        }
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.done !== undefined) {
            S[mode].open = null;
            if (mode === 'd') S.d.picking = false;
            return render();
        }
        if (b.dataset.qeOpen !== undefined && mode === 'd') {
            e.stopPropagation(); e.preventDefault();
            S.d.picking = true; return render();
        }
        if (mode === 'c' && b.dataset.qeAdd !== undefined) S.c.open = b.dataset.qeAdd;
        if (mode === 'd' && b.dataset.qeAdd !== undefined) {
            S.d.open = b.dataset.qeAdd; S.d.picking = false;
        }
    }, true);

    document.querySelectorAll('.pv-tabs button').forEach((b) => {
        b.addEventListener('click', () => {
            mode = b.dataset.m;
            document.querySelectorAll('.pv-tabs button')
                .forEach((x) => x.classList.toggle('on', x.dataset.m === mode));
            say.innerHTML = SAY[mode];
            render();
            window.scrollTo({ top: 0 });
        });
    });

    document.getElementById('reset').addEventListener('click', () => {
        S[mode].qs.length = 0;
        if (mode === 'c') S.c.open = null;
        if (mode === 'd') { S.d.open = null; S.d.picking = false; }
        render();
    });

    document.querySelector('.pv-tabs button').classList.add('on');
    say.innerHTML = SAY.a;
    render();
})();
</script>
</body>
</html>
