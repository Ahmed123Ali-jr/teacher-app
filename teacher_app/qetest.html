<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تاريخ الاختبار</title>
<link rel="stylesheet" href="/css/main.css?k=7"><link rel="stylesheet" href="/css/components.css?k=7">
<link rel="stylesheet" href="/css/views.css?k=7"><link rel="stylesheet" href="/css/portfolio-theme.css?k=7">
<link rel="stylesheet" href="/css/theme-white.css?k=7"><link rel="stylesheet" href="/css/fonts.css?k=7">
<style>body{margin:0;background:var(--bg)}#w{padding:12px 14px}
pre{font-size:12px;white-space:pre-wrap;background:#fff;padding:10px;border-radius:10px}</style></head>
<body><div id="w"></div><pre id="out"></pre>
<script src="/js/question-editor.js?k=7"></script>
<script src="/js/pdf-core.js?k=7"></script>
<script src="/js/print-exam.js?k=7"></script>
<script>
var settings={include_school:true,include_teacher:true,include_date:true,include_name:true,
              include_grade:true,include_instructions:true,include_answers:false,exam_date:''};
function checkbox(n,l,c){return '<label class="cb-row"><input type="checkbox" name="'+n+'" '+(c?'checked':'')+'><span>'+l+'</span></label>';}
function dateFieldHtml(s){ if(!s.include_date) return '';
 return '<div class="cb-sub"><input class="input" id="exam-date" value="'+(s.exam_date||'')+'" placeholder="اكتب التاريخ… أو اتركه فراغاً ليُكتب بالقلم"><button type="button" class="btn btn-secondary btn-sm" id="exam-date-today">اليوم</button></div>';}
function draw(){
 document.getElementById('w').innerHTML='<div class="card"><div class="checkbox-list">'
  +checkbox('include_school','ترويسة المدرسة',settings.include_school)
  +checkbox('include_teacher','اسم المعلم',settings.include_teacher)
  +checkbox('include_date','التاريخ',settings.include_date)
  +dateFieldHtml(settings)
  +checkbox('include_name','خانة اسم الطالب',settings.include_name)
  +checkbox('include_grade','الدرجة الكلية',settings.include_grade)
  +'</div></div>';
 document.querySelectorAll('.checkbox-list input[type="checkbox"]').forEach(function(cb){
   cb.addEventListener('change',function(){settings[cb.name]=cb.checked; if(cb.name==='include_date') draw();});});
 var inp=document.getElementById('exam-date');
 if(inp){inp.addEventListener('input',function(){settings.exam_date=inp.value;});
  document.getElementById('exam-date-today').addEventListener('click',function(){
   inp.value=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date()); settings.exam_date=inp.value; inp.focus();});}
}
draw();
window.peek=async function(){ var cap='';
 var real=PdfCore.renderPdf; PdfCore.renderPdf=async function(p){cap=p.map(x=>x.innerHTML).join('');throw new Error('وقف');};
 try{await PrintExam.savePdf({exam:{title:'اختبار',settings:settings,questions:[{type:'essay',text:'س',options:[],answer:'',points:1}]},cls:{subject:'العلوم'},teacher:{name:'م'}});}catch(e){}
 PdfCore.renderPdf=real;
 var m=cap.match(/التاريخ:[^<]*/); document.getElementById('out').textContent = m?m[0]:'لا تاريخ على الورقة';};
</script></body></html>
