<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>شريط التحضير — النسخة النهائية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#F4F1EA; --surface:#fff; --text:#101828; --muted:#667085; --border:#E7E3D8;
        --royal:#0F2C5C; --present:#10B981; --absent:#EF4444; --late:#F59E0B; --excused:#2563EB;
        --cls:#12A150;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{min-height:100vh;padding:12px 13px 60px;}
    .num{font-variant-numeric:tabular-nums;}
    .hint{position:fixed;top:8px;left:8px;z-index:60;background:rgba(17,17,17,.85);color:#fff;border-radius:99px;padding:6px 13px;font-size:11px;max-width:70vw;transition:opacity .5s;}
    .hint.gone{opacity:0;}

    .hero{position:relative;overflow:hidden;border-radius:21px;padding:21px;color:#fff;margin-bottom:13px;
      background:linear-gradient(135deg, color-mix(in srgb,var(--cls) 80%,#000) 0%, var(--cls) 45%, color-mix(in srgb,var(--cls) 85%,#fff) 100%);
      box-shadow:0 8px 20px color-mix(in srgb,var(--cls) 25%,transparent);}
    .hero .b1{position:absolute;border-radius:50%;background:rgba(255,255,255,.06);width:120px;height:120px;left:-24px;top:-24px;}
    .hero .b2{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);width:90px;height:90px;left:40px;bottom:-44px;}
    .hero-head{display:flex;align-items:center;gap:12px;position:relative;}
    .hero-ic{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex-shrink:0;}
    .hero-tt{flex:1;min-width:0;}
    .hero-t1{font-weight:900;font-size:21px;}
    .hero-t2{font-size:11.5px;opacity:.85;margin-top:2px;}
    .hero-print{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);border:0;font-size:17px;display:grid;place-items:center;flex-shrink:0;}
    /* سهم الرجوع برا المربع — نفس صفحة الفصل */
    .page-bar{display:flex;align-items:center;margin-bottom:11px;}
    .btn-back-box{width:42px;height:42px;border-radius:13px;background:#fff;border:1.5px solid var(--border);color:var(--royal);font-size:19px;display:grid;place-items:center;text-decoration:none;}
    .hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;}
    .hs{flex:1;background:rgba(255,255,255,.13);border-radius:13px;padding:9px 4px;text-align:center;}
    .hs b{display:block;font-size:19px;font-weight:900;}
    .hs span{font-size:11px;opacity:.85;}

    /* البحث القصير + إضافة طالب */
    .toolrow{display:flex;gap:8px;margin-bottom:12px;}
    .search{flex:1;min-width:0;min-height:44px;border:1.5px solid var(--border);border-radius:13px;background:#fff;padding:0 13px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;}
    .btn-add{min-height:44px;border-radius:13px;border:1.5px solid var(--cls);background:var(--cls);color:#fff;font-family:inherit;font-weight:800;font-size:13.5px;padding:0 15px;white-space:nowrap;flex-shrink:0;}

    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;min-height:40px;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:0 15px;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;}
    .chip.on{border-color:var(--cls);background:color-mix(in srgb,var(--cls) 8%,#fff);color:color-mix(in srgb,var(--cls) 70%,#000);}

    /* شريط التحضير: الزر يمين، الأسماء يسار فقط عند وجود ناقصين بعد بدء التحضير */
    .markbar{margin-top:10px;}
    .markbar[hidden]{display:none;}
    .mk-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px;}
    .mk-row button{min-height:38px;border-radius:11px;border:0;background:var(--present);color:#fff;font-family:inherit;font-weight:800;font-size:13.5px;padding:0 15px;white-space:nowrap;flex-shrink:0;}
    .mk-row button.undo{background:var(--absent);}
    .mk-row .names{flex:1;min-width:0;text-align:left;font-size:12.5px;font-weight:700;color:var(--text);line-height:1.55;padding-left:7px;}
    .mk-row .names:empty{display:none;}
    .mk-row .names em{font-style:normal;color:var(--absent);font-weight:800;}

    .cards{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
    .card{position:relative;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 17px 12px 14px;overflow:hidden;}
    .card::before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:var(--stripe,#D8DEE9);}
    .av{width:38px;height:38px;border-radius:11px;background:#F2F4F7;color:var(--muted);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;}
    .info{flex:1;min-width:0;}
    .nm{font-weight:800;font-size:15px;line-height:1.4;}
    .stt{font-size:12px;font-weight:700;margin-top:2px;}
    .ab{display:flex;gap:5px;flex-shrink:0;}
    .ab b{width:33px;height:33px;border:1.5px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:400;}
    .ab b.on{color:#fff;border-color:transparent;}
    .st-sq{display:flex;gap:5px;flex-shrink:0;}
    .st-sq b{width:33px;height:33px;border:1.5px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:14px;color:#D0D5DD;}
</style>
</head>
<body>
<div class="hint">جرّب: حضّر طالباً وشوف الشريط — الطباعة صارت فوق في البطاقة</div>
<div class="screen" id="sc"></div>

<script>
const NAMES = ['إبراهيم حمد القحطاني','بندر عبدالله الغامدي','تركي فهد الشهري','ثامر ناصر العتيبي','جابر سعد الدوسري'];
const ATT = { present:{i:'✓',c:'var(--present)',l:'حاضر'}, absent:{i:'✕',c:'var(--absent)',l:'غائب'},
              late:{i:'⏰',c:'var(--late)',l:'متأخر'}, excused:{i:'📝',c:'var(--excused)',l:'مستأذن'} };
const short = n => n.split(' ').slice(0,2).join(' ');
const AR = s => String(s).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

const sc = document.getElementById('sc');
sc.innerHTML = `
  <div class="page-bar"><a class="btn-back-box" href="#">→</a></div>
  <div class="hero"><div class="b1"></div><div class="b2"></div>
    <div class="hero-head"><div class="hero-ic">👥</div>
      <div class="hero-tt"><div class="hero-t1">سجل متابعة الطلاب</div><div class="hero-t2">التحضير والغياب والمشاركة</div></div>
      <button class="hero-print">🖨️</button></div>
    <div class="hero-stats">
      <div class="hs"><b class="num">٥</b><span>طالب</span></div>
      <div class="hs"><b class="num" data-k="p">٠</b><span>حاضر</span></div>
      <div class="hs"><b class="num" data-k="a">٠</b><span>غائب</span></div>
      <div class="hs"><b class="num" data-k="pct">—</b><span>الحضور</span></div>
    </div></div>
  <div class="toolrow">
    <div class="search">🔍 بحث باسم الطالب…</div>
    <button class="btn-add">+ إضافة طالب</button>
  </div>
  <div class="chips"><div class="chip on" data-col="att">الحضور</div><div class="chip">المشاركة</div>
    <div class="chip">الواجبات</div><div class="chip">📝 الملاحظات</div>
    <div class="chip" style="border-style:dashed">＋</div><div class="chip">⚙️ تعديل</div></div>
  <div class="markbar" data-mark>
    <div class="mk-row"><button data-mk>✓ تحضير الكل</button><div class="names" data-miss></div></div>
  </div>
  <div class="cards" data-cards></div>`;

let state = NAMES.map(()=>'');

function paint(attCol=true){
  sc.querySelector('[data-cards]').innerHTML = NAMES.map((n,idx)=>{
    const a = ATT[state[idx]];
    return `<div class="card" style="--stripe:${attCol&&a?a.c:'#D8DEE9'}">
      <div class="av">${n.trim()[0]}</div>
      <div class="info"><div class="nm">${n}</div>
        <div class="stt" style="color:${attCol&&a?a.c:'var(--muted)'}">${attCol?(a?a.l:'بلا تحضير'):'المشاركة'}</div></div>
      ${attCol
        ? `<div class="ab">${Object.entries(ATT).map(([k,x])=>`<b data-s="${k}" data-i="${idx}" class="${state[idx]===k?'on':''}" style="${state[idx]===k?`background:${x.c}`:''}">${x.i}</b>`).join('')}</div>`
        : `<div class="st-sq"><b>★</b><b>★</b><b>★</b></div>`}
    </div>`;}).join('');

  const missing = NAMES.filter((_,i)=>!state[i]);
  const marked  = state.filter(Boolean).length;
  const done    = missing.length===0;
  const mk = sc.querySelector('[data-mk]'), miss = sc.querySelector('[data-miss]');
  mk.classList.toggle('undo', done);
  mk.textContent = done ? '✕ إلغاء تحضير الكل' : '✓ تحضير الكل';
  /* الأسماء تظهر فقط لو بدأ التحضير وبقي أحد */
  miss.innerHTML = (marked>0 && !done) ? '<em>لم يتم تحضير :</em> ' + missing.map(short).join(' · ') : '';

  const p = state.filter(s=>s==='present'||s==='late').length;
  const ab = state.filter(s=>s==='absent').length;
  sc.querySelector('[data-k="p"]').textContent = AR(p);
  sc.querySelector('[data-k="a"]').textContent = AR(ab);
  sc.querySelector('[data-k="pct"]').textContent = marked ? AR(Math.round(p/NAMES.length*100))+'٪' : '—';
}

sc.addEventListener('click', e=>{
  const sq = e.target.closest('[data-s]');
  if(sq){ const i=+sq.dataset.i; state[i] = state[i]===sq.dataset.s ? '' : sq.dataset.s; paint(); return; }
  if(e.target.closest('[data-mk]')){
    const done = state.every(Boolean);
    state = NAMES.map((_,i)=> done ? '' : (state[i] || 'present'));
    paint(); return;
  }
  const ch = e.target.closest('.chip');
  if(ch){
    sc.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===ch));
    const isAtt = ch.dataset.col==='att';
    sc.querySelector('[data-mark]').hidden = !isAtt;
    paint(isAtt);
  }
});
paint();
setTimeout(()=>document.querySelector('.hint').classList.add('gone'),4000);
</script>
</body>
</html>
