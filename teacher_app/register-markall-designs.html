<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>زر تحضير الكل — يظهر مع خانة الحضور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{
        --bg:#F4F1EA; --surface:#fff; --text:#101828; --muted:#667085; --border:#E7E3D8;
        --royal:#0F2C5C; --present:#10B981; --absent:#EF4444; --late:#F59E0B; --excused:#2563EB;
        --cls:#12A150;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:12px 13px 170px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .hint{position:fixed;top:8px;left:8px;z-index:60;background:rgba(17,17,17,.85);color:#fff;border-radius:99px;padding:5px 13px;font-size:11px;transition:opacity .5s;}
    .hint.gone{opacity:0;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}

    /* البطاقة الملوّنة */
    .hero{position:relative;overflow:hidden;border-radius:21px;padding:21px;color:#fff;margin-bottom:13px;
      background:linear-gradient(135deg, color-mix(in srgb,var(--cls) 80%,#000) 0%, var(--cls) 45%, color-mix(in srgb,var(--cls) 85%,#fff) 100%);
      box-shadow:0 8px 20px color-mix(in srgb,var(--cls) 25%,transparent);}
    .hero .b1{position:absolute;border-radius:50%;background:rgba(255,255,255,.06);width:120px;height:120px;left:-24px;top:-24px;}
    .hero .b2{position:absolute;border-radius:50%;background:rgba(255,255,255,.05);width:90px;height:90px;left:40px;bottom:-44px;}
    .hero-head{display:flex;align-items:center;gap:12px;position:relative;}
    .hero-ic{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:24px;flex-shrink:0;}
    .hero-tt{flex:1;min-width:0;}
    .hero-t1{font-weight:900;font-size:21px;}
    .hero-t2{font-size:11.5px;opacity:.85;margin-top:2px;}
    .hero-back{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);border:0;color:#fff;font-size:18px;display:grid;place-items:center;flex-shrink:0;}
    .hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;}
    .hs{flex:1;background:rgba(255,255,255,.13);border-radius:13px;padding:9px 4px;text-align:center;}
    .hs b{display:block;font-size:19px;font-weight:900;}
    .hs span{font-size:11px;opacity:.85;}

    .search{flex:1;min-height:44px;border:1.5px solid var(--border);border-radius:13px;background:#fff;padding:0 14px;font-size:14px;color:var(--muted);display:flex;align-items:center;}
    .btn{min-height:44px;border-radius:13px;font-family:inherit;font-weight:800;font-size:14px;border:1.5px solid var(--border);background:#fff;color:var(--muted);padding:0 15px;white-space:nowrap;}
    .btn-primary{background:var(--royal);color:#fff;border-color:var(--royal);}
    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
    .chips::-webkit-scrollbar{display:none;}
    .chip{flex-shrink:0;min-height:40px;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:0 15px;font-size:13.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;}
    .chip.on{border-color:var(--cls);background:color-mix(in srgb,var(--cls) 8%,#fff);color:color-mix(in srgb,var(--cls) 70%,#000);}

    /* ===== أشكال زر التحضير ===== */
    .markbar{margin-top:10px;}
    .markbar[hidden]{display:none;}
    /* أ: شريط أخضر عريض */
    .mk-wide{width:100%;min-height:46px;border-radius:13px;border:1.5px solid color-mix(in srgb,var(--present) 40%,#fff);
        background:color-mix(in srgb,var(--present) 8%,#fff);color:var(--present);font-family:inherit;font-weight:800;font-size:14.5px;
        display:flex;align-items:center;justify-content:center;gap:7px;}
    .mk-wide.undo{border-color:color-mix(in srgb,var(--absent) 35%,#fff);background:color-mix(in srgb,var(--absent) 6%,#fff);color:var(--absent);}
    /* ب: شريط بإحصائية + زر */
    .mk-row{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px 8px 8px 14px;}
    .mk-row .txt{flex:1;font-size:12.5px;font-weight:700;color:var(--muted);}
    .mk-row .txt b{color:var(--text);}
    .mk-row button{min-height:38px;border-radius:11px;border:0;background:var(--present);color:#fff;font-family:inherit;font-weight:800;font-size:13.5px;padding:0 15px;}
    /* هـ/و: الزر يمين والمعلومة يسار */
    .mk-row.rev{flex-direction:row-reverse;padding:8px 14px 8px 8px;}
    .mk-row.rev .txt{text-align:left;}
    .mk-row .txt.names{font-size:12.5px;line-height:1.5;}
    .mk-row .txt.names b{color:var(--absent);font-weight:800;}
    .mk-row.done{border-color:color-mix(in srgb,var(--present) 35%,#fff);background:color-mix(in srgb,var(--present) 6%,#fff);}
    .mk-row.done .txt{color:var(--present);}
    .mk-row button.ghost{background:#fff;border:1.5px solid var(--border);color:var(--muted);}
    .states{display:flex;gap:6px;margin:0 0 10px;}
    .states button{flex:1;min-height:32px;border-radius:9px;border:1.5px solid var(--border);background:#fff;color:var(--muted);font-family:inherit;font-size:11.5px;font-weight:700;}
    .states button.on{background:var(--royal);color:#fff;border-color:var(--royal);}
    .states-lbl{font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;}
    /* ج: زر عائم */
    .mk-fab{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);z-index:40;min-height:48px;border-radius:99px;border:0;
        background:var(--present);color:#fff;font-family:inherit;font-weight:800;font-size:14.5px;padding:0 24px;
        box-shadow:0 8px 22px rgba(16,185,129,.4);display:flex;align-items:center;gap:7px;}
    /* د: مدمج بين الخانات (حبّة خضراء آخر الشريط) */
    .chip-mark{flex-shrink:0;min-height:40px;border:1.5px solid var(--present);background:var(--present);color:#fff;border-radius:12px;padding:0 15px;font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:5px;}

    .cards{display:flex;flex-direction:column;gap:9px;margin-top:12px;}
    .card{position:relative;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px 17px 12px 14px;overflow:hidden;}
    .card::before{content:"";position:absolute;top:0;bottom:0;right:0;width:5px;background:var(--stripe,#D8DEE9);}
    .av{width:38px;height:38px;border-radius:11px;background:#F2F4F7;color:var(--muted);display:grid;place-items:center;font-weight:800;font-size:16px;flex-shrink:0;}
    .info{flex:1;min-width:0;}
    .nm{font-weight:800;font-size:15px;line-height:1.4;}
    .stt{font-size:12px;font-weight:700;margin-top:2px;}
    .ab{display:flex;gap:5px;flex-shrink:0;}
    .ab b{width:33px;height:33px;border:1.5px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:400;}
    .ab b.on{color:#fff;border-color:transparent;}
    .st-sq{display:flex;gap:5px;flex-shrink:0;}
    .st-sq b{width:33px;height:33px;border:1.5px solid var(--border);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:14px;color:#D0D5DD;}
</style>
</head>
<body>
<div class="hint">اضغط الخانات فوق — زر التحضير يظهر مع «الحضور» فقط</div>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const ST = [
  {n:'إبراهيم حمد القحطاني', s:'present'},
  {n:'بندر عبدالله الغامدي', s:'absent'},
  {n:'تركي فهد الشهري',      s:'late'},
  {n:'ثامر ناصر العتيبي',    s:''},
];
const ATT = { present:{i:'✓',c:'var(--present)',l:'حاضر'}, absent:{i:'✕',c:'var(--absent)',l:'غائب'},
              late:{i:'⏰',c:'var(--late)',l:'متأخر'}, excused:{i:'📝',c:'var(--excused)',l:'مستأذن'} };

function cards(att){
  return `<div class="cards">${ST.map(s=>{const a=ATT[s.s];
    return `<div class="card" style="--stripe:${att&&a?a.c:'#D8DEE9'}">
      <div class="av">${s.n.trim()[0]}</div>
      <div class="info"><div class="nm">${s.n}</div>
        <div class="stt" style="color:${att&&a?a.c:'var(--muted)'}">${att?(a?a.l:'بلا تحضير'):'المشاركة'}</div></div>
      ${att
        ? `<div class="ab">${Object.entries(ATT).map(([k,x])=>`<b class="${s.s===k?'on':''}" style="${s.s===k?`background:${x.c}`:''}">${x.i}</b>`).join('')}</div>`
        : `<div class="st-sq"><b>★</b><b>★</b><b>★</b></div>`}
    </div>`;}).join('')}</div>`;
}
function hero(){
  return `<div class="hero"><div class="b1"></div><div class="b2"></div>
    <div class="hero-head"><div class="hero-ic">👥</div>
      <div class="hero-tt"><div class="hero-t1">سجل متابعة الطلاب</div><div class="hero-t2">التحضير والغياب والمشاركة</div></div>
      <button class="hero-back">→</button></div>
    <div class="hero-stats">
      <div class="hs"><b class="num">٤</b><span>طالب</span></div>
      <div class="hs"><b class="num">١</b><span>حاضر</span></div>
      <div class="hs"><b class="num">١</b><span>غائب</span></div>
      <div class="hs"><b class="num">٦٧٪</b><span>الحضور</span></div>
    </div></div>`;
}
const toolbar = `<div style="display:flex;gap:8px;margin-bottom:12px">
    <div class="search">🔍 بحث باسم الطالب…</div>
    <button class="btn btn-primary" style="width:46px;padding:0;display:grid;place-items:center;font-size:20px">＋</button>
    <button class="btn" style="width:46px;padding:0;display:grid;place-items:center">🖨️</button>
  </div>`;

function chips(extra=''){
  return `<div class="chips"><div class="chip on" data-col="att">الحضور</div><div class="chip" data-col="x">المشاركة</div>
    <div class="chip" data-col="x">الواجبات</div><div class="chip" data-col="x">📝 الملاحظات</div>
    <div class="chip" data-col="x" style="border-style:dashed">＋</div><div class="chip" data-col="x">⚙️ تعديل</div>${extra}</div>`;
}

const D = [];

/* أ — شريط عريض تحت الخانات */
D.push(['أ — شريط عريض', `${hero()}${toolbar}${chips()}
  <div class="markbar" data-mark><button class="mk-wide">✓ تحضير الكل</button></div>
  <div data-cards></div>`]);

/* ب — شريط بمعلومة + زر */
D.push(['ب — شريط بمعلومة', `${hero()}${toolbar}${chips()}
  <div class="markbar" data-mark>
    <div class="mk-row"><div class="txt">لم يُحضَّر بعد <b class="num">١</b> من <b class="num">٤</b></div>
    <button>✓ تحضير الكل</button></div></div>
  <div data-cards></div>`]);

/* ج — زر عائم */
D.push(['ج — زر عائم', `${hero()}${toolbar}${chips()}
  <div data-cards></div>
  <button class="mk-fab" data-mark>✓ تحضير الكل</button>`]);

/* د — حبّة ضمن شريط الخانات */
D.push(['د — ضمن الخانات', `${hero()}${toolbar}
  ${chips('<div class="chip-mark" data-mark>✓ تحضير الكل</div>')}
  <div data-cards></div>`]);

/* هـ — الزر يمين + المعلومة يسار بالأسماء (ذكي) */
D.push(['هـ — بالاسم', `${hero()}${toolbar}${chips()}
  <div class="markbar" data-mark>
    <div class="mk-row rev" data-smart><button data-mkbtn>✓ تحضير الكل</button><div class="txt" data-mktxt></div></div>
  </div>
  <div class="states-lbl" style="margin-top:12px">— جرّب الحالات —</div>
  <div class="states" data-states>
    <button data-st="0" class="on">بداية الحصة</button><button data-st="1">بقي ٢</button>
    <button data-st="2">بقي ١</button><button data-st="3">اكتمل</button>
  </div>
  <div data-cards></div>`]);

/* و — نفس هـ لكن الأسماء دائماً بدون عدّاد */
D.push(['و — الاسم دائماً', `${hero()}${toolbar}${chips()}
  <div class="markbar" data-mark>
    <div class="mk-row rev" data-smart data-always><button data-mkbtn>✓ تحضير الكل</button><div class="txt names" data-mktxt></div></div>
  </div>
  <div class="states-lbl" style="margin-top:12px">— جرّب الحالات —</div>
  <div class="states" data-states>
    <button data-st="0" class="on">بداية الحصة</button><button data-st="1">بقي ٢</button>
    <button data-st="2">بقي ١</button><button data-st="3">اكتمل</button>
  </div>
  <div data-cards></div>`]);

/* حالات الشريط الذكي */
const SMART = [
  {txt:'<span style="color:var(--muted)">لم يبدأ التحضير · <b class="num" style="color:var(--text)">٤</b> طلاب</span>',
   always:'<span style="color:var(--muted)">لم يبدأ التحضير</span>', btn:'✓ تحضير الكل', done:false},
  {txt:'<span style="color:var(--muted)">بقي <b class="num" style="color:var(--text)">٢</b> بلا تحضير</span>',
   always:'بقي <b>تركي فهد</b> و<b>ثامر ناصر</b>', btn:'✓ تحضير الباقي', done:false},
  {txt:'بقي <b>ثامر ناصر</b> بلا تحضير',
   always:'بقي <b>ثامر ناصر</b> بلا تحضير', btn:'✓ تحضير الباقي', done:false},
  {txt:'✓ اكتمل تحضير الفصل',
   always:'✓ اكتمل تحضير الفصل', btn:'↺ تراجع', done:true},
];
function paintSmart(sc, i){
  const row = sc.querySelector('[data-smart]'); if(!row) return;
  const s = SMART[i], always = row.hasAttribute('data-always');
  row.querySelector('[data-mktxt]').innerHTML = always ? s.always : s.txt;
  const b = row.querySelector('[data-mkbtn]');
  b.textContent = s.btn; b.classList.toggle('ghost', s.done);
  row.classList.toggle('done', s.done);
}

const root=document.getElementById('root'), sw=document.getElementById('switcher');
D.forEach(([name,html],i)=>{
  const sc=document.createElement('div'); sc.className='screen'+(i===0?' active':''); sc.innerHTML=html; root.appendChild(sc);
  const holder=sc.querySelector('[data-cards]'); if(holder) holder.innerHTML=cards(true);
  sc.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      sc.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===ch));
      const isAtt = ch.dataset.col==='att';
      sc.querySelectorAll('[data-mark]').forEach(m=>m.hidden=!isAtt);
      if(holder) holder.innerHTML=cards(isAtt);
    };
  });
  paintSmart(sc, 0);
  sc.querySelectorAll('[data-states] button').forEach(st=>{
    st.onclick=()=>{ sc.querySelectorAll('[data-states] button').forEach(x=>x.classList.toggle('on',x===st));
      paintSmart(sc, +st.dataset.st); };
  });
  const b=document.createElement('button'); b.textContent=name; if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
sw.querySelectorAll('button')[4].click();   // ابدأ من هـ
setTimeout(()=>document.querySelector('.hint').classList.add('gone'),3200);
</script>
</body>
</html>
