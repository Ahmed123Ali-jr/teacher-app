<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تصاميم طباعة السجل — بالعرض</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
    :root{ --royal:#0F2C5C; --royal2:#1A3A6E; --gold:#C9A961; --ink:#14181F; --muted:#5B6472; --line:#C9CDD6; --soft:#F3F4F7; }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:#DDDFE4;}
    .screen{display:none;padding:14px 10px 150px;}
    .screen.active{display:block;}
    /* landscape sheet — fixed readable width, horizontal-scroll like real paper */
    .sheet-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
    .sheet{background:#fff;width:820px;margin:0 auto;padding:20px 22px;box-shadow:0 4px 16px rgba(0,0,0,.2);border-radius:3px;}
    table{width:100%;border-collapse:collapse;}
    .num{font-variant-numeric:tabular-nums;}
    .hint{position:fixed;top:10px;left:10px;z-index:60;background:rgba(17,17,17,.85);color:#fff;border-radius:99px;padding:5px 14px;font-size:11px;transition:opacity .5s;}
    .hint.gone{opacity:0;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:50;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 16px;font-family:inherit;font-size:13px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
</style>
</head>
<body>
<div class="hint">تصاميم بالعرض — بدّل من الأسفل</div>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const NAMES = ['إبراهيم حمد القحطاني','بندر عبدالله الغامدي','تركي فهد الشهري','ثامر ناصر العتيبي','جابر سعيد الزهراني','حسن علي المالكي','خالد يوسف الدوسري','سعد مبارك العجمي','صالح ماجد الحربي','عبدالله راشد المطيري'];
const AR = n => String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const rows = (n=NAMES.length) => NAMES.slice(0,n);

const DESIGNS = [];

/* ============ أ — كلاسيكي أنيق ============ */
DESIGNS.push(['أ — كلاسيكي', `
<div class="sheet" style="font-family:Tajawal">
  <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2.5px solid #0F2C5C;padding-bottom:12px;">
    <div style="text-align:right"><div style="font-size:13px;color:#5B6472">المملكة العربية السعودية · وزارة التعليم</div>
      <div style="font-size:22px;font-weight:900;color:#0F2C5C;margin-top:2px">مجمع القيرة التعليمي</div></div>
    <div style="width:64px;height:64px;border:2px dashed #C9CDD6;border-radius:10px;display:grid;place-items:center;color:#9AA1AD;font-size:11px">الشعار</div>
  </div>
  <div style="display:flex;gap:26px;font-size:13.5px;color:#14181F;margin:12px 2px 16px;font-weight:700">
    <span>سجل متابعة الطلاب</span><span>الصف: الأول الثانوي / أ</span><span>المادة: اللغة الإنجليزية</span><span>المعلم: محمد عسيري</span><span>التاريخ: ٢٤ / ٧</span>
  </div>
  <table style="border:1.5px solid #0F2C5C;font-size:13.5px">
    <thead><tr style="background:#F3F4F7;color:#0F2C5C">
      <th style="border:1px solid #C9CDD6;padding:9px;width:34px">#</th>
      <th style="border:1px solid #C9CDD6;padding:9px;text-align:right">اسم الطالب</th>
      <th style="border:1px solid #C9CDD6;padding:9px;width:80px">الحضور</th>
      <th style="border:1px solid #C9CDD6;padding:9px;width:90px">المشاركة</th>
      <th style="border:1px solid #C9CDD6;padding:9px;width:90px">الواجبات</th>
      <th style="border:1px solid #C9CDD6;padding:9px;width:180px">ملاحظات</th>
    </tr></thead><tbody>
    ${rows().map((n,i)=>`<tr><td style="border:1px solid #C9CDD6;padding:8px;text-align:center" class="num">${AR(i+1)}</td>
      <td style="border:1px solid #C9CDD6;padding:8px;text-align:right;font-weight:700">${n}</td>
      <td style="border:1px solid #C9CDD6"></td><td style="border:1px solid #C9CDD6"></td><td style="border:1px solid #C9CDD6"></td><td style="border:1px solid #C9CDD6"></td></tr>`).join('')}
    </tbody>
  </table>
  <div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;color:#5B6472">
    <span>الرموز: ✓ حاضر · ✗ غائب · ت متأخر · ذ مستأذن</span>
    <span>توقيع المعلم: ____________</span>
  </div>
</div>`]);

/* ============ ب — رسمي بترويسة ذهبية ============ */
DESIGNS.push(['ب — رسمي ذهبي', `
<div class="sheet" style="font-family:Amiri,Tajawal;padding:0;overflow:hidden">
  <div style="background:#0F2C5C;color:#fff;padding:18px 26px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid #C9A961">
    <div style="width:58px;height:58px;border:2px solid #C9A961;border-radius:50%;display:grid;place-items:center;color:#C9A961;font-size:11px">الشعار</div>
    <div style="text-align:center"><div style="font-size:24px;font-weight:700">مجمع القيرة التعليمي</div>
      <div style="font-size:14px;color:#C9A961;margin-top:3px;font-weight:700">سجل متابعة الطلاب — الفصل الدراسي الأول</div></div>
    <div style="width:58px"></div>
  </div>
  <div style="padding:14px 26px 24px">
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-family:Tajawal">
      ${['الصف: الأول الثانوي / أ','المادة: اللغة الإنجليزية','المعلم: محمد عسيري','الأسبوع: ____','التاريخ: ____'].map(x=>`<span style="border:1px solid #C9A961;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#0F2C5C;background:#FBF8F0">${x}</span>`).join('')}
    </div>
    <table style="font-family:Tajawal;font-size:13.5px;border:2px solid #0F2C5C">
      <thead><tr style="background:#0F2C5C;color:#fff">
        <th style="padding:10px;width:34px">#</th><th style="padding:10px;text-align:right">اسم الطالب</th>
        <th style="padding:10px;width:80px">الحضور</th><th style="padding:10px;width:90px">المشاركة</th><th style="padding:10px;width:90px">الواجبات</th><th style="padding:10px;width:170px">ملاحظات</th>
      </tr></thead><tbody>
      ${rows().map((n,i)=>`<tr style="background:${i%2?'#FBF8F0':'#fff'}">
        <td style="border:1px solid #E4DFCF;padding:8px;text-align:center" class="num">${AR(i+1)}</td>
        <td style="border:1px solid #E4DFCF;padding:8px;text-align:right;font-weight:700">${n}</td>
        <td style="border:1px solid #E4DFCF"></td><td style="border:1px solid #E4DFCF"></td><td style="border:1px solid #E4DFCF"></td><td style="border:1px solid #E4DFCF"></td></tr>`).join('')}
      </tbody></table>
    <div style="display:flex;justify-content:space-between;margin-top:16px;font-size:12.5px;color:#5B6472;font-family:Tajawal">
      <span>✓ حاضر · ✗ غائب · ت متأخر · ذ مستأذن</span><span>اعتماد مدير المدرسة: ____________</span>
    </div>
  </div>
</div>`]);

/* ============ ج — شبكة أسبوعية (الأيام أعمدة) ============ */
DESIGNS.push(['ج — أسبوعي', `
<div class="sheet" style="font-family:Tajawal">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div style="font-size:20px;font-weight:900;color:#0F2C5C">سجل الحضور الأسبوعي</div>
    <div style="font-size:13px;color:#5B6472;font-weight:700">الأول الثانوي / أ · اللغة الإنجليزية · المعلم: محمد عسيري · الأسبوع: ____</div>
  </div>
  <table style="font-size:13px;border:1.5px solid #0F2C5C">
    <thead><tr style="background:#0F2C5C;color:#fff">
      <th style="padding:8px;width:30px">#</th><th style="padding:8px;text-align:right">الاسم</th>
      ${DAYS.map(d=>`<th style="padding:8px;width:74px;border-inline:1px solid #2B4778">${d}</th>`).join('')}
      <th style="padding:8px;width:56px;background:#123A6B">حاضر</th><th style="padding:8px;width:56px;background:#123A6B">غائب</th>
    </tr></thead><tbody>
    ${rows(9).map((n,i)=>`<tr style="background:${i%2?'#F5F7FA':'#fff'}">
      <td style="border:1px solid #C9CDD6;padding:7px;text-align:center" class="num">${AR(i+1)}</td>
      <td style="border:1px solid #C9CDD6;padding:7px;text-align:right;font-weight:700">${n}</td>
      ${DAYS.map(()=>`<td style="border:1px solid #C9CDD6"></td>`).join('')}
      <td style="border:1px solid #C9CDD6;background:#F0FAF4"></td><td style="border:1px solid #C9CDD6;background:#FDF1F1"></td></tr>`).join('')}
    </tbody></table>
  <div style="margin-top:12px;font-size:12.5px;color:#5B6472">ضع في كل يوم: ✓ حاضر · ✗ غائب · ت متأخر · ذ مستأذن</div>
</div>`]);

/* ============ د — عصري مبسّط ============ */
DESIGNS.push(['د — عصري', `
<div class="sheet" style="font-family:Tajawal">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;border-bottom:3px solid #C9A961;padding-bottom:10px;margin-bottom:4px">
    <div><div style="font-size:21px;font-weight:900;color:#0F2C5C">مجمع القيرة التعليمي</div>
      <div style="font-size:12.5px;color:#5B6472;margin-top:2px">سجل متابعة الطلاب</div></div>
    <div style="text-align:left;font-size:12.5px;color:#14181F;font-weight:700;line-height:1.9">
      الأول الثانوي / أ &nbsp;•&nbsp; اللغة الإنجليزية<br>المعلم: محمد عسيري &nbsp;•&nbsp; التاريخ: ٢٤ / ٧
    </div>
  </div>
  <table style="font-size:13.5px">
    <thead><tr style="color:#5B6472;font-size:12px">
      <th style="padding:10px 8px;text-align:center;width:34px">#</th><th style="padding:10px 8px;text-align:right">الاسم</th>
      <th style="padding:10px;width:80px">الحضور</th><th style="padding:10px;width:100px">المشاركة</th><th style="padding:10px;width:100px">الواجبات</th><th style="padding:10px;width:200px">ملاحظات</th>
    </tr></thead><tbody>
    ${rows().map((n,i)=>`<tr style="border-bottom:1px solid #ECEEF2">
      <td style="padding:11px 8px;text-align:center;color:#9AA1AD" class="num">${AR(i+1)}</td>
      <td style="padding:11px 8px;text-align:right;font-weight:700">${n}</td>
      <td style="padding:11px"></td><td style="padding:11px"></td><td style="padding:11px"></td><td style="padding:11px"></td></tr>`).join('')}
    </tbody></table>
  <div style="margin-top:16px;font-size:12px;color:#9AA1AD;text-align:center">✓ حاضر · ✗ غائب · ت متأخر · ذ مستأذن — تطبيق إنجاز المعلم</div>
</div>`]);

/* build */
const root=document.getElementById('root'), sw=document.getElementById('switcher');
DESIGNS.forEach(([name,html],i)=>{
    const sc=document.createElement('div');
    sc.className='screen'+(i===0?' active':'');
    sc.innerHTML=`<div class="sheet-wrap">${html}</div>`;
    root.appendChild(sc);
    const b=document.createElement('button');
    b.textContent=name; if(i===0)b.className='on';
    b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
    sw.appendChild(b);
});
setTimeout(()=>document.querySelector('.hint').classList.add('gone'),2600);
</script>
</body>
</html>
