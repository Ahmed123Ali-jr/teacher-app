<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: تصميم تذكيراتي</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=9">
<link rel="stylesheet" href="css/views.css?v=D285">
<link rel="stylesheet" href="css/portfolio-theme.css?v=15">
<link rel="stylesheet" href="css/theme-white.css?v=20">
<link rel="stylesheet" href="css/theme-dark.css?v=32">

<style>
    /* ══ إطارُ المعاينة — لا شيء منه يدخل التطبيق ══ */
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 480px; margin: 0 auto; padding: 0 14px 60px; }
    .pv-bar {
        position: sticky; top: 0; z-index: 40;
        background: var(--surface); border-bottom: 1.5px solid var(--border);
        padding: 10px 14px 12px; margin: 0 -14px 14px;
    }
    .pv-tabs { display: flex; gap: 7px; }
    .pv-tabs button {
        flex: 1 1 0; min-height: 44px; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface);
        color: var(--ink-primary);
    }
    .pv-tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pv-say { margin: 9px 2px 0; font-size: 12.5px; line-height: 1.85;
              font-weight: 500; color: var(--text-muted); }
    .pv-say b { color: var(--ink-primary); font-weight: var(--fw-bold); }

    /* ══ مشتركاتٌ بين الثلاثة ══ */
    .rm-seg { display: flex; gap: 6px; margin-bottom: 14px; }
    .rm-seg .pseg { flex: 1; padding: 0 8px; font-size: 12.5px; }

    .rm-add {
        display: block; width: 100%; min-height: 50px; border: 0; border-radius: 15px;
        cursor: pointer; font-family: inherit; font-size: 15px;
        font-weight: var(--fw-bold); color: #fff; background: var(--primary);
        box-shadow: 0 5px 15px color-mix(in srgb, var(--primary) 30%, transparent);
        margin-top: var(--space-5);
    }

    /* دائرةُ الإنجاز: هدفُ لمسٍ واضحٌ بدل مربّعِ النظام الصغير. */
    .rm-tick {
        width: 26px; height: 26px; flex: none; border-radius: 50%;
        border: 2px solid var(--border-strong); background: var(--surface);
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        font-size: 13px; color: transparent; padding: 0;
    }
    .rm-done .rm-tick { background: var(--primary); border-color: var(--primary); color: #fff; }

    .rm-del {
        flex: none; border: 0; background: transparent; color: var(--text-muted);
        padding: 4px; cursor: pointer; line-height: 1; opacity: .75;
    }

    .rm-empty {
        text-align: center; padding: var(--space-8) var(--space-4);
        color: var(--text-muted); font-size: 13px; font-weight: var(--fw-bold);
        line-height: 1.9;
    }

    /* ══════════ «ج» — صدرٌ ثمّ قائمةٌ مضغوطة ══════════ */
    .rmc-hero {
        background: var(--primary); border-radius: var(--radius-lg);
        padding: 18px; color: #fff; margin-top: var(--space-5);
        box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 25%, transparent);
    }
    .rmc-hero .k { font-size: 12px; font-weight: var(--fw-bold); opacity: .8; }
    .rmc-hero .v { font-size: 44px; font-weight: var(--fw-bold); line-height: 1.1; margin-top: 2px; }
    .rmc-hero .s { font-size: 12.5px; opacity: .88; margin-top: 5px; }
    .rmc-hero .row {
        display: flex; gap: 8px; margin-top: 15px;
        border-top: 1px solid rgba(255,255,255,.2); padding-top: 13px;
    }
    .rmc-hero .row > div { flex: 1; text-align: center; }
    .rmc-hero .row .n { font-size: 18px; font-weight: var(--fw-bold); }
    .rmc-hero .row .c { font-size: 10.5px; opacity: .8; margin-top: 1px; }
    .rmc-list { margin-top: var(--space-5); }
    .rmc-row {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 2px; border-bottom: 1px solid var(--border);
    }
    .rmc-row:last-child { border-bottom: 0; }
    .rmc-row .bd { flex: 1; min-width: 0; }
    .rmc-row .t {
        font-size: 13.5px; font-weight: var(--fw-bold); color: var(--ink-primary);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .rmc-row .m { font-size: 10.5px; font-weight: var(--fw-bold); color: var(--text-muted); margin-top: 2px; }
    .rmc-row .when {
        font-size: 11px; font-weight: var(--fw-bold); flex: none; color: var(--text-muted);
    }
    .rmc-row .when.late {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 11%, var(--mix-base));
        padding: 3px 9px; border-radius: 999px;
    }
</style>
</head>
<body>

<div class="pv">
    <div class="pv-bar">
        <div class="pv-tabs">
            <button type="button" data-m="now">الحالي</button>
            <button type="button" data-m="c">المعتمَد (ج)</button>
        </div>
        <p class="pv-say" id="say"></p>
    </div>
    <div id="stage"></div>
</div>

<script>
(function () {
    'use strict';

    const TRASH = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none"'
        + ' stroke="currentColor" stroke-width="2" stroke-linecap="round"'
        + ' stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

    const TYPE = {
        exam:     { l: 'اختبار', i: '📝', c: '#EF4444' },
        homework: { l: 'واجب',   i: '📚', c: '#F59E0B' },
        meeting:  { l: 'اجتماع', i: '👥', c: '#8B5CF6' },
        activity: { l: 'نشاط',   i: '🎯', c: '#0EA5E9' },
        other:    { l: 'أخرى',   i: '🔔', c: '#64748B' }
    };
    const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

    /* تذكيراتٌ بأيّامٍ نسبيّةٍ من اليوم — فالمعاينةُ لا تشيخ بمرور الوقت. */
    const R = [
        { id:'1', t:'اختبار الوحدة الثالثة', ty:'exam',     d:-2, cls:'الخامس الابتدائي / أ', done:false, nt:'' },
        { id:'2', t:'تسليم واجب الرياضيات',  ty:'homework', d:0,  cls:'الخامس الابتدائي / أ', done:false, nt:'' },
        { id:'3', t:'اجتماع أولياء الأمور',  ty:'meeting',  d:0,  cls:'',                      done:false,
          nt:'القاعة الكبرى — الساعة الثانية' },
        { id:'4', t:'تسميع سورة الملك',       ty:'activity', d:1,  cls:'السادس الابتدائي / ب', done:false, nt:'' },
        { id:'5', t:'رصد درجات الفترة',       ty:'other',    d:3,  cls:'',                      done:false, nt:'' },
        { id:'6', t:'اختبار قصير في العلوم',  ty:'exam',     d:5,  cls:'السادس الابتدائي / ب', done:false, nt:'' },
        { id:'7', t:'تجهيز ورقة عمل',         ty:'homework', d:12, cls:'الرابع الابتدائي / أ',  done:false, nt:'' },
        { id:'8', t:'تسليم خطة الأسبوع',      ty:'other',    d:-4, cls:'',                      done:true,  nt:'' }
    ];

    const rel = (n) => n === 0 ? 'اليوم' : n === 1 ? 'غداً' : n === -1 ? 'أمس'
        : n > 1 && n <= 7 ? 'بعد ' + ar(n) + ' أيام'
        : n < -1 && n >= -7 ? 'قبل ' + ar(-n) + ' أيام'
        : n > 0 ? 'بعد ' + ar(n) + ' يوماً' : 'قبل ' + ar(-n) + ' يوماً';

    /* الفلترُ الأوّل في الثلاثة الجديدة يشمل المتأخّرات، وفي «الحالي» لا
       يشملها كما هو اليوم — والفرقُ يُرى بالتبديل بينهما.
       فتذكيرٌ فات موعدُه يختفي من أوّل ما يُفتح، وهو أولى ما يُرى. */
    /* شريحتان لا ثلاث: «القائمة» كلُّ ما لم يُنجَز، و«المنجزة» ما أُنجز.
       فالتعليمُ ينقله من الأولى إلى الثانية ولا يبقى له أثرٌ فيها. */
    let filter = 'open';
    const counts = () => ({
        open: R.filter((r) => !r.done).length,
        cur:  R.filter((r) => !r.done && r.d >= 0).length,
        all:  R.length,
        done: R.filter((r) => r.done).length
    });
    /* الأقدمُ أوّلاً: المتأخّرُ في رأس القائمة لا في ذيلها. */
    const byDate = (a, b) => a.d - b.d;
    const list = (legacy) => {
        if (filter === 'done') return R.filter((r) => r.done).sort(byDate);
        if (legacy) return R.filter((r) => !r.done && r.d >= 0).sort(byDate);
        return R.filter((r) => !r.done).sort(byDate);
    };

    const seg = () => { const c = counts(); return `
        <div class="rm-seg">
            <button type="button" class="pseg${filter === 'open' ? ' on' : ''}" data-f="open">القائمة ${ar(c.open)}</button>
            <button type="button" class="pseg${filter === 'done' ? ' on' : ''}" data-f="done">المنجزة ${ar(c.done)}</button>
        </div>`; };

    const addBtn = () => '<button type="button" class="rm-add">إضافة تذكير</button>';
    const tick = (r) => `<button type="button" class="rm-tick" data-tick="${r.id}">✓</button>`;
    const del  = (r) => `<button type="button" class="rm-del" data-del="${r.id}">${TRASH}</button>`;
    const empty = () => `<div class="rm-empty">لا يوجد شيء هنا</div>`;

    /* ══════════ الحاليّ ══════════ */
    function now() {
        const items = list(true);
        return `
        <div class="section-header" style="margin-top:var(--space-6)">
            <button class="btn btn-primary">+ إضافة تذكير</button></div>
        <div class="filter-bar">
            ${['open','all','done'].map((f, i) => `<button class="chip${filter === f ? ' active' : ''}" data-f="${f}">${
                ['القادمة','الكل','المنجزة'][i]} (${[counts().cur, counts().all, counts().done][i]})</button>`).join('')}
        </div>
        <div class="reminders-list">${items.length === 0 ? `
            <div class="empty-state"><div class="icon">🔔</div><h3>لا يوجد شيء هنا</h3>
            <p>لم تُضف أي تذكيرات بعد.</p></div>` : items.map((r) => {
            const m = TYPE[r.ty]; const late = !r.done && r.d < 0;
            return `
            <article class="reminder-item${r.done ? ' is-done' : ''}${late ? ' is-overdue' : ''}"
                     style="--type-color:${m.c}">
                <label class="reminder-check"><input type="checkbox" ${r.done ? 'checked' : ''} data-tick="${r.id}"></label>
                <div class="reminder-icon">${m.i}</div>
                <div class="reminder-body">
                    <div class="reminder-title">${r.t}</div>
                    <div class="reminder-meta">
                        <span class="badge badge-muted">${m.l}</span>
                        <span>📅 ${rel(r.d)}</span>
                        ${r.cls ? `<span>📚 ${r.cls}</span>` : ''}
                        ${late ? '<span class="badge badge-danger">متأخر</span>' : ''}
                    </div>
                    ${r.nt ? `<div class="reminder-notes">${r.nt}</div>` : ''}
                </div>
                <div class="reminder-actions">
                    <button class="btn btn-ghost btn-sm">✏️</button>
                    <button class="btn btn-ghost btn-sm" data-del="${r.id}">🗑️</button>
                </div>
            </article>`; }).join('')}</div>`;
    }



    /* ══════════ ج — صدرٌ ثمّ قائمةٌ مضغوطة ══════════ */
    function C_() {
        const today = R.filter((r) => !r.done && r.d === 0).length;
        const late  = R.filter((r) => !r.done && r.d < 0).length;
        const soon  = R.filter((r) => !r.done && r.d > 0 && r.d <= 7).length;
        const next  = R.filter((r) => !r.done && r.d > 0).sort((a, b) => a.d - b.d)[0];
        const items = list();
        return `
        <div class="rmc-hero">
            <div class="k">تذكيرات اليوم</div>
            <div class="v">${ar(today)}</div>
            <div class="s">${next ? 'والقادم: ' + next.t + ' — ' + rel(next.d) : 'لا تذكيرات قادمة'}</div>
            <div class="row">
                <div><div class="n">${ar(late)}</div><div class="c">متأخرة</div></div>
                <div><div class="n">${ar(soon)}</div><div class="c">هذا الأسبوع</div></div>
                <div><div class="n">${ar(counts().done)}</div><div class="c">منجزة</div></div>
            </div>
        </div>
        <div style="margin-top:var(--space-5)">${seg()}</div>
        ${items.length === 0 ? empty() : `<div class="rmc-list">${items.map((r) => {
            /* المتأخّرُ يقولها بالأحمر، وكم تأخّر في سطر بيانه — والتأخيرُ
               يبدأ من «أمس»: يومُ الموعد نفسُه ليس تأخيراً. */
            const m = TYPE[r.ty]; const late = !r.done && r.d < 0;
            const meta = [m.l, r.cls, late ? rel(r.d) : ''].filter(Boolean).join(' · ');
            return `<div class="rmc-row${r.done ? ' rm-done' : ''}">
                ${tick(r)}
                <div class="bd"><div class="t">${r.t}</div>
                    <div class="m">${meta}</div></div>
                <span class="when${late ? ' late' : ''}">${late ? 'متأخرة' : rel(r.d)}</span>
                ${del(r)}
            </div>`; }).join('')}</div>`}
        ${addBtn()}`;
    }

    const SAY = {
        now: '<b>الحالي</b> — للمقارنة. إيموجي في كلّ سطر، ومربّعُ تعليمٍ صغير، ' +
             'وثلاثُ شرائح، <b>وأوّلُها يُخفي المتأخّرات</b>: اعدد فيه ثمّ في المعتمَد.',
        c: '<b>ج المعتمَد.</b> شريحتان: <b>القائمة</b> بالأقدم أوّلاً و«متأخرة» ' +
           'بالأحمر لما فات موعدُه، و<b>المنجزة</b>. والتعليمُ ينقل التذكيرَ ' +
           'بينهما فلا يبقى له أثرٌ في القائمة.'
    };

    const stage = document.getElementById('stage');
    const say = document.getElementById('say');
    let mode = 'c';
    const REN = { now: now, c: C_ };

    function draw() {
        stage.innerHTML = REN[mode]();
        say.innerHTML = SAY[mode];
        document.querySelectorAll('.pv-tabs button')
            .forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
    }
    document.querySelectorAll('.pv-tabs button').forEach((b) =>
        b.addEventListener('click', () => { mode = b.dataset.m; draw(); window.scrollTo({ top: 0 }); }));

    stage.addEventListener('click', (e) => {
        const f = e.target.closest('[data-f]');
        if (f) { filter = f.dataset.f; return draw(); }
        const t = e.target.closest('[data-tick]');
        if (t) { const r = R.find((x) => x.id === t.dataset.tick); r.done = !r.done; return draw(); }
        const d = e.target.closest('[data-del]');
        if (d) { const i = R.findIndex((x) => x.id === d.dataset.del); R.splice(i, 1); return draw(); }
    });
    draw();
})();
</script>
</body>
</html>
