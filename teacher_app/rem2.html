<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مقارنة: تذكيراتي قبل التعديلين وبعدهما</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=9">
<link rel="stylesheet" href="css/views.css?v=D288">
<link rel="stylesheet" href="css/portfolio-theme.css?v=15">
<link rel="stylesheet" href="css/theme-white.css?v=20">
<link rel="stylesheet" href="css/theme-dark.css?v=32">

<style>
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 480px; margin: 0 auto; padding: 0 14px 40px; }
    .pv-bar {
        position: sticky; top: 0; z-index: 60;
        background: var(--surface); border-bottom: 1.5px solid var(--border);
        padding: 10px 14px 12px; margin: 0 -14px 10px;
    }
    .pv-tabs { display: flex; gap: 7px; }
    .pv-tabs button {
        flex: 1 1 0; min-height: 44px; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface);
        color: var(--ink-primary);
    }
    .pv-tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pv-say { margin: 9px 2px 0; font-size: 12.5px; line-height: 1.85;
              font-weight: 500; color: var(--text-muted); }
    .pv-say b { color: var(--ink-primary); font-weight: var(--fw-bold); }
    .pv-h { font: var(--fw-bold) 12.5px/1.6 inherit; color: var(--text-muted); margin: 18px 2px 8px; }

    /* ══ «قبل»: تُردّ المقاسات القديمة ويعود الزرُّ إلى ذيل الصفحة ══
       ليست تصميماً جديداً — هي القيمُ التي كانت قبل التعديل حرفاً بحرف،
       تُطبَّق على الترميز نفسِه فيُقارن الفرقُ وحدَه. */
    .was .rm-seg .pseg   { font-size: 12.5px; }
    .was .rm-row         { padding: 12px 2px; }
    .was .rm-row .bd .t  { font-size: 13.5px; }
    .was .rm-row .bd .m  { font-size: 10.5px; }
    .was .rm-row .when   { font-size: 11px; }
    .was .rm-hero .k     { font-size: 12px; }
    .was .rm-hero .s     { font-size: 12.5px; }
    .was .rm-hero .row .n { font-size: 18px; }
    .was .rm-hero .row .c { font-size: 10.5px; }

    /* الزرُّ القديم: في ذيل الصفحة يُنزَل إليه، لا عائمٌ ثابت. */
    .was .classes-fab { display: none; }
    .was .rm-v2 { padding-bottom: 0; }
    .old-add {
        display: block; width: 100%; min-height: 50px; border: 0; border-radius: 15px;
        cursor: pointer; font-family: inherit; font-size: 15px;
        font-weight: var(--fw-bold); color: #fff; background: var(--primary);
        box-shadow: 0 5px 15px color-mix(in srgb, var(--primary) 30%, transparent);
        margin-top: var(--space-6);
    }
    .now .old-add { display: none; }

    /* المسرحُ يقصّ الزرَّ العائم داخله بدل أن يطفو على النافذة. */
    .frame {
        position: relative; overflow: hidden;
        background: var(--surface); border: 1.5px solid var(--border);
        border-radius: 18px; padding: 0 12px; min-height: 620px;
    }
    .frame .classes-fab { position: absolute; }

    .sheet-box { background: var(--surface); border: 1.5px solid var(--border);
                 border-radius: 16px; padding: 12px; }
</style>
</head>
<body>

<div class="pv">
    <div class="pv-bar">
        <div class="pv-tabs">
            <button type="button" data-m="was">قبل التعديلين</button>
            <button type="button" data-m="now">المنشور الآن</button>
        </div>
        <p class="pv-say" id="say"></p>
    </div>

    <div class="pv-h">الشاشة</div>
    <div class="frame" id="screen"></div>

    <div class="pv-h">لوحة الإضافة</div>
    <div class="sheet-box" id="sheet"></div>
</div>

<script>
/* بياناتٌ نسبيّةٌ من اليوم — فالمعاينةُ لا تشيخ. */
const iso = (d) => { const x = new Date(); x.setDate(x.getDate() + d);
    return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')
         + '-' + String(x.getDate()).padStart(2, '0'); };
const CLS = [
    { id: 'c1', teacher_id: 't1', grade: 'الصف الخامس الابتدائي', section: 'أ' },
    { id: 'c2', teacher_id: 't1', grade: 'الصف السادس الابتدائي', section: 'ب' }];
const ROWS = [
 { id:'1', teacher_id:'t1', title:'اختبار الوحدة الثالثة', type:'exam',     date:iso(-2), class_id:'c1', done:false, notes:'' },
 { id:'2', teacher_id:'t1', title:'تسليم واجب الرياضيات',  type:'homework', date:iso(0),  class_id:'c1', done:false, notes:'' },
 { id:'3', teacher_id:'t1', title:'اجتماع أولياء الأمور',  type:'meeting',  date:iso(0),  class_id:null, done:false, notes:'' },
 { id:'4', teacher_id:'t1', title:'تسميع سورة الملك',      type:'activity', date:iso(1),  class_id:'c2', done:false, notes:'' },
 { id:'5', teacher_id:'t1', title:'رصد درجات الفترة',      type:'other',    date:iso(3),  class_id:null, done:false, notes:'' },
 { id:'6', teacher_id:'t1', title:'اختبار قصير في العلوم', type:'exam',     date:iso(5),  class_id:'c2', done:false, notes:'' },
 { id:'7', teacher_id:'t1', title:'تسليم خطة الأسبوع',     type:'other',    date:iso(-4), class_id:null, done:true,  notes:'' }];

window.Auth = { currentTeacher: async () => ({ id: 't1', name: 'أحمد' }) };
window.TeacherApp = { toast: () => {} };
window.TeacherDB = {
    getAllByIndex: async (st) => st === 'reminders' ? ROWS.map((r) => ({ ...r }))
                              : st === 'classes' ? CLS : [],
    put: async () => {}, remove: async () => {},
    Settings: { get: async () => null }, get: async () => null, getAll: async () => [] };
window.Modal = {
    open({ body }) { const h = document.getElementById('sheet'); h.innerHTML = ''; h.appendChild(body); },
    close() {} };
</script>
<script src="js/class-create.js"></script>
<script src="js/views/reminders.js?v=S8"></script>
<script>
(async () => {
    const screen = document.getElementById('screen');
    const say = document.getElementById('say');
    await window.RemindersView.render(screen);
    await window.RemindersView.openSheet({ id: 't1' }, null, () => {});

    /* زرٌّ قديمٌ يُضاف إلى الترميز نفسِه، يظهر في «قبل» وحدَه. */
    screen.querySelector('.rm-v2').insertAdjacentHTML('beforeend',
        '<button type="button" class="old-add">إضافة تذكير</button>');

    /* والإيموجي القديمةُ تُردّ نصّاً في «قبل» — نفسُ الأزرار وقد أُعيد
       إليها ما رُفع منها، فيُقارن الفرقُ لا شيءَ آخر. */
    const OLD_ICON = { 'اختبار': '📝', 'واجب': '📚', 'اجتماع': '👥', 'نشاط': '🎯', 'أخرى': '🔔' };
    const sheet = document.getElementById('sheet');
    const withEmoji = () => {
        sheet.querySelectorAll('[data-type]').forEach((b) => {
            const t = b.textContent.trim();
            if (OLD_ICON[t]) b.textContent = OLD_ICON[t] + ' ' + t;
        });
        const d = sheet.querySelector('[data-date-other]');
        if (d && !d.textContent.trim().startsWith('✎')) d.textContent = '✎ ' + d.textContent.trim();
        const s = sheet.querySelector('.fsave');
        if (s && !s.textContent.trim().startsWith('💾')) s.textContent = '💾 ' + s.textContent.trim();
    };
    const noEmoji = () => {
        sheet.querySelectorAll('[data-type]').forEach((b) => {
            b.textContent = b.textContent.replace(/^[^ء-ي]+/, '').trim();
        });
        const d = sheet.querySelector('[data-date-other]');
        if (d) d.textContent = d.textContent.replace(/^[^ء-ي]+/, '').trim();
        const s = sheet.querySelector('.fsave');
        if (s) s.textContent = s.textContent.replace(/^[^ء-ي]+/, '').trim();
    };

    const SAY = {
        was: '<b>قبل التعديلين.</b> الزرُّ في ذيل الصفحة يُنزَل إليه، وإيموجي في ' +
             'لوحة الإضافة، وحروفٌ أصغرَ من مربّعاتها.',
        now: '<b>المنشور الآن.</b> الزرُّ عائمٌ في مكان «إضافة فصل جديد» ومقاسه، ' +
             'ولا إيموجي، والحروفُ أكبرُ درجةً في الشرائح والسطور والصدر.'
    };
    let mode = 'now';
    function draw() {
        document.body.classList.toggle('was', mode === 'was');
        document.body.classList.toggle('now', mode === 'now');
        (mode === 'was' ? withEmoji : noEmoji)();
        say.innerHTML = SAY[mode];
        document.querySelectorAll('.pv-tabs button')
            .forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
    }
    document.querySelectorAll('.pv-tabs button').forEach((b) =>
        b.addEventListener('click', () => { mode = b.dataset.m; draw(); }));
    draw();
    document.title = 'جاهزة';
})();
</script>
</body>
</html>
