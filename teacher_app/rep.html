<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معاينة: تصميم التقارير</title>

<link rel="stylesheet" href="css/fonts.css?v=2">
<link rel="stylesheet" href="css/main.css?v=D32">
<link rel="stylesheet" href="css/components.css?v=9">
<link rel="stylesheet" href="css/views.css?v=D284">
<link rel="stylesheet" href="css/portfolio-theme.css?v=15">
<link rel="stylesheet" href="css/theme-white.css?v=20">
<link rel="stylesheet" href="css/theme-dark.css?v=32">

<style>
    /* ══ إطارُ المعاينة — لا شيء منه يدخل التطبيق ══ */
    body { margin: 0; background: var(--bg, #F4F5F7); }
    .pv { max-width: 480px; margin: 0 auto; padding: 0 14px 60px; }
    .pv-bar {
        position: sticky; top: 0; z-index: 40;
        background: var(--surface); border-bottom: 1.5px solid var(--border);
        padding: 10px 14px 12px; margin: 0 -14px 14px;
    }
    .pv-tabs { display: flex; gap: 7px; }
    .pv-tabs button {
        flex: 1 1 0; min-height: 44px; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: var(--fw-bold);
        border: 1.5px solid var(--border); background: var(--surface);
        color: var(--ink-primary);
    }
    .pv-tabs button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pv-say {
        margin: 9px 2px 0; font-size: 12.5px; line-height: 1.85;
        font-weight: 500; color: var(--text-muted);
    }
    .pv-say b { color: var(--ink-primary); font-weight: var(--fw-bold); }

    /* ══════════ «أ» — بلاطاتُ الإنجاز ══════════
       نفسُ أثاث قسم الإنجاز الذي يدخل منه: بيجٌ متدرّجٌ بحافّةٍ وبريقٍ
       داخليّ. فالتقاريرُ تصير جزءاً من القسم لا شاشةً غريبةً فيه. */
    .rpa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rpa-tile {
        border-radius: 16px; padding: 14px 12px; text-align: center;
        background: linear-gradient(150deg, #fff 0%,
            color-mix(in srgb, var(--beige) 42%, var(--mix-base)) 50%, #ECEAE3 100%);
        border: 1.5px solid color-mix(in srgb, var(--beige) 85%, #000);
        box-shadow: inset 0 1.5px 0 var(--sheen), 0 3px 8px rgba(16, 24, 40, .09);
    }
    .rpa-tile .v {
        font-size: 26px; font-weight: var(--fw-bold); color: var(--ink-primary);
        line-height: 1.25; font-variant-numeric: tabular-nums;
    }
    .rpa-tile .l { font-size: 11px; font-weight: var(--fw-bold); color: var(--text-muted); margin-top: 3px; }
    .rpa-tile.wide { grid-column: 1 / -1; }

    /* ══════════ «ب» — رقمٌ واحدٌ يتصدّر ══════════
       البطاقةُ الكحليّةُ هي بطاقةُ «حصّتك القادمة» في الرئيسيّة. */
    .rpb-hero {
        background: var(--primary); border-radius: var(--radius-lg);
        padding: 20px 18px; color: #fff;
        box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 25%, transparent);
    }
    .rpb-hero .k { font-size: 12px; font-weight: var(--fw-bold); opacity: .8; }
    .rpb-hero .v {
        font-size: 52px; font-weight: var(--fw-bold); line-height: 1.05;
        margin-top: 2px; font-variant-numeric: tabular-nums;
    }
    .rpb-hero .s { font-size: 12px; opacity: .85; margin-top: 4px; }
    .rpb-hero .row {
        display: flex; gap: 8px; margin-top: 16px;
        border-top: 1px solid rgba(255,255,255,.2); padding-top: 14px;
    }
    .rpb-hero .row > div { flex: 1; text-align: center; }
    .rpb-hero .row .n {
        font-size: 19px; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums;
    }
    .rpb-hero .row .c { font-size: 10.5px; opacity: .8; margin-top: 1px; }
    .rpb-list { display: flex; flex-direction: column; gap: 9px; }
    .rpb-line { display: flex; align-items: center; gap: 10px; }
    .rpb-line .lb { font-size: 12.5px; font-weight: var(--fw-bold); color: var(--ink-primary); width: 62px; flex: none; }
    .rpb-line .tr { flex: 1; height: 10px; border-radius: 6px; background: color-mix(in srgb, var(--beige) 45%, var(--mix-base)); overflow: hidden; }
    /* `display:block` ليس زينة: العنصرُ سطريٌّ بأصله، و`height` لا تعمل
       عليه — فيُرسم الشريطُ فارغاً وإن كان عرضُه مضبوطاً. */
    .rpb-line .fl { display: block; height: 100%; border-radius: 6px; }
    .rpb-line .vn { font-size: 12px; font-weight: var(--fw-bold); color: var(--text-muted); width: 58px; text-align: end; flex: none; font-variant-numeric: tabular-nums; }

    /* ══════════ «ج» — قسمٌ واحدٌ في الشاشة ══════════
       `pseg` هو مقسّمُ التطبيق نفسُه — المستعمَل في سجلّ المتابعة. */
    .rpc-seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 14px; }
    .rpc-seg::-webkit-scrollbar { display: none; }
    .rpc-seg .pseg { flex: 0 0 auto; padding: 0 14px; }

    /* ══ مشتركاتٌ بين الثلاثة ══ */
    .rp-h {
        font-size: 13px; font-weight: var(--fw-bold); color: var(--text-muted);
        margin: 22px 2px 9px;
    }
    .rp-card {
        background: var(--surface); border: 1.5px solid var(--border);
        border-radius: 16px; padding: 14px 13px;
        box-shadow: 0 2px 6px rgba(16, 24, 40, .05);
    }
    .rp-bar { height: 14px; border-radius: 8px; overflow: hidden; display: flex; }
    .rp-bar i { display: block; height: 100%; }
    /* الرقمُ يلي اسمَه لا يُدفع إلى طرف خانته: الدفعُ يُلصقه باسم الخانة
       المجاورة فيُقرأ الرقمُ لغير صاحبه. */
    .rp-leg { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 14px; margin-top: 13px; }
    .rp-leg div { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: var(--fw-bold); color: var(--ink-primary); }
    .rp-leg .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .rp-leg .n { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .rp-leg .p { color: var(--text-muted); font-size: 11px; margin-inline-start: auto; }

    .rp-row {
        display: flex; align-items: center; gap: 9px;
        padding: 9px 2px; border-bottom: 1px solid var(--border);
    }
    .rp-row:last-child { border-bottom: 0; }
    .rp-row .rk { width: 22px; flex: none; font-size: 13px; font-weight: var(--fw-bold); color: var(--text-muted); text-align: center; }
    .rp-row .nm { flex: 1; min-width: 0; font-size: 13.5px; font-weight: var(--fw-bold); color: var(--ink-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rp-row .mt { font-size: 10.5px; font-weight: var(--fw-bold); color: var(--text-muted); flex: none; }
    .rp-row .pc { font-size: 13.5px; font-weight: var(--fw-bold); flex: none; font-variant-numeric: tabular-nums; }

    /* بطاقةُ الفصل بدل صفٍّ في جدولٍ سباعيّ الأعمدة: الجدولُ يفيض على
       الجوّال فيُمرَّر أفقيّاً، والمعلّمُ لا يمرّر ورقةً ليقرأ صفّه. */
    .rp-cls { display: flex; flex-direction: column; gap: 10px; }
    .rp-cls-card {
        background: var(--surface); border: 1.5px solid var(--border);
        border-radius: 14px; padding: 12px 13px;
        box-shadow: 0 2px 6px rgba(16, 24, 40, .05);
    }
    .rp-cls-top { display: flex; align-items: baseline; gap: 8px; }
    .rp-cls-top .t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: var(--fw-bold); color: var(--ink-primary); }
    .rp-cls-top .r { font-size: 15px; font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
    .rp-cls .sub { font-size: 11px; font-weight: var(--fw-bold); color: var(--text-muted); margin-top: 2px; }
    .rp-cls .mini { height: 7px; border-radius: 5px; margin-top: 9px; background: color-mix(in srgb, var(--beige) 45%, var(--mix-base)); overflow: hidden; }
    .rp-cls .mini i { display: block; height: 100%; border-radius: 5px; background: var(--primary); }
    .rp-cls .facts { display: flex; gap: 14px; margin-top: 9px; }
    .rp-cls .facts span { font-size: 11px; font-weight: var(--fw-bold); color: var(--text-muted); }
    .rp-cls .facts b { color: var(--ink-primary); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="pv">
    <div class="pv-bar">
        <div class="pv-tabs">
            <button type="button" data-m="now">الحالي</button>
            <button type="button" data-m="a">أ</button>
            <button type="button" data-m="b">ب</button>
            <button type="button" data-m="c">ج</button>
        </div>
        <p class="pv-say" id="say"></p>
    </div>
    <div id="stage"></div>
</div>

<script>
(function () {
    'use strict';

    /* بياناتٌ واقعيّةٌ لمعلّمٍ بثلاثة فصول — الأرقامُ متماسكةٌ لا عشوائيّة،
       فنسبةُ الحضور محسوبةٌ من الخانات نفسِها كما يحسبها التطبيق. */
    const ATT = { present: 1420, late: 96, excused: 54, absent: 118 };
    const considered = ATT.present + ATT.late + ATT.absent;
    const RATE = Math.round((ATT.present + ATT.late) / considered * 100);
    const D = {
        classes: 3, students: 78,
        exams: 12, worksheets: 21, homework: 34, strategies: 7, initiatives: 4,
        att: ATT, attTotal: ATT.present + ATT.late + ATT.excused + ATT.absent, rate: RATE,
        top: [
            { n: 'عبدالرحمن محمد الغامدي', c: 'الخامس / أ', s: '٤١٢ حضور', p: 99 },
            { n: 'سلمان عبدالله القحطاني', c: 'السادس / ب', s: '٣٩٨ حضور', p: 97 },
            { n: 'فيصل ناصر الدوسري',      c: 'الخامس / أ', s: '٣٩١ حضور', p: 96 },
            { n: 'يوسف خالد الشهري',       c: 'الرابع / أ', s: '٣٨٠ حضور', p: 94 },
            { n: 'تركي سعد العتيبي',       c: 'السادس / ب', s: '٣٧٤ حضور', p: 92 }
        ],
        low: [
            { n: 'ماجد فهد الزهراني',   c: 'السادس / ب', s: '١٤ غياب', p: 21 },
            { n: 'بندر علي المالكي',    c: 'الرابع / أ',  s: '١١ غياب', p: 17 },
            { n: 'راكان أحمد الحربي',   c: 'الخامس / أ',  s: '٩ غياب',  p: 14 },
            { n: 'نايف سلطان العنزي',   c: 'السادس / ب', s: '٧ غياب',  p: 11 },
            { n: 'زياد مشعل الشمري',    c: 'الرابع / أ',  s: '٥ غياب',  p: 8  }
        ],
        rated: [
            { n: 'عبدالرحمن محمد الغامدي', c: 'الخامس / أ', p: 96 },
            { n: 'خالد عبدالعزيز السبيعي', c: 'الرابع / أ', p: 93 },
            { n: 'سلمان عبدالله القحطاني', c: 'السادس / ب', p: 91 },
            { n: 'فيصل ناصر الدوسري',      c: 'الخامس / أ', p: 88 },
            { n: 'يوسف خالد الشهري',       c: 'الرابع / أ', p: 85 }
        ],
        perClass: [
            { t: 'الخامس الابتدائي / أ', sub: 'الرياضيات', st: 28, rate: 95, ex: 5, ws: 9, hw: 14 },
            { t: 'السادس الابتدائي / ب', sub: 'العلوم',     st: 26, rate: 91, ex: 4, ws: 7, hw: 11 },
            { t: 'الرابع الابتدائي / أ', sub: 'الرياضيات', st: 24, rate: 92, ex: 3, ws: 5, hw: 9  }
        ]
    };

    const ar = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    const C = { present: '#10B981', late: '#F59E0B', excused: '#3B82F6', absent: '#EF4444' };
    const LEG = [
        { k: 'present', l: 'حاضر' }, { k: 'late', l: 'متأخر' },
        { k: 'excused', l: 'مستأذن' }, { k: 'absent', l: 'غائب' }
    ];

    /* ── قطعٌ مشتركةٌ بين «أ» و«ب» و«ج» ── */
    const barHtml = () => `
        <div class="rp-bar">${LEG.map((g) =>
            `<i style="width:${D.att[g.k] / D.attTotal * 100}%;background:${C[g.k]}"></i>`).join('')}</div>
        <div class="rp-leg">${LEG.map((g) => `
            <div><span class="dot" style="background:${C[g.k]}"></span>${g.l}
                 <span class="n">${ar(D.att[g.k])}</span>
                 <span class="p">${ar(Math.round(D.att[g.k] / D.attTotal * 100))}%</span></div>`).join('')}</div>`;

    const rowsHtml = (list, color, rank) => list.map((s, i) => `
        <div class="rp-row">
            ${rank ? `<span class="rk">${['🥇','🥈','🥉','٤','٥'][i]}</span>` : ''}
            <span class="nm">${s.n}</span>
            <span class="mt">${s.c}${s.s ? ' · ' + s.s : ''}</span>
            <span class="pc" style="color:${color}">${ar(s.p)}%</span>
        </div>`).join('');

    const clsHtml = () => `<div class="rp-cls">${D.perClass.map((p) => `
        <div class="rp-cls-card">
            <div class="rp-cls-top">
                <span class="t">${p.t}</span>
                <span class="r" style="color:var(--primary)">${ar(p.rate)}%</span>
            </div>
            <div class="sub">${p.sub} · ${ar(p.st)} طالباً</div>
            <div class="mini"><i style="width:${p.rate}%"></i></div>
            <div class="facts">
                <span>اختبارات <b>${ar(p.ex)}</b></span>
                <span>أوراق <b>${ar(p.ws)}</b></span>
                <span>واجبات <b>${ar(p.hw)}</b></span>
            </div>
        </div>`).join('')}</div>`;

    const PROD = [
        { i: '📝', l: 'اختبارات', v: D.exams }, { i: '📄', l: 'أوراق عمل', v: D.worksheets },
        { i: '📚', l: 'واجبات', v: D.homework }, { i: '🎯', l: 'استراتيجيات', v: D.strategies },
        { i: '🌟', l: 'مبادرات', v: D.initiatives }
    ];

    /* ══════════ الشاشةُ الحاليّة — بأصنافها كما هي ══════════ */
    function now() {
        const tile = (i, v, l, c) => `
            <div class="card stat-card"><div class="stat-icon">${i}</div>
                <div class="stat-value num" ${c ? `style="color:${c}"` : ''}>${v}</div>
                <div class="stat-label">${l}</div></div>`;
        return `
        <div class="section-header" style="margin-top:var(--space-6)">
            <button class="btn btn-primary">🖨️ طباعة التقرير</button></div>
        <div class="dashboard-section"><h3 class="section-title">📌 نظرة عامة</h3>
            <div class="grid grid-4">
                ${tile('📚', D.classes, 'فصول')}${tile('👥', D.students, 'طلاب')}
                ${tile('📝', D.exams + D.worksheets + D.homework, 'محتوى أُنتج')}
                ${tile('✅', D.rate + '%', 'نسبة الحضور العامة', 'var(--success)')}
            </div></div>
        <div class="dashboard-section"><h3 class="section-title">📅 توزيع الحضور</h3>
            <div class="card"><div class="stacked-bar">${LEG.map((g) =>
                `<div class="sb-seg" style="width:${D.att[g.k] / D.attTotal * 100}%;background:${C[g.k]}"></div>`).join('')}</div>
            <div class="legend-grid" style="margin-top:var(--space-4)">${LEG.map((g) => `
                <div class="legend-item"><span class="legend-dot" style="background:${C[g.k]}"></span>
                <span>${g.l}</span><strong class="num">${D.att[g.k]}</strong>
                <span class="text-muted">(${Math.round(D.att[g.k] / D.attTotal * 100)}%)</span></div>`).join('')}</div>
            </div></div>
        <div class="dashboard-section"><h3 class="section-title">🏆 الطلاب الأبرز</h3>
            <div class="grid grid-2">
                <div class="card"><h4 style="color:var(--success);margin-top:0">🌟 الأعلى التزاماً بالحضور</h4>
                    <div class="mini-list">${D.top.map((s) => `<div class="mini-row">
                        <a href="#" class="mini-name">${s.n}</a>
                        <span class="text-muted" style="font-size:var(--fs-xs)">${s.c} · ${s.s}</span>
                        <span class="mini-rate num" style="color:var(--success)">${s.p}%</span></div>`).join('')}</div></div>
                <div class="card"><h4 style="color:var(--danger);margin-top:0">⚠️ أكثر الطلاب تغيّباً</h4>
                    <div class="mini-list">${D.low.map((s) => `<div class="mini-row">
                        <a href="#" class="mini-name">${s.n}</a>
                        <span class="text-muted" style="font-size:var(--fs-xs)">${s.c} · ${s.s}</span>
                        <span class="mini-rate num" style="color:var(--danger)">${s.p}%</span></div>`).join('')}</div></div>
            </div></div>
        <div class="dashboard-section"><h3 class="section-title">🧑‍🏫 إنتاجي</h3>
            <div class="grid grid-4">${PROD.map((p) => tile(p.i, p.v, p.l)).join('')}</div></div>
        <div class="dashboard-section"><h3 class="section-title">📚 تفصيل لكل فصل</h3>
            <div class="table-wrapper"><table class="students-table">
                <thead><tr><th>الفصل</th><th>المادة</th><th>الطلاب</th><th>نسبة الحضور</th>
                <th>اختبارات</th><th>أوراق</th><th>واجبات</th></tr></thead>
                <tbody>${D.perClass.map((p) => `<tr>
                    <td><a href="#" class="st-name-link">${p.t}</a></td><td>${p.sub}</td>
                    <td class="num">${p.st}</td>
                    <td class="num" style="color:var(--success);font-weight:var(--fw-bold)">${p.rate}%</td>
                    <td class="num">${p.ex}</td><td class="num">${p.ws}</td><td class="num">${p.hw}</td>
                </tr>`).join('')}</tbody></table></div></div>`;
    }

    /* ══════════ أ — بلاطاتُ الإنجاز ══════════ */
    function A() {
        const tile = (v, l, wide) => `
            <div class="rpa-tile${wide ? ' wide' : ''}">
                <div class="v">${v}</div><div class="l">${l}</div></div>`;
        return `
        <div class="rp-h">نظرة عامة</div>
        <div class="rpa-grid">
            ${tile(ar(D.rate) + '%', 'نسبة الحضور العامة', true)}
            ${tile(ar(D.classes), 'فصول')}${tile(ar(D.students), 'طلاب')}
            ${tile(ar(D.exams + D.worksheets + D.homework), 'محتوى أُنتج')}
            ${tile(ar(D.strategies + D.initiatives), 'استراتيجيات ومبادرات')}
        </div>

        <div class="rp-h">توزيع الحضور</div>
        <div class="rp-card">${barHtml()}</div>

        <div class="rp-h">الأعلى التزاماً بالحضور</div>
        <div class="rp-card">${rowsHtml(D.top, 'var(--success)')}</div>

        <div class="rp-h">أكثر الطلاب تغيّباً</div>
        <div class="rp-card">${rowsHtml(D.low, 'var(--danger)')}</div>

        <div class="rp-h">الطلاب المتميّزون في التقييم</div>
        <div class="rp-card">${rowsHtml(D.rated, 'var(--primary)', true)}</div>

        <div class="rp-h">إنتاجي</div>
        <div class="rpa-grid">${PROD.map((p) => tile(ar(p.v), p.l)).join('')}</div>

        <div class="rp-h">تفصيل لكل فصل</div>
        ${clsHtml()}`;
    }

    /* ══════════ ب — رقمٌ واحدٌ يتصدّر ══════════ */
    function B() {
        return `
        <div class="rpb-hero">
            <div class="k">نسبة الحضور العامة</div>
            <div class="v">${ar(D.rate)}%</div>
            <div class="s">من ${ar(considered)} حالة حضورٍ مرصودة</div>
            <div class="row">
                <div><div class="n">${ar(D.classes)}</div><div class="c">فصول</div></div>
                <div><div class="n">${ar(D.students)}</div><div class="c">طلاب</div></div>
                <div><div class="n">${ar(D.exams + D.worksheets + D.homework)}</div><div class="c">محتوى</div></div>
            </div>
        </div>

        <div class="rp-h">تفصيل الحضور</div>
        <div class="rp-card">
            <div class="rpb-list">${LEG.map((g) => `
                <div class="rpb-line">
                    <span class="lb">${g.l}</span>
                    <span class="tr"><i class="fl" style="width:${D.att[g.k] / D.attTotal * 100}%;background:${C[g.k]}"></i></span>
                    <span class="vn">${ar(D.att[g.k])} · ${ar(Math.round(D.att[g.k] / D.attTotal * 100))}%</span>
                </div>`).join('')}</div>
        </div>

        <div class="rp-h">الأعلى التزاماً</div>
        <div class="rp-card">${rowsHtml(D.top, 'var(--success)')}</div>

        <div class="rp-h">أكثر تغيّباً</div>
        <div class="rp-card">${rowsHtml(D.low, 'var(--danger)')}</div>

        <div class="rp-h">المتميّزون في التقييم</div>
        <div class="rp-card">${rowsHtml(D.rated, 'var(--primary)', true)}</div>

        <div class="rp-h">إنتاجي</div>
        <div class="rp-card">
            <div class="rpb-list">${PROD.map((p) => {
                const max = Math.max(...PROD.map((x) => x.v));
                return `<div class="rpb-line">
                    <span class="lb">${p.l}</span>
                    <span class="tr"><i class="fl" style="width:${p.v / max * 100}%;background:var(--primary)"></i></span>
                    <span class="vn">${ar(p.v)}</span></div>`;
            }).join('')}</div>
        </div>

        <div class="rp-h">تفصيل لكل فصل</div>
        ${clsHtml()}`;
    }

    /* ══════════ ج — قسمٌ واحدٌ في الشاشة ══════════ */
    const TABS = [
        { k: 'ov',   t: 'نظرة عامة' }, { k: 'att', t: 'الحضور' },
        { k: 'std',  t: 'الطلاب' },    { k: 'prod', t: 'إنتاجي' },
        { k: 'cls',  t: 'الفصول' }
    ];
    let ctab = 'ov';

    function C_() {
        const seg = `<div class="rpc-seg">${TABS.map((t) =>
            `<button type="button" class="pseg${t.k === ctab ? ' on' : ''}" data-t="${t.k}">${t.t}</button>`).join('')}</div>`;
        const tile = (v, l, wide) => `
            <div class="rpa-tile${wide ? ' wide' : ''}"><div class="v">${v}</div><div class="l">${l}</div></div>`;
        let body = '';
        if (ctab === 'ov') body = `
            <div class="rpa-grid">
                ${tile(ar(D.rate) + '%', 'نسبة الحضور العامة', true)}
                ${tile(ar(D.classes), 'فصول')}${tile(ar(D.students), 'طلاب')}
                ${tile(ar(D.exams + D.worksheets + D.homework), 'محتوى أُنتج')}
                ${tile(ar(D.strategies + D.initiatives), 'استراتيجيات ومبادرات')}
            </div>`;
        if (ctab === 'att')  body = `<div class="rp-card">${barHtml()}</div>`;
        if (ctab === 'std')  body = `
            <div class="rp-h" style="margin-top:4px">الأعلى التزاماً بالحضور</div>
            <div class="rp-card">${rowsHtml(D.top, 'var(--success)')}</div>
            <div class="rp-h">أكثر الطلاب تغيّباً</div>
            <div class="rp-card">${rowsHtml(D.low, 'var(--danger)')}</div>
            <div class="rp-h">المتميّزون في التقييم</div>
            <div class="rp-card">${rowsHtml(D.rated, 'var(--primary)', true)}</div>`;
        if (ctab === 'prod') body = `<div class="rpa-grid">${PROD.map((p) => tile(ar(p.v), p.l)).join('')}</div>`;
        if (ctab === 'cls')  body = clsHtml();
        return seg + body;
    }

    /* ── التبديل ── */
    const SAY = {
        now: '<b>الحالي</b> — ست أقسامٍ بعناوين وإيموجي، وبطاقاتٌ من الطبقة ' +
             'القديمة، وجدولٌ بسبعة أعمدة يفيض على الجوّال فيُمرَّر أفقيّاً.',
        a: '<b>أ — بلاطاتُ الإنجاز.</b> نفسُ أثاث القسم الذي تدخل منه: البيجُ ' +
           'المتدرّج بحافّته وبريقه. والجدولُ صار بطاقةَ فصلٍ لكلِّ فصل.',
        b: '<b>ب — رقمٌ واحدٌ يتصدّر.</b> نسبةُ الحضور كبيرةً في بطاقةٍ كحليّةٍ ' +
           'كبطاقة «حصّتك القادمة»، وما تحتها أشرطةُ مقارنةٍ لا أرقامٌ مبعثرة.',
        c: '<b>ج — قسمٌ واحدٌ في الشاشة.</b> خمسةُ تبويباتٍ بمقسّم التطبيق نفسِه، ' +
           'فلا تمرّر طويلاً — تضغط ما تريد قراءته.'
    };
    const stage = document.getElementById('stage');
    const say = document.getElementById('say');
    let mode = 'now';
    const R = { now: now, a: A, b: B, c: C_ };

    function draw() {
        stage.innerHTML = R[mode]();
        say.innerHTML = SAY[mode];
        document.querySelectorAll('.pv-tabs button')
            .forEach((b) => b.classList.toggle('on', b.dataset.m === mode));
    }
    document.querySelectorAll('.pv-tabs button').forEach((b) => {
        b.addEventListener('click', () => { mode = b.dataset.m; ctab = 'ov'; draw(); window.scrollTo({ top: 0 }); });
    });
    stage.addEventListener('click', (e) => {
        const t = e.target.closest('[data-t]');
        if (t) { ctab = t.dataset.t; draw(); }
    });
    draw();
})();
</script>
</body>
</html>
