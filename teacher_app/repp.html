<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معاينة: التقارير وورقتها</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/portfolio-theme.css">
<link rel="stylesheet" href="css/theme-white.css">
<link rel="stylesheet" href="css/theme-dark.css">
<link rel="stylesheet" href="css/print.css" media="print">
<style>
    body { margin: 0; background: #888; }
    #screen { max-width: 440px; margin: 0 auto; background: var(--surface); padding: 0 14px 30px; }
    #pdf { padding: 20px 0; }
    #pdf canvas { display: block; margin: 0 auto 18px; width: 100%; max-width: 560px; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
    h2 { font: 700 14px system-ui; color: #fff; text-align: center; padding: 14px 0 4px; margin: 0; }
</style>
</head>
<body>

<h2>الشاشة — كما تراها في التطبيق</h2>
<div id="screen"></div>
<h2>ورقة التصدير — بالمحرّك الحقيقيّ، صفحتان A4</h2>
<div id="pdf"></div>

<script>
/* ── بياناتٌ مولَّدةٌ تمرّ بـ collectStats الحقيقيّة ── */
const T = { id: 't1', name: 'أحمد علي العسيري', school_name: 'مدرسة النور الابتدائية',
            education_dept: 'إدارة تعليم عسير' };
const FIRST = ['عبدالرحمن','سلمان','فيصل','يوسف','تركي','ماجد','بندر','راكان','نايف','زياد',
               'خالد','سعود','مشعل','عبدالعزيز','ريان','وليد','هاني','ثامر','معاذ','أنس',
               'صالح','فهد','عمر','بدر','مازن','طلال','رائد'];
const LAST = ['الغامدي','القحطاني','الدوسري','الشهري','العتيبي','الزهراني','المالكي','الحربي',
              'العنزي','الشمري','السبيعي','البقمي','الخالدي'];
const CLASSES = [
  { id:'c1', teacher_id:'t1', stage:'primary', grade:'الصف الخامس الابتدائي', section:'أ',
    subject:'الرياضيات', eval_columns:[{id:'p',max:5},{id:'g',max:20}] },
  { id:'c2', teacher_id:'t1', stage:'primary', grade:'الصف السادس الابتدائي', section:'ب',
    subject:'العلوم', eval_columns:[{id:'p',max:5}] },
  { id:'c3', teacher_id:'t1', stage:'primary', grade:'الصف الرابع الابتدائي', section:'أ',
    subject:'الرياضيات', eval_columns:[{id:'p',max:5},{id:'g',max:20}] }
];
/* عشوائيّةٌ ثابتة — التشغيلُ نفسُه يعطي النتيجة نفسَها فالفحصُ يُعاد. */
let seed = 7;
const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
const COUNTS = { c1: 28, c2: 26, c3: 24 };
const STUDENTS = [], ATT = [], PART = [];
CLASSES.forEach((c) => {
  for (let i = 0; i < COUNTS[c.id]; i++) {
    const id = c.id + '_s' + i;
    STUDENTS.push({ id, class_id: c.id,
      name: FIRST[(i * 3 + 1) % FIRST.length] + ' ' + FIRST[(i * 5) % FIRST.length]
            + ' ' + LAST[(i * 7) % LAST.length] });
    const days = 22;
    for (let d = 0; d < days; d++) {
      const r = rnd();
      const st = r > 0.93 ? 'absent' : r > 0.88 ? 'late' : r > 0.855 ? 'excused' : 'present';
      ATT.push({ id: id + '_a' + d, student_id: id, status: st });
    }
    for (let k = 0; k < 4; k++) {
      const v = { p: 1 + Math.round(rnd() * 4) };
      if (c.eval_columns.length > 1) v.g = 8 + Math.round(rnd() * 12);
      PART.push({ id: id + '_p' + k, student_id: id, values: v });
    }
  }
});
const CONTENT = {
  exams:       [['c1',5],['c2',4],['c3',3]],
  worksheets:  [['c1',9],['c2',7],['c3',5]],
  assignments: [['c1',14],['c2',11],['c3',9]]
};
const mk = (store) => CONTENT[store].flatMap(([cid, n]) =>
  Array.from({ length: n }, (_, i) => ({ id: cid + store + i, class_id: cid })));

const BY = {
  classes:     (v) => CLASSES.filter((c) => c.teacher_id === v),
  students:    (v) => STUDENTS.filter((s) => s.class_id === v),
  attendance:  (v) => ATT.filter((a) => a.student_id === v),
  participation:(v)=> PART.filter((p) => p.student_id === v),
  exams:       (v) => mk('exams').filter((x) => x.class_id === v),
  worksheets:  (v) => mk('worksheets').filter((x) => x.class_id === v),
  assignments: (v) => mk('assignments').filter((x) => x.class_id === v),
  strategies:  () => Array.from({ length: 7 }, (_, i) => ({ id: 'st' + i })),
  initiatives: () => Array.from({ length: 4 }, (_, i) => ({ id: 'in' + i }))
};
window.Auth = { currentTeacher: async () => T };
window.TeacherApp = { toast: (m, t) => console.log('TOAST', t, m) };
window.TeacherDB = {
  Settings: { get: async () => null, set: async () => {}, unset: async () => {} },
  getAllByIndex: async (store, idx, v) => (BY[store] ? BY[store](v) : []),
  getAll: async () => [], get: async () => null, put: async () => {}
};
</script>

<script src="js/pdf-core.js"></script>
<script src="js/edu-departments.js"></script>
<script src="js/class-create.js"></script>
<script src="js/print-reports.js"></script>
<script src="js/views/reports.js"></script>
<script>
(async () => {
    /* ١) الشاشة — بالمسار الحقيقيّ */
    await window.ReportsView.render(document.getElementById('screen'));

    /* ٢) الورقة — نفسُ `savePdf` إلى آخره، ويُستبدل الرسمُ إلى ملفٍّ
       بعرض اللوحات كما رسمها html2canvas. فما يُرى هو ما يُحفظ. */
    const realStage = PdfCore.createStage;
    PdfCore.createStage = async () => { const s = await realStage(); s.destroy = () => {}; return s; };
    PdfCore.renderPdf = async (pages) => {
        await PdfCore.preloadPdfEngine();
        for (const p of pages) {
            const c = await window.html2canvas(p, { scale: 1.5, backgroundColor: '#fff',
                logging: false, useCORS: true, width: 794, height: 1123,
                windowWidth: 794, windowHeight: 1123 });
            document.getElementById('pdf').appendChild(c);
        }
        return new Blob();
    };
    PdfCore.deliverPdf = async (b, name) => { window.__FILE = name; return 'downloaded'; };

    const teacher = await window.Auth.currentTeacher();
    const data = await window.ReportsView.collectStats(teacher);
    window.__DATA = data;
    await window.PrintReports.savePdf({ teacher, data });
    document.title = 'تمّ';
})();
</script>
</body>
</html>
