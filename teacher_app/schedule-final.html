<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الجدول ج — الأزرار والحذف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--amber:#F59E0B;--red:#DC2626;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 14px 130px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:60;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 14px;font-family:inherit;font-size:12.5px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 3px 14px;line-height:1.6;}

    h1.t{margin:0 0 13px;font-size:20px;font-weight:900;color:var(--royal);}
    .g{background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
       border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 4px 10px rgba(16,24,40,.1);}

    /* الشبكة (تصميم ج المعتمد) */
    .gwrap{overflow-x:auto;border-radius:17px;-webkit-overflow-scrolling:touch;box-shadow:0 4px 12px rgba(16,24,40,.08);}
    .gwrap::-webkit-scrollbar{height:0;}
    table.gt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;background:#fff;}
    table.gt th,table.gt td{padding:0;}
    .gt thead th{background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;padding:8px 4px;font-size:11px;font-weight:800;min-width:78px;}
    .gt thead th .pt{font-size:9.5px;color:rgba(255,255,255,.7);font-weight:700;display:block;margin-top:1px;}
    .gt thead th.corner{position:sticky;right:0;z-index:2;min-width:52px;}
    .gt td.dc{background:var(--gray);color:var(--royal);font-weight:900;font-size:12.5px;position:sticky;right:0;z-index:1;min-width:52px;text-align:center;border-left:1.5px solid color-mix(in srgb,var(--gray) 82%,#000);}
    .gt tr.today td.dc{background:var(--gold);color:var(--royal);}
    .gt td.cell{border-bottom:1px solid var(--border);border-left:1px solid var(--border);height:52px;padding:5px;}
    .cellbox{height:100%;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
    .cellbox.cls{background:linear-gradient(150deg,#fff,var(--gray));border:1px solid color-mix(in srgb,var(--gray) 82%,#000);}
    .cellbox.cls .c{font-size:11.5px;font-weight:900;color:var(--royal);}
    .cellbox.cls .s{font-size:9.5px;color:var(--muted);font-weight:700;}
    .cellbox.wait{background:color-mix(in srgb,var(--amber) 12%,#fff);border:1px solid color-mix(in srgb,var(--amber) 30%,#fff);color:#B45309;font-size:11px;font-weight:800;}
    .cellbox.empty{color:#CBBE9E;font-size:17px;}
    .hintline{text-align:center;color:var(--muted);font-size:11.5px;margin-top:9px;}

    /* أ — زران نصيان فوق الجدول */
    .barA{display:flex;gap:8px;margin-bottom:13px;}
    .barA button{flex:1;min-height:48px;border-radius:13px;font-family:inherit;font-weight:800;font-size:13.5px;color:var(--royal);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 4px 10px rgba(16,24,40,.1);}
    .barA button.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 28%,#fff);
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--red) 5%,#fff) 100%);}

    /* ب — أيقونتان بجانب العنوان */
    .headB{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
    .headB h1{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--royal);}
    .iconb{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:17px;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 4px 10px rgba(16,24,40,.1);}
    .iconb.danger{border-color:color-mix(in srgb,var(--red) 28%,#fff);}
    .capt{display:flex;gap:8px;justify-content:flex-end;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:-8px;margin-bottom:13px;}

    /* ج — توقيت بارز فوق + مسح خفيف تحت */
    .btnTime{width:100%;min-height:50px;border-radius:14px;font-family:inherit;font-weight:900;font-size:15px;color:#fff;margin-bottom:13px;
        background:linear-gradient(180deg,#24498A 0%,var(--royal) 55%,#0A2148 100%);border:1px solid #1B3E75;
        box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 5px 13px rgba(15,44,92,.3);}

    /* ج المعدّل — مربع توقيت صغير رصاصي فوق يمين بجانب العنوان */
    .headC{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
    .headC h1{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--royal);}
    .timeSm{display:inline-flex;align-items:center;gap:6px;min-height:36px;border-radius:11px;padding:0 12px;
        font-family:inherit;font-weight:800;font-size:12.5px;color:var(--royal);white-space:nowrap;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);
        box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.1);}
    .timeSm.icononly{width:36px;padding:0;justify-content:center;font-size:15px;}
    .clearLink{display:block;width:100%;text-align:center;margin-top:21px;background:none;border:0;font-family:inherit;
        font-size:13px;font-weight:800;color:var(--red);text-decoration:underline;padding:10px;}

    /* نافذة تعديل الخانة (توضيح الحذف) */
    .sheet{position:fixed;inset:0;z-index:55;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;}
    .sheet .card{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:21px 17px calc(21px + env(safe-area-inset-bottom));
        box-shadow:0 -8px 26px rgba(0,0,0,.2);}
    .sheet .grab{width:38px;height:4px;border-radius:99px;background:#CFC9BA;margin:0 auto 15px;}
    .sheet h3{margin:0 0 4px;font-size:17px;font-weight:900;color:var(--royal);}
    .sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:15px;}
    .fld{margin-bottom:13px;}
    .fld label{display:block;font-size:12.5px;font-weight:800;color:var(--royal);margin-bottom:6px;}
    .fld .inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--border);background:#fff;
        padding:0 13px;display:flex;align-items:center;font-size:14px;color:var(--text);}
    .sheet .acts{display:flex;gap:8px;margin-top:17px;}
    .sheet .acts .save{flex:1;min-height:50px;border-radius:13px;border:0;background:var(--royal);color:#fff;font-family:inherit;font-weight:900;font-size:15px;}
    .sheet .acts .del{min-height:50px;border-radius:13px;padding:0 17px;border:1.5px solid color-mix(in srgb,var(--red) 35%,#fff);
        background:color-mix(in srgb,var(--red) 6%,#fff);color:var(--red);font-family:inherit;font-weight:800;font-size:14px;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const TODAY=2;
const PT=['07:00','07:55','08:50','09:45','10:50','11:45'];
const W={
 0:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:'wait',4:{c:'الرابع/أ',s:'رياضيات'},5:{c:'الخامس/ج',s:'لغتي'}},
 1:{1:{c:'السادس/ب',s:'علوم'},2:{c:'الرابع/أ',s:'رياضيات'},4:{c:'الخامس/ج',s:'لغتي'},5:'wait'},
 2:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:{c:'الرابع/أ',s:'رياضيات'},4:'wait',5:{c:'الخامس/ج',s:'لغتي'},6:{c:'السادس/ب',s:'علوم'}},
 3:{1:{c:'الخامس/ج',s:'لغتي'},2:{c:'الرابع/أ',s:'رياضيات'},3:{c:'السادس/ب',s:'علوم'}},
 4:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'الخامس/ج',s:'لغتي'},5:{c:'السادس/ب',s:'علوم'}},
};
const NP=6;
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function grid(){
  let head='<th class="corner">اليوم</th>';
  for(let p=1;p<=NP;p++)head+=`<th>ح${AR(p)}<span class="pt num">${PT[p-1]}</span></th>`;
  let body='';
  DAYS.forEach((d,i)=>{
    let tds=`<td class="dc">${d}</td>`;
    for(let p=1;p<=NP;p++){const cell=W[i][p];
      if(!cell)tds+=`<td class="cell"><div class="cellbox empty">+</div></td>`;
      else if(cell==='wait')tds+=`<td class="cell"><div class="cellbox wait">انتظار</div></td>`;
      else tds+=`<td class="cell"><div class="cellbox cls"><span class="c">${cell.c}</span><span class="s">${cell.s}</span></div></td>`;
    }
    body+=`<tr class="${i===TODAY?'today':''}">${tds}</tr>`;
  });
  return `<div class="gwrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
   <p class="hintline">← اسحب لعرض بقية الحصص · اضغط أي خانة للتعديل</p>`;
}

const sheet = `
  <div class="sheet">
    <div class="card">
      <div class="grab"></div>
      <h3>الثلاثاء — الحصة ٣</h3>
      <div class="sub">اضغط أي خانة في الجدول لتفتح هذه النافذة</div>
      <div class="fld"><label>الفصل</label><div class="inp">الرابع الابتدائي / أ — رياضيات ⌄</div></div>
      <div class="fld"><label>الموضوع / الدرس (اختياري)</label><div class="inp" style="color:var(--muted)">مثلاً: جمع الأعداد</div></div>
      <div class="acts">
        <button class="save">حفظ</button>
        <button class="del">🗑️ إزالة الحصة</button>
      </div>
    </div>
  </div>`;

const D=[
 ['أ — زران واضحان','⏰ توقيت الحصص و🗑️ مسح الجدول كزرّين نصيّين فوق الجدول — الأوضح لمن يبحث عنهما',
  `<h1 class="t">📅 الجدول الأسبوعي</h1>
   <div class="barA"><button>⏰ توقيت الحصص</button><button class="danger">🗑️ مسح الجدول</button></div>
   ${grid()}`],
 ['ب — أيقونتان بجانب العنوان','أيقونتان صغيرتان مع تسمية تحتهما — يوفّر مساحة والجدول يبان أعلى',
  `<div class="headB"><h1>📅 الجدول الأسبوعي</h1><div class="iconb">⏰</div><div class="iconb danger">🗑️</div></div>
   <div class="capt"><span>توقيت الحصص</span><span style="width:8px"></span><span>مسح الجدول</span></div>
   ${grid()}`],
 ['ج١ — مربع صغير بالنص','مربع رصاصي صغير «⏰ توقيت الحصص» فوق يمين بجانب العنوان، ومسح الجدول رابط أحمر خفيف تحت الجدول',
  `<div class="headC"><h1>📅 الجدول الأسبوعي</h1><button class="timeSm">⏰ توقيت الحصص</button></div>
   ${grid()}
   <button class="clearLink">🗑️ مسح الجدول كاملاً</button>`],
 ['ج٢ — أيقونة فقط','نفسه لكن المربع أصغر ما يمكن: أيقونة الساعة فقط ٣٦×٣٦ — أقصى توفير للمساحة',
  `<div class="headC"><h1>📅 الجدول الأسبوعي</h1><button class="timeSm icononly">⏰</button></div>
   ${grid()}
   <button class="clearLink">🗑️ مسح الجدول كاملاً</button>`],
 ['ج٣ — الكحلي السابق','للمقارنة: زر التوقيت الكحلي العريض السابق',
  `<h1 class="t">📅 الجدول الأسبوعي</h1>
   <button class="btnTime">⏰ توقيت الحصص</button>
   ${grid()}
   <button class="clearLink">🗑️ مسح الجدول كاملاً</button>`],
 ['نافذة التعديل والحذف','هكذا تظهر عند الضغط على أي خانة — وفيها زر «إزالة الحصة»',
  `<h1 class="t">📅 الجدول الأسبوعي</h1>
   <div class="barA"><button>⏰ توقيت الحصص</button><button class="danger">🗑️ مسح الجدول</button></div>
   ${grid()}${sheet}`],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
