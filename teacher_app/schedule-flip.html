<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الجدول — الحصص يمين والأيام فوق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--amber:#F59E0B;--red:#DC2626;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 14px 130px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:60;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 13px;font-family:inherit;font-size:12px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 3px 14px;line-height:1.6;}

    .headC{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
    .headC h1{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--royal);}
    .timeSm{display:inline-flex;align-items:center;min-height:36px;border-radius:11px;padding:0 12px;
        font-family:inherit;font-weight:800;font-size:12.5px;color:var(--royal);white-space:nowrap;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.1);}
    .clearLink{display:block;width:100%;text-align:center;margin-top:21px;background:none;border:0;font-family:inherit;
        font-size:13px;font-weight:800;color:var(--red);text-decoration:underline;padding:10px;}
    .hintline{text-align:center;color:var(--muted);font-size:11.5px;margin-top:9px;}
    .dots{display:flex;gap:5px;justify-content:center;margin-top:10px;}
    .dots i{width:6px;height:6px;border-radius:50%;background:#D8D2C2;}
    .dots i.on{background:var(--royal);width:18px;border-radius:99px;}

    /* ===== القاعدة: صفوف = حصص · أعمدة = أيام ===== */
    .gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
    .gwrap::-webkit-scrollbar{height:0;}
    table.gt{border-collapse:separate;border-spacing:0 7px;background:transparent;}
    table.gt th,table.gt td{padding:0;}
    .gt thead th{background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;font-weight:800;
        padding:10px 4px;font-size:12.5px;text-align:center;}
    .gt thead th:first-child{border-radius:0 12px 12px 0;}
    .gt thead th:last-child{border-radius:12px 0 0 12px;}
    .gt thead th.corner{position:sticky;right:0;z-index:2;}
    .gt thead th.todaycol{background:linear-gradient(180deg,#D6B96F,var(--gold));color:var(--royal);}
    .gt tbody tr{background:#fff;box-shadow:0 3px 8px rgba(16,24,40,.07);}
    .gt tbody td:first-child{border-radius:0 12px 12px 0;}
    .gt tbody td:last-child{border-radius:12px 0 0 12px;}
    /* عمود الحصة الثابت على اليمين */
    .gt td.pc{background:var(--gray);color:var(--royal);position:sticky;right:0;z-index:1;text-align:center;
        border-left:1.5px solid color-mix(in srgb,var(--gray) 82%,#000);}
    .gt td.pc b{display:block;font-size:13px;font-weight:900;}
    .gt td.pc span{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-top:1px;}
    .gt td.cell{border-left:1px solid var(--border);height:62px;padding:6px;}
    .gt td.cell.todaycol{background:color-mix(in srgb,var(--gold) 9%,#fff);}
    .cellbox{height:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
    .cellbox.cls .c{font-size:12.5px;font-weight:900;color:var(--royal);}
    .cellbox.cls .s{font-size:10px;color:var(--muted);font-weight:700;}
    .cellbox.wait{background:color-mix(in srgb,var(--amber) 12%,#fff);border:1px solid color-mix(in srgb,var(--amber) 32%,#fff);
        color:#B45309;font-size:11px;font-weight:800;}
    .cellbox.empty{color:#CBBE9E;font-size:19px;}

    /* أ — بتمرير أفقي (أعمدة ثابتة العرض) */
    .v-a table.gt{width:max-content;min-width:100%;}
    .v-a .gt thead th{min-width:84px;}
    .v-a .gt thead th.corner,.v-a .gt td.pc{min-width:54px;}

    /* ب — بلا تمرير: الأيام الخمسة تتوزع على العرض */
    .v-b .gwrap{overflow-x:visible;}
    .v-b table.gt{width:100%;table-layout:fixed;}
    .v-b .gt thead th.corner,.v-b .gt td.pc{width:46px;}
    .v-b .gt thead th{font-size:11.5px;padding:9px 2px;}
    .v-b .gt td.cell{padding:5px;height:60px;}
    .v-b .cellbox.cls .c{font-size:11px;}
    .v-b .cellbox.cls .s{font-size:9px;}
    .v-b .cellbox.wait{font-size:9.5px;}
    .v-b .gt td.pc b{font-size:12px;} .v-b .gt td.pc span{font-size:9px;}

    /* ج — بلا تمرير + أسماء الأيام مختصرة وخط أكبر للفصل */
    .v-c .gwrap{overflow-x:visible;}
    .v-c table.gt{width:100%;table-layout:fixed;}
    .v-c .gt thead th.corner,.v-c .gt td.pc{width:44px;}
    .v-c .gt thead th{font-size:12.5px;padding:10px 2px;}
    .v-c .gt td.cell{padding:5px;height:64px;}
    .v-c .cellbox.cls .c{font-size:12px;}
    .v-c .cellbox.cls .s{font-size:9px;}
    .v-c .cellbox.wait{font-size:9.5px;}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const DAYS_SHORT=['أحد','اثنين','ثلاثاء','أربعاء','خميس'];
const TODAY=2;
const PT=['07:00','07:55','08:50','09:45','10:50','11:45','12:40'];
const W={
 0:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:'wait',4:{c:'الرابع/أ',s:'رياضيات'},5:{c:'الخامس/ج',s:'لغتي'}},
 1:{1:{c:'السادس/ب',s:'علوم'},2:{c:'الرابع/أ',s:'رياضيات'},4:{c:'الخامس/ج',s:'لغتي'},5:'wait'},
 2:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:{c:'الرابع/أ',s:'رياضيات'},4:'wait',5:{c:'الخامس/ج',s:'لغتي'},6:{c:'السادس/ب',s:'علوم'}},
 3:{1:{c:'الخامس/ج',s:'لغتي'},2:{c:'الرابع/أ',s:'رياضيات'},3:{c:'السادس/ب',s:'علوم'}},
 4:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'الخامس/ج',s:'لغتي'},5:{c:'السادس/ب',s:'علوم'}},
};
const NP=7;
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* صفوف = حصص · أعمدة = أيام */
function grid(short){
  const names = short?DAYS_SHORT:DAYS;
  let head='<th class="corner">الحصة</th>';
  names.forEach((d,i)=>{head+=`<th class="${i===TODAY?'todaycol':''}">${d}</th>`;});
  let body='';
  for(let p=1;p<=NP;p++){
    let tds=`<td class="pc"><b class="num">ح${AR(p)}</b><span class="num">${PT[p-1]}</span></td>`;
    DAYS.forEach((d,i)=>{
      const cell=W[i][p];
      const tc=i===TODAY?'todaycol':'';
      if(!cell)tds+=`<td class="cell ${tc}"><div class="cellbox empty">+</div></td>`;
      else if(cell==='wait')tds+=`<td class="cell ${tc}"><div class="cellbox wait">انتظار</div></td>`;
      else tds+=`<td class="cell ${tc}"><div class="cellbox cls"><span class="c">${cell.c}</span><span class="s">${cell.s}</span></div></td>`;
    });
    body+=`<tr>${tds}</tr>`;
  }
  return `<div class="gwrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const page=(cls,short,dots)=>`
  <div class="${cls}">
    <div class="headC"><h1>📅 الجدول الأسبوعي</h1><button class="timeSm">توقيت الحصص</button></div>
    ${grid(short)}
    ${dots?'<div class="dots"><i class="on"></i><i></i><i></i></div>':''}
    <p class="hintline">${dots?'اسحب لعرض بقية الأيام · ':''}اضغط أي خانة للتعديل</p>
    <button class="clearLink">🗑️ مسح الجدول كاملاً</button>
  </div>`;

const D=[
 ['أ · تمرير أفقي','الحصص يمين والأيام فوق — أعمدة عريضة (٨٤px) مع تمرير أفقي ونقاط',()=>page('v-a',false,true)],
 ['ب · بلا تمرير','الأيام الخمسة كلها ظاهرة في الشاشة — لا تمرير أفقي إطلاقاً',()=>page('v-b',false,false)],
 ['ج · بلا تمرير + أسماء مختصرة','نفسه لكن أسماء الأيام مختصرة (أحد/اثنين) فيتّسع مكان أكبر للفصل',()=>page('v-c',true,false)],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc,fn],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+fn();
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
