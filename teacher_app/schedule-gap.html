<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الجدول — الفراغ بين الأيام</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--amber:#F59E0B;--red:#DC2626;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;padding:14px 14px 130px;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:60;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 13px;font-family:inherit;font-size:12px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal-name{font-size:12.5px;font-weight:800;color:var(--muted);margin:4px 3px 14px;line-height:1.6;}

    .headC{display:flex;align-items:center;gap:9px;margin-bottom:13px;}
    .headC h1{flex:1;margin:0;font-size:20px;font-weight:900;color:var(--royal);}
    .timeSm{display:inline-flex;align-items:center;min-height:36px;border-radius:11px;padding:0 12px;
        font-family:inherit;font-weight:800;font-size:12.5px;color:var(--royal);white-space:nowrap;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.1);}
    .clearLink{display:block;width:100%;text-align:center;margin-top:21px;background:none;border:0;font-family:inherit;
        font-size:13px;font-weight:800;color:var(--red);text-decoration:underline;padding:10px;}
    .hintline{text-align:center;color:var(--muted);font-size:11.5px;margin-top:9px;}

    /* ===== القاعدة المشتركة ===== */
    table.gt{border-collapse:separate;width:100%;table-layout:fixed;background:transparent;}
    .gt th,.gt td{padding:0;}
    .gt thead th{background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;font-weight:900;
        padding:9px 2px;font-size:11.5px;text-align:center;}
    .gt thead th.todaycol{background:linear-gradient(180deg,#D6B96F,var(--gold));color:var(--royal);}
    .gt td.pc{background:var(--gray);color:var(--royal);width:46px;text-align:center;}
    .gt td.pc b{display:block;font-size:12px;font-weight:900;}
    .gt td.pc span{display:block;font-size:9px;color:var(--muted);font-weight:700;margin-top:1px;}
    .gt td.cell{height:60px;padding:5px;background:#fff;}
    .gt td.cell.todaycol{background:color-mix(in srgb,var(--gold) 9%,#fff);}
    .cellbox{height:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
    .cellbox .c{font-size:11px;font-weight:900;color:var(--royal);}
    .cellbox .s{font-size:9px;color:var(--muted);font-weight:700;}
    .cellbox.wait{background:color-mix(in srgb,var(--amber) 12%,#fff);border:1px solid color-mix(in srgb,var(--amber) 32%,#fff);
        color:#B45309;font-size:9.5px;font-weight:800;}
    .cellbox.empty{color:#CBBE9E;font-size:17px;}

    /* ── الوضع الحالي (للمقارنة): فراغ بين الحصص ── */
    .v-now table.gt{border-spacing:0 7px;}
    .v-now .gt thead th:first-child{border-radius:0 12px 12px 0;}
    .v-now .gt thead th:last-child{border-radius:12px 0 0 12px;}
    .v-now .gt tbody tr{background:#fff;box-shadow:0 3px 8px rgba(16,24,40,.07);}
    .v-now .gt tbody td:first-child{border-radius:0 12px 12px 0;}
    .v-now .gt tbody td:last-child{border-radius:12px 0 0 12px;}
    .v-now .gt td.pc{border-left:1.5px solid color-mix(in srgb,var(--gray) 82%,#000);}
    .v-now .gt td.cell{border-left:1px solid var(--border);}

    /* ===== الفراغ بين الأيام: كل يوم عمود مستقل ===== */
    .flip table.gt{border-spacing:7px 0;}
    .flip .gt thead th{border-radius:12px 12px 0 0;}
    .flip .gt tbody tr:last-child td{border-radius:0 0 12px 12px;}
    .flip .gt td{box-shadow:2px 0 6px -5px rgba(16,24,40,.35),-2px 0 6px -5px rgba(16,24,40,.35);}
    .flip .gt tbody tr:last-child td{box-shadow:0 4px 8px -3px rgba(16,24,40,.16);}

    /* أ — خط رفيع فاصل بين الحصص */
    .v-a .gt tbody tr:not(:last-child) td{border-bottom:1px solid var(--border);}
    .v-a .gt tbody tr:not(:last-child) td.pc{border-bottom:1px solid color-mix(in srgb,var(--gray) 84%,#000);}

    /* ب — بلا أي فاصل بين الحصص */

    /* ج — فراغ في الاتجاهين: ٧px بين الأيام و٤px بين الحصص */
    .v-c table.gt{border-spacing:7px 4px;}
    .v-c .gt thead th{border-radius:12px;}
    .v-c .gt tbody td{border-radius:10px;}
    .v-c .gt tbody tr:last-child td{border-radius:10px;}
    .v-c .gt td{box-shadow:0 2px 5px rgba(16,24,40,.07);}
    .v-c .gt tbody tr:last-child td{box-shadow:0 2px 5px rgba(16,24,40,.07);}
</style>
</head>
<body>
<div id="root"></div>
<div class="switcher" id="switcher"></div>

<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const TODAY=2;
const PT=['07:00','07:55','08:50','09:45','10:50','11:45','12:40'];
const W={
 0:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:'wait',4:{c:'الرابع/أ',s:'رياضيات'},5:{c:'الخامس/ج',s:'لغتي'}},
 1:{1:{c:'السادس/ب',s:'علوم'},2:{c:'الرابع/أ',s:'رياضيات'},4:{c:'الخامس/ج',s:'لغتي'},5:'wait'},
 2:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'السادس/ب',s:'علوم'},3:{c:'الرابع/أ',s:'رياضيات'},4:'wait',5:{c:'الخامس/ج',s:'لغتي'},6:{c:'السادس/ب',s:'علوم'}},
 3:{1:{c:'الخامس/ج',s:'لغتي'},2:{c:'الرابع/أ',s:'رياضيات'},3:{c:'السادس/ب',s:'علوم'}},
 4:{1:{c:'الرابع/أ',s:'رياضيات'},2:{c:'الخامس/ج',s:'لغتي'},5:{c:'السادس/ب',s:'علوم'}},
};
const NP=7;
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

function grid(){
  let head='<th class="corner">الحصة</th>';
  DAYS.forEach((d,i)=>{head+=`<th class="${i===TODAY?'todaycol':''}">${d}</th>`;});
  let body='';
  for(let p=1;p<=NP;p++){
    let tds=`<td class="pc"><b class="num">ح${AR(p)}</b><span class="num">${PT[p-1]}</span></td>`;
    DAYS.forEach((d,i)=>{
      const cell=W[i][p];
      const tc=i===TODAY?'todaycol':'';
      if(!cell)tds+=`<td class="cell ${tc}"><div class="cellbox empty">+</div></td>`;
      else if(cell==='wait')tds+=`<td class="cell ${tc}"><div class="cellbox wait">انتظار</div></td>`;
      else tds+=`<td class="cell ${tc}"><div class="cellbox"><span class="c">${cell.c}</span><span class="s">${cell.s}</span></div></td>`;
    });
    body+=`<tr>${tds}</tr>`;
  }
  return `<table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

const page=cls=>`
  <div class="${cls}">
    <div class="headC"><h1>📅 الجدول الأسبوعي</h1><button class="timeSm">توقيت الحصص</button></div>
    ${grid()}
    <p class="hintline">اضغط أي خانة للتعديل</p>
    <button class="clearLink">🗑️ مسح الجدول كاملاً</button>
  </div>`;

const D=[
 ['أ · خط فاصل','الفراغ بين الأيام — كل يوم عمود مستقل، والحصص يفصلها خط رفيع'],
 ['ب · بلا فاصل','الفراغ بين الأيام — والحصص متلاصقة تماماً بلا أي خط'],
 ['ج · فراغ بالاتجاهين','٧px بين الأيام و٤px بين الحصص — كل خانة مربع مستقل'],
 ['الحالي','للمقارنة فقط: الفراغ الحالي بين الحصص'],
];
const CLS=['flip v-a','flip v-b','flip v-c','v-now'];

const root=document.getElementById('root'),sw=document.getElementById('switcher');
D.forEach(([name,desc],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal-name">${name} · ${desc}</div>`+page(CLS[i]);
  root.appendChild(sc);
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
