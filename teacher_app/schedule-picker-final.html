<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الاختيار باللمس — إضافة ج + تعديل ب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--amber:#F59E0B;--red:#DC2626;--green:#059669;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:80;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 13px;font-family:inherit;font-size:12px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal{position:fixed;top:0;right:0;left:0;z-index:70;background:rgba(17,17,17,.85);color:#fff;font-size:11.5px;font-weight:700;padding:8px 12px;line-height:1.6;}

    .bgpage{padding:52px 14px 0;filter:saturate(.9);}
    .bgpage .hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
    .bgpage h1{flex:1;margin:0;font-size:19px;font-weight:900;color:var(--royal);}
    .bgpage .tb{min-height:34px;border-radius:11px;padding:0 11px;display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--royal);
        background:linear-gradient(150deg,#fff,var(--gray));border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);}
    .minigrid{border-collapse:separate;border-spacing:0 7px;width:100%;}
    .minigrid th{background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;font-size:11px;font-weight:800;padding:8px 4px;}
    .minigrid th:first-child{border-radius:0 12px 12px 0;} .minigrid th:last-child{border-radius:12px 0 0 12px;}
    .minigrid tr.b{background:#fff;box-shadow:0 3px 8px rgba(16,24,40,.07);}
    .minigrid td:first-child{border-radius:0 12px 12px 0;} .minigrid td:last-child{border-radius:12px 0 0 12px;}
    .minigrid td.d{background:var(--gray);color:var(--royal);font-weight:900;font-size:12px;text-align:center;width:54px;}
    .minigrid td.c{height:58px;border-left:1px solid var(--border);text-align:center;color:#CBBE9E;font-size:18px;}
    .minigrid td.c b{display:block;font-size:12.5px;color:var(--royal);}
    .minigrid td.c span{display:block;font-size:10px;color:var(--muted);font-weight:700;}
    .minigrid td.c.tgt{outline:2px solid var(--gold);border-radius:9px;}

    .sheet{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;}
    .card{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:17px 15px calc(90px + env(safe-area-inset-bottom));
        box-shadow:0 -10px 30px rgba(0,0,0,.24);max-height:88vh;overflow-y:auto;}
    .grab{width:38px;height:4px;border-radius:99px;background:#CFC9BA;margin:0 auto 14px;}
    .shead{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
    .shead .slot{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0;box-shadow:0 4px 11px rgba(15,44,92,.3);}
    .shead .slot b{font-size:15px;font-weight:900;} .shead .slot span{font-size:9px;opacity:.75;}
    .shead .tt h3{margin:0;font-size:17px;font-weight:900;color:var(--royal);}
    .shead .tt div{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
    .lbl{font-size:12px;font-weight:800;color:var(--muted);margin:0 3px 9px;}

    .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
    .ccard{border-radius:15px;padding:12px;text-align:right;position:relative;cursor:pointer;transition:transform .12s;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.09);}
    .ccard:active{transform:scale(.97);}
    .ccard .g{font-size:14px;font-weight:900;color:var(--royal);}
    .ccard .s{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px;}
    .ccard.on{background:linear-gradient(180deg,#24498A,var(--royal));border-color:var(--royal);box-shadow:0 6px 15px rgba(15,44,92,.33);}
    .ccard.on .g{color:#fff;} .ccard.on .s{color:rgba(201,169,97,.95);}
    .ccard.on::after{content:"✓";position:absolute;top:8px;left:10px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:var(--royal);
        font-size:12px;font-weight:900;display:grid;place-items:center;}
    .ccard.wait{background:color-mix(in srgb,var(--amber) 10%,#fff);border-color:color-mix(in srgb,var(--amber) 35%,#fff);}
    .ccard.wait .g{color:#B45309;}
    .ccard.wait.on{background:linear-gradient(180deg,#D97706,#B45309);border-color:#B45309;}
    .ccard.wait.on .g{color:#fff;} .ccard.wait.on .s{color:rgba(255,255,255,.85);}

    /* سطر الموضوع القابل للضغط */
    .toprow{display:flex;align-items:center;gap:10px;margin-top:13px;border-radius:14px;padding:12px 13px;cursor:pointer;
        background:#fff;border:1.5px solid var(--border);box-shadow:0 2px 6px rgba(16,24,40,.06);}
    .toprow .em{font-size:17px;}
    .toprow .tx{flex:1;min-width:0;}
    .toprow .k{font-size:11px;color:var(--muted);font-weight:700;}
    .toprow .v{font-size:13.5px;font-weight:800;color:var(--royal);margin-top:1px;}
    .toprow .v.ph{color:#B9B2A2;font-weight:700;}
    .toprow .ar{color:var(--muted);font-size:15px;}

    /* حقل موضوع بحفظ تلقائي */
    .fld{margin-top:13px;}
    .fld .inp{width:100%;min-height:48px;border-radius:13px;border:1.5px solid var(--border);background:#fff;
        padding:0 13px;display:flex;align-items:center;font-size:13.5px;color:var(--text);}
    .autosave{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:800;margin:6px 3px 0;}

    .btnD{width:100%;min-height:52px;border-radius:14px;margin-top:15px;border:1.5px solid color-mix(in srgb,var(--red) 35%,#fff);
        background:color-mix(in srgb,var(--red) 6%,#fff);color:var(--red);font-family:inherit;font-weight:800;font-size:14.5px;}
    .btnG{width:100%;min-height:50px;border-radius:14px;margin-top:9px;border:1.5px solid var(--border);background:#fff;
        color:var(--muted);font-family:inherit;font-weight:800;font-size:14px;}
    .hintTap{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:11px;}
    /* إشعار الحفظ الفوري */
    .toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);z-index:90;
        background:var(--green);color:#fff;border-radius:99px;padding:9px 18px;font-size:13px;font-weight:800;
        box-shadow:0 6px 18px rgba(5,150,105,.4);opacity:0;transition:opacity .25s;}
    .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast">✓ تم الحفظ</div>
<div class="switcher" id="switcher"></div>

<script>
const CLASSES=[{g:'الرابع/أ',s:'رياضيات'},{g:'السادس/ب',s:'علوم'},{g:'الخامس/ج',s:'لغتي'},{g:'الثالث/أ',s:'رياضيات'}];

function bg(target){
  const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
  let rows='';
  DAYS.forEach((d,i)=>{
    let tds=`<td class="d">${d}</td>`;
    for(let p=1;p<=3;p++){
      const filled=(i===0&&p<3)||(i===2&&p===1);
      const tgt=(i===2&&p===3&&target==='empty')||(i===2&&p===1&&target==='filled');
      tds+=`<td class="c ${tgt?'tgt':''}">${filled?'<b>الرابع/أ</b><span>رياضيات</span>':'+'}</td>`;
    }
    rows+=`<tr class="b">${tds}</tr>`;
  });
  return `<div class="bgpage">
    <div class="hd"><h1>📅 الجدول الأسبوعي</h1><span class="tb">توقيت الحصص</span></div>
    <table class="minigrid"><thead><tr><th>اليوم</th><th>ح١<br>07:00</th><th>ح٢<br>07:55</th><th>ح٣<br>08:50</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
const head=(t,sub)=>`<div class="grab"></div>
  <div class="shead">
    <div class="slot"><b class="num">ح٣</b><span>الحصة</span></div>
    <div class="tt"><h3>${t}</h3><div class="num">${sub}</div></div>
  </div>`;
const cgrid=(sel)=>`<div class="cgrid">
  ${CLASSES.map((c,i)=>`<div class="ccard ${i===sel?'on':''}" data-pick="${i}">
      <div class="g">${c.g}</div><div class="s">${c.s}</div></div>`).join('')}
  <div class="ccard wait ${sel===9?'on':''}" data-pick="9" style="grid-column:1/-1">
    <div class="g">⏳ حصة انتظار</div><div class="s">بلا فصل</div></div>
</div>`;

const S=[
 ['إضافة ج — لمسة واحدة','خانة فارغة: تضغط الفصل فيُضاف فوراً وتُغلق اللوحة — بلا زر حفظ',
  bg('empty')+`<div class="sheet"><div class="card">
    ${head('اختر الفصل','الثلاثاء · ٠٨:٥٠ — ٠٩:٣٥')}
    <div class="lbl">اضغط الفصل ليُضاف فوراً</div>
    ${cgrid(-1)}
    <button class="btnG">إلغاء</button>
  </div></div>`],

 ['تعديل ب١ — لمس + موضوع تلقائي','حصة معبّأة: الفصل الحالي بـ✓، تضغط فصلاً آخر فيتغيّر فوراً. الموضوع يُحفظ تلقائياً وأنت تكتب — بلا زر حفظ',
  bg('filled')+`<div class="sheet"><div class="card">
    ${head('الحصة الثالثة','الثلاثاء · ٠٨:٥٠ — ٠٩:٣٥')}
    <div class="lbl">الفصل — اضغط لتغييره فوراً</div>
    ${cgrid(0)}
    <div class="fld">
      <div class="lbl">الموضوع / الدرس</div>
      <div class="inp">جمع الأعداد</div>
      <div class="autosave">✓ يُحفظ تلقائياً</div>
    </div>
    <button class="btnD">🗑️ إزالة الحصة من الجدول</button>
    <button class="btnG">تم</button>
  </div></div>`],

 ['تعديل ب٢ — لمس فقط','الأبسط: الشبكة + الموضوع سطر تضغطه ليُحرَّر + إزالة — بلا أي حقول ظاهرة ولا زر حفظ',
  bg('filled')+`<div class="sheet"><div class="card">
    ${head('الحصة الثالثة','الثلاثاء · ٠٨:٥٠ — ٠٩:٣٥')}
    <div class="lbl">الفصل — اضغط لتغييره فوراً</div>
    ${cgrid(0)}
    <div class="toprow"><span class="em">📖</span>
      <div class="tx"><div class="k">الموضوع / الدرس</div><div class="v">جمع الأعداد</div></div>
      <span class="ar">‹</span></div>
    <button class="btnD">🗑️ إزالة الحصة من الجدول</button>
    <div class="hintTap">اضغط خارج اللوحة للإغلاق</div>
  </div></div>`],

 ['تعديل ب٢ — بلا موضوع','نفسه حين لا يوجد موضوع مسجّل: السطر يعرض «أضف موضوع الدرس»',
  bg('filled')+`<div class="sheet"><div class="card">
    ${head('الحصة الثالثة','الثلاثاء · ٠٨:٥٠ — ٠٩:٣٥')}
    <div class="lbl">الفصل — اضغط لتغييره فوراً</div>
    ${cgrid(1)}
    <div class="toprow"><span class="em">📖</span>
      <div class="tx"><div class="k">الموضوع / الدرس</div><div class="v ph">أضف موضوع الدرس (اختياري)</div></div>
      <span class="ar">‹</span></div>
    <button class="btnD">🗑️ إزالة الحصة من الجدول</button>
    <div class="hintTap">اضغط خارج اللوحة للإغلاق</div>
  </div></div>`],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher'),toast=document.getElementById('toast');
function ping(){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1100);}
S.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  sc.querySelectorAll('[data-pick]').forEach(el=>{
    el.onclick=()=>{
      sc.querySelectorAll('.ccard').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      ping();   // محاكاة: يُحفظ فوراً
    };
  });
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
