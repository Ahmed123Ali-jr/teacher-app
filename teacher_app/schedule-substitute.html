<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إسناد فصل لحصة الانتظار</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
    :root{--bg:#F4F1EA;--text:#101828;--muted:#8A8578;--border:#E7E3D8;--royal:#0F2C5C;--gold:#C9A961;--gray:#ECEAE3;--amber:#F59E0B;--red:#DC2626;--green:#059669;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;padding:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .screen{display:none;min-height:100vh;}
    .screen.active{display:block;}
    .num{font-variant-numeric:tabular-nums;}
    .switcher{position:fixed;bottom:0;right:0;left:0;z-index:80;background:rgba(15,44,92,.96);backdrop-filter:blur(10px);padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;}
    .switcher button{flex-shrink:0;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:99px;padding:9px 13px;font-family:inherit;font-size:12px;font-weight:800;white-space:nowrap;}
    .switcher button.on{background:#fff;color:var(--royal);}
    .pal{position:fixed;top:0;right:0;left:0;z-index:70;background:rgba(17,17,17,.85);color:#fff;font-size:11.5px;font-weight:700;padding:8px 12px;line-height:1.6;}

    .bgpage{padding:52px 14px 0;filter:saturate(.9);}
    .bgpage .hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
    .bgpage h1{flex:1;margin:0;font-size:19px;font-weight:900;color:var(--royal);}
    .bgpage .tb{min-height:34px;border-radius:11px;padding:0 11px;display:inline-flex;align-items:center;font-size:12px;font-weight:800;color:var(--royal);
        background:linear-gradient(150deg,#fff,var(--gray));border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);}
    .minigrid{border-collapse:separate;border-spacing:0 7px;width:100%;}
    .minigrid th{background:linear-gradient(180deg,#24498A,var(--royal));color:#fff;font-size:11px;font-weight:800;padding:8px 4px;}
    .minigrid th:first-child{border-radius:0 12px 12px 0;} .minigrid th:last-child{border-radius:12px 0 0 12px;}
    .minigrid tr.b{background:#fff;box-shadow:0 3px 8px rgba(16,24,40,.07);}
    .minigrid td:first-child{border-radius:0 12px 12px 0;} .minigrid td:last-child{border-radius:12px 0 0 12px;}
    .minigrid td.d{background:var(--gray);color:var(--royal);font-weight:900;font-size:12px;text-align:center;width:54px;}
    .minigrid td.c{height:58px;border-left:1px solid var(--border);text-align:center;color:#CBBE9E;font-size:18px;}
    .minigrid td.c b{display:block;font-size:12.5px;color:var(--royal);}
    .minigrid td.c span{display:block;font-size:10px;color:var(--muted);font-weight:700;}
    .minigrid td.c.w{color:#B45309;font-size:11px;font-weight:800;}
    .minigrid td.c.w b{color:#B45309;font-size:12px;} .minigrid td.c.w span{color:#B45309;opacity:.75;}
    .minigrid td.c.tgt{outline:2px solid var(--gold);border-radius:9px;}

    .sheet{position:fixed;inset:0;z-index:60;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;}
    .card{width:100%;background:var(--bg);border-radius:26px 26px 0 0;padding:17px 15px calc(90px + env(safe-area-inset-bottom));
        box-shadow:0 -10px 30px rgba(0,0,0,.24);max-height:88vh;overflow-y:auto;}
    .grab{width:38px;height:4px;border-radius:99px;background:#CFC9BA;margin:0 auto 14px;}
    .shead{display:flex;align-items:center;gap:10px;margin-bottom:13px;}
    .shead .slot{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,#D97706,#B45309);color:#fff;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0;box-shadow:0 4px 11px rgba(180,83,9,.32);}
    .shead .slot b{font-size:15px;font-weight:900;} .shead .slot span{font-size:9px;opacity:.8;}
    .shead .tt{flex:1;min-width:0;}
    .shead .tt h3{margin:0;font-size:17px;font-weight:900;color:var(--royal);}
    .shead .tt div{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
    .backb{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--royal);flex-shrink:0;
        background:#fff;border:1.5px solid var(--border);box-shadow:0 2px 6px rgba(16,24,40,.07);}
    .lbl{font-size:12px;font-weight:800;color:var(--muted);margin:0 3px 9px;}
    .note{display:flex;gap:8px;align-items:flex-start;border-radius:13px;padding:10px 12px;margin-bottom:13px;
        background:color-mix(in srgb,var(--amber) 9%,#fff);border:1px solid color-mix(in srgb,var(--amber) 28%,#fff);}
    .note .em{font-size:15px;}
    .note .t{font-size:11.5px;color:#8A5A10;font-weight:700;line-height:1.6;}

    /* حبّات وشبكات */
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px;}
    .chip{border-radius:12px;padding:9px 15px;font-size:13px;font-weight:800;color:var(--royal);cursor:pointer;
        background:#fff;border:1.5px solid var(--border);box-shadow:0 2px 6px rgba(16,24,40,.06);}
    .chip.on{background:linear-gradient(180deg,#24498A,var(--royal));border-color:var(--royal);color:#fff;box-shadow:0 4px 11px rgba(15,44,92,.3);}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .gcell{border-radius:13px;padding:12px 6px;text-align:center;font-size:13px;font-weight:900;color:var(--royal);cursor:pointer;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.09);}
    .gcell.on{background:linear-gradient(180deg,#24498A,var(--royal));border-color:var(--royal);color:#fff;}
    .secs{display:flex;gap:8px;flex-wrap:wrap;}
    .sec{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:17px;font-weight:900;color:var(--royal);cursor:pointer;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.09);}
    .sec.on{background:linear-gradient(180deg,#D97706,#B45309);border-color:#B45309;color:#fff;box-shadow:0 5px 13px rgba(180,83,9,.35);}

    /* فصولي — اختصار */
    .mine{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:5px;}
    .mcard{border-radius:14px;padding:11px;text-align:right;cursor:pointer;
        background:linear-gradient(150deg,#fff 0%,color-mix(in srgb,var(--gray) 42%,#fff) 50%,var(--gray) 100%);
        border:1.5px solid color-mix(in srgb,var(--gray) 85%,#000);box-shadow:inset 0 1.5px 0 #fff,0 3px 8px rgba(16,24,40,.09);}
    .mcard .g{font-size:13.5px;font-weight:900;color:var(--royal);}
    .mcard .s{font-size:10.5px;color:var(--muted);font-weight:700;}

    /* شريط البحث السريع */
    .qsearch{display:flex;align-items:center;gap:9px;border-radius:14px;padding:0 13px;min-height:50px;margin-bottom:13px;
        background:#fff;border:1.5px solid var(--border);box-shadow:0 2px 6px rgba(16,24,40,.06);}
    .qsearch .em{font-size:15px;color:var(--muted);}
    .qsearch .ph{font-size:13.5px;color:#B9B2A2;font-weight:700;}
    .qres{display:flex;flex-direction:column;gap:7px;}
    .qrow{display:flex;align-items:center;gap:10px;border-radius:13px;padding:11px 13px;cursor:pointer;
        background:#fff;border:1.5px solid var(--border);}
    .qrow .g{font-size:14px;font-weight:900;color:var(--royal);flex:1;}
    .qrow .tag{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 8px;background:color-mix(in srgb,var(--royal) 7%,#fff);color:var(--royal);}

    .curwait{border-radius:16px;padding:13px 15px;margin-bottom:13px;display:flex;align-items:center;gap:11px;
        background:color-mix(in srgb,var(--amber) 10%,#fff);border:1.5px solid color-mix(in srgb,var(--amber) 35%,#fff);}
    .curwait .em{font-size:20px;}
    .curwait .t{font-size:14.5px;font-weight:900;color:#B45309;}
    .curwait .h{font-size:11.5px;color:#B45309;opacity:.85;font-weight:700;margin-top:1px;}
    .curwait .x{margin-right:auto;width:30px;height:30px;border-radius:50%;background:#fff;border:1.5px solid color-mix(in srgb,var(--amber) 35%,#fff);
        display:grid;place-items:center;color:#B45309;font-size:14px;font-weight:900;}
    .btnG{width:100%;min-height:50px;border-radius:14px;margin-top:9px;border:1.5px solid var(--border);background:#fff;
        color:var(--muted);font-family:inherit;font-weight:800;font-size:14px;}
    .hintTap{text-align:center;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:11px;}
    .toast{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%);z-index:90;
        background:var(--green);color:#fff;border-radius:99px;padding:9px 18px;font-size:13px;font-weight:800;
        box-shadow:0 6px 18px rgba(5,150,105,.4);opacity:0;transition:opacity .25s;}
    .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast">✓ تم الحفظ</div>
<div class="switcher" id="switcher"></div>

<script>
function bg(mode){
  const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
  let rows='';
  DAYS.forEach((d,i)=>{
    let tds=`<td class="d">${d}</td>`;
    for(let p=1;p<=3;p++){
      const filled=(i===0&&p<3);
      const isWait=(i===2&&p===1);
      const tgt=isWait;
      let inner='+';
      if(filled)inner='<b>الرابع/أ</b><span>رياضيات</span>';
      else if(isWait)inner=(mode==='assigned')?'<b>السادس/ج</b><span>انتظار · اليوم</span>':'انتظار';
      tds+=`<td class="c ${isWait?'w':''} ${tgt?'tgt':''}">${inner}</td>`;
    }
    rows+=`<tr class="b">${tds}</tr>`;
  });
  return `<div class="bgpage">
    <div class="hd"><h1>📅 الجدول الأسبوعي</h1><span class="tb">توقيت الحصص</span></div>
    <table class="minigrid"><thead><tr><th>اليوم</th><th>ح١<br>07:00</th><th>ح٢<br>07:55</th><th>ح٣<br>08:50</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
const head=(t,sub,back)=>`<div class="grab"></div>
  <div class="shead">
    ${back?'<div class="backb">›</div>':''}
    <div class="slot"><b class="num">ح١</b><span>انتظار</span></div>
    <div class="tt"><h3>${t}</h3><div class="num">${sub}</div></div>
  </div>`;
const note=`<div class="note"><span class="em">📅</span>
  <div class="t">الإسناد لهذا اليوم فقط — يُمسح تلقائياً نهاية اليوم وتعود الخانة «انتظار» فارغة.</div></div>`;
const mine=`<div class="lbl">فصولي (وصول سريع)</div>
  <div class="mine">
    <div class="mcard"><div class="g">الرابع/أ</div><div class="s">رياضيات</div></div>
    <div class="mcard"><div class="g">السادس/ب</div><div class="s">علوم</div></div>
  </div>`;

const S=[
 ['أ · خطوات (مرحلة ← صف ← شعبة)','اضغط خانة الانتظار: فصولك أعلى للوصول السريع، وتحتها كل فصول المدرسة عبر ثلاث خطوات',
  bg('empty')+`<div class="sheet"><div class="card">
    ${head('عند أي فصل تنتظر؟','الثلاثاء · ٠٧:٠٠ — ٠٧:٤٥')}
    ${note}
    ${mine}
    <div class="lbl">أو اختر أي فصل في المدرسة</div>
    <div class="chips"><span class="chip on">ابتدائي</span><span class="chip">متوسط</span><span class="chip">ثانوي</span></div>
    <div class="grid3">
      <div class="gcell">الأول</div><div class="gcell">الثاني</div><div class="gcell">الثالث</div>
      <div class="gcell">الرابع</div><div class="gcell">الخامس</div><div class="gcell on">السادس</div>
    </div>
    <div class="lbl" style="margin-top:13px">الشعبة</div>
    <div class="secs">
      <span class="sec">أ</span><span class="sec">ب</span><span class="sec on">ج</span>
      <span class="sec">د</span><span class="sec">هـ</span><span class="sec">و</span>
    </div>
    <button class="btnG">إلغاء</button>
  </div></div>`],

 ['ب · بحث سريع','حقل واحد: تكتب «٦ج» أو «السادس» فتظهر النتائج فوراً — الأسرع لمن يعرف الفصل',
  bg('empty')+`<div class="sheet"><div class="card">
    ${head('عند أي فصل تنتظر؟','الثلاثاء · ٠٧:٠٠ — ٠٧:٤٥')}
    ${note}
    <div class="qsearch"><span class="em">🔍</span><span class="ph">اكتب الصف والشعبة — مثلاً: السادس ج</span></div>
    <div class="lbl">النتائج</div>
    <div class="qres">
      <div class="qrow"><span class="g">السادس/أ</span></div>
      <div class="qrow"><span class="g">السادس/ب</span><span class="tag">من فصولي</span></div>
      <div class="qrow"><span class="g">السادس/ج</span></div>
      <div class="qrow"><span class="g">السادس/د</span></div>
    </div>
    <button class="btnG">إلغاء</button>
  </div></div>`],

 ['ج · بعد الإسناد','الخانة صارت «السادس/ج · انتظار · اليوم» بلون كهرماني — وتضغطها لتغيير الفصل أو إلغائه',
  bg('assigned')+`<div class="sheet"><div class="card">
    ${head('حصة انتظار','الثلاثاء · ٠٧:٠٠ — ٠٧:٤٥')}
    <div class="curwait"><span class="em">⏳</span>
      <div><div class="t">تنتظر عند: السادس/ج</div><div class="h">لهذا اليوم فقط · يُمسح نهاية اليوم</div></div>
      <span class="x">✕</span></div>
    <div class="lbl">تغيير الفصل</div>
    ${mine}
    <div class="lbl">أو اختر أي فصل في المدرسة</div>
    <div class="chips"><span class="chip on">ابتدائي</span><span class="chip">متوسط</span><span class="chip">ثانوي</span></div>
    <div class="grid3">
      <div class="gcell">الرابع</div><div class="gcell">الخامس</div><div class="gcell on">السادس</div>
    </div>
    <div class="hintTap">اضغط ✕ لإلغاء الإسناد وإرجاعها «انتظار» فارغة</div>
  </div></div>`],
];

const root=document.getElementById('root'),sw=document.getElementById('switcher'),toast=document.getElementById('toast');
function ping(t){toast.textContent=t||'✓ تم الحفظ';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1200);}
S.forEach(([name,desc,html],i)=>{
  const sc=document.createElement('div');sc.className='screen'+(i===0?' active':'');
  sc.innerHTML=`<div class="pal">${name} · ${desc}</div>`+html;
  root.appendChild(sc);
  sc.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{sc.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');});
  sc.querySelectorAll('.gcell').forEach(el=>el.onclick=()=>{sc.querySelectorAll('.gcell').forEach(x=>x.classList.remove('on'));el.classList.add('on');});
  sc.querySelectorAll('.sec').forEach(el=>el.onclick=()=>{sc.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));el.classList.add('on');ping('✓ تنتظر عند هذا الفصل اليوم');});
  sc.querySelectorAll('.mcard,.qrow').forEach(el=>el.onclick=()=>ping('✓ تنتظر عند هذا الفصل اليوم'));
  const b=document.createElement('button');b.textContent=name;if(i===0)b.className='on';
  b.onclick=()=>{document.querySelectorAll('.screen').forEach((s,j)=>s.classList.toggle('active',j===i));
    sw.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0);};
  sw.appendChild(b);
});
</script>
</body>
</html>
