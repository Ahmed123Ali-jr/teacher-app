<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>استوديو شاشة الدخول</title>
<link rel="stylesheet" href="css/fonts.css?v=2">
<style>
:root{
  --royal:#0A3F4A; --gold:#C9A961; --ink:#2C2C2A; --muted:#6B6B68; --line:#E4E6EA;
  --rad:13px;        /* حوافُّ الأزرار والحقول */
  --fs:15px;         /* حجمُ خطّ الحقول */
  --pad:14px;
}
*{box-sizing:border-box}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:#EFF1F4;
     margin:0;padding:12px 10px 40px;color:var(--ink)}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px;color:var(--royal)}
.lead{font-size:12.5px;color:#5A5F66;line-height:1.75;margin:0 0 14px}

/* ── لوحةُ التحكّم ── */
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;
       padding:12px 13px;margin-bottom:14px}
.grp{margin-bottom:13px}
.grp:last-child{margin-bottom:0}
.grp > label{display:block;font-size:12px;font-weight:800;color:var(--royal);margin-bottom:7px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1 1 auto;min-width:62px;font-family:inherit;font-size:12.5px;font-weight:700;
   padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
   color:#5A5F66;cursor:pointer;transition:.12s}
.opts button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}
.txt{width:100%;font-family:inherit;font-size:13.5px;padding:9px 11px;
     border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
.rng{width:100%;accent-color:var(--royal)}
.val{float:left;font-size:12px;font-weight:800;color:var(--gold)}

/* ── الجوّال ── */
.phone{border:1px solid #D5D9DE;border-radius:22px;overflow:hidden;background:#fff;
       box-shadow:0 4px 18px rgba(10,63,74,.13);margin-bottom:14px}
.screen{min-height:600px;display:flex;flex-direction:column}

/* عناصرُ الشاشة */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.fld input{width:100%;font-family:inherit;font-size:var(--fs);padding:var(--pad);
   border-radius:var(--rad);border:1px solid var(--line);background:#fff;color:var(--ink)}
.fld input::placeholder{color:#A9ACB2}
.go{width:100%;font-family:inherit;font-size:16px;font-weight:800;padding:15px;border:0;
    border-radius:var(--rad);background:var(--royal);color:#fff;cursor:pointer}
.forgot{text-align:start;margin:-2px 0 14px}
.forgot a{font-size:12.5px;font-weight:700;color:var(--royal);text-decoration:underline}
.try{width:100%;font-family:inherit;font-size:14.5px;font-weight:800;padding:14px;
     border-radius:var(--rad);cursor:pointer}
.sep{display:flex;align-items:center;gap:10px;margin:15px 0;font-size:12px;color:#9AA0A6}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}
.swap{text-align:center;font-size:13px;color:var(--muted);margin:15px 0 0}
.swap a{font-weight:800;color:var(--royal)}

/* الأشكال */
[data-look="a"] .body{padding:44px 24px 24px}
[data-look="a"] .mark{width:54px;height:54px;border-radius:16px;background:var(--royal);
   display:grid;place-items:center;font-size:26px;margin-bottom:16px}
[data-look="a"] .ttl{font-size:25px;font-weight:800;color:var(--royal);margin:0 0 5px;letter-spacing:-.4px}
[data-look="a"] .sub{font-size:13.5px;color:var(--muted);margin:0 0 24px}
[data-look="a"] .head{display:none}

[data-look="b"] .head{display:block;background:var(--royal);padding:38px 24px 30px;text-align:center}
[data-look="b"] .head .mark{font-size:36px}
[data-look="b"] .head .ttl{color:#fff;font-size:21px;font-weight:800;margin:6px 0 4px}
[data-look="b"] .head .sub{color:rgba(255,255,255,.72);font-size:12.5px;margin:0}
[data-look="b"] .head::after{content:'';display:block;height:3px;background:var(--gold);
   margin:30px -24px -30px}
[data-look="b"] .body{padding:24px 22px}
[data-look="b"] .body .mark,[data-look="b"] .body .ttl,[data-look="b"] .body .sub{display:none}

[data-look="c"] .body{padding:52px 24px 24px}
[data-look="c"] .mark{display:none}
[data-look="c"] .ttl{font-size:28px;font-weight:800;color:var(--royal);margin:0 0 6px;
   letter-spacing:-.6px;line-height:1.35}
[data-look="c"] .sub{font-size:13.5px;color:var(--muted);margin:0 0 28px;line-height:1.7}
[data-look="c"] .head{display:none}
[data-look="c"] .fld input{border:0;border-bottom:1.5px solid var(--line);border-radius:0;
   padding:11px 2px;background:transparent}
[data-look="c"] .go{border-radius:30px}
[data-look="c"] .try{border-radius:30px}

/* `.screen` هو حاملُ `data-look` نفسُه لا ابنٌ له — فالمحدّدُ يلتصق به. */
.screen[data-look="d"]{background:var(--royal);justify-content:center;padding:30px 14px}
[data-look="d"] .body{background:#fff;border-radius:18px;padding:24px 20px;
   box-shadow:0 10px 30px rgba(0,0,0,.2)}
[data-look="d"] .mark{width:56px;height:56px;border-radius:50%;background:var(--royal);
   border:2.5px solid var(--gold);display:grid;place-items:center;font-size:24px;
   margin:-48px auto 12px}
[data-look="d"] .ttl{text-align:center;font-size:19px;font-weight:800;color:var(--royal);margin:0 0 3px}
[data-look="d"] .sub{text-align:center;font-size:12.5px;color:var(--muted);margin:0 0 20px}
[data-look="d"] .head{display:none}

/* زرُّ التجربة — ثلاثةُ أشكال */
[data-try="outline"] .try{background:#fff;border:1.5px solid var(--gold);color:#7A6430}
[data-try="solid"]   .try{background:var(--gold);border:0;color:#2A2411}
[data-try="hidden"]  .try,[data-try="hidden"] .sep{display:none}

/* الخلاصة */
.out{background:var(--royal);color:#fff;border-radius:12px;padding:13px 15px;
     font-size:13px;line-height:1.9}
.out h3{margin:0 0 8px;font-size:13px;color:var(--gold)}
.out code{background:rgba(255,255,255,.12);padding:2px 7px;border-radius:5px;
   font-family:inherit;font-weight:800}
</style>
</head>
<body>
<div class="wrap">

<h1>استوديو شاشة الدخول</h1>
<p class="lead">بدّل وشوف مباشرة. وفي الأسفل <b>خلاصةُ اختيارك</b> — صوّرها وأرسلها لي،
   أو قل لي الحروف.</p>

<div class="panel">
  <div class="grp">
    <label>التصميم</label>
    <div class="opts" id="look">
      <button data-v="a" aria-pressed="true">أ · هادئ</button>
      <button data-v="b">ب · ترويسة</button>
      <button data-v="c">ج · ملء الشاشة</button>
      <button data-v="d">د · بطاقة</button>
    </div>
  </div>

  <div class="grp">
    <label>الحواف <span class="val" id="radv">13px</span></label>
    <input type="range" class="rng" id="rad" min="0" max="30" value="13">
  </div>

  <div class="grp">
    <label>حجم خطّ الحقول <span class="val" id="fsv">15px</span></label>
    <input type="range" class="rng" id="fs" min="13" max="19" value="15">
  </div>

  <div class="grp">
    <label>زرّ التجربة</label>
    <div class="opts" id="try">
      <button data-v="outline" aria-pressed="true">إطار ذهبي</button>
      <button data-v="solid">ذهبي كامل</button>
      <button data-v="hidden">مخفي</button>
    </div>
  </div>

  <div class="grp">
    <label>العنوان</label>
    <input class="txt" id="ttl" value="أهلاً بعودتك">
  </div>

  <div class="grp">
    <label>السطر تحته</label>
    <input class="txt" id="sub" value="سجّل دخولك لتكمل من حيث توقّفت">
  </div>
</div>

<div class="phone">
  <div class="screen" id="stage" data-look="a" data-try="outline">
    <div class="head">
      <div class="mark">🎓</div>
      <h2 class="ttl">أهلاً بعودتك</h2>
      <p class="sub">سجّل دخولك لتكمل من حيث توقّفت</p>
    </div>
    <div class="body">
      <div class="mark">🎓</div>
      <h2 class="ttl">أهلاً بعودتك</h2>
      <p class="sub">سجّل دخولك لتكمل من حيث توقّفت</p>

      <div class="fld"><label>البريد الإلكتروني</label>
        <input type="email" placeholder="name@example.com"></div>
      <div class="fld"><label>كلمة المرور</label>
        <input type="password" placeholder="••••••••"></div>
      <p class="forgot"><a href="javascript:void(0)">نسيت كلمة المرور؟</a></p>

      <button class="go">تسجيل الدخول</button>
      <div class="sep">أو</div>
      <button class="try">✨ جرّب التطبيق — فصل واحد مجاناً</button>
      <p class="swap">ليس لديك حساب؟ <a href="javascript:void(0)">إنشاء حساب</a></p>
    </div>
  </div>
</div>

<div class="out">
  <h3>خلاصةُ اختيارك</h3>
  <div id="summary"></div>
</div>

</div>

<script>
/* حالةٌ واحدةٌ تقود الشاشةَ والخلاصةَ معاً — فلا يفترقان. */
const stage = document.getElementById('stage');
const state = { look:'a', try:'outline', rad:13, fs:15,
                ttl:'أهلاً بعودتك', sub:'سجّل دخولك لتكمل من حيث توقّفت' };

const NAMES = { a:'أ · هادئ ومركَّز', b:'ب · ترويسة بترولية',
                c:'ج · ملء الشاشة', d:'د · بطاقة مرفوعة' };
const TRYN  = { outline:'إطار ذهبي', solid:'ذهبي كامل', hidden:'مخفي' };

function paint() {
  stage.dataset.look = state.look;
  stage.dataset.try  = state.try;
  stage.style.setProperty('--rad', state.rad + 'px');
  stage.style.setProperty('--fs',  state.fs  + 'px');
  /* العنوانُ في موضعين (الترويسة والجسم) — يُكتب فيهما معاً. */
  stage.querySelectorAll('.ttl').forEach(function (el) { el.textContent = state.ttl; });
  stage.querySelectorAll('.sub').forEach(function (el) { el.textContent = state.sub; });

  document.getElementById('radv').textContent = state.rad + 'px';
  document.getElementById('fsv').textContent  = state.fs  + 'px';

  document.getElementById('summary').innerHTML =
      'التصميم: <code>' + NAMES[state.look] + '</code><br>' +
      'زرّ التجربة: <code>' + TRYN[state.try] + '</code><br>' +
      'الحواف: <code>' + state.rad + 'px</code> · الخط: <code>' + state.fs + 'px</code><br>' +
      'العنوان: <code>' + state.ttl + '</code>';
}

function group(id, key) {
  const box = document.getElementById(id);
  box.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    state[key] = b.dataset.v;
    box.querySelectorAll('button').forEach(function (x) {
      x.setAttribute('aria-pressed', String(x === b));
    });
    paint();
  });
}
group('look', 'look');
group('try', 'try');

document.getElementById('rad').addEventListener('input', function (e) {
  state.rad = +e.target.value; paint();
});
document.getElementById('fs').addEventListener('input', function (e) {
  state.fs = +e.target.value; paint();
});
document.getElementById('ttl').addEventListener('input', function (e) {
  state.ttl = e.target.value; paint();
});
document.getElementById('sub').addEventListener('input', function (e) {
  state.sub = e.target.value; paint();
});

paint();
</script>
</body>
</html>
