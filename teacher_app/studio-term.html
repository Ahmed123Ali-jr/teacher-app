<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>استوديو الفصل الدراسي</title>
<link rel="stylesheet" href="css/fonts.css?v=2">
<style>
:root{
  --royal:#0A3F4A; --gold:#C9A961; --ink:#2C2C2A; --muted:#6B6B68; --line:#E4E6EA;
  --rad:14px; --w:500;
}
*{box-sizing:border-box}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:#EFF1F4;
     margin:0;padding:12px 10px 40px;color:var(--ink)}
.wrap{max-width:430px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px;color:var(--royal)}
.lead{font-size:12.5px;color:#5A5F66;line-height:1.75;margin:0 0 14px}

.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:14px}
.grp{margin-bottom:13px}.grp:last-child{margin-bottom:0}
.grp>label{display:block;font-size:12px;font-weight:700;color:var(--royal);margin-bottom:7px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1 1 auto;min-width:66px;font-family:inherit;font-size:12.5px;font-weight:700;
  padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:#5A5F66;cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--royal);border-color:var(--royal);color:#fff}
.rng{width:100%;accent-color:var(--royal)}
.val{float:left;font-size:12px;font-weight:700;color:var(--gold)}

.phone{border:1px solid #D5D9DE;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 4px 18px rgba(10,63,74,.13);margin-bottom:14px}
.hd{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line)}
.hd b{font-size:16px;font-weight:700;color:var(--royal)}
.hd span{font-size:18px;color:var(--muted)}
.screen{padding:18px 16px;min-height:420px}

/* ══ أ: بطاقتان متجاورتان ══ */
.tw{display:flex;gap:10px}
.tw .t{flex:1;border:1.5px solid var(--line);border-radius:var(--rad);
   padding:16px 12px;text-align:center;cursor:pointer;background:#fff}
.tw .t .n{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
.tw .t .c{display:block;font-size:12.5px;color:var(--muted)}
.tw .t.on{background:var(--royal);border-color:var(--royal)}
.tw .t.on .n{color:#fff}
.tw .t.on .c{color:var(--gold)}
.tw .t.on::after{content:'الحالي';display:block;margin-top:8px;font-size:10.5px;
   font-weight:700;color:var(--gold)}

/* ══ ب: شريط تبديل ══ */
.seg{display:flex;background:#EEF0F2;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;font-family:inherit;font-size:14px;font-weight:var(--w);
   padding:12px 6px;border:0;border-radius:9px;background:none;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--royal);color:#fff}
.seg-note{margin:12px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.seg-note b{color:var(--royal)}

/* ══ ج: صفٌّ واحد ══ */
.row1{border:1.5px solid var(--line);border-radius:var(--rad);overflow:hidden}
.row1 .cur{background:var(--royal);padding:18px 16px}
.row1 .cur .l{font-size:12px;color:rgba(255,255,255,.65)}
.row1 .cur .v{display:block;font-size:21px;font-weight:700;color:#fff;margin:3px 0 2px}
.row1 .cur .s{font-size:12.5px;color:var(--gold)}
.row1 .go{width:100%;display:flex;align-items:center;justify-content:space-between;
   padding:15px 16px;background:#fff;border:0;font-family:inherit;font-size:14.5px;
   font-weight:var(--w);color:var(--royal);cursor:pointer}
.row1 .go .ar{color:var(--muted);font-size:13px}

.go-btn{width:100%;margin-top:16px;font-family:inherit;font-size:15.5px;font-weight:var(--w);
   padding:15px;border:0;border-radius:var(--rad);background:var(--royal);color:#fff;cursor:pointer}

.out{background:var(--royal);color:#fff;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.9}
.out h3{margin:0 0 8px;font-size:13px;color:var(--gold)}
.out code{background:rgba(255,255,255,.12);padding:2px 7px;border-radius:5px;font-family:inherit;font-weight:700}
.note{font-size:12px;color:#666;line-height:1.75;margin:9px 2px 0}
</style>
</head>
<body>
<div class="wrap">

<h1>استوديو الفصل الدراسي</h1>
<p class="lead">الشاشةُ اليوم تقول «أنت في الفصل الأول» وزرّ. <b>ولا تُري الفصل
   الثاني ولا ما فيه</b>، والزرُّ محاذٍ لليسار وتحته فراغٌ كبير.<br>
   بدّل وشوف — والخلاصةُ أسفل.</p>

<div class="panel">
  <div class="grp">
    <label>التصميم</label>
    <div class="opts" id="look">
      <button data-v="a" aria-pressed="true">أ · بطاقتان</button>
      <button data-v="b">ب · شريط</button>
      <button data-v="c">ج · صفّ واحد</button>
    </div>
  </div>
  <div class="grp">
    <label>ثقل الخطّ <span class="val" id="wv">٥٠٠ وسط</span></label>
    <input type="range" class="rng" id="w" min="400" max="700" step="100" value="500">
  </div>
  <div class="grp">
    <label>الحواف <span class="val" id="radv">14px</span></label>
    <input type="range" class="rng" id="rad" min="0" max="26" value="14">
  </div>
</div>

<div class="phone">
  <div class="hd"><b>الفصل الدراسي</b><span>←</span></div>
  <div class="screen" id="stage"></div>
</div>

<p class="note" id="why"></p>

<div class="out">
  <h3>خلاصةُ اختيارك</h3>
  <div id="summary"></div>
</div>

</div>

<script>
const stage = document.getElementById('stage');
const state = { look: 'a', w: 500, rad: 14 };

const NAMES = { a: 'أ · بطاقتان متجاورتان', b: 'ب · شريط تبديل', c: 'ج · صفّ واحد' };
const WN = { 400:'٤٠٠ عادي', 500:'٥٠٠ وسط', 600:'٦٠٠ متوسط', 700:'٧٠٠ ثقيل' };

const WHY = {
  a: 'الفصلان أمامك معاً، وتحت كلٍّ عددُ فصوله — فتعرف أين أنت وما ينتظرك هناك قبل أن تنتقل. وضغطةٌ على الآخر تبدأ الانتقال.',
  b: 'أصغرُها وأهدؤها، وشكلٌ يعرفه كلُّ من استعمل جوالاً. لكنّه لا يُري عددَ الفصول في كلٍّ إلا بسطرٍ تحته.',
  c: 'الحاليُّ بارزٌ في كتلةٍ ملوّنة، والآخرُ صفٌّ تحته يُضغط. أقربُها لشكل بقيّة الإعدادات، وأقلُّها إظهاراً للمقارنة.'
};

function draw() {
  const L = state.look;
  if (L === 'a') {
    stage.innerHTML =
      '<div class="tw">' +
        '<div class="t on"><span class="n">الفصل الأول</span><span class="c">فصلان</span></div>' +
        '<div class="t"><span class="n">الفصل الثاني</span><span class="c">لا فصول بعد</span></div>' +
      '</div>' +
      '<button class="go-btn">الانتقال إلى الفصل الثاني</button>';
  } else if (L === 'b') {
    stage.innerHTML =
      '<div class="seg">' +
        '<button class="on">الفصل الأول</button>' +
        '<button>الفصل الثاني</button>' +
      '</div>' +
      '<p class="seg-note">أنت في <b>الفصل الأول</b> — وفيه فصلان.<br>' +
      'والفصل الثاني لا فصول فيه بعد.</p>' +
      '<button class="go-btn">الانتقال إلى الفصل الثاني</button>';
  } else {
    stage.innerHTML =
      '<div class="row1">' +
        '<div class="cur"><span class="l">أنت الآن في</span>' +
          '<b class="v">الفصل الأول</b><span class="s">فصلان</span></div>' +
        '<button class="go"><span>الانتقال إلى الفصل الثاني</span><span class="ar">❮</span></button>' +
      '</div>';
  }
  stage.style.setProperty('--w', String(state.w));
  stage.style.setProperty('--rad', state.rad + 'px');
  document.getElementById('wv').textContent = WN[state.w];
  document.getElementById('radv').textContent = state.rad + 'px';
  document.getElementById('why').textContent = WHY[L];
  document.getElementById('summary').innerHTML =
    'التصميم: <code>' + NAMES[L] + '</code><br>' +
    'الثقل: <code>' + WN[state.w] + '</code> · الحواف: <code>' + state.rad + 'px</code>';
}

document.getElementById('look').addEventListener('click', function (e) {
  const b = e.target.closest('button'); if (!b) return;
  state.look = b.dataset.v;
  this.querySelectorAll('button').forEach(function (x) {
    x.setAttribute('aria-pressed', String(x === b));
  });
  draw();
});
document.getElementById('w').addEventListener('input', function (e) { state.w = +e.target.value; draw(); });
document.getElementById('rad').addEventListener('input', function (e) { state.rad = +e.target.value; draw(); });

draw();
</script>
</body>
</html>
