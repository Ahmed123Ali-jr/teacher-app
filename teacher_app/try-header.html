<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>تجربة الشريط العلوي — غير معتمدة</title>
<style>
    body { margin: 0; background: #FFF; font-family: system-ui, sans-serif; }
    #boot { padding: 40px 20px; text-align: center; color: #6B6B68; font-size: 13px; }
</style>
</head>
<body>
<div id="boot">⏳ يُحمَّل التطبيق…</div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   صفحةُ تجربةٍ للشريط العلوي — **ليست معتمدة**، و`index.html` لا يعرف بها.

   ── لماذا تُجلب `index.html` ولا تُنسخ ──
   نسخُها يعني نسختين تفترقان: سبق أن بقيت نسخةُ المظهر الأبيض بأرقام
   أصولٍ متجمّدةٍ على ما كان قبل أسبوع، فمن يفتحها يرى تطبيقاً قديماً
   ويحسبه الحاضر. فتُجلب الصفحةُ الحيّة وقتَ الفتح، ويُحقن فيها سطران:
   تنسيقُ الطبقة وسكربتُها. فما تراه هنا هو تطبيقُك اليوم لا صورتُه.

   الحذف بعد القرار: هذا الملفّ و`css/try-header.css` و`js/try-header.js`.
   ══════════════════════════════════════════════════════════════════════ */
(async function () {
    try {
        const res = await fetch('index.html?try=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('تعذّر جلب التطبيق (' + res.status + ')');
        let html = await res.text();

        const inject =
            '<link rel="stylesheet" href="css/try-header.css?v=1">' +
            '<scr' + 'ipt src="js/try-header.js?v=1" defer></scr' + 'ipt>';

        if (html.indexOf('</head>') < 0) throw new Error('صفحةٌ غير متوقّعة');
        html = html.replace('</head>', inject + '</head>');

        /* عاملُ الخدمة يُعطَّل في هذه الصفحة: مخبأٌ ثالثٌ يخلط النسخ،
           وقد سبق أن أربكَ تجربةَ المظاهر. */
        html = html.replace('navigator.serviceWorker.register', 'false && navigator.serviceWorker.register');

        document.open();
        document.write(html);
        document.close();
    } catch (e) {
        document.getElementById('boot').innerHTML =
            '❌ ' + e.message + '<br><br>افتح <a href="index.html">التطبيق</a> مباشرةً.';
    }
})();
</script>
</body>
</html>
